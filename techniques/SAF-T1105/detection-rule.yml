title: File Tool Operation Outside Canonical Allowed Scope
id: 8c7dc66f-e3b2-4f2c-a763-1b8b3fb84d3d
status: experimental
description: >-
  Detects MCP or agent file-tool operations whose resolved target is outside
  every canonical allowed root or whose use violates no-access mode, excluding
  an explicitly approved override.
logsource:
  category: application
  product: mcp_or_agent_tool_gateway
detection:
  selection_file_operation:
    event_type: mcp_tool_call
    operation:
      - read_file
      - write_file
      - copy_file
      - move_file
      - delete_file
  selection_boundary_violation:
    path_scope:
      - outside_allowed_root
      - no_access_violation
  filter_approved_override:
    approved_override: true
  condition: selection_file_operation and selection_boundary_violation and not filter_approved_override
fields:
  - timestamp
  - agent_id
  - session_id
  - server
  - tool
  - operation
  - requested_path
  - resolved_path
  - allowed_roots
  - access_mode
  - validation_decision
  - outcome
  - approved_override
falsepositives:
  - Approved break-glass maintenance recorded without the approved_override field.
level: high
tags:
  - saf.t1105
traceability:
  policy: source_or_omit
  design_claim_ids: [SAF-T1105-C003, SAF-T1105-C004, SAF-T1105-C012]
  telemetry_claim_ids: [SAF-T1105-C011, SAF-T1105-C012]
  limitation_claim_ids: [SAF-T1105-C012, SAF-T1105-C013]
  validation_artifacts:
    - tests/SAF-T1105/test_detection_rule.py
    - tests/SAF-T1105/test-logs.json
  components:
    logsource:
      claim_ids: [SAF-T1105-C011]
      rationale: MCP tool audit records are the event family needed for the analytic.
    selection_file_operation:
      claim_ids: [SAF-T1105-C003, SAF-T1105-C004]
      rationale: The behavior culminates in a read, write, copy, move, or delete by a file-capable tool.
    selection_boundary_violation:
      claim_ids: [SAF-T1105-C004, SAF-T1105-C012]
      rationale: Resolved target containment or a no-access violation defines the security-boundary crossing.
    filter_approved_override:
      claim_ids: [SAF-T1105-C012]
      rationale: A recorded authorized exception is outside the non-overridden alert condition.
    condition:
      claim_ids: [SAF-T1105-C012]
      rationale: The conjunction requires both a file operation and a boundary violation without an approved override.
    fields:
      claim_ids: [SAF-T1105-C011, SAF-T1105-C012]
      rationale: These fields support attribution, containment comparison, validation review, and outcome scoping.
    falsepositives:
      claim_ids: [SAF-T1105-C012]
      rationale: Missing exception metadata can make an authorized boundary crossing look unauthorized.
