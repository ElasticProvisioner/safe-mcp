title: Persistent Tool Definition Changed Without Current Approval
id: 9ef71ad8-45a0-4d78-82ba-3a40a9231462
status: experimental
description: >-
  Detects a stable MCP server/tool identity whose normalized current definition
  hash differs from the approved hash and lacks approval for the current hash.
author: OpenAI Codex clean-room research team
date: 2026-09-01
logsource:
  product: mcp
  service: tool_discovery_and_approval
detection:
  selection_change:
    event_type:
      - tool_definition_observed
      - tools_list_changed
    identity_stable: true
    definition_hash_changed: true
    approval_for_current_hash: false
  condition: selection_change
fields:
  - timestamp
  - server_id
  - tool_name
  - current_definition_hash
  - approved_definition_hash
  - approval_for_current_hash
  - approver_or_policy_id
  - session_id
falsepositives:
  - Legitimate hot reload or planned schema change before approval is recorded.
  - Noncanonical serialization that changes a hash without a semantic change.
level: high
tags:
  - saf.t1205
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1205-C010
  telemetry_claim_ids:
    - SAF-T1205-C008
    - SAF-T1205-C009
  limitation_claim_ids:
    - SAF-T1205-C011
  validation_artifacts:
    - techniques/SAF-T1205/test-logs.json
    - techniques/SAF-T1205/test_detection_rule.py
  components:
    logsource:
      claim_ids: [SAF-T1205-C008, SAF-T1205-C009]
      rationale: Discovery, approval, identity, session, and fingerprint telemetry is needed for correlation.
    selection_change:
      claim_ids: [SAF-T1205-C010, SAF-T1205-C011]
      rationale: A mismatch under stable identity without current approval defines the testable behavior and preserves known limits.
    condition:
      claim_ids: [SAF-T1205-C010]
      rationale: The conjunction is the minimum analytic for an unapproved current definition.
    fields:
      claim_ids: [SAF-T1205-C008, SAF-T1205-C009, SAF-T1205-C010]
      rationale: The fields support baseline comparison, attribution, and later investigation.
    falsepositives:
      claim_ids: [SAF-T1205-C011]
      rationale: Dynamic updates and serialization variance are documented boundary conditions.
