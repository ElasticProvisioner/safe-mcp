title: MCP Tool Enumeration by Unapproved Principal or Pagination Burst
id: c69839f5-3c55-4e2c-a997-4b1d2a8c467a
status: experimental
description: >-
  Detects tools/list activity when local authorization context marks the
  principal denied or unapproved, or when the same actor and server generate
  at least three cursor-bearing list pages within sixty seconds.
author: OpenAI Codex clean-room research agent
date: 2026-09-02
logsource:
  category: application
  product: mcp
  service: jsonrpc_audit
detection:
  selection_tools_list:
    rpc.method: tools/list
  selection_denied:
    authorization.decision:
      - denied
      - unapproved
  correlation_burst:
    group_by:
      - actor.id
      - server.address
    require_cursor: true
    count_gte: 3
    within_seconds: 60
  condition: selection_tools_list and (selection_denied or correlation_burst)
fields:
  - timestamp
  - rpc.method
  - jsonrpc.request.id
  - actor.id
  - server.address
  - authorization.decision
  - mcp.cursor
  - mcp.result.tool_count
falsepositives:
  - Approved inventory jobs, interactive Inspector use, client cache refreshes, and administration can paginate rapidly.
level: medium
tags:
  - saf.t1602
  - attack.discovery
  - attack.t1046
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1602-C011
    - SAF-T1602-C012
  telemetry_claim_ids:
    - SAF-T1602-C010
  limitation_claim_ids:
    - SAF-T1602-C011
    - SAF-T1602-C012
  validation_artifacts:
    - techniques/SAF-T1602/test-logs.json
    - techniques/SAF-T1602/test_detection_rule.py
    - research/techniques/SAF-T1602/validation/detection-test.txt
    - research/techniques/SAF-T1602/validation/strict-validator.txt
  components:
    logsource:
      claim_ids: [SAF-T1602-C010]
      rationale: JSON-RPC client and server spans can retain method, request ID, and target attributes.
    selection_tools_list:
      claim_ids: [SAF-T1602-C002, SAF-T1602-C010]
      rationale: tools/list is the normative method and rpc.method is its observable field.
    selection_denied:
      claim_ids: [SAF-T1602-C008, SAF-T1602-C012]
      rationale: Authorization is evaluated per HTTP request; denied or unapproved activity is locally actionable.
    correlation_burst:
      claim_ids: [SAF-T1602-C002, SAF-T1602-C012]
      rationale: Pagination is normative, while the count and window are explicit experimental tuning choices.
    condition:
      claim_ids: [SAF-T1602-C011, SAF-T1602-C012]
      rationale: The condition requires policy or burst context because routine tools/list use is legitimate.
    fields:
      claim_ids: [SAF-T1602-C010, SAF-T1602-C012]
      rationale: These fields support request correlation, actor/server grouping, authorization context, and pagination.
    falsepositives:
      claim_ids: [SAF-T1602-C004, SAF-T1602-C011, SAF-T1602-C012]
      rationale: The first-party Inspector and normal cache or inventory workflows are legitimate lookalikes.
