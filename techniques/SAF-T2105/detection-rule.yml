title: SAF-T2105 Disinformation Output Correlated Integrity Alert
id: 6c13f7c2-ef2c-4bb8-a870-c71b1499a520
status: experimental
description: >-
  Detects a factual AI output that conflicts with approved ground truth and is accompanied by anomalous retrieval context or an explicit deception-intent signal.
author: SAF clean-room research
date: 2026-09-02
logsource:
  category: application
  product: ai_agent_gateway
detection:
  selection_output:
    event_type: ai_output
    task_mode: factual
    factuality_status: contradicted
  selection_context:
    context_integrity_status: anomalous
  selection_intent:
    deception_intent_flag: true
  condition: selection_output and (selection_context or selection_intent)
fields:
  - output_id
  - actor_id
  - session_id
  - application_id
  - model_id
  - source_ids
  - factuality_status
  - context_integrity_status
  - deception_intent_flag
falsepositives:
  - Stale or incomplete approved ground-truth records.
  - Legitimate red-team, fact-checking, simulation, or authorized research activity.
  - Context-integrity anomalies caused by ingestion defects rather than adversarial manipulation.
level: high
tags:
  - saf.t2105
  - attack.t1565
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T2105-C011
  telemetry_claim_ids:
    - SAF-T2105-C008
    - SAF-T2105-C011
  limitation_claim_ids:
    - SAF-T2105-C009
    - SAF-T2105-C010
  validation_artifacts:
    - tests/SAF-T2105/test_detection_rule.py
    - tests/SAF-T2105/cases.json
    - research/techniques/SAF-T2105/validation/detection-test.txt
    - research/techniques/SAF-T2105/validation/canonical-validation.txt
  components:
    logsource:
      claim_ids: [SAF-T2105-C008]
      rationale: Output monitoring requires an application or agent gateway event source.
    selection_output:
      claim_ids: [SAF-T2105-C008, SAF-T2105-C011]
      rationale: Ground-truth conflict on a factual task is the required output-side signal.
    selection_context:
      claim_ids: [SAF-T2105-C004, SAF-T2105-C011]
      rationale: An anomalous retrieved-context signal binds the output to the demonstrated integrity path.
    selection_intent:
      claim_ids: [SAF-T2105-C001, SAF-T2105-C007, SAF-T2105-C011]
      rationale: Explicit intent telemetry distinguishes deliberate deception from accidental confabulation when available.
    condition:
      claim_ids: [SAF-T2105-C011]
      rationale: The conjunction is the original high-confidence experimental analytic.
    fields:
      claim_ids: [SAF-T2105-C008, SAF-T2105-C011]
      rationale: Identifiers and integrity fields support provenance review, tuning, and investigation.
    falsepositives:
      claim_ids: [SAF-T2105-C009, SAF-T2105-C010, SAF-T2105-C011]
      rationale: The evidence requires explicit caveats for incomplete truth sets, benign tests, and imperfect anomaly signals.
