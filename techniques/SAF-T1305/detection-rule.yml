title: MCP Component Spawning an Unexpected Shell or Interpreter
id: 6f794070-53a5-4c77-943b-d0f95f7b1305
status: experimental
description: >-
  Detects a shell or interpreter child process attributed to an MCP runtime
  within 60 seconds of a correlated MCP interaction, excluding explicitly
  allowlisted tool-child pairs.
author: OpenAI Codex clean-room agent
date: 2026-09-01
modified: 2026-09-01
references:
  - https://learn.microsoft.com/en-us/windows/security/operating-system-security/sysmon/sysmon-events
  - https://www.oligo.security/blog/critical-rce-vulnerability-in-anthropic-mcp-inspector-cve-2025-49596
logsource:
  category: process_creation
  product: generic
  definition: Normalized endpoint process events joined to MCP host audit events.
detection:
  selection_parent:
    parent_role: mcp_runtime
  selection_child:
    process_image|endswith:
      - /sh
      - /bash
      - /zsh
      - /python
      - /python3
      - \\cmd.exe
      - \\powershell.exe
      - \\pwsh.exe
  selection_window:
    seconds_since_mcp_event|gte: 0
    seconds_since_mcp_event|lte: 60
  filter_expected:
    expected_tool_child: true
  condition: selection_parent and selection_child and selection_window and not filter_expected
fields:
  - timestamp
  - host_id
  - mcp_session_id
  - mcp_server_id
  - mcp_tool_name
  - approval_state
  - parent_process_id
  - parent_image
  - process_id
  - process_image
  - command_line
  - user
  - seconds_since_mcp_event
falsepositives:
  - Approved MCP tools that intentionally launch a shell or interpreter.
  - Development and test harnesses that run MCP components with interpreter children.
level: high
tags:
  - saf.t1305
  - attack.t1068
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1305-C011
  telemetry_claim_ids:
    - SAF-T1305-C010
  limitation_claim_ids:
    - SAF-T1305-C011
  validation_artifacts:
    - tests/SAF-T1305/test_detection_rule.py
    - tests/SAF-T1305/test-logs.json
  components:
    logsource:
      claim_ids: [SAF-T1305-C010]
      rationale: Process-creation telemetry exposes child and parent context for correlation.
    selection_parent:
      claim_ids: [SAF-T1305-C011]
      rationale: The analytic is scoped to processes attributed to MCP runtimes.
    selection_child:
      claim_ids: [SAF-T1305-C010, SAF-T1305-C011]
      rationale: Shell and interpreter children make the OS execution transition observable.
    selection_window:
      claim_ids: [SAF-T1305-C011]
      rationale: A bounded temporal join reduces unrelated process matches and is tested at both boundaries.
    filter_expected:
      claim_ids: [SAF-T1305-C011]
      rationale: Legitimate tools may intentionally spawn interpreters and require explicit suppression.
    condition:
      claim_ids: [SAF-T1305-C011]
      rationale: All boundary, child, temporal, and allowlist predicates must be evaluated together.
    fields:
      claim_ids: [SAF-T1305-C010, SAF-T1305-C011]
      rationale: The fields support process lineage, MCP correlation, triage, and tuning.
    falsepositives:
      claim_ids: [SAF-T1305-C011]
      rationale: Process creation is observational and expected interpreter children are legitimate lookalikes.
