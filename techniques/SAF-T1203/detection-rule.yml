title: Unapproved MCP Server Binary Digest at Process Start
id: 12030000-0000-4000-8000-000000001203
status: test
description: >-
  Detects a configured local MCP server process start when the executable's
  observed SHA-256 digest differs from its approved digest and the change was
  not approved.
author: OpenAI Codex clean-room research agent
date: 2026-09-01
logsource:
  category: process_creation
  product: mcp_host_endpoint
detection:
  selection:
    event_type: mcp_server_process_start
    server_registered: true
    change_approved: false
  digest_mismatch:
    observed_sha256|not_equals_field: approved_sha256
  condition: selection and digest_mismatch
fields:
  - server_id
  - executable_path
  - observed_sha256
  - approved_sha256
  - change_approved
  - signature_valid
falsepositives:
  - Legitimate upgrade or local rebuild launched before its approved digest is registered.
  - Collection that hashes a different path than the resolved executable launched by the host.
level: high
tags:
  - saf.t1203
  - attack.persistence
  - attack.t1554
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1203-C011
    - SAF-T1203-C015
  telemetry_claim_ids:
    - SAF-T1203-C011
  limitation_claim_ids:
    - SAF-T1203-C013
    - SAF-T1203-C015
  validation_artifacts:
    - techniques/SAF-T1203/test-logs.json
    - techniques/SAF-T1203/test_detection_rule.py
  components:
    logsource:
      claim_ids: [SAF-T1203-C011]
      rationale: ATT&CK DET0336 identifies process-creation and file-integrity telemetry for changed binaries.
    selection:
      claim_ids: [SAF-T1203-C011, SAF-T1203-C015]
      rationale: Restricts evaluation to registered MCP server starts and unapproved changes.
    digest_mismatch:
      claim_ids: [SAF-T1203-C011, SAF-T1203-C015]
      rationale: Compares execution-time identity with an approved artifact baseline.
    condition:
      claim_ids: [SAF-T1203-C011, SAF-T1203-C015]
      rationale: Requires both the lifecycle context and an unapproved identity mismatch.
    fields:
      claim_ids: [SAF-T1203-C011, SAF-T1203-C015]
      rationale: Retains the fields needed to investigate identity, path, approval, and signing state.
    falsepositives:
      claim_ids: [SAF-T1203-C015]
      rationale: Declares expected deployment and path-resolution lookalikes exercised by fixtures.
