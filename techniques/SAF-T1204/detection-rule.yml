title: Suspicious Persistent Memory Write Followed by Cross-Session Retrieval
id: 7e7ebc64-53fe-4d92-9960-53198cf8fd03
status: test
description: >-
  Correlates a persistent memory write with untrusted, unknown, unapproved, or
  memory-instruction-marked provenance to retrieval of the same memory ID in a
  different session within seven days.
author: OpenAI Codex clean-room author
date: 2026-09-01
logsource:
  category: agent_memory
  product: generic_agent_runtime
  service: memory_lifecycle_audit
detection:
  risky_write:
    event_type: memory_write
    memory_scope: persistent
    any_of:
      source_trust: [untrusted, unknown]
      user_approved: false
      semantic_flags_contains: memory_instruction
  later_retrieval:
    event_type: memory_retrieval
    join_key: memory_id
    session_relation: different_from_write_session
  condition: risky_write followed_by later_retrieval within 7d
fields:
  - timestamp
  - event_type
  - memory_id
  - session_id
  - actor_id
  - tenant_id
  - namespace
  - source_origin
  - source_trust
  - user_approved
  - semantic_flags
  - consuming_agent
falsepositives:
  - Approved user preference changes whose approval flag or trust metadata was lost in transit.
  - Administrator-authored migrations or shared-memory maintenance performed through an unclassified service identity.
  - Benign content containing words associated with memory operations when provenance and approval are otherwise legitimate.
level: high
tags:
  - saf.t1204
  - atlas.aml.t0080.000
traceability:
  policy: source_or_omit
  design_claim_ids: [SAF-T1204-C014]
  telemetry_claim_ids: [SAF-T1204-C011, SAF-T1204-C014]
  limitation_claim_ids: [SAF-T1204-C009, SAF-T1204-C015]
  validation_artifacts:
    - techniques/SAF-T1204/test_detection_rule.py
    - techniques/SAF-T1204/test-logs.json
  components:
    logsource:
      claim_ids: [SAF-T1204-C011]
      rationale: Memory lifecycle audit events are required to join writes, retrievals, and later interactions.
    risky_write:
      claim_ids: [SAF-T1204-C010, SAF-T1204-C014]
      rationale: Provenance, approval, and semantic risk at persistence time bound the suspicious write selection.
    later_retrieval:
      claim_ids: [SAF-T1204-C004, SAF-T1204-C011, SAF-T1204-C014]
      rationale: Later retrieval of the same durable entry is the defining persistence activation and raises confidence over a write-only signal.
    condition:
      claim_ids: [SAF-T1204-C014]
      rationale: Same-ID cross-session correlation implements the evidence-backed lifecycle analytic goal; seven days is an explicitly tunable test window.
    fields:
      claim_ids: [SAF-T1204-C010, SAF-T1204-C011, SAF-T1204-C014]
      rationale: Stable identity, provenance, scope, approval, and trace fields support correlation and investigation.
    falsepositives:
      claim_ids: [SAF-T1204-C009, SAF-T1204-C015]
      rationale: Legitimate memory functions and empirical trust-threshold tradeoffs require provenance-aware tuning.
