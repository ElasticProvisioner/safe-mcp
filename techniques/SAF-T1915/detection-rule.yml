title: Correlated Risk-Provenance Bridge and DEX Sequence
id: b8ed9de7-17a6-5e91-a054-6e616c39ca4f
status: experimental
description: >-
  Flags a subject with known illicit-fund provenance that performs at least one
  bridge action and one DEX swap across two or more chains within a bounded time
  and value-conservation window. The rule is a triage signal, not a laundering verdict.
author: OpenAI Codex clean-room agent /root/cleanroom_saf_t1915
date: "2026-09-02"
modified: "2026-09-02"
tags:
  - saf.t1915
  - attack.t1657
logsource:
  category: blockchain_transaction
  product: normalized_multi_chain_telemetry
  definition: >-
    Correlated bridge, DEX, provenance, and agent-policy records normalized by
    subject_id and ordered by event_time.
detection:
  parameters:
    window_minutes: 30
    min_bridge_events: 1
    min_dex_swaps: 1
    min_distinct_chains: 2
    min_usd_value: 10000
    value_ratio_min: 0.70
    value_ratio_max: 1.30
    risky_origins:
      - stolen_funds
      - sanctions
      - fraud
      - ransomware
  condition: >-
    Group valid records by normalized subject_id; require a risky provenance label,
    at least one bridge event, at least one DEX swap, at least two distinct chains,
    the minimum value, a first-to-last value ratio inside the configured range, and
    an inclusive event-time span no greater than window_minutes.
fields:
  - subject_id
  - event_time
  - chain
  - transaction_hash
  - event_type
  - asset
  - amount
  - usd_value
  - service_id
  - destination
  - bridge_join_id
  - provenance_risk
  - agent_intent_id
  - policy_decision_id
  - signer_id
falsepositives:
  - Legitimate treasury rebalancing or arbitrage from an address with stale or indirect risk exposure.
  - Recovery, seizure, or incident-response movement of tainted assets through approved services.
  - Dusting or address-poisoning that incorrectly assigns risky provenance to a legitimate subject.
level: high
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1915-C002
    - SAF-T1915-C004
    - SAF-T1915-C012
    - SAF-T1915-C014
  telemetry_claim_ids:
    - SAF-T1915-C003
    - SAF-T1915-C011
  limitation_claim_ids:
    - SAF-T1915-C013
    - SAF-T1915-C015
    - SAF-T1915-C018
  validation_artifacts:
    - tests/SAF-T1915/test_detection_rule.py
    - tests/SAF-T1915/test-cases.json
    - tests/SAF-T1915/test-logs.json
  components:
    logsource:
      claim_ids:
        - SAF-T1915-C003
        - SAF-T1915-C011
      rationale: Cross-chain reconstruction requires records from both chains plus service and provenance context.
    parameters:
      claim_ids:
        - SAF-T1915-C011
        - SAF-T1915-C012
        - SAF-T1915-C013
        - SAF-T1915-C014
      rationale: The chosen window, value band, chain count, and event sequence operationalize evidence-backed fields while exposing tunable assumptions.
    condition:
      claim_ids:
        - SAF-T1915-C002
        - SAF-T1915-C004
        - SAF-T1915-C014
      rationale: Provenance plus bridge and DEX sequence narrows the signal beyond ordinary cross-chain use.
    fields:
      claim_ids:
        - SAF-T1915-C003
        - SAF-T1915-C011
      rationale: Listed fields support deterministic joins, heuristic fallbacks, and agent-policy context.
    falsepositives:
      claim_ids:
        - SAF-T1915-C013
        - SAF-T1915-C014
        - SAF-T1915-C015
      rationale: Legitimate use, provenance errors, and incomplete multi-chain evidence can resemble the selected sequence.
