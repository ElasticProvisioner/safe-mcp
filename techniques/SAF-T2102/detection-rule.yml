title: SAF-T2102 Service Disruption
id: 8ce08aa9-77e5-42de-a71f-7c30753a84e2
status: experimental
description: >-
  Detects successful cross-owner MCP task cancellation, a known transport-lifecycle
  crash signal accompanied by service unavailability, or actor-attributed request
  pressure at the configured concurrency boundary.
author: SAF-MCP clean-room research
date: 2026-09-02
logsource:
  category: application
  product: mcp_or_agent_runtime
fields:
  - timestamp
  - actor_id
  - actor_role
  - method
  - task_owner_mismatch
  - outcome
  - event_type
  - error_name
  - service_status
  - actor_request_count_60s
  - concurrent_tasks_ratio
detection:
  selection_cross_context_cancel:
    method: tasks/cancel
    task_owner_mismatch: true
    outcome:
      - success
      - cancelled
  selection_transport_crash:
    event_type: mcp_server_error
    error_name: ClosedResourceError
    service_status: unavailable
  selection_resource_pressure:
    event_type: mcp_metric
    service_status:
      - degraded
      - unavailable
    actor_request_count_60s|gte: 100
    concurrent_tasks_ratio|gte: 0.9
  filter_approved_operator:
    actor_role: approved_operator
  condition: >-
    (selection_cross_context_cancel or selection_transport_crash or
    selection_resource_pressure) and not filter_approved_operator
falsepositives:
  - Approved load, resilience, or recovery tests not identified by actor role.
  - Administrative cancellation performed through telemetry that cannot express task ownership.
level: high
tags:
  - saf.t2102
  - attack.impact
  - attack.t1499
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T2102-C009
  telemetry_claim_ids:
    - SAF-T2102-C008
  limitation_claim_ids:
    - SAF-T2102-C009
  validation_artifacts:
    - techniques/SAF-T2102/test_detection_rule.py
    - techniques/SAF-T2102/test-logs.json
    - research/techniques/SAF-T2102/validation/detection-tests.txt
    - research/techniques/SAF-T2102/validation/canonical-validation.txt
  components:
    logsource:
      claim_ids: [SAF-T2102-C008]
      rationale: The analytic requires application-level MCP and agent-runtime events.
    fields:
      claim_ids: [SAF-T2102-C008]
      rationale: These fields express actor, operation, ownership, service health, and pressure.
    selection_cross_context_cancel:
      claim_ids: [SAF-T2102-C006, SAF-T2102-C009]
      rationale: A successful owner-mismatched task cancellation is a direct disruption signal.
    selection_transport_crash:
      claim_ids: [SAF-T2102-C005, SAF-T2102-C009]
      rationale: The disclosed error becomes high-confidence only with unavailable service state.
    selection_resource_pressure:
      claim_ids: [SAF-T2102-C007, SAF-T2102-C009]
      rationale: Actor-attributed volume, concurrency pressure, and degradation bound the analytic.
    filter_approved_operator:
      claim_ids: [SAF-T2102-C009]
      rationale: Explicitly approved operators are a documented expected false-positive class.
    condition:
      claim_ids: [SAF-T2102-C009]
      rationale: The condition joins the three defining mechanisms and applies the operator filter.
    falsepositives:
      claim_ids: [SAF-T2102-C009]
      rationale: Load tests and low-fidelity administrative events can resemble malicious disruption.
