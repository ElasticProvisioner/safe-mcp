title: Cross-Session Acceptance of an OAuth State Value
id: 0ec1720d-12ec-4b5c-9da7-17071b4881ef
status: stable
description: >-
  Detects a successful OAuth callback whose privacy-preserving session binding
  differs from the session that created the same state digest, or a state digest
  accepted more than once inside a ten-minute correlation window.
references:
  - https://modelcontextprotocol.io/specification/2026-07-28/basic/security_best_practices
  - https://www.rfc-editor.org/rfc/rfc9700.html
author:
  - OpenAI Codex
  - SAF Technique Research Team
date: 2026-09-02
modified: 2026-09-02
tags:
  - saf.t1707
  - attack.t1204.001
logsource:
  category: application
  product: oauth_client
  service: authorization_callback
detection:
  request_start:
    event_type: authorization_request_started
    fields_required:
      - state_digest
      - client_id
      - redirect_uri
      - initiating_session_binding
      - timestamp
  callback_success:
    event_type: authorization_callback_accepted
    outcome: success
    fields_required:
      - state_digest
      - client_id
      - redirect_uri
      - callback_session_binding
      - timestamp
  cross_session_correlation:
    join_keys:
      - state_digest
      - client_id
      - redirect_uri
    condition: initiating_session_binding != callback_session_binding
    max_span_seconds: 600
  duplicate_acceptance:
    group_by:
      - state_digest
      - client_id
    condition: count(callback_success) > 1
    max_span_seconds: 600
  condition: cross_session_correlation or duplicate_acceptance
falsepositives:
  - Legitimate callback brokers that intentionally move an authorization response between browser processes without first normalizing both events to the same protected transaction binding.
  - Duplicate delivery generated by a client retry path when state is not consumed atomically; this remains a security defect but may not reflect adversary activity.
fields:
  - timestamp
  - state_digest
  - client_id
  - redirect_uri
  - initiating_session_binding
  - callback_session_binding
  - outcome
level: medium
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1707-C014
  telemetry_claim_ids:
    - SAF-T1707-C013
  limitation_claim_ids:
    - SAF-T1707-C016
  validation_artifacts:
    - tests/SAF-T1707/test_detection.py
    - tests/SAF-T1707/events.json
    - research/techniques/SAF-T1707/validation/detection-test.txt
  components:
    logsource:
      claim_ids: [SAF-T1707-C013]
      rationale: OAuth client callback logs are the minimum event source for the correlation.
    request_start:
      claim_ids: [SAF-T1707-C013, SAF-T1707-C014]
      rationale: The initiating transaction and protected session binding form the correlation baseline.
    callback_success:
      claim_ids: [SAF-T1707-C013, SAF-T1707-C014]
      rationale: Only accepted callbacks can establish the suspicious completed transition.
    cross_session_correlation:
      claim_ids: [SAF-T1707-C014]
      rationale: A binding mismatch for the same state digest expresses the technique boundary.
    duplicate_acceptance:
      claim_ids: [SAF-T1707-C014, SAF-T1707-C016]
      rationale: Reuse of a supposedly single-use state is an independent high-signal condition.
    condition:
      claim_ids: [SAF-T1707-C014]
      rationale: Either cross-session success or duplicate success warrants investigation.
    falsepositives:
      claim_ids: [SAF-T1707-C016]
      rationale: Brokered callbacks and retries can mimic the observable without malicious relay.
    fields:
      claim_ids: [SAF-T1707-C013, SAF-T1707-C016]
      rationale: These fields support triage without storing raw state, tokens, or session identifiers.
