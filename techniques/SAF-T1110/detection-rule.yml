title: Multimodal Instruction Signal Followed by Unapproved Sensitive Agent Action
id: 11101110-1110-4110-8110-111011101110
status: test
description: >-
  Correlates an untrusted image or audio ingestion event carrying an
  instruction-risk signal with a sensitive, unapproved action in the same
  session within an inclusive 120-second window.
author: OpenAI Codex clean-room research agent
date: 2026-09-01
logsource:
  category: application
  product: multimodal_agent
  service: mcp_host
detection:
  selection_multimodal_source:
    event_type: multimodal_input
    media_type:
      - image
      - audio
    media_source_trust: untrusted
  selection_instruction_signal:
    instruction_detected: true
  selection_sensitive_action:
    event_type: tool_call
    action_type:
      - external_send
      - state_change
      - credential_access
      - file_write
  filter_explicit_approval:
    approval_state: approved
  timeframe: 120s
  condition: >-
    sequence by session_id: selection_multimodal_source and
    selection_instruction_signal followed by selection_sensitive_action and
    not filter_explicit_approval within timeframe
fields:
  - timestamp
  - session_id
  - event_type
  - media_type
  - media_source_trust
  - instruction_detected
  - action_type
  - approval_state
  - action_source
falsepositives:
  - >-
    Benign image or audio that contains instructional language followed by a
    legitimate but not-yet-approved sensitive action in the same session.
  - >-
    Classifier error on ambient or overlapping speech that coincides with an
    unrelated agent action.
level: high
tags:
  - saf.t1110
  - attack.execution
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1110-C007
    - SAF-T1110-C011
  telemetry_claim_ids:
    - SAF-T1110-C006
    - SAF-T1110-C011
  limitation_claim_ids:
    - SAF-T1110-C009
    - SAF-T1110-C010
    - SAF-T1110-C013
  validation_artifacts:
    - research/techniques/SAF-T1110/test-logs.json
    - research/techniques/SAF-T1110/test_detection_rule.py
    - research/techniques/SAF-T1110/validation/detection-test.txt
  components:
    logsource:
      claim_ids: [SAF-T1110-C006, SAF-T1110-C011]
      rationale: The host and media pipeline must expose provenance and action events.
    selection_multimodal_source:
      claim_ids: [SAF-T1110-C001, SAF-T1110-C011]
      rationale: The carrier and untrusted provenance define the technique boundary.
    selection_instruction_signal:
      claim_ids: [SAF-T1110-C008, SAF-T1110-C011]
      rationale: A media-aware signal provides a testable precursor without treating it as proof alone.
    selection_sensitive_action:
      claim_ids: [SAF-T1110-C007, SAF-T1110-C011, SAF-T1110-C012]
      rationale: A consequential sink separates mere model influence from high-impact execution.
    filter_explicit_approval:
      claim_ids: [SAF-T1110-C006, SAF-T1110-C007]
      rationale: Recorded informed approval materially changes the authorization state.
    timeframe:
      claim_ids: [SAF-T1110-C011]
      rationale: A bounded interval makes causal review practical and is explicitly tunable.
    condition:
      claim_ids: [SAF-T1110-C011]
      rationale: Same-session sequence correlation implements the source-to-sink analytic.
    fields:
      claim_ids: [SAF-T1110-C006, SAF-T1110-C011]
      rationale: These fields support provenance, ordering, sensitive-action, and approval analysis.
    falsepositives:
      claim_ids: [SAF-T1110-C009, SAF-T1110-C010]
      rationale: Benign overlap and classifier error are supported limits of contextual screening.
