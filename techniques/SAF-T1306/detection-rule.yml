title: MCP Authorization Issuer Validation Failure
id: 7f3d5f20-4f16-4a92-b23b-17e480e43290
status: experimental
description: Detects an exact authorization issuer mismatch, an advertised-but-missing issuer, or a fatal issuer validation error before code redemption.
logsource:
  category: application
  product: mcp-client
detection:
  selection_error:
    outcome: rejected
    error_code:
      - issuer_mismatch
      - issuer_missing
  selection_mismatch:
    issuer_match: false
  selection_required_missing:
    authorization_response_iss_parameter_supported: true
    received_issuer: null
  condition: selection_error or selection_mismatch or selection_required_missing
fields:
  - timestamp
  - session_id
  - resource_uri
  - expected_issuer
  - received_issuer
  - authorization_response_iss_parameter_supported
  - issuer_match
  - outcome
  - error_code
  - validation_kind
  - token_endpoint
falsepositives:
  - Authenticated authorization-server migration where the client still holds an older expected-issuer baseline; the flow must remain rejected until the baseline is refreshed.
level: high
tags:
  - saf.t1306
  - attack.t1528
traceability:
  policy: source_or_omit
  design_claim_ids: [SAF-T1306-C004, SAF-T1306-C005, SAF-T1306-C022]
  telemetry_claim_ids: [SAF-T1306-C008, SAF-T1306-C015, SAF-T1306-C022]
  limitation_claim_ids: [SAF-T1306-C021, SAF-T1306-C022]
  validation_artifacts:
    - tests/SAF-T1306/test_detection_rule.py
    - tests/SAF-T1306/test-logs.json
    - research/techniques/SAF-T1306/validation/detection-test.txt
    - research/techniques/SAF-T1306/validation/strict-validator.txt
  components:
    logsource:
      claim_ids: [SAF-T1306-C008]
      rationale: The first-party MCP SDK documents client-side issuer mismatch errors.
    selection_error:
      claim_ids: [SAF-T1306-C004, SAF-T1306-C008]
      rationale: A conforming client aborts mismatch or required-missing issuer conditions and can expose the fatal error kind.
    selection_mismatch:
      claim_ids: [SAF-T1306-C005, SAF-T1306-C022]
      rationale: Exact string inequality is the defining derived validation signal.
    selection_required_missing:
      claim_ids: [SAF-T1306-C004, SAF-T1306-C022]
      rationale: The current MCP validation matrix requires rejection when support was advertised but the response omits issuer.
    condition:
      claim_ids: [SAF-T1306-C004, SAF-T1306-C022]
      rationale: Any of the three normalized signals represents a required issuer-validation failure.
    fields:
      claim_ids: [SAF-T1306-C008, SAF-T1306-C015, SAF-T1306-C022]
      rationale: Flow correlation, expected and received values, configuration context, and endpoint data support triage and tuning.
    falsepositives:
      claim_ids: [SAF-T1306-C021]
      rationale: RFC 9728 permits protected-resource metadata refresh, including a changed authorization-server set.
