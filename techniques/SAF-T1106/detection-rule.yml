title: Autonomous Agent Repeated Tool Calls Without Progress
id: e3d4b6f1-0b5a-4f4f-9c50-110600000001
status: experimental
description: >-
  Detects repeated tool execution in one autonomous-agent session when arguments
  or progress fingerprints recur and completion remains nonterminal.
logsource:
  category: application
  product: agent_orchestrator
detection:
  selection_tool_call:
    event_type: tool_call
  selection_session:
    session_id|exists: true
    tool_name|exists: true
  filter_approved_long_running:
    approval_state: approved_long_running
  condition: >-
    selection_tool_call and selection_session and not filter_approved_long_running
    | correlate session_id within 300s where count() >= 6,
    max_count(tool_name) >= 4, and
    (max_count(normalized_argument_hash) >= 3 or
    max_count(progress_fingerprint) >= 3), and
    all(completion_state != terminal)
fields:
  - timestamp
  - session_id
  - tool_name
  - normalized_argument_hash
  - progress_fingerprint
  - completion_state
  - cumulative_tokens
  - elapsed_ms
  - approval_state
falsepositives:
  - Approved long-running polling or iterative tasks that reuse arguments.
  - Recovery workflows whose progress signal is not externally observable.
level: high
tags:
  - saf.t1106
traceability:
  policy: source_or_omit
  design_claim_ids: [SAF-T1106-C010]
  telemetry_claim_ids: [SAF-T1106-C008, SAF-T1106-C009]
  limitation_claim_ids: [SAF-T1106-C011]
  validation_artifacts:
    - techniques/SAF-T1106/tests/test_detection_rule.py
    - techniques/SAF-T1106/tests/test-logs.json
    - research/techniques/SAF-T1106/validation/detection-test.txt
  components:
    logsource:
      claim_ids: [SAF-T1106-C008]
      rationale: Agent-orchestrator audit logs are the required event source.
    selection_tool_call:
      claim_ids: [SAF-T1106-C010]
      rationale: The defining cycle repeatedly reaches tool execution.
    selection_session:
      claim_ids: [SAF-T1106-C008, SAF-T1106-C010]
      rationale: Session and tool identity are required to correlate one feedback path.
    filter_approved_long_running:
      claim_ids: [SAF-T1106-C011]
      rationale: Explicit approval reduces predictable long-running-work false positives.
    condition:
      claim_ids: [SAF-T1106-C010, SAF-T1106-C011]
      rationale: The threshold combines recurrence, nonprogress, time, and completion state.
    fields:
      claim_ids: [SAF-T1106-C008, SAF-T1106-C009, SAF-T1106-C010]
      rationale: Investigation and tuning require identity, recurrence, progress, resource, and timing fields.
    falsepositives:
      claim_ids: [SAF-T1106-C011]
      rationale: Legitimate polling and recovery can exhibit the same local pattern.
