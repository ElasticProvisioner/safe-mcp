title: Compromised MCP Server Cross-Trust Pivot
id: 8f3d8b72-f7fc-4d84-92cf-e6df6433f18a
status: experimental
description: >-
  Detects a changed catalog from an untrusted or compromised MCP server followed
  within ten minutes by an unapproved high-sensitivity call to a different MCP
  server in the same causal trace.
references:
  - https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks
  - https://learn.microsoft.com/en-us/microsoft-365/admin/manage/manage-tools-for-agent?view=o365-worldwide
author: OpenAI Codex clean-room research agent
date: 2026-09-02
tags:
  - saf.t1704
  - attack.lateral_movement
logsource:
  category: application
  product: mcp_host_or_gateway
  service: mcp_audit
detection:
  source_catalog_change:
    event_type: mcp.tool_catalog_change
    source_server_trust:
      - untrusted
      - compromised
    metadata_fingerprint_changed: true
  target_sensitive_call:
    event_type: mcp.tool_call
    operation_sensitivity: high
    user_approved: false
  correlation:
    same_fields:
      - trace_id
    different_fields:
      - source_server_id
      - target_server_id
    causal_membership: source_server_id in causal_context_server_ids
    ordered_within_seconds: 600
  condition: source_catalog_change then target_sensitive_call and correlation
fields:
  - timestamp
  - trace_id
  - source_server_id
  - source_server_trust
  - metadata_fingerprint_changed
  - target_server_id
  - target_tool_name
  - operation_sensitivity
  - user_approved
  - causal_context_server_ids
falsepositives:
  - Approved catalog rollout followed by legitimate cross-server orchestration.
  - Misclassified server trust or tool sensitivity.
level: high
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1704-C003
    - SAF-T1704-C012
  telemetry_claim_ids:
    - SAF-T1704-C011
  limitation_claim_ids:
    - SAF-T1704-C013
  validation_artifacts:
    - tests/SAF-T1704/test_detection_rule.py
    - tests/SAF-T1704/fixtures.jsonl
    - tests/SAF-T1704/test-logs.json
    - research/techniques/SAF-T1704/validation/detection-test.txt
    - research/techniques/SAF-T1704/validation/strict-validator.txt
  components:
    logsource:
      claim_ids: [SAF-T1704-C011]
      rationale: Host or gateway audit events preserve server and invocation identity.
    source_catalog_change:
      claim_ids: [SAF-T1704-C003, SAF-T1704-C012]
      rationale: The defining demonstration begins with malicious server-supplied tool metadata.
    target_sensitive_call:
      claim_ids: [SAF-T1704-C003, SAF-T1704-C010, SAF-T1704-C012]
      rationale: The pivot becomes material when host authority reaches a different sensitive target without approval.
    correlation:
      claim_ids: [SAF-T1704-C011, SAF-T1704-C012, SAF-T1704-C013]
      rationale: Trace, server identity, sequence, and window are required to distinguish causal cross-server action.
    condition:
      claim_ids: [SAF-T1704-C012]
      rationale: The ordered conjunction encodes the bounded behavioral hypothesis.
    fields:
      claim_ids: [SAF-T1704-C011, SAF-T1704-C013]
      rationale: These fields support investigation and expose missing-provenance blind spots.
    falsepositives:
      claim_ids: [SAF-T1704-C013]
      rationale: Legitimate orchestrated workflows can create the same sequence after an approved change.
