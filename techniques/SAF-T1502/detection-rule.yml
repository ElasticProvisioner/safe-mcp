title: MCP or Agent Credential-File Read Correlated with Operating-System Access
id: 7ecb19a4-5fa1-4e0e-8837-6a8d114e9952
status: experimental
description: >-
  Detects a successful MCP filesystem operation followed by a successful
  operating-system read of an environment-labeled credential file by the same
  host and process within five minutes. The rule requires deployment-specific
  file sensitivity enrichment and maintenance allowlisting.
author: OpenAI Codex clean-room research agent
date: "2026-09-01"
modified: "2026-09-01"
references:
  - https://modelcontextprotocol.io/specification/2025-11-25/server/tools
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4663
  - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/security_hardening/auditing-the-system_security-hardening
logsource:
  category: normalized_correlation
  product: saf_mcp
  definition: Normalized MCP operation and operating-system file-access events.
detection:
  selection_mcp_read:
    event.kind: mcp_operation
    event.action:
      - read_file
      - read_resource
      - resources_read
    tool.category: filesystem
    event.outcome: success
    file.sensitivity: credential
  selection_os_read:
    event.kind: file_access
    event.action: read
    event.outcome: success
    file.sensitivity: credential
  filter_approved_maintenance:
    context.approved_maintenance: true
  correlation:
    ordered: true
    by:
      - host.id
      - process.pid
    maxspan_seconds: 300
  condition: selection_mcp_read followed_by selection_os_read within correlation and not filter_approved_maintenance
fields:
  - event.timestamp
  - host.id
  - process.pid
  - process.executable
  - user.id
  - session.id
  - mcp.server.id
  - mcp.tool.name
  - resource.uri
  - file.path
  - file.sensitivity
  - approval.status
  - event.outcome
falsepositives:
  - Approved credential rotation, backup, migration, or administrator debugging performed through an agent-enabled workflow.
  - Incorrect environment sensitivity labels or process-identity normalization.
level: high
tags:
  - saf.t1502
  - attack.credential-access
  - attack.t1552.001
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1502-C013
  telemetry_claim_ids:
    - SAF-T1502-C001
    - SAF-T1502-C011
    - SAF-T1502-C012
  limitation_claim_ids:
    - SAF-T1502-C013
    - SAF-T1502-C015
  validation_artifacts:
    - tests/SAF-T1502/test_detection_rule.py
    - tests/SAF-T1502/test-logs.json
    - research/techniques/SAF-T1502/validation/detection-test.txt
    - research/techniques/SAF-T1502/validation/strict-validator.txt
  components:
    logsource:
      claim_ids:
        - SAF-T1502-C001
        - SAF-T1502-C011
        - SAF-T1502-C012
      rationale: MCP tool-use records and OS file-access records supply complementary operation, process, path, and outcome evidence.
    selection_mcp_read:
      claim_ids:
        - SAF-T1502-C001
        - SAF-T1502-C013
      rationale: Limits the first event to a successful filesystem-related MCP read with locally enriched credential sensitivity.
    selection_os_read:
      claim_ids:
        - SAF-T1502-C011
        - SAF-T1502-C012
        - SAF-T1502-C013
      rationale: Requires a successful OS read event with path sensitivity rather than trusting model text alone.
    filter_approved_maintenance:
      claim_ids:
        - SAF-T1502-C001
        - SAF-T1502-C013
      rationale: Excludes explicitly approved maintenance while leaving the allowlist deployment controlled.
    correlation:
      claim_ids:
        - SAF-T1502-C013
      rationale: Same-host and same-process ordering ties the MCP action to the file read; 300 seconds is a documented tuning boundary.
    condition:
      claim_ids:
        - SAF-T1502-C013
        - SAF-T1502-C015
      rationale: Correlation and maintenance exclusion reduce false claims from model output or unrelated file access.
    fields:
      claim_ids:
        - SAF-T1502-C001
        - SAF-T1502-C011
        - SAF-T1502-C012
      rationale: Retains the identifiers needed to investigate the MCP operation, file access, subject, and approval context.
    falsepositives:
      claim_ids:
        - SAF-T1502-C013
        - SAF-T1502-C015
      rationale: Legitimate access and incorrect model or enrichment assertions remain expected analytic limitations.
