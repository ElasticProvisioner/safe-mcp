title: Concentrated MCP Capability Mapping Sequence
id: 7f9a2cb2-09d8-46f4-bbad-d623e640c7b7
status: experimental
description: >-
  Detects one requester querying server/discover and then at least three
  distinct capability-list methods against one MCP server within 120 seconds,
  unless the activity is explicitly labeled as approved inventory.
author: SAF-MCP Research Team
date: 2026-09-02
tags:
  - saf.t1605
  - attack.discovery
logsource:
  category: application
  product: mcp
  service: request_audit
  definition: Normalized MCP request audit events, correlated by actor_id and server_id.
detection:
  discovery:
    method: server/discover
    result_status: success
  capability_lists:
    method:
      - tools/list
      - resources/list
      - resources/templates/list
      - prompts/list
      - roots/list
    result_status: success
  approved_inventory_suppression:
    purpose:
      - approved_inventory
      - approved_bootstrap
  condition: >-
    For the same nonempty actor_id and server_id, one discovery event followed
    by at least three distinct capability-list methods at or after discovery
    and no more than 120 seconds later, excluding groups whose matching events
    carry an approved purpose.
  timeframe: 120s
fields:
  - timestamp
  - actor_id
  - server_id
  - session_id
  - method
  - result_status
  - authorization_context
  - purpose
  - result_count
  - next_cursor_present
falsepositives:
  - Legitimate client bootstrap or capability negotiation without an approved-purpose label.
  - MCP Inspector troubleshooting and validation.
  - Authorized inventory, catalog refresh, and conformance testing.
level: medium
traceability:
  policy: source_or_omit
  design_claim_ids: [SAF-T1605-C012, SAF-T1605-C013]
  telemetry_claim_ids: [SAF-T1605-C012, SAF-T1605-C007]
  limitation_claim_ids: [SAF-T1605-C013, SAF-T1605-C016]
  validation_artifacts:
    - techniques/SAF-T1605/test_detection_rule.py
    - techniques/SAF-T1605/test-logs.json
    - research/techniques/SAF-T1605/validation/detection-tests.txt
    - research/techniques/SAF-T1605/validation/strict-validator.txt
  components:
    logsource:
      claim_ids: [SAF-T1605-C012, SAF-T1605-C007]
      rationale: Protocol methods and production observability support normalized MCP request auditing.
    discovery:
      claim_ids: [SAF-T1605-C001, SAF-T1605-C012]
      rationale: server/discover is the current single-request server capability inventory event.
    capability_lists:
      claim_ids: [SAF-T1605-C002, SAF-T1605-C003, SAF-T1605-C012]
      rationale: The current and legacy listing methods expose distinct capability surfaces.
    approved_inventory_suppression:
      claim_ids: [SAF-T1605-C013]
      rationale: Official administration and production discovery make purpose-aware suppression necessary.
    condition:
      claim_ids: [SAF-T1605-C012, SAF-T1605-C013]
      rationale: The tested correlation emphasizes breadth and concentration but remains behavioral rather than dispositive.
    timeframe:
      claim_ids: [SAF-T1605-C012, SAF-T1605-C016]
      rationale: The bounded window is a tested analytic choice; caching and changes can legitimately alter request timing.
    fields:
      claim_ids: [SAF-T1605-C012, SAF-T1605-C007]
      rationale: These fields support requester/server correlation, authorization review, result context, and tuning.
    falsepositives:
      claim_ids: [SAF-T1605-C004, SAF-T1605-C013]
      rationale: Inspector, bootstrap, inventory, and catalog refresh can emit the same sequence.
