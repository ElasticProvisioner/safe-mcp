title: Exposed MCP Endpoint Followed by Sensitive Action
id: 4a6b171b-2f6c-4f65-a9b8-9dcbd5a6d005
status: experimental
description: >-
  Detects an accepted request from an untrusted network or browser zone with
  missing or invalid access context followed by a successful sensitive MCP or
  backend action under the same correlation identifier within 120 seconds.
author: Clean-room authoring agent
date: 2026-09-01
logsource:
  category: application
  product: mcp
  service: http_endpoint
fields:
  - timestamp
  - correlation_id
  - source_zone
  - server_address
  - endpoint
  - http_method
  - http_status
  - auth_result
  - origin_verdict
  - rpc_method
  - action_class
  - outcome
  - process_parent
  - process_name
detection:
  selection_untrusted_accept:
    source_zone:
      - internet
      - browser_untrusted
    http_status:
      - 200
      - 202
    endpoint:
      - /mcp
      - /sse
      - /mcp-rest/test/connection
      - /mcp-rest/test/tools/list
    action_class: endpoint_access
  selection_missing_access:
    auth_result:
      - missing
      - invalid
  selection_invalid_origin:
    source_zone: browser_untrusted
    origin_verdict: invalid
  selection_sensitive_success:
    action_class:
      - tool_invoke
      - resource_read
      - process_spawn
    outcome: success
  timeframe: 120s
  condition: >-
    Correlate by correlation_id and server_address: selection_untrusted_accept
    and (selection_missing_access or selection_invalid_origin), followed by
    selection_sensitive_success within an inclusive 120-second window.
falsepositives:
  - Intentionally public read-only MCP capabilities.
  - Approved security scanning or synthetic monitoring.
  - Authentication context dropped by a logging intermediary even though access was authorized.
level: high
tags:
  - saf.t1005
  - attack.initial-access
  - attack.t1190
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1005-C003
    - SAF-T1005-C012
  telemetry_claim_ids:
    - SAF-T1005-C002
    - SAF-T1005-C011
    - SAF-T1005-C013
  limitation_claim_ids:
    - SAF-T1005-C017
  validation_artifacts:
    - techniques/SAF-T1005/test-logs.json
    - techniques/SAF-T1005/test_detection_rule.py
    - techniques/SAF-T1005/test-results.json
  components:
    logsource:
      claim_ids: [SAF-T1005-C011]
      rationale: HTTP application telemetry carries the request and response fields needed for correlation.
    fields:
      claim_ids: [SAF-T1005-C002, SAF-T1005-C011, SAF-T1005-C013]
      rationale: The fields join network provenance, access decisions, MCP operations, and outcomes.
    selection_untrusted_accept:
      claim_ids: [SAF-T1005-C001, SAF-T1005-C011]
      rationale: A successful MCP or companion-route response from an untrusted zone establishes reachable accepted access.
    selection_missing_access:
      claim_ids: [SAF-T1005-C003, SAF-T1005-C013]
      rationale: Missing or invalid authentication identifies the access-control condition central to the technique.
    selection_invalid_origin:
      claim_ids: [SAF-T1005-C001, SAF-T1005-C013]
      rationale: An accepted invalid browser Origin represents the DNS-rebinding and browser-to-local variant.
    selection_sensitive_success:
      claim_ids: [SAF-T1005-C003, SAF-T1005-C012]
      rationale: A successful sensitive action distinguishes material capability use from a harmless reachability check.
    timeframe:
      claim_ids: [SAF-T1005-C012]
      rationale: A bounded temporal join keeps the public request and resulting server behavior causally proximate.
    condition:
      claim_ids: [SAF-T1005-C003, SAF-T1005-C012]
      rationale: The sequence models accepted unauthorized access followed by the immediate adversary objective.
    falsepositives:
      claim_ids: [SAF-T1005-C017]
      rationale: Public capabilities, scanners, and lost logging context can produce the same observable sequence.
