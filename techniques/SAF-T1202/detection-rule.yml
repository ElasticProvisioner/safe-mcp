title: Successful OAuth Refresh After Disablement or Token-Family Reuse
id: 7c0f4ac4-bbe6-4b5b-9487-89556c394c11
status: experimental
description: >-
  Detects successful refresh-token grants for a disabled or deactivated subject,
  or successful refresh-token grants accompanied by authorization-server detection
  of reuse within an invalidated refresh-token family.
references:
  - https://www.rfc-editor.org/rfc/rfc9700.html#section-4.14.2
  - https://nvd.nist.gov/vuln/detail/CVE-2026-9571
author: OpenAI Codex clean-room research agent
date: 2026-09-01
modified: 2026-09-01
tags:
  - saf.t1202
  - attack.persistence
  - attack.t1550.001
logsource:
  category: identity
  product: oauth_authorization_server
detection:
  selection_refresh:
    event.action: oauth.token.refresh
    oauth.grant_type: refresh_token
    event.outcome: success
  selection_disabled:
    user.account_status:
      - disabled
      - deactivated
  selection_reuse:
    oauth.refresh_token_reuse_detected: true
  condition: selection_refresh and (selection_disabled or selection_reuse)
fields:
  - event.timestamp
  - subject.id
  - user.account_status
  - oauth.client_id
  - oauth.token_family_id
  - oauth.grant_type
  - oauth.refresh_token_reuse_detected
  - event.outcome
falsepositives:
  - Delayed identity-lifecycle synchronization during account recovery or deactivation testing.
  - Authorization-server retry or concurrency behavior incorrectly classified as token-family reuse.
level: high
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1202-C010
    - SAF-T1202-C011
  telemetry_claim_ids:
    - SAF-T1202-C011
  limitation_claim_ids:
    - SAF-T1202-C010
    - SAF-T1202-C018
  validation_artifacts:
    - tests/SAF-T1202/test_detection_rule.py
    - tests/SAF-T1202/test-logs.json
  components:
    logsource:
      claim_ids: [SAF-T1202-C011]
      rationale: OAuth authorization-server events are the authoritative renewal decision source.
    selection_refresh:
      claim_ids: [SAF-T1202-C004, SAF-T1202-C011]
      rationale: The defining action is a successful refresh-token grant.
    selection_disabled:
      claim_ids: [SAF-T1202-C007, SAF-T1202-C011]
      rationale: Renewal after effective disablement is inconsistent with the intended lifecycle state.
    selection_reuse:
      claim_ids: [SAF-T1202-C010, SAF-T1202-C011]
      rationale: Family reuse is the protocol-defined rotation signal for competing possession.
    condition:
      claim_ids: [SAF-T1202-C011]
      rationale: Requiring successful renewal plus lifecycle or reuse context avoids flagging normal refresh.
    fields:
      claim_ids: [SAF-T1202-C011]
      rationale: These fields support subject, client, family, outcome, and time correlation.
    falsepositives:
      claim_ids: [SAF-T1202-C011, SAF-T1202-C018]
      rationale: Lifecycle lag and token-family concurrency can produce legitimate lookalikes.
