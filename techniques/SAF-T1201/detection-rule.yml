title: SAF-T1201 Post-Approval Tool Mutation Without Reapproval
id: 1ccad182-7a3e-4cb5-a154-6adf560999fd
status: test
description: >-
  Detects a complete MCP tool-definition observation whose canonical hash differs
  from the latest approved hash for the same provenance-scoped server and tool,
  when no approval covers the newly observed hash.
author: Fred Kautz; OpenAI Research
date: 2026-09-01
logsource:
  category: application
  product: mcp_host
  service: tool_inventory
detection:
  selection_complete:
    event_type: mcp_tool_definition_observed
    approved_definition_hash|exists: true
    observed_definition_hash|exists: true
    server_id|exists: true
    tool_name|exists: true
  selection_changed:
    definition_hash_match: false
  selection_unapproved:
    reapproval_status: absent
  condition: selection_complete and selection_changed and selection_unapproved
fields:
  - timestamp
  - server_id
  - tool_name
  - approved_definition_hash
  - observed_definition_hash
  - approval_id
  - reapproval_status
  - session_id
falsepositives:
  - Legitimate change observed before its approval event is ingested.
  - Canonicalization algorithm changes without a versioned migration.
  - Distinct servers incorrectly collapsed to one server_id alias.
level: high
tags:
  - saf.t1201
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1201-C008
    - SAF-T1201-C016
  telemetry_claim_ids:
    - SAF-T1201-C001
    - SAF-T1201-C016
  limitation_claim_ids:
    - SAF-T1201-C009
    - SAF-T1201-C017
  validation_artifacts:
    - techniques/SAF-T1201/test_detection_rule.py
    - techniques/SAF-T1201/test-logs.json
  components:
    logsource:
      claim_ids: [SAF-T1201-C001, SAF-T1201-C016]
      rationale: Tool inventory, approval, and invocation events are required to compare lifecycle state.
    selection_complete:
      claim_ids: [SAF-T1201-C008, SAF-T1201-C016]
      rationale: Complete provenance, name, and both hashes are required for a defensible comparison.
    selection_changed:
      claim_ids: [SAF-T1201-C008]
      rationale: A changed canonical definition hash is the core integrity signal.
    selection_unapproved:
      claim_ids: [SAF-T1201-C002, SAF-T1201-C011]
      rationale: The technique requires the changed state to retain an older approval rather than receive renewed consent.
    condition:
      claim_ids: [SAF-T1201-C016]
      rationale: All completeness, change, and approval-state conditions must hold together.
    fields:
      claim_ids: [SAF-T1201-C016, SAF-T1201-C017]
      rationale: Output fields support triage, identity disambiguation, and false-positive analysis.
    falsepositives:
      claim_ids: [SAF-T1201-C010, SAF-T1201-C017]
      rationale: Legitimate upgrades and lifecycle races can resemble an unauthorized change.
