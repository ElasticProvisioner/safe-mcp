title: Suspicious Privileged Deputy Action Without Valid Initiator Binding
id: 7a2d9e6c-9bb1-4c0e-9304-c7c5f3b8221d
status: experimental
description: >-
  Detects a normalized deputy action where the deputy is authorized, the
  initiating principal is not authorized, and the authorization or delegation
  binding is explicitly invalid. Valid, current delegation records are
  excluded.
author:
  - OpenAI Codex clean-room agent
date: 2026-09-01
modified: 2026-09-01
logsource:
  category: application
  product: mcp_or_agentic_gateway
  service: normalized_deputy_audit
detection:
  selection_deputy_action:
    event.category: authorization
    event.action:
      - oauth_code_issued
      - downstream_api_call
      - tool_execution
      - process_launch
    deputy.allowed: true
    initiator.allowed: false
    binding.valid: false
  filter_valid_delegation:
    delegation.valid: true
  condition: selection_deputy_action and not filter_valid_delegation
fields:
  - event.timestamp
  - event.action
  - correlation.id
  - initiator.id
  - initiator.allowed
  - deputy.id
  - deputy.allowed
  - resource.id
  - binding.valid
  - delegation.id
  - delegation.valid
  - event.outcome
falsepositives:
  - Legitimate service-to-service delegation when the normalizer fails to emit
    a valid delegation record.
  - Policy simulation or authorization testing that intentionally records an
    invalid binding without executing the downstream action.
level: high
tags:
  - saf.t1307
  - attack.privilege-escalation
  - attack.t1068
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1307-C011
    - SAF-T1307-C012
  telemetry_claim_ids:
    - SAF-T1307-C003
    - SAF-T1307-C005
    - SAF-T1307-C011
  limitation_claim_ids:
    - SAF-T1307-C012
  validation_artifacts:
    - tests/SAF-T1307/test_detection_rule.py
    - tests/SAF-T1307/test-logs.json
    - research/techniques/SAF-T1307/validation/detection-test.txt
    - research/techniques/SAF-T1307/validation/strict-validator.txt
  components:
    logsource:
      claim_ids:
        - SAF-T1307-C011
        - SAF-T1307-C012
      rationale: >-
        A normalized gateway audit stream is required because initiator and
        deputy authorization decisions may otherwise be split across systems.
    selection_deputy_action:
      claim_ids:
        - SAF-T1307-C001
        - SAF-T1307-C011
      rationale: >-
        The defining asymmetry is an unauthorized initiator causing an
        authorized deputy to act while an explicit binding check fails.
    filter_valid_delegation:
      claim_ids:
        - SAF-T1307-C012
        - SAF-T1307-C013
      rationale: >-
        A current delegation bound to the initiator, action, and resource is a
        legitimate lookalike and must suppress the generic analytic.
    condition:
      claim_ids:
        - SAF-T1307-C011
        - SAF-T1307-C012
      rationale: >-
        Combining the asymmetry with the delegation exclusion provides a
        deterministic, testable high-signal condition.
    fields:
      claim_ids:
        - SAF-T1307-C011
        - SAF-T1307-C012
      rationale: >-
        The output fields preserve the initiator-to-deputy-to-resource chain
        required for triage and expose missing context.
    falsepositives:
      claim_ids:
        - SAF-T1307-C012
      rationale: >-
        Legitimate intermediaries are common, and incomplete delegation
        telemetry can make an approved workflow appear unbound.
