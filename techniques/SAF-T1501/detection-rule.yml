title: Unapproved or Distributed MCP Full-Schema Instruction Surface
id: 15011501-1501-4501-8501-150115011501
status: experimental
description: >-
  Flags an untrusted MCP tool-definition observation when the complete
  definition differs from its approved fingerprint without explicit reapproval,
  or instruction-like language appears across at least two definition paths
  including a schema-resident path. This is a review signal, not proof of FSP.
author: OpenAI Codex clean-room research agent
date: 2026-09-01
references:
  - https://modelcontextprotocol.io/specification/2026-07-28/server/tools
  - https://www.rfc-editor.org/rfc/rfc8785
  - https://arxiv.org/abs/2604.17125v1
logsource:
  category: application
  product: mcp_host
  service: tool_definition_audit
detection:
  selection_context:
    event_type: mcp_tool_definition_observed
    source_trust: untrusted
  selection_schema_change:
    approved_schema_sha256|exists: true
    observed_schema_sha256|neq_field: approved_schema_sha256
  selection_distributed_directives:
    suspicious_definition_path_count|gte: 2
    suspicious_schema_path_count|gte: 1
  filter_explicit_reapproval:
    lifecycle_event: explicit_reapproval
  condition: >-
    selection_context and not filter_explicit_reapproval and
    (selection_schema_change or selection_distributed_directives)
fields:
  - timestamp
  - host_id
  - server_id
  - tool_name
  - definition
  - observed_schema_sha256
  - approved_schema_sha256
  - source_trust
  - lifecycle_event
falsepositives:
  - Legitimate schema changes observed before the approval record is updated.
  - Security-training or policy tools with imperative terms across schema paths.
  - Benign schemas whose documentation describes secondary review workflows.
level: high
tags:
  - saf.t1501
  - attack.initial-access
notes:
  canonicalization_profile: >-
    The executable fixture profile uses parsed JSON, recursively sorted object
    keys, compact separators, and UTF-8 bytes. Production deployments should use
    a reviewed JCS implementation when RFC 8785 conformance is required.
  string_normalization: Unicode NFKC plus case-folding for the static phrase profile.
  correlation_window: One lifecycle observation against the most recent explicit approval for the same server_id and tool_name.
  limitations:
    - Semantic paraphrases and single-path poisoning may evade the phrase profile.
    - A malicious definition approved as the initial baseline may not create hash drift.
    - Trusted-source compromise is outside selection_context and requires separate monitoring.
    - Complete definitions and explicit reapproval state must be logged before model use.
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1501-C006
    - SAF-T1501-C008
  telemetry_claim_ids:
    - SAF-T1501-C001
    - SAF-T1501-C002
  limitation_claim_ids:
    - SAF-T1501-C007
    - SAF-T1501-C008
  validation_artifacts:
    - tests/SAF-T1501/cases.json
    - tests/SAF-T1501/test_detection_rule.py
    - research/techniques/SAF-T1501/validation/detection-test.txt
    - research/techniques/SAF-T1501/validation/strict-validator.txt
  components:
    logsource:
      claim_ids: [SAF-T1501-C002]
      rationale: Definition-discovery telemetry is required at the point a host receives model-visible metadata.
    selection_context:
      claim_ids: [SAF-T1501-C002, SAF-T1501-C003]
      rationale: FSP crosses the untrusted-server-to-model planning boundary.
    selection_schema_change:
      claim_ids: [SAF-T1501-C006, SAF-T1501-C008]
      rationale: A complete-definition digest permits deterministic comparison with an explicitly approved baseline.
    selection_distributed_directives:
      claim_ids: [SAF-T1501-C003, SAF-T1501-C006]
      rationale: The technique contract requires distributed semantics with at least one schema-resident path.
    filter_explicit_reapproval:
      claim_ids: [SAF-T1501-C008]
      rationale: An explicit complete-definition reapproval distinguishes reviewed administrative change from unapproved drift.
    condition:
      claim_ids: [SAF-T1501-C006, SAF-T1501-C007]
      rationale: The combined selections are a bounded review signal and retain known content-scanning limitations.
    fields:
      claim_ids: [SAF-T1501-C001, SAF-T1501-C002, SAF-T1501-C006]
      rationale: Investigation requires identity, lifecycle, complete definition, and both observed and approved digest fields.
    falsepositives:
      claim_ids: [SAF-T1501-C007]
      rationale: Reviewed research records false positives from benign content that resembles attack language.
