title: Response digest mismatch before MCP result consumption
id: 7ea19ee4-5edc-4ea5-a0b2-2fe7aa727404
status: experimental
description: >-
  Correlates a canonical response digest recorded at trusted transport receipt
  with the digest recorded immediately before model or downstream consumption.
  An unexplained mismatch indicates post-receipt modification; missing telemetry
  is reported separately and does not create an integrity alert.
author: The SAF-MCP Authors
date: "2026-09-01"
references:
  - https://attack.mitre.org/techniques/T1565/002/
  - https://www.rfc-editor.org/rfc/rfc8785.html
traceability:
  policy: source_or_omit
  design_claim_ids: [SAF-T1404-C009, SAF-T1404-C010]
  telemetry_claim_ids: [SAF-T1404-C001, SAF-T1404-C009, SAF-T1404-C013]
  limitation_claim_ids: [SAF-T1404-C009, SAF-T1404-C010, SAF-T1404-C011]
  validation_artifacts:
    - techniques/SAF-T1404/detection-rule.yml
    - tests/SAF-T1404/test-logs.json
    - tests/SAF-T1404/test_detection_rule.py
    - research/techniques/SAF-T1404/validation/detection-tests.txt
    - research/techniques/SAF-T1404/validation/strict-validator.txt
  components:
    selection_receipt:
      claim_ids: [SAF-T1404-C009]
      rationale: The first checkpoint supplies the origin-side digest and correlation identifiers.
    selection_consumption:
      claim_ids: [SAF-T1404-C009]
      rationale: The second checkpoint supplies the destination-side digest for the same request.
    filter_authorized_transform:
      claim_ids: [SAF-T1404-C010]
      rationale: Explicitly approved transformations are legitimate digest-changing operations.
    condition:
      claim_ids: [SAF-T1404-C009, SAF-T1404-C010]
      rationale: A correlated mismatch is meaningful only when both checkpoints exist and no approved transformation intervened.
    logsource:
      claim_ids: [SAF-T1404-C001, SAF-T1404-C013]
      rationale: MCP host transport and context-assembly audit events can bind results to requests and consumption.
    falsepositives:
      claim_ids: [SAF-T1404-C010]
      rationale: Inconsistent canonicalization and unrecorded redaction or normalization can produce benign mismatches.
    fields:
      claim_ids: [SAF-T1404-C009, SAF-T1404-C010]
      rationale: These fields preserve the two digests, correlation identity, server/tool context, and authorization state needed for triage.
logsource:
  product: mcp
  service: host_response_integrity
detection:
  selection_receipt:
    checkpoint: trusted_receipt
    event_type: mcp_response_digest
  selection_consumption:
    checkpoint: pre_consumption
    event_type: mcp_response_digest
  filter_authorized_transform:
    transform_authorized: true
  condition: >-
    correlate selection_receipt and selection_consumption by trace_id,
    request_id, server_id, and tool_name; alert when canonical_sha256 differs
    and not filter_authorized_transform
falsepositives:
  - Approved redaction, schema normalization, or encoding conversion that was not marked transform_authorized.
  - Different canonicalization implementations or binary-digest conventions at the two checkpoints.
fields:
  - trace_id
  - request_id
  - server_id
  - tool_name
  - receipt_canonical_sha256
  - consumption_canonical_sha256
  - transform_authorized
level: high
tags:
  - saf.t1404
