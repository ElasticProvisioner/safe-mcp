title: Unauthorized MCP Response Contains Classified Token Material
id: 7d729d6b-d8c0-4db0-a082-012898a2d1a1
status: experimental
description: >-
  Detects MCP tool-result or tool-error audit events in which an upstream
  classifier identified reusable token material, the result was not redacted,
  and the response recipient failed the authorization decision. The event must
  contain metadata and a non-reversible finding classification, never the raw
  token value.
author:
  - SAF-MCP clean-room research agent /root/cleanroom_saf_t1504
date: "2026-09-01"
references:
  - https://modelcontextprotocol.io/specification/2025-11-25/server/tools
  - https://www.rfc-editor.org/rfc/rfc6750.html
  - https://github.com/pipeboard-co/meta-ads-mcp/security/advisories/GHSA-9gw6-46qc-99vr
logsource:
  category: application
  product: mcp_audit
  service: response_security
detection:
  selection_result:
    event.action:
      - tool_result
      - tool_error
    mcp.response.channel:
      - content
      - structuredContent
      - embedded_resource
      - error_detail
  selection_secret:
    mcp.response.secret_count|gte: 1
    mcp.response.secret_types|contains:
      - access_token
      - bearer_token
      - refresh_token
      - session_token
  selection_recipient:
    mcp.response.recipient_authorized: false
  filter_redacted:
    mcp.response.redacted: true
  condition: selection_result and selection_secret and selection_recipient and not filter_redacted
fields:
  - '@timestamp'
  - event.action
  - mcp.session.id
  - mcp.request.id
  - mcp.server.id
  - mcp.tool.name
  - mcp.response.channel
  - mcp.response.secret_count
  - mcp.response.secret_types
  - mcp.response.recipient_authorized
  - mcp.response.redacted
  - source.user.id
  - source.tenant.id
falsepositives:
  - Synthetic security tests that intentionally return inert tokens and are not tagged or authorized as test traffic.
  - Classifier matches on token-shaped documentation or examples when the recipient authorization decision is incorrect.
level: high
tags:
  - saf.t1504
  - attack.credential-access
  - attack.t1528
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1504-C014
  telemetry_claim_ids:
    - SAF-T1504-C001
    - SAF-T1504-C002
    - SAF-T1504-C014
  limitation_claim_ids:
    - SAF-T1504-C015
  validation_artifacts:
    - tests/SAF-T1504/cases.json
    - tests/SAF-T1504/test_detection_rule.py
    - research/techniques/SAF-T1504/validation/detection-test-output.txt
    - research/techniques/SAF-T1504/validation/strict-validator-output.txt
  components:
    logsource:
      claim_ids:
        - SAF-T1504-C001
        - SAF-T1504-C002
      rationale: MCP response audit telemetry is required because the disclosure occurs as server-produced result data crosses the client boundary.
    selection_result:
      claim_ids:
        - SAF-T1504-C001
      rationale: Restricts evaluation to tool results and errors in protocol-defined response channels.
    selection_secret:
      claim_ids:
        - SAF-T1504-C003
        - SAF-T1504-C014
        - SAF-T1504-C015
      rationale: Requires at least one upstream token classification while acknowledging that no universal token syntax exists.
    selection_recipient:
      claim_ids:
        - SAF-T1504-C004
        - SAF-T1504-C014
      rationale: The defining boundary requires a recipient that is not authorized to possess the token.
    filter_redacted:
      claim_ids:
        - SAF-T1504-C002
        - SAF-T1504-C014
      rationale: A response already redacted before release does not deliver the classified token.
    condition:
      claim_ids:
        - SAF-T1504-C014
      rationale: Conjoins result channel, token finding, authorization failure, and absent redaction.
    fields:
      claim_ids:
        - SAF-T1504-C002
        - SAF-T1504-C014
      rationale: Supplies correlation and triage context without retaining raw credential material.
    falsepositives:
      claim_ids:
        - SAF-T1504-C014
        - SAF-T1504-C015
      rationale: Captures inert test values and token-shaped documentation plus possible authorization-classification errors.
