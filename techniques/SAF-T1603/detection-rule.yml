title: SAF-T1603 Unauthorized System Prompt Disclosure
id: 1f649079-d411-4df9-a3e8-f25b570ad412
status: experimental
description: >-
  Detects a model-response event enriched with either multiple protected-prompt
  chunk overlaps or a synthetic prompt canary, excluding explicitly authorized
  disclosure. The rule never requires protected prompt text in ordinary logs.
references:
  - https://arxiv.org/html/2505.23817
  - https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/gen-ai-events.md
author: OpenAI Codex clean-room research agent
date: 2026-09-02
logsource:
  category: application
  product: genai
  service: model_response
detection:
  selection_response:
    event.name: gen_ai.client.inference.operation.details
    gen_ai.output.messages|exists: true
  selection_overlap:
    saf.system_prompt.overlap_count|gte: 2
  selection_canary:
    saf.system_prompt.canary_match: true
  filter_authorized:
    saf.disclosure.authorized: true
  condition: selection_response and (selection_overlap or selection_canary) and not filter_authorized
fields:
  - timestamp
  - gen_ai.conversation.id
  - gen_ai.operation.name
  - gen_ai.request.model
  - actor.id
  - saf.system_prompt.version
  - saf.system_prompt.overlap_count
  - saf.system_prompt.canary_match
  - saf.disclosure.authorized
falsepositives:
  - Authorized prompt debugging or red-team evaluation not marked as authorized.
  - Deliberately public prompt content that overlaps protected reference chunks.
level: high
tags:
  - saf.t1603
  - attack.discovery
traceability:
  policy: source_or_omit
  design_claim_ids: [SAF-T1603-C011]
  telemetry_claim_ids: [SAF-T1603-C012]
  limitation_claim_ids: [SAF-T1603-C011, SAF-T1603-C012]
  validation_artifacts:
    - tests/SAF-T1603/test-logs.json
    - tests/SAF-T1603/test_detection_rule.py
    - research/techniques/SAF-T1603/validation/detection-test.txt
    - research/techniques/SAF-T1603/validation/strict-validator.txt
  components:
    logsource:
      claim_ids: [SAF-T1603-C012]
      rationale: Uses developing OpenTelemetry GenAI response-event semantics.
    selection_response:
      claim_ids: [SAF-T1603-C012]
      rationale: Requires a correlated model response event and output presence.
    selection_overlap:
      claim_ids: [SAF-T1603-C011]
      rationale: Multiple protected chunks reduce single-phrase false positives.
    selection_canary:
      claim_ids: [SAF-T1603-C011]
      rationale: A distinctive synthetic canary provides a high-specificity alternative.
    filter_authorized:
      claim_ids: [SAF-T1603-C002, SAF-T1603-C012]
      rationale: Suppresses intended or approved prompt disclosure.
    condition:
      claim_ids: [SAF-T1603-C011, SAF-T1603-C012]
      rationale: Combines response context, disclosure evidence, and authorization state.
    falsepositives:
      claim_ids: [SAF-T1603-C002, SAF-T1603-C011]
      rationale: Public templates and approved testing can resemble disclosure.
    fields:
      claim_ids: [SAF-T1603-C012]
      rationale: Preserves correlation and authorization context without requiring prompt text retention.
