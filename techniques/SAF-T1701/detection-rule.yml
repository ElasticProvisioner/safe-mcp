title: Cross-Tool Contamination in an Agent Session
id: 95b7dcae-63e6-48e8-8f70-170100000001
status: experimental
description: >-
  Detects an instruction-like untrusted tool result followed within ten minutes
  by a high-impact call to a different tool or server without a fully recorded
  user request and approval.
author: Frank Kautz, SAF Technique Author; OpenAI Codex, Detection Engineering
date: 2026-09-02
modified: 2026-09-02
references:
  - https://aclanthology.org/2024.findings-acl.624.pdf
  - https://invariantlabs.ai/blog/toxic-flow-analysis
logsource:
  category: application
  product: mcp_host
  service: agent_audit
detection:
  source_result:
    event_type: tool_result
    result_trust: untrusted
  instruction_like:
    result_text|re: '(?i)\b(ignore|must|send|upload|publish|execute|secret|credential|do not tell)\b'
  target_call:
    event_type: tool_call
    impact_class:
      - read_sensitive
      - write
      - execute
      - external_send
  condition: >-
    sequence by session_id with maxspan=10m: source_result and instruction_like,
    followed by target_call where source_tool_id differs from tool_id or
    source_server_id differs from server_id, and where user_requested is false
    or approved is false
fields:
  - timestamp
  - session_id
  - event_type
  - event_id
  - source_event_id
  - tool_id
  - server_id
  - result_trust
  - result_text
  - arguments
  - impact_class
  - user_requested
  - approved
falsepositives:
  - Legitimate multi-tool automation in which approval or user-intent telemetry is absent.
  - Administrative workflows that deliberately transform untrusted content into a reviewed action.
level: high
tags:
  - saf.t1701
  - attack.lateral_movement
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1701-C007
  telemetry_claim_ids:
    - SAF-T1701-C009
  limitation_claim_ids:
    - SAF-T1701-C010
  validation_artifacts:
    - tests/SAF-T1701/run_detection_tests.py
    - tests/SAF-T1701/test-cases.yml
    - tests/SAF-T1701/expected-results.yml
    - research/techniques/SAF-T1701/validation/detector-test.txt
    - research/techniques/SAF-T1701/validation/strict-validator.txt
  components:
    logsource:
      claim_ids: [SAF-T1701-C009]
      rationale: Session-level agent audit events supply the cross-event join.
    source_result:
      claim_ids: [SAF-T1701-C007, SAF-T1701-C009]
      rationale: The source event must be an explicitly untrusted tool result.
    instruction_like:
      claim_ids: [SAF-T1701-C007, SAF-T1701-C010]
      rationale: Text indicators narrow volume but are only a heuristic, not the defining signal.
    target_call:
      claim_ids: [SAF-T1701-C007, SAF-T1701-C009]
      rationale: A later high-impact tool call supplies the cross-capability edge.
    condition:
      claim_ids: [SAF-T1701-C007, SAF-T1701-C009, SAF-T1701-C010]
      rationale: Session, time, distinct-tool, intent, and approval constraints form the behavioral correlation.
    fields:
      claim_ids: [SAF-T1701-C009]
      rationale: The listed fields preserve event identity, tool identity, trust, intent, and effect.
    falsepositives:
      claim_ids: [SAF-T1701-C010]
      rationale: Missing intent and approval records can make legitimate automation resemble contamination.
