title: Rapid MCP Server Discovery Across Distinct Server Identities
id: 4121c02c-8e13-4d59-bbca-982725afc6b9
status: experimental
description: >-
  Detects one actor and session issuing successful modern server/discover or
  legacy initialize operations to at least three distinct MCP server identities
  within five minutes, excluding approved startup, health-check, and explicit
  administrative Inspector contexts.
author: SAF-MCP Research Team
date: 2026-09-01
logsource:
  category: application
  product: mcp
  service: host_client_audit
detection:
  selection_discovery:
    method:
      - server/discover
      - initialize
    result: success
  filter_approved_context:
    approved_context: true
  condition: >-
    selection_discovery and not filter_approved_context |
    count_distinct(server_id) by actor_id, session_id >= 3 within 5m
falsepositives:
  - Approved host startup or configuration reload that initializes every configured server.
  - Health checks that probe several server endpoints from one service identity.
  - Explicit MCP Inspector administration or inventory activity.
fields:
  - timestamp
  - actor_id
  - process_id
  - process_role
  - session_id
  - server_id
  - server_endpoint
  - transport
  - method
  - protocol_version
  - server_info_name
  - capability_classes
  - result
  - approved_context
level: medium
tags:
  - saf.t1601
  - attack.discovery
  - attack.t1046
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1601-C011
    - SAF-T1601-C012
  telemetry_claim_ids:
    - SAF-T1601-C001
    - SAF-T1601-C002
    - SAF-T1601-C011
  limitation_claim_ids:
    - SAF-T1601-C003
    - SAF-T1601-C012
  validation_artifacts:
    - tests/SAF-T1601/test_detection_rule.py
    - tests/SAF-T1601/test-logs.json
    - research/techniques/SAF-T1601/validation/detection-test.txt
    - research/techniques/SAF-T1601/validation/strict-validator.txt
  components:
    logsource:
      claim_ids:
        - SAF-T1601-C001
        - SAF-T1601-C011
      rationale: Host/client audit events are the point that can correlate one actor across multiple one-to-one server connections.
    selection_discovery:
      claim_ids:
        - SAF-T1601-C002
        - SAF-T1601-C011
      rationale: server/discover is the current discovery method and initialize covers legacy handshake telemetry.
    filter_approved_context:
      claim_ids:
        - SAF-T1601-C012
      rationale: Legitimate startup, health checking, and Inspector administration use the same operations and require explicit context suppression.
    condition:
      claim_ids:
        - SAF-T1601-C011
      rationale: Distinct-server correlation within five minutes is a bounded, testable starting analytic rather than a universal threshold.
    falsepositives:
      claim_ids:
        - SAF-T1601-C012
      rationale: Each false-positive class is a documented or directly inferred legitimate use of discovery operations.
    fields:
      claim_ids:
        - SAF-T1601-C002
        - SAF-T1601-C011
      rationale: The fields bind actor, session, endpoint, method, result, protocol version, and self-reported response metadata for investigation.
