title: Accepted OAuth Token With Audience Mismatch or Cross-Presenter Reuse
id: 12c67165-8591-4fc3-a5d7-e1f9b8476082
status: experimental
description: >-
  Detects accepted protected-resource authentication when the token audience
  does not match the resource, or when the same non-reversible token
  fingerprint succeeds from distinct presenters or resources within ten
  minutes without an approved handoff or a declared multi-instance client
  group. The correlation window and identity model require local tuning.
logsource:
  category: application
  product: oauth_protected_resource
  service: mcp_or_agent_connected_resource
detection:
  audience_mismatch:
    event_action: oauth_token_use
    auth_result: success
    audience_match: false
  successful_token_use:
    event_action: oauth_token_use
    auth_result: success
  correlation:
    group_by: token_fingerprint
    distinct_by:
      - presenter_id
      - resource_id
    timespan_seconds: 600
    exclude_when:
      approved_handoff: true
      same_client_instance_group: true
  condition: audience_mismatch or correlated successful_token_use meeting correlation
fields:
  - timestamp
  - token_fingerprint
  - presenter_id
  - resource_id
  - audience_match
  - auth_result
  - sender_constrained
  - approved_handoff
  - client_instance_group
falsepositives:
  - Approved token handoffs during migration, gateway failover, or brokered access.
  - Horizontally scaled instances that share one logical client identity but log different presenters.
  - Clock skew or inconsistent fingerprint derivation across protected resources.
level: high
tags:
  - saf.t1706
  - attack.t1550.001
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1706-C012
  telemetry_claim_ids:
    - SAF-T1706-C003
    - SAF-T1706-C012
  limitation_claim_ids:
    - SAF-T1706-C010
    - SAF-T1706-C011
    - SAF-T1706-C015
  validation_artifacts:
    - tests/SAF-T1706/test_detection_rule.py
    - tests/SAF-T1706/test-cases.json
    - tests/SAF-T1706/test-logs.json
    - research/techniques/SAF-T1706/validation/detection-tests.txt
    - research/techniques/SAF-T1706/validation/strict-validator.txt
  components:
    audience_mismatch:
      claim_ids: [SAF-T1706-C003, SAF-T1706-C012]
      rationale: MCP resource servers must validate intended audience; an accepted mismatch is a high-confidence control failure.
    successful_token_use:
      claim_ids: [SAF-T1706-C012]
      rationale: Only accepted uses can establish successful lateral authentication.
    correlation:
      claim_ids: [SAF-T1706-C012, SAF-T1706-C015]
      rationale: Token-fingerprint reuse across presenters or resources is a behavior-based replay signal with explicit timing and lookalike controls.
    condition:
      claim_ids: [SAF-T1706-C012]
      rationale: Either accepted audience mismatch or bounded cross-presenter reuse satisfies the analytic.
    logsource:
      claim_ids: [SAF-T1706-C003, SAF-T1706-C012]
      rationale: The protected resource is the point that can observe audience validation and accepted token use.
    fields:
      claim_ids: [SAF-T1706-C012]
      rationale: These normalized fields support correlation while avoiding storage of bearer-token material.
    falsepositives:
      claim_ids: [SAF-T1706-C012, SAF-T1706-C015]
      rationale: Approved handoffs, scaled clients, and inconsistent telemetry can resemble replay and require tuning.
