title: Unreviewed Cross-Server Tool Descriptor Reference
id: 6eaaf875-e01e-45ee-b9d6-56d59bcc9d15
status: experimental
description: >-
  Detects registration of a tool descriptor from an untrusted MCP server that
  explicitly references a different server and lacks an approved review record.
logsource:
  category: application
  product: mcp_host
  service: tool_inventory
fields:
  - event.action
  - source.server.id
  - source.server.trust
  - tool.name
  - descriptor.sha256
  - descriptor.references_other_server
  - descriptor.referenced_server_ids
  - descriptor.referenced_tool_names
  - descriptor.reference_review
  - session.id
detection:
  selection:
    event.action: mcp.tool_descriptor_registered
    source.server.trust: untrusted
    descriptor.references_other_server: true
    descriptor.reference_review: unapproved
  condition: selection
falsepositives:
  - Legitimate orchestration or documentation descriptors with an explicit approved cross-server relationship.
level: high
tags:
  - saf.t1301
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1301-C010
  telemetry_claim_ids:
    - SAF-T1301-C008
  limitation_claim_ids:
    - SAF-T1301-C009
  validation_artifacts:
    - tests/SAF-T1301/test_detection_rule.py
    - tests/SAF-T1301/test-logs.json
  components:
    logsource:
      claim_ids: [SAF-T1301-C008]
      rationale: The host inventory is where descriptor provenance and registration are joined.
    fields:
      claim_ids: [SAF-T1301-C008, SAF-T1301-C009]
      rationale: The fields preserve provenance, descriptor identity, reference targets, and review state.
    selection:
      claim_ids: [SAF-T1301-C010]
      rationale: The selection implements the proposed high-signal explicit-reference heuristic.
    condition:
      claim_ids: [SAF-T1301-C010]
      rationale: A single selection must match before the rule alerts.
    falsepositives:
      claim_ids: [SAF-T1301-C009]
      rationale: Reviewed cross-server orchestration can produce the same surface signal.
