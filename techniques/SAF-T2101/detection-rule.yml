title: MCP or Agent Destructive Action Against Protected State
id: 7c112063-606a-4a91-9d44-2ba33e3481e4
status: test
description: >-
  Identifies successful explicit destructive tool operations against protected
  targets without a matching approval, or a five-minute burst across three
  distinct targets for one actor, server, and session.
logsource:
  category: application
  product: mcp_or_agent_runtime
  service: tool_audit
detection:
  destructive_action:
    event_type: mcp_tool_call
    decision: allow
    result_status: success
    normalized_operation|contains:
      - delete
      - destroy
      - drop
      - purge
      - remove
      - terminate
      - truncate
  protected_target:
    target.environment:
      - production
    target.criticality:
      - high
      - critical
  approval_failure:
    approval.status:
      - missing
      - not_requested
      - denied
      - mismatch
  destructive_burst:
    group_by:
      - actor_id
      - server_id
      - session_id
    distinct_by: target.id
    threshold: 3
    timeframe: 5m
  condition: >-
    destructive_action and ((protected_target and approval_failure) or
    destructive_burst)
fields:
  - timestamp
  - actor_id
  - server_id
  - session_id
  - tool_name
  - arguments.action
  - target.id
  - target.environment
  - target.criticality
  - approval.status
  - decision
  - result_status
falsepositives:
  - Approved bulk retention or lifecycle cleanup that reaches three distinct targets.
  - Emergency decommissioning and test-fixture cleanup using production-labeled telemetry.
level: high
tags:
  - saf.t2101
  - attack.impact
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T2101-C012
    - SAF-T2101-C015
  telemetry_claim_ids:
    - SAF-T2101-C005
    - SAF-T2101-C006
    - SAF-T2101-C012
  limitation_claim_ids:
    - SAF-T2101-C003
    - SAF-T2101-C012
    - SAF-T2101-C013
  validation_artifacts:
    - tests/SAF-T2101/test_detection_rule.py
    - tests/SAF-T2101/test-events.jsonl
    - research/techniques/SAF-T2101/validation/detection-test-result.txt
  components:
    logsource:
      claim_ids: [SAF-T2101-C005, SAF-T2101-C006, SAF-T2101-C012]
      rationale: Structured tool, authorization, approval, and target-service audit events provide the required correlation fields.
    destructive_action:
      claim_ids: [SAF-T2101-C004, SAF-T2101-C005, SAF-T2101-C012, SAF-T2101-C015]
      rationale: First-party tool catalogs and ATT&CK analytics identify explicit deletion operations while normalization covers superficial spelling variation.
    protected_target:
      claim_ids: [SAF-T2101-C006, SAF-T2101-C016]
      rationale: Production or critical scope separates high-impact state from ordinary development cleanup.
    approval_failure:
      claim_ids: [SAF-T2101-C002, SAF-T2101-C007, SAF-T2101-C013]
      rationale: Sensitive operations should be independently confirmed, and missing or mismatched approval is a high-confidence policy failure.
    destructive_burst:
      claim_ids: [SAF-T2101-C006, SAF-T2101-C012, SAF-T2101-C015]
      rationale: Distinct-target correlation represents machine-speed or mass deletion while avoiding repeat-event duplication for one target.
    condition:
      claim_ids: [SAF-T2101-C012, SAF-T2101-C016]
      rationale: The protected-target branch favors precision while the burst branch exposes broader destructive sequences for review.
    fields:
      claim_ids: [SAF-T2101-C005, SAF-T2101-C006, SAF-T2101-C012]
      rationale: These fields support actor, path, approval, target, outcome, and time-window reconstruction.
    falsepositives:
      claim_ids: [SAF-T2101-C012]
      rationale: Deterministic signatures cannot distinguish all legitimate and malicious administrative actions with identical surfaces.
