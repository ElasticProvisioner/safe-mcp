title: Token Scope Substitution Allowed Decision
id: d95dd99b-1175-40c2-8b4c-4af49d83da08
status: experimental
description: >-
  Detects an authorization allow decision when the requested resource is outside
  the authorization grant, the token audience does not match the protected
  resource, or the token scopes do not satisfy the operation's required scopes.
references:
  - https://www.rfc-editor.org/rfc/rfc8707.html
  - https://www.rfc-editor.org/rfc/rfc9068.html
  - https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization
author: OpenAI Codex (cleanroom_saf_t1308)
date: 2026-09-01
logsource:
  category: application
  product: mcp_authorization
detection:
  selection_grant_resource:
    event.action: oauth_token_issuance
    auth.decision: allow
    grant.resource_contains_requested: false
  selection_audience:
    event.action: oauth_token_validation
    auth.decision: allow
    token.audience_matches: false
  selection_scope:
    event.action: mcp_tool_authorization
    auth.decision: allow
    token.scope_satisfies_required: false
  condition: selection_grant_resource or selection_audience or selection_scope
fields:
  - event.action
  - auth.decision
  - grant.resource_contains_requested
  - token.audience_matches
  - token.scope_satisfies_required
  - oauth.client_id
  - oauth.resource
  - oauth.granted_scopes
  - mcp.tool
falsepositives:
  - >-
    A documented resource alias or gateway trust boundary can produce an apparent
    audience mismatch; tune only after verifying the alias is explicitly bound.
  - >-
    Compatibility telemetry emitted before a deny response can look like an allow
    unless auth.decision records the final enforcement result.
level: high
tags:
  - saf.t1308
  - attack.t1550.001
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1308-C012
    - SAF-T1308-C022
  telemetry_claim_ids:
    - SAF-T1308-C004
    - SAF-T1308-C005
    - SAF-T1308-C012
  limitation_claim_ids:
    - SAF-T1308-C013
  validation_artifacts:
    - tests/SAF-T1308/test-logs.json
    - tests/SAF-T1308/test_detection_rule.py
    - research/techniques/SAF-T1308/validation/detection-test.txt
    - research/techniques/SAF-T1308/validation/strict-validator.txt
  components:
    logsource:
      claim_ids: [SAF-T1308-C005, SAF-T1308-C012]
      rationale: Authorization enforcement must emit a final decision and context.
    selection_grant_resource:
      claim_ids: [SAF-T1308-C004, SAF-T1308-C012]
      rationale: Flags an allowed token issuance whose resource exceeds the grant.
    selection_audience:
      claim_ids: [SAF-T1308-C005, SAF-T1308-C012]
      rationale: Flags a protected-resource allow decision despite audience mismatch.
    selection_scope:
      claim_ids: [SAF-T1308-C005, SAF-T1308-C012]
      rationale: Flags an MCP operation allowed without its required scopes.
    condition:
      claim_ids: [SAF-T1308-C022]
      rationale: Any defining authorization invariant failing on an allow is sufficient.
    fields:
      claim_ids: [SAF-T1308-C012, SAF-T1308-C013]
      rationale: Context fields support investigation and documented tuning.
    falsepositives:
      claim_ids: [SAF-T1308-C013]
      rationale: Records alias and pre-enforcement telemetry limitations.
