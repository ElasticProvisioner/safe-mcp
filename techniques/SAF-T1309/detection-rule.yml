title: Prompt Attack Followed by Unapproved High-Risk Agent Tool Invocation
id: 7a0f5a6e-4c12-4a93-9f2f-130913091309
status: experimental
description: >-
  Correlates a direct or indirect prompt-attack marker with an attempted or
  executed high-risk tool call lacking a granted approval in the same agent
  session and actor context.
references:
  - https://modelcontextprotocol.io/specification/2026-07-28/server/tools
  - https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields
  - https://arxiv.org/html/2406.13352v3
author: Clean-room SAF-T1309 authoring agent
date: 2026-09-01
logsource:
  category: application
  product: agent_or_mcp_host
  service: prompt_guardrail_and_tool_audit
detection:
  selection_attack_signal:
    event_type:
      - prompt_guardrail
      - content_guardrail
    source_trust: untrusted
    attack_detected: true
  selection_privileged_call:
    event_type: tool_call
    risk_tier:
      - high
      - critical
    approval_state:
      - missing
      - denied
      - not_requested
    outcome:
      - attempted
      - executed
  timeframe: 5m
  condition: >-
    selection_attack_signal followed by selection_privileged_call within
    timeframe, grouped by session_id and actor_id
fields:
  - timestamp
  - session_id
  - actor_id
  - source_trust
  - intervention_point
  - attack_detected
  - filtered
  - server_id
  - tool_name
  - arguments_digest
  - risk_tier
  - approval_state
  - outcome
falsepositives:
  - Authorized red-team or guardrail validation exercises.
  - Classifier mistakes on benign content followed by legitimate automation.
  - Approval recorded in an external system but missing from normalized telemetry.
level: high
tags:
  - saf.t1309
  - attack.privilege_escalation
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1309-C011
  telemetry_claim_ids:
    - SAF-T1309-C002
    - SAF-T1309-C003
  limitation_claim_ids:
    - SAF-T1309-C012
  validation_artifacts:
    - tests/SAF-T1309/test_detection_rule.py
    - tests/SAF-T1309/test-logs.json
    - research/techniques/SAF-T1309/validation/detection-test-output.txt
    - research/techniques/SAF-T1309/validation/strict-validator-output.txt
  components:
    logsource:
      claim_ids: [SAF-T1309-C002, SAF-T1309-C003]
      rationale: Joins prompt-guardrail annotations to MCP host or agent tool audit events.
    selection_attack_signal:
      claim_ids: [SAF-T1309-C003]
      rationale: Uses the documented direct or document-attack annotation at an untrusted intervention point.
    selection_privileged_call:
      claim_ids: [SAF-T1309-C002, SAF-T1309-C011]
      rationale: Selects sensitive tool use without a granted approval.
    timeframe:
      claim_ids: [SAF-T1309-C011]
      rationale: Provides a bounded, tunable temporal join for deterministic testing.
    condition:
      claim_ids: [SAF-T1309-C011]
      rationale: Correlates the attack marker and later tool action on session and actor.
    fields:
      claim_ids: [SAF-T1309-C002, SAF-T1309-C003, SAF-T1309-C011]
      rationale: Preserves identifiers, provenance, risk, approval, and outcome needed to evaluate the sequence.
    falsepositives:
      claim_ids: [SAF-T1309-C012]
      rationale: Records classifier and telemetry-join lookalikes established by the reviewed sources and analytic limits.
