title: AI Agent CLI Unsafe Mode Spawning a Shell
id: 9d96d8d6-35e3-4f96-a42c-8ea7f72feaf1
status: test
description: >-
  Detects a recognized AI coding-agent CLI spawning a shell while the parent
  command line contains a documented unsafe or permission-bypass mode marker.
references:
  - https://developers.openai.com/codex/cli/reference
  - https://code.claude.com/docs/en/cli-reference
  - https://github.com/google-github-actions/run-gemini-cli/security/advisories/GHSA-wpqr-6v78-jr5g
author: OpenAI Codex clean-room research agent
date: 2026-09-01
logsource:
  category: process_creation
  product: multi-platform
detection:
  selection_agent_parent:
    parent_process_name:
      - claude
      - codex
      - gemini
  selection_shell_child:
    process_name:
      - bash
      - sh
      - zsh
      - cmd.exe
      - powershell.exe
      - pwsh
  selection_unsafe_mode:
    parent_command_line|contains:
      - --dangerously-skip-permissions
      - --dangerously-bypass-approvals-and-sandbox
      - --yolo
  condition: selection_agent_parent and selection_shell_child and selection_unsafe_mode
fields:
  - timestamp
  - host
  - user
  - session_id
  - parent_process_name
  - parent_command_line
  - process_name
  - command_line
falsepositives:
  - Authorized red-team, CI, or development jobs running inside a dedicated isolated runner.
level: high
tags:
  - saf.t1111
  - attack.execution
  - attack.t1059
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1111-C011
  telemetry_claim_ids:
    - SAF-T1111-C010
  limitation_claim_ids:
    - SAF-T1111-C012
  validation_artifacts:
    - techniques/SAF-T1111/test-logs.json
    - techniques/SAF-T1111/test_detection_rule.py
  components:
    logsource:
      claim_ids: [SAF-T1111-C010]
      rationale: Sysmon documents process creation, parent command lines, and correlation identifiers.
    selection_agent_parent:
      claim_ids: [SAF-T1111-C004, SAF-T1111-C011]
      rationale: The named products expose command-line agent execution and unsafe modes.
    selection_shell_child:
      claim_ids: [SAF-T1111-C010, SAF-T1111-C014]
      rationale: Process lineage records the agent-to-interpreter transition mapped to ATT&CK T1059.
    selection_unsafe_mode:
      claim_ids: [SAF-T1111-C004, SAF-T1111-C011]
      rationale: The markers are documented permission-bypass or unsafe unattended modes.
    condition:
      claim_ids: [SAF-T1111-C011, SAF-T1111-C012]
      rationale: Conjunction narrows the alert but cannot establish malicious intent.
    fields:
      claim_ids: [SAF-T1111-C010]
      rationale: Fields support process lineage and session correlation.
    falsepositives:
      claim_ids: [SAF-T1111-C012]
      rationale: Vendors describe isolated-runner and automation uses for these modes.
