title: MCP API Data Harvest by Broad Paginated Retrieval
id: 7e5b6cf9-5a7c-4d62-b35c-2fe8caf4db6a
status: experimental
description: >-
  Detects MCP discovery followed within one session by broad, high-volume reads
  from at least three API- or database-backed targets, excluding explicitly
  approved bulk workloads. Numeric values are starter thresholds, not universal
  security boundaries.
author: OpenAI Codex clean-room research agent
date: 2026-09-02
logsource:
  category: application
  product: mcp
  service: audit
detection:
  selection_discovery:
    action:
      - resources/list
      - tools/list
      - schema/list
  selection_collection:
    action:
      - resources/read
      - tools/call
  filter_approved_bulk:
    workload_class: approved_bulk_job
  condition: >-
    discovery precedes collection in the same actor and session within 15 minutes,
    at least 3 distinct targets are read, and at least one threshold is reached:
    20 pages, 5000 records, or 52428800 response bytes; exclude approved bulk jobs
  timeframe: 15m
fields:
  - timestamp
  - session_id
  - actor_id
  - client_id
  - server_id
  - action
  - tool_name
  - target_id
  - record_count
  - response_bytes
  - page_index
  - approval_state
  - auth_scope
  - workload_class
  - source_ip
  - result_status
falsepositives:
  - Approved backup, export, migration, discovery, indexing, or synchronization jobs not labeled with workload_class approved_bulk_job.
  - Large interactive investigations or incident-response collections.
level: high
tags:
  - saf.t1804
  - attack.collection
  - attack.t1213
traceability:
  policy: source_or_omit
  design_claim_ids: [SAF-T1804-C007, SAF-T1804-C013]
  telemetry_claim_ids: [SAF-T1804-C001, SAF-T1804-C006, SAF-T1804-C007]
  limitation_claim_ids: [SAF-T1804-C006, SAF-T1804-C013]
  validation_artifacts:
    - techniques/SAF-T1804/test-logs.json
    - techniques/SAF-T1804/test_detection_rule.py
  components:
    logsource:
      claim_ids: [SAF-T1804-C001, SAF-T1804-C006]
      rationale: MCP application audit events carry the protocol action while NIST establishes API telemetry requirements.
    selection_discovery:
      claim_ids: [SAF-T1804-C001, SAF-T1804-C007]
      rationale: MCP exposes list operations and ATT&CK identifies enumeration before repository collection.
    selection_collection:
      claim_ids: [SAF-T1804-C001, SAF-T1804-C007]
      rationale: Resource reads and data-query tool calls are the collection actions correlated by the analytic.
    filter_approved_bulk:
      claim_ids: [SAF-T1804-C006, SAF-T1804-C013]
      rationale: Context-specific limits require differentiating authorized bulk workloads.
    condition:
      claim_ids: [SAF-T1804-C007, SAF-T1804-C013]
      rationale: The sequence, breadth, and volume condition instantiates authoritative behaviors with locally tunable starter values.
    timeframe:
      claim_ids: [SAF-T1804-C007, SAF-T1804-C013]
      rationale: Temporal correlation distinguishes a collection burst while remaining a locally tunable design choice.
    fields:
      claim_ids: [SAF-T1804-C006, SAF-T1804-C007, SAF-T1804-C013]
      rationale: These fields support identity, scope, target, volume, decision, source, and result correlation.
    falsepositives:
      claim_ids: [SAF-T1804-C006, SAF-T1804-C013]
      rationale: NIST makes limits contextual, so legitimate bulk access must be baselined and explicitly labeled.
