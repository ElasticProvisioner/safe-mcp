title: Returned RAG Passage Fails Source or Integrity Policy
id: 2e116765-e68d-4f28-b248-b6f3d891fc3c
status: experimental
description: >-
  Candidate analytic for a returned RAG passage whose source is not approved or
  whose document integrity check failed; this signal is not proof of poisoning.
references:
  - https://cheatsheetseries.owasp.org/cheatsheets/RAG_Security_Cheat_Sheet.html
author: SAF clean-room research
date: 2026-09-02
logsource:
  category: application
  product: rag_pipeline
detection:
  selection_returned:
    event.action: rag_retrieval
    retrieval.returned: true
  selection_unapproved:
    document.source_approved: false
  selection_integrity_failure:
    document.integrity_verified: false
  filter_test:
    deployment.environment: test
  condition: selection_returned and (selection_unapproved or selection_integrity_failure) and not filter_test
fields:
  - event.action
  - retrieval.returned
  - retrieval.rank
  - document.id
  - document.source
  - document.source_approved
  - document.integrity_verified
  - document.ingested_by
  - query.id
  - response.id
falsepositives:
  - Newly onboarded sources may be retrieved before approval metadata is synchronized.
  - Incident-response replay outside the declared test environment may intentionally retrieve quarantined passages.
level: high
tags:
  - saf.t3001
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T3001-C010
  telemetry_claim_ids:
    - SAF-T3001-C009
  limitation_claim_ids:
    - SAF-T3001-C010
    - SAF-T3001-C011
  validation_artifacts:
    - tests/SAF-T3001/test_detection.py
    - tests/SAF-T3001/test-logs.json
    - research/techniques/SAF-T3001/validation/detection-tests.txt
    - research/techniques/SAF-T3001/validation/strict-validator.txt
    - research/techniques/SAF-T3001/validation/canonical-validation.txt
  components:
    logsource:
      claim_ids: [SAF-T3001-C009]
      rationale: OWASP recommends full-pipeline RAG logging with retrieved chunk metadata.
    selection_returned:
      claim_ids: [SAF-T3001-C010]
      rationale: The analytic is limited to passages actually returned by retrieval.
    selection_unapproved:
      claim_ids: [SAF-T3001-C009, SAF-T3001-C010]
      rationale: Source approval is a recommended ingestion control and a candidate detection signal.
    selection_integrity_failure:
      claim_ids: [SAF-T3001-C009, SAF-T3001-C010]
      rationale: Pre-retrieval hash verification is a recommended control and a candidate detection signal.
    filter_test:
      claim_ids: [SAF-T3001-C010]
      rationale: Declared test traffic is suppressed to preserve expected red-team and CI activity.
    condition:
      claim_ids: [SAF-T3001-C010]
      rationale: Returned content plus a failed source or integrity policy is the bounded analytic condition.
    fields:
      claim_ids: [SAF-T3001-C009]
      rationale: These fields support provenance, integrity, retrieval, and response reconstruction.
    falsepositives:
      claim_ids: [SAF-T3001-C010]
      rationale: Metadata synchronization and response exercises can resemble the candidate signal.
