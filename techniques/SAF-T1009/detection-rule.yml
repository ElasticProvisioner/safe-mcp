title: MCP Authorization Response Issuer-Binding Failure
id: 7a0ccaa4-b11f-44e2-9f05-b87516ee1009
status: experimental
description: >-
  Detects client-side evidence that an MCP authorization response was not
  safely bound to the validated issuer recorded for the authorization flow.
author: OpenAI Codex clean-room agent
date: 2026-09-01
logsource:
  category: application
  product: mcp_client
  service: authorization
detection:
  selection_mismatch:
    event_type: authorization_callback_validation
    issuer_comparison_result: mismatch
  selection_advertised_missing_iss:
    event_type: authorization_callback_validation
    authorization_response_iss_parameter_supported: true
    response_iss: null
  selection_unvalidated_metadata:
    event_type: authorization_callback_validation
    metadata_validated: false
  selection_forward_after_failed_validation:
    event_type: outbound_token_request
    code_forwarded: true
    prior_validation_outcome:
      - rejected
      - failed
      - missing
  condition: >-
    selection_mismatch or selection_advertised_missing_iss or
    selection_unvalidated_metadata or
    selection_forward_after_failed_validation
fields:
  - timestamp
  - flow_id
  - recorded_expected_issuer
  - response_iss
  - authorization_response_iss_parameter_supported
  - metadata_validated
  - comparison_mode
  - issuer_comparison_result
  - validation_outcome
  - selected_token_endpoint
  - bound_issuer
  - code_forwarded
falsepositives:
  - Instrumentation emitted before validated metadata or per-flow state was restored after a client restart.
  - A deliberately stricter local policy may separately reject legacy responses that omit iss even when support was not advertised.
level: high
tags:
  - saf.t1009
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1009-C006
    - SAF-T1009-C008
    - SAF-T1009-C019
  telemetry_claim_ids:
    - SAF-T1009-C020
  limitation_claim_ids:
    - SAF-T1009-C021
  validation_artifacts:
    - techniques/SAF-T1009/test-logs.json
    - techniques/SAF-T1009/test_detection_rule.py
  components:
    logsource:
      claim_ids: [SAF-T1009-C020]
      rationale: The comparison and forward decision are made and observable inside the MCP client authorization flow.
    selection_mismatch:
      claim_ids: [SAF-T1009-C006, SAF-T1009-C008, SAF-T1009-C019]
      rationale: An exact disagreement between the stored expected issuer and returned issuer is the highest-confidence defining signal.
    selection_advertised_missing_iss:
      claim_ids: [SAF-T1009-C008]
      rationale: A server that advertised response-issuer support must supply iss, so advertised absence is a required rejection case.
    selection_unvalidated_metadata:
      claim_ids: [SAF-T1009-C007, SAF-T1009-C018]
      rationale: Issuer comparison is not trustworthy unless the expected issuer and its metadata were first validated.
    selection_forward_after_failed_validation:
      claim_ids: [SAF-T1009-C006, SAF-T1009-C020]
      rationale: Forwarding a credential after a failed or absent issuer decision detects the dangerous control-flow consequence.
    condition:
      claim_ids: [SAF-T1009-C008, SAF-T1009-C020]
      rationale: Any one unsafe binding state warrants investigation before credential transmission proceeds.
    fields:
      claim_ids: [SAF-T1009-C019, SAF-T1009-C020]
      rationale: These fields preserve exact compared values, decision state, and cross-event correlation context.
    falsepositives:
      claim_ids: [SAF-T1009-C021]
      rationale: Legacy issuer omission without advertised support is expected and is deliberately not selected by this analytic.
