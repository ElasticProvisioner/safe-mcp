title: Sensitive Data Flow into Untrusted MCP Tool Arguments
id: 3e50cc5c-9866-4af1-9406-348b8bfb3288
status: experimental
description: >-
  Detects an enriched MCP tools/call event when host-side data lineage indicates
  that sensitive source content flowed into arguments sent to an untrusted
  destination and no scoped policy exception was approved.
date: 2026-09-02
modified: 2026-09-02
references:
  - https://modelcontextprotocol.io/specification/2025-11-25/server/tools
  - https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks
  - https://invariantlabs.ai/blog/whatsapp-mcp-exploited
logsource:
  category: mcp_tool_call
  product: mcp_host
  definition: >-
    Normalized host-side pre-dispatch events enriched with destination trust,
    sensitive-data lineage, and policy-exception state.
detection:
  selection_parameter_exfiltration:
    event.category: mcp_tool
    event.action: tools/call
    dataflow.sensitive_to_arguments: true
    destination.trust: untrusted
  filter_authorized_exception:
    policy.exception.approved: true
  condition: selection_parameter_exfiltration and not filter_authorized_exception
fields:
  - timestamp
  - session.id
  - server.id
  - tool.name
  - destination.trust
  - dataflow.source.classification
  - dataflow.sensitive_to_arguments
  - approval.full_arguments_visible
  - policy.exception.approved
falsepositives:
  - Legitimate support, backup, or analysis workflows sending classified data to an external service without a recorded scoped exception.
  - Incorrect destination-trust or data-classification enrichment.
level: high
tags:
  - saf.t1911
  - attack.exfiltration
  - attack.t1020
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1911-C011
    - SAF-T1911-C013
    - SAF-T1911-C018
  telemetry_claim_ids:
    - SAF-T1911-C001
    - SAF-T1911-C008
    - SAF-T1911-C011
  limitation_claim_ids:
    - SAF-T1911-C012
    - SAF-T1911-C013
    - SAF-T1911-C017
  validation_artifacts:
    - tests/SAF-T1911/events.json
    - tests/SAF-T1911/test_detection_rule.py
    - tests/SAF-T1911/test-logs.json
  components:
    logsource:
      claim_ids:
        - SAF-T1911-C001
        - SAF-T1911-C008
      rationale: MCP tool calls and their audit context are the required event source.
    selection_parameter_exfiltration:
      claim_ids:
        - SAF-T1911-C011
        - SAF-T1911-C018
      rationale: The selection implements the bounded sensitive-source-to-argument-to-untrusted-destination sequence.
    filter_authorized_exception:
      claim_ids:
        - SAF-T1911-C013
      rationale: Explicit scoped policy exceptions separate intended external data transfers from unauthorized ones.
    condition:
      claim_ids:
        - SAF-T1911-C011
        - SAF-T1911-C013
      rationale: Alert only on the full enriched sequence when no approved exception applies.
    fields:
      claim_ids:
        - SAF-T1911-C008
        - SAF-T1911-C011
        - SAF-T1911-C012
      rationale: The listed fields support investigation, tuning, and identification of missing enrichment.
    falsepositives:
      claim_ids:
        - SAF-T1911-C013
      rationale: Legitimate external tool workflows can share the protocol-level behavior and require policy context.
