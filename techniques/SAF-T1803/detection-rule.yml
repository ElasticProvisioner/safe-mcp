title: SAF-T1803 Database Dump Through MCP Tool Call
id: d1803000-4f73-4a13-9c42-180300000001
status: experimental
description: >-
  Detects a normalized MCP tools/call event that performs a dump-like database
  operation, returns at least 10 MiB, and is neither explicitly approved nor
  performed by an allowlisted backup identity.
logsource:
  product: mcp
  service: normalized_tool_audit
detection:
  selection_mcp:
    mcp.method: tools/call
  selection_database_operation:
    database.operation:
      - dump
      - export
      - bulk_read
  selection_volume:
    result.bytes|gte: 10485760
  filter_approved:
    approval.state: approved
  filter_allowlisted_backup:
    actor.is_approved_backup: true
  condition: selection_mcp and selection_database_operation and selection_volume and not filter_approved and not filter_allowlisted_backup
falsepositives:
  - Approved database backups, migrations, and administrative exports
  - Incident-response acquisition and authorized bulk analytics extracts
  - Data-pipeline jobs not represented in the backup-identity allowlist
level: high
tags:
  - saf.t1803
  - attack.collection
  - attack.t1213.006
references:
  - https://modelcontextprotocol.io/specification/2026-07-28/server/tools
  - https://attack.mitre.org/techniques/T1213/006/
  - https://services.google.com/fh/files/misc/snowflake-threat-hunting-guide.pdf
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1803-C010
  telemetry_claim_ids:
    - SAF-T1803-C001
    - SAF-T1803-C008
    - SAF-T1803-C009
  limitation_claim_ids:
    - SAF-T1803-C008
    - SAF-T1803-C010
    - SAF-T1803-C015
  validation_artifacts:
    - tests/SAF-T1803/test-logs.json
    - tests/SAF-T1803/test_detection_rule.py
  components:
    logsource:
      claim_ids:
        - SAF-T1803-C001
        - SAF-T1803-C009
      rationale: Correlates normalized MCP tool audit events with database activity fields.
    selection_mcp:
      claim_ids:
        - SAF-T1803-C001
      rationale: The protocol-defined tools/call method identifies model-controlled tool invocation.
    selection_database_operation:
      claim_ids:
        - SAF-T1803-C002
        - SAF-T1803-C006
        - SAF-T1803-C008
      rationale: Dump, export, and bulk-read operations represent the database-collection behavior.
    selection_volume:
      claim_ids:
        - SAF-T1803-C008
        - SAF-T1803-C010
      rationale: A large result is an explicit synthetic tuning threshold for broad retrieval.
    filter_approved:
      claim_ids:
        - SAF-T1803-C001
        - SAF-T1803-C011
      rationale: Explicit human approval distinguishes reviewed sensitive operations.
    filter_allowlisted_backup:
      claim_ids:
        - SAF-T1803-C008
        - SAF-T1803-C010
      rationale: Known backup behavior is a documented source of expected lookalikes.
    condition:
      claim_ids:
        - SAF-T1803-C010
      rationale: Combines method, operation, volume, approval, and allowlist state into the analytic.
    falsepositives:
      claim_ids:
        - SAF-T1803-C008
        - SAF-T1803-C010
      rationale: Backups, pipelines, migrations, and authorized response can resemble collection.
