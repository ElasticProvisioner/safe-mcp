title: Local MCP Server Child Process Enumerates Environment
id: 0e509b28-f8f5-4a96-84cb-ed8a7c9cd339
status: experimental
description: >-
  Detects a narrowly defined process-creation pattern in which env, printenv,
  or cmd.exe invoking the set builtin descends from a process identified by the
  deployment as a local MCP server. This analytic does not detect direct
  in-process reads through language runtime APIs.
author: OpenAI Codex clean-room author
date: 2026-09-01
logsource:
  category: process_creation
  product: cross-platform
  definition: >-
    Normalized Sysmon Event ID 1, Windows 4688, or Linux Audit process records
    with image, command line, and deployment-derived ancestor role.
detection:
  server_ancestor:
    AncestorProcessRole: local_mcp_server
  utility_unix:
    Image|endswith:
      - /env
      - /printenv
  utility_windows:
    Image|endswith: '\cmd.exe'
    CommandLine|re: '(?i)(?:^|\s)/(?:c|k)\s+set(?:\s|$)'
  condition: server_ancestor and (utility_unix or utility_windows)
fields:
  - TimeCreated
  - Hostname
  - User
  - Image
  - CommandLine
  - ProcessId
  - ParentProcessId
  - AncestorProcessRole
falsepositives:
  - An administrator or a trusted MCP server may invoke an environment utility for diagnostics.
level: medium
tags:
  - saf.t1503
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1503-C017
  telemetry_claim_ids:
    - SAF-T1503-C015
    - SAF-T1503-C016
  limitation_claim_ids:
    - SAF-T1503-C018
    - SAF-T1503-C019
  validation_artifacts:
    - tests/SAF-T1503/test_detection.py
    - tests/SAF-T1503/test-cases.json
    - tests/SAF-T1503/test-result.txt
    - research/techniques/SAF-T1503/validation/detection-test-result.txt
    - research/techniques/SAF-T1503/validation/strict-validator-result.txt
  components:
    logsource:
      claim_ids: [SAF-T1503-C015, SAF-T1503-C016, SAF-T1503-C019]
      rationale: Process-creation telemetry supplies the image, command line, and lineage fields while requiring privacy-aware handling.
    server_ancestor:
      claim_ids: [SAF-T1503-C015, SAF-T1503-C016, SAF-T1503-C017]
      rationale: Parent identifiers and command lines permit deployment-specific lineage enrichment for known local MCP server processes.
    utility_unix:
      claim_ids: [SAF-T1503-C009, SAF-T1503-C017]
      rationale: The Codecov incident establishes env as a real collection utility; printenv is included as the bounded same-purpose Unix utility.
    utility_windows:
      claim_ids: [SAF-T1503-C017]
      rationale: The Windows command-shell set builtin is the bounded platform-equivalent enumeration command tested by this analytic.
    condition:
      claim_ids: [SAF-T1503-C017, SAF-T1503-C018]
      rationale: Requiring both known server ancestry and an enumeration utility narrows the signal while preserving the stated in-process blind spot.
    fields:
      claim_ids: [SAF-T1503-C015, SAF-T1503-C016, SAF-T1503-C019]
      rationale: Investigation fields support lineage reconstruction, host and user scoping, and controlled access to potentially sensitive command lines.
    falsepositives:
      claim_ids: [SAF-T1503-C017]
      rationale: The design claim explicitly identifies legitimate diagnostics as a low-specificity match class.
