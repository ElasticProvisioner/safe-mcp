title: Repeated Agent Approval Requests Followed by Approval
id: 3a9d4f8c-3f0b-4a7f-9f68-f50e41d9c403
status: experimental
description: >-
  Detects materially equivalent approval requests for one user and requester
  within a short window when a denial or cancellation precedes approval.
author: OpenAI Codex clean-room agent /root/cleanroom_saf_t1403
date: 2026-09-01
modified: 2026-09-01
logsource:
  category: application
  product: agent_or_mcp_client
  service: approval_audit
detection:
  selection_request:
    event_type: approval_request
  group_by:
    - user_id
    - requester_id
    - operation
    - request_fingerprint
  timeframe: 10m
  threshold: 4
  prior_negative_decisions:
    decision:
      - denied
      - cancelled
  terminal_decision:
    decision: approved
  exclusions:
    user_initiated: true
  condition: >-
    selection_request and count() >= threshold by group_by within timeframe and
    prior_negative_decisions precedes terminal_decision and not exclusions
fields:
  - event_time
  - user_id
  - session_id
  - requester_id
  - operation
  - request_fingerprint
  - decision
  - approval_scope
  - user_initiated
falsepositives:
  - Legitimate retries after transient failures when the application preserves an identical request fingerprint.
  - Separately initiated user actions that happen to request the same operation within the correlation window.
level: medium
tags:
  - saf.t1403
  - attack.t1621
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1403-C013
    - SAF-T1403-C014
  telemetry_claim_ids:
    - SAF-T1403-C002
    - SAF-T1403-C010
    - SAF-T1403-C013
  limitation_claim_ids:
    - SAF-T1403-C014
    - SAF-T1403-C015
  validation_artifacts:
    - tests/SAF-T1403/cases.json
    - tests/SAF-T1403/test_detection_rule.py
    - research/techniques/SAF-T1403/validation/detection-test.txt
    - research/techniques/SAF-T1403/validation/strict-validator.txt
  components:
    logsource:
      claim_ids: [SAF-T1403-C002, SAF-T1403-C010, SAF-T1403-C013]
      rationale: MCP and analogous authentication guidance require auditable request and decision events.
    selection_request:
      claim_ids: [SAF-T1403-C013]
      rationale: Approval-request events are the base population for sequence analysis.
    group_by:
      claim_ids: [SAF-T1403-C013, SAF-T1403-C015]
      rationale: User, requester, operation, and fingerprint distinguish equivalent requests from unrelated actions.
    timeframe:
      claim_ids: [SAF-T1403-C014]
      rationale: Ten minutes is the explicit experimental correlation boundary.
    threshold:
      claim_ids: [SAF-T1403-C014]
      rationale: Four requests is the explicit experimental count boundary.
    prior_negative_decisions:
      claim_ids: [SAF-T1403-C013]
      rationale: A prior denial or cancellation distinguishes resistance from ordinary approval.
    terminal_decision:
      claim_ids: [SAF-T1403-C013]
      rationale: Later approval represents the technique's immediate objective.
    exclusions:
      claim_ids: [SAF-T1403-C015]
      rationale: Explicit user initiation is an expected legitimate lookalike.
    condition:
      claim_ids: [SAF-T1403-C013, SAF-T1403-C014, SAF-T1403-C015]
      rationale: The full condition binds equivalence, count, time, decision order, and false-positive suppression.
    fields:
      claim_ids: [SAF-T1403-C013, SAF-T1403-C015]
      rationale: These fields support correlation, scoping, validation, and investigation.
    falsepositives:
      claim_ids: [SAF-T1403-C015]
      rationale: Retry loops and separate user actions are documented analytic limitations.
