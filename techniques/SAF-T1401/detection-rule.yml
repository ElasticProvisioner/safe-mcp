title: MCP Line Jumping Resolver Precedence Manipulation
id: 7e0e64f9-8f57-48c3-9f6c-7cfca13b1401
status: experimental
description: >-
  Detects a successful unresolved object collision, a successful non-admin
  mutation of a global MCP object, or an untrusted resolver winner displacing
  a trusted competitor, excluding explicitly approved changes.
author: /root/cleanroom_saf_t1401
date: 2026-09-01
logsource:
  category: mcp_resolver
  product: mcp_host
detection:
  selection_collision:
    action: register
    collision: true
    disambiguated: false
    outcome: success
  selection_unauthorized_global_mutation:
    action: mutate
    object.scope: global
    actor.is_admin: false
    outcome: success
  selection_untrusted_winner:
    action: resolve
    collision: true
    winner.trust: untrusted
    competitor.trust: trusted
    outcome: success
  filter_approved_change:
    change.approved: true
  condition: 1 of selection_* and not filter_approved_change
fields:
  - timestamp
  - request_id
  - session_id
  - action
  - actor.id
  - actor.is_admin
  - object.type
  - object.scope
  - object.logical_id
  - object.normalized_id
  - object.definition_hash
  - source.canonical_id
  - collision
  - disambiguated
  - winner.source
  - winner.trust
  - competitor.source
  - competitor.trust
  - resolution.reason
  - change.approved
  - outcome
falsepositives:
  - Planned source migrations that temporarily register both old and new identities without recording approval.
  - Authorized aliases or compatibility mappings that intentionally preserve a collision.
  - Test and staging registrations emitted into production-visible audit streams.
level: high
tags:
  - saf.t1401
  - attack.defense-evasion
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1401-C012
    - SAF-T1401-C013
  telemetry_claim_ids:
    - SAF-T1401-C011
    - SAF-T1401-C014
  limitation_claim_ids:
    - SAF-T1401-C013
  validation_artifacts:
    - tests/SAF-T1401/test_detection_rule.py
    - tests/SAF-T1401/test-logs.json
    - research/techniques/SAF-T1401/validation/detection-test.txt
    - research/techniques/SAF-T1401/validation/strict-validator.txt
  components:
    logsource:
      claim_ids: [SAF-T1401-C011]
      rationale: MCP host resolver and registry lifecycle logs retain the source and decision fields required by the analytic.
    selection_collision:
      claim_ids: [SAF-T1401-C005, SAF-T1401-C012]
      rationale: The direct overwrite demonstration and protocol collision guidance support unresolved successful registration as suspicious.
    selection_unauthorized_global_mutation:
      claim_ids: [SAF-T1401-C004, SAF-T1401-C012, SAF-T1401-C015]
      rationale: The MCPHub demonstration and fix establish non-admin mutation of global objects as a precedence-changing behavior.
    selection_untrusted_winner:
      claim_ids: [SAF-T1401-C003, SAF-T1401-C012]
      rationale: Both direct demonstrations culminate in an attacker-controlled object winning ahead of a trusted competitor.
    filter_approved_change:
      claim_ids: [SAF-T1401-C012, SAF-T1401-C013]
      rationale: Explicit change approval separates authorized aliases and migrations from unapproved displacement.
    condition:
      claim_ids: [SAF-T1401-C012, SAF-T1401-C013]
      rationale: Any supported precedence branch alerts unless an explicit approved-change record is present.
    fields:
      claim_ids: [SAF-T1401-C011, SAF-T1401-C013, SAF-T1401-C014]
      rationale: Candidate provenance, identity, role, scope, trust, approval, and resolution reason enable evaluation and tuning.
    falsepositives:
      claim_ids: [SAF-T1401-C013]
      rationale: Controlled studies and operational extrapolation support migration, alias, and test-registration tuning classes.
