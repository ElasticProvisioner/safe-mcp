title: MCP Server Proxy Masquerade Identity and Relay Correlation
id: 09f59f0c-9477-4c82-a66d-3c49f37139bf
status: experimental
description: >-
  Detects a normalized MCP session that has both a mismatch from the approved
  server identity and a relay-like protected-resource, authorization-server, or
  tool-catalog association, excluding explicitly approved gateways.
author: OpenAI Codex clean-room author
date: 2026-09-01
logsource:
  category: mcp_session
  product: mcp
  definition: Normalized MCP client, endpoint identity, TLS, OAuth discovery, and tool inventory telemetry.
detection:
  selection_identity:
    approved_identity_mismatch: true
  selection_relay:
    relay_association_signal: true
  filter_approved_gateway:
    approved_gateway: true
  condition: selection_identity and selection_relay and not filter_approved_gateway
fields:
  - session_id
  - approved_server_uri
  - configured_server_uri
  - resolved_server_uri
  - tls_peer_identity
  - protected_resource
  - authorization_servers
  - server_info
  - tool_catalog_fingerprint
  - approved_identity_mismatch
  - relay_association_signal
  - approved_gateway
falsepositives:
  - Legitimate gateway or service-mesh mediation not yet entered into the approval inventory.
  - Planned endpoint migration with stale URI, certificate, resource, or authorization-server baselines.
  - Shared authorization infrastructure or cloned tool catalogs combined with an unrelated identity mismatch.
level: high
tags:
  - saf.t1407
  - attack.defense-evasion
  - attack.t1036
  - attack.t1557
traceability:
  policy: source_or_omit
  design_claim_ids: [SAF-T1407-C013, SAF-T1407-C014]
  telemetry_claim_ids: [SAF-T1407-C001, SAF-T1407-C004, SAF-T1407-C013]
  limitation_claim_ids: [SAF-T1407-C015, SAF-T1407-C023]
  validation_artifacts:
    - tests/SAF-T1407/cases.json
    - tests/SAF-T1407/test_detection_rule.py
    - research/techniques/SAF-T1407/validation/detection-test.txt
    - research/techniques/SAF-T1407/validation/strict-validator.txt
  components:
    logsource:
      claim_ids: [SAF-T1407-C001, SAF-T1407-C004, SAF-T1407-C013]
      rationale: MCP connection, endpoint identity, and authorization metadata must be normalized into one session record.
    selection_identity:
      claim_ids: [SAF-T1407-C005, SAF-T1407-C013]
      rationale: Standards-defined resource and TLS comparisons support an explicit approved-identity mismatch field.
    selection_relay:
      claim_ids: [SAF-T1407-C006, SAF-T1407-C013, SAF-T1407-C014]
      rationale: Resource, authorization, or catalog association supplies a second signal consistent with relay or reuse.
    filter_approved_gateway:
      claim_ids: [SAF-T1407-C014, SAF-T1407-C015]
      rationale: Explicit gateway approval suppresses expected mediation while retaining unapproved identity shifts.
    condition:
      claim_ids: [SAF-T1407-C014]
      rationale: Requiring both independent conditions reduces alerts on merely unapproved development servers.
    fields:
      claim_ids: [SAF-T1407-C013]
      rationale: The output fields preserve the identity tuple needed for investigation and tuning.
    falsepositives:
      claim_ids: [SAF-T1407-C015]
      rationale: Gateways, migrations, shared authorization, and cloned catalogs can create legitimate correlation matches.
