title: MCP Untrusted Command Boundary Crossing
id: a34b3eb5-fc62-4a39-83c5-0dbe97fd9adc
status: experimental
description: >-
  Correlates an untrusted MCP command-bearing event with a child process and alerts when the child contains shell-control syntax or the requested executable changed, unless an explicit approval and command-policy match are both present.
author: SAF-MCP clean-room research
date: 2026-09-01
logsource:
  category: process_creation
  product: cross-platform
  definition: Requires normalized MCP audit events and process-start events sharing a correlation identifier.
detection:
  selection_mcp:
    event.category: mcp
    event.action:
      - tool_call
      - server_launch
      - authorization_launch
      - proxy_call
    mcp.input_trust: untrusted
  selection_process:
    event.category: process
    event.type: start
    process.parent.entity_id|exists: true
  selection_shell_control:
    process.name|endswith:
      - /sh
      - /bash
      - /zsh
      - powershell.exe
      - pwsh.exe
      - cmd.exe
    process.command_line|contains:
      - " ; "
      - " && "
      - " || "
      - " | "
  selection_executable_change:
    mcp.requested_executable_changed: true
  filter_approved:
    mcp.approval_state: approved
    mcp.command_policy_match: true
  timeframe: 10s
  condition: >-
    sequence by mcp.correlation_id selection_mcp then selection_process where
    (selection_shell_control or selection_executable_change) and not filter_approved
falsepositives:
  - Authorized diagnostic or administrative tools whose approval and policy state are absent from telemetry.
  - Build, package, and automation systems that intentionally launch shells with control operators.
fields:
  - "@timestamp"
  - mcp.correlation_id
  - mcp.component.entity_id
  - mcp.command_source
  - mcp.approval_state
  - mcp.command_policy_match
  - mcp.requested_executable_changed
  - process.entity_id
  - process.parent.entity_id
  - process.executable
  - process.args
  - process.command_line
level: high
tags:
  - saf.t1101
  - attack.execution
  - attack.t1059
traceability:
  policy: source_or_omit
  design_claim_ids: [SAF-T1101-C011, SAF-T1101-C014]
  telemetry_claim_ids: [SAF-T1101-C012, SAF-T1101-C013]
  limitation_claim_ids: [SAF-T1101-C015]
  validation_artifacts:
    - techniques/SAF-T1101/test-logs.json
    - techniques/SAF-T1101/test_detection_rule.py
    - techniques/SAF-T1101/test-results.json
  components:
    logsource:
      claim_ids: [SAF-T1101-C012, SAF-T1101-C013]
      rationale: Process-start and normalized MCP audit events provide the required ancestry and command context.
    selection_mcp:
      claim_ids: [SAF-T1101-C002, SAF-T1101-C011]
      rationale: Restricts the first event to an untrusted command-bearing MCP boundary.
    selection_process:
      claim_ids: [SAF-T1101-C012, SAF-T1101-C013]
      rationale: Requires a normalized child process with parent identity.
    selection_shell_control:
      claim_ids: [SAF-T1101-C001, SAF-T1101-C014]
      rationale: Represents the intended-command modification variant with shell syntax.
    selection_executable_change:
      claim_ids: [SAF-T1101-C001, SAF-T1101-C014]
      rationale: Represents the full-command or executable-selection variant.
    filter_approved:
      claim_ids: [SAF-T1101-C002, SAF-T1101-C017]
      rationale: Requires both explicit approval and policy conformance before suppressing intentional execution.
    timeframe:
      claim_ids: [SAF-T1101-C014]
      rationale: A bounded synthetic correlation window limits unrelated process joins; production tuning is required.
    condition:
      claim_ids: [SAF-T1101-C011, SAF-T1101-C014]
      rationale: Joins attacker influence, process ancestry, and one of the two command-injection variants.
    falsepositives:
      claim_ids: [SAF-T1101-C015]
      rationale: Documents authorized automation and incomplete approval context as expected ambiguity.
    fields:
      claim_ids: [SAF-T1101-C012, SAF-T1101-C013]
      rationale: Retains the minimum protocol and process fields needed to investigate a match.
