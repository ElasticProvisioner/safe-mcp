title: MCP Runtime Secret Boundary Violation
id: 9dbfd0ef-c166-4f69-ab54-68406a84c279
status: experimental
description: >-
  Detects three instrumented MCP or agent-runtime sequences that expose
  secret-bearing live state to an unauthorized destination, child process, or session.
author: OpenAI Codex clean-room author
date: "2026-09-01"
modified: "2026-09-01"
tags:
  - saf.t1505
  - attack.credential_access
logsource:
  category: application
  product: mcp_agent_runtime
detection:
  selection_remote_environment_resolution:
    event_type: mcp_server_config_validation
    input_trust: untrusted
    destination_trust: external
    referenced_env_names|secret_name: true
  selection_untrusted_child_inheritance:
    event_type: mcp_server_process_start
    child_trust:
      - untrusted
      - unknown
    allowlist_decision: not_explicitly_allowed
    inherited_env_names|secret_name: true
  selection_cross_session_access:
    event_type: runtime_secret_access
    same_session_owner: false
    authorization_result: not_allowed
    secret_identifier|secret_name: true
  condition: >-
    selection_remote_environment_resolution or
    selection_untrusted_child_inheritance or selection_cross_session_access
fields:
  - timestamp
  - event_type
  - actor_id
  - session_id
  - secret_owner_session_id
  - transport
  - destination_host
  - destination_trust
  - input_trust
  - parent_process
  - child_process
  - child_trust
  - allowlist_decision
  - referenced_env_names
  - inherited_env_names
  - secret_identifier
  - authorization_result
falsepositives:
  - Approved local MCP servers receiving an explicitly allowlisted minimum environment.
  - Administrative configuration validation against an organization-controlled destination.
  - Authorized service-account sharing represented by an explicit allowed decision.
level: high
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1505-C010
    - SAF-T1505-C011
  telemetry_claim_ids:
    - SAF-T1505-C016
  limitation_claim_ids:
    - SAF-T1505-C010
    - SAF-T1505-C011
  validation_artifacts:
    - tests/SAF-T1505/test_detection_rule.py
    - tests/SAF-T1505/test-logs.json
    - research/techniques/SAF-T1505/validation/detection-tests.txt
    - research/techniques/SAF-T1505/validation/strict-validator.txt
  components:
    logsource:
      claim_ids:
        - SAF-T1505-C016
      rationale: The rule requires normalized MCP or agent-runtime application events.
    selection_remote_environment_resolution:
      claim_ids:
        - SAF-T1505-C005
        - SAF-T1505-C010
      rationale: The selection follows the reviewed untrusted URL, environment lookup, and external destination sequence.
    selection_untrusted_child_inheritance:
      claim_ids:
        - SAF-T1505-C007
        - SAF-T1505-C010
        - SAF-T1505-C011
      rationale: The selection requires both secret-like inheritance and an untrusted non-allowlisted child.
    selection_cross_session_access:
      claim_ids:
        - SAF-T1505-C006
        - SAF-T1505-C010
      rationale: The selection models a secret owner and requesting session mismatch without authorization.
    condition:
      claim_ids:
        - SAF-T1505-C010
      rationale: Any independently sufficient reviewed boundary-crossing pattern raises the alert.
    fields:
      claim_ids:
        - SAF-T1505-C016
      rationale: Fields reproduce causal joins from the reviewed disclosures while excluding secret values.
    falsepositives:
      claim_ids:
        - SAF-T1505-C002
        - SAF-T1505-C011
      rationale: Legitimate stdio credential use requires trust and allowlist context to avoid name-only alerts.
