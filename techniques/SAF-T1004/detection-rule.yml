title: MCP Server Identity Binding Discrepancy
id: a69cd1e5-b4ea-5eb9-be7a-186912acc2af
status: experimental
description: >-
  Detects a security-relevant MCP server install, configuration, resolution, or
  connection when publisher or package binding is unverified, an approved alias
  resolves to a different canonical server tuple, or TLS endpoint identity fails.
author: SAF-MCP clean-room research packet
date: 2026-09-01
references:
  - https://modelcontextprotocol.io/specification/2026-07-28/schema
  - https://modelcontextprotocol.io/registry/package-types
  - https://learn.microsoft.com/en-us/azure/developer/azure-mcp-server/security
  - https://www.rfc-editor.org/rfc/rfc9525.html
tags:
  - saf.t1004
logsource:
  product: mcp
  category: server_resolution
  definition: Normalized discovery, install, configuration, resolution, and connection telemetry with an approved identity baseline.
detection:
  selection_action:
    action:
      - configure
      - connect
      - install
      - resolve
  selection_unverified_namespace:
    publisher_namespace_verified: false
  selection_unverified_binding:
    package_binding_status:
      - failed
      - skipped
      - unknown
  selection_approved_alias_tuple_mismatch:
    approved_alias_match: true
    canonical_identity_tuple_match: false
  selection_tls_identity_mismatch:
    tls_identity_status: mismatch
  condition: >-
    selection_action and
    (selection_unverified_namespace or selection_unverified_binding or
    selection_approved_alias_tuple_mismatch or selection_tls_identity_mismatch)
fields:
  - timestamp
  - event_type
  - action
  - actor
  - client_id
  - decision
  - discovery_source
  - alias
  - server_name
  - registry_url
  - authenticated_publisher_namespace
  - package_identifier
  - immutable_artifact_digest
  - endpoint_uri
  - expected_tls_reference_identity
  - resolved_certificate_identities
  - publisher_namespace_verified
  - package_binding_status
  - tls_identity_status
  - approved_identity
falsepositives:
  - A legitimate server migration retains a familiar alias while changing its endpoint or package before the approved baseline is updated.
  - Two unrelated servers use the same human-readable title while their authenticated namespaces differ.
  - An upstream verifier is temporarily unavailable and a fail-closed pipeline records the binding as unknown.
  - A separate confusable-name heuristic flags a legitimate multilingual name.
level: medium
severity_by_match:
  tls_identity_mismatch: high
  unverified_namespace_or_binding: high
  approved_alias_tuple_mismatch: medium
limitations:
  - Requires normalized identity and approval-baseline telemetry that products may not currently emit.
  - Does not establish malicious intent or validate a live certificate chain.
  - Does not detect a malicious server that retains every approved identity attribute.
  - Unicode confusable similarity is intentionally not a primary match condition because it is inclusive, version-sensitive, and font-dependent.
tuning:
  - Populate approved_identity from authenticated publisher, package, digest, endpoint, and TLS reference-identity records.
  - Review legitimate migrations and duplicate display titles without allowlisting failed namespace, package, or TLS verification.
traceability:
  policy: source_or_omit
  design_claim_ids:
    - SAF-T1004-C003
    - SAF-T1004-C007
    - SAF-T1004-C008
  telemetry_claim_ids:
    - SAF-T1004-C003
    - SAF-T1004-C007
    - SAF-T1004-C008
  limitation_claim_ids:
    - SAF-T1004-C006
    - SAF-T1004-C007
    - SAF-T1004-C008
    - SAF-T1004-C010
  validation_artifacts:
    - techniques/SAF-T1004/test_detection_rule.py
    - techniques/SAF-T1004/fixtures/detection-events.json
    - techniques/SAF-T1004/test-results.json
    - techniques/SAF-T1004/test-log.jsonl
  components:
    logsource:
      claim_ids: [SAF-T1004-C003, SAF-T1004-C007, SAF-T1004-C008]
      rationale: The sources establish the identity attributes and endpoint-verification outcomes that the normalized log source must retain.
    selection_action:
      claim_ids: [SAF-T1004-C003, SAF-T1004-C007]
      rationale: Install, configuration, resolution, and connection are the frozen security-relevant decision points.
    selection_unverified_namespace:
      claim_ids: [SAF-T1004-C002, SAF-T1004-C003]
      rationale: An authenticated publisher namespace is one required identity binding, so explicit verification failure is suspicious.
    selection_unverified_binding:
      claim_ids: [SAF-T1004-C003, SAF-T1004-C004]
      rationale: The direct vulnerability demonstrates why failed, skipped, or unknown package-to-server binding must not be treated as success.
    selection_approved_alias_tuple_mismatch:
      claim_ids: [SAF-T1004-C001, SAF-T1004-C003, SAF-T1004-C007]
      rationale: A familiar self-reported label is insufficient when package, publisher, registry, or endpoint values differ from the approved tuple.
    selection_tls_identity_mismatch:
      claim_ids: [SAF-T1004-C007, SAF-T1004-C008]
      rationale: Endpoint-substitution guidance and RFC 9525 support treating a TLS identity mismatch as a security-relevant discrepancy.
    condition:
      claim_ids: [SAF-T1004-C003, SAF-T1004-C004, SAF-T1004-C007, SAF-T1004-C008]
      rationale: The condition preserves the frozen analytic intent by requiring a security-relevant action plus at least one binding, tuple, or TLS discrepancy.
    fields:
      claim_ids: [SAF-T1004-C003, SAF-T1004-C007, SAF-T1004-C008]
      rationale: The field list exposes both display attributes and independently established identity values needed for comparison and investigation.
    falsepositives:
      claim_ids: [SAF-T1004-C006, SAF-T1004-C007, SAF-T1004-C008, SAF-T1004-C010]
      rationale: Migration, duplicate titles, verifier outages, and multilingual similarity can resemble parts of the behavior without establishing malicious intent.
