# SIGMA RULE: Malicious MCP-Server Distribution - host / endpoint telemetry
# WARNING: This rule contains example patterns only. Organizations should:
# - Regularly update patterns based on threat intelligence
# - Implement behavioral analysis beyond pattern matching
# - Use AI-based anomaly detection for novel attack vectors
# - Consider context-specific false positives
#
# Scope: endpoint (Sysmon) telemetry only, using Sysmon EventIDs 1 (process
# create), 3 (network connect) and 11 (file create). This is the companion to
# the MCP-runtime rule detection-rule.yml (id 7dd04394-...). The two are kept
# separate because no single log source emits both MCP-level events and OS
# endpoint telemetry. (The earlier single rule mixed product: mcp with Windows
# Security EventIDs, so it could never fire against an MCP log stream.)

title: Malicious MCP Server Host Activity (Beacon, Persistence, Exfiltration)
id: 382285c8-7989-498d-a9f0-bd8673e7554e
status: experimental
description: Detects host-level indicators of a trojanized MCP server after installation - an MCP runtime process spawning a shell/curl beacon, connecting to the Example Scenario C2 hosts, or creating a cron/health-check persistence file - via Sysmon endpoint telemetry.
author: Frederick Kautz
date: 2026-07-01
modified: 2026-07-01
references:
  - https://github.com/secure-agentic-framework/saf-mcp/tree/main/techniques/SAF-T1003
  - https://attack.mitre.org/techniques/T1204/002/
logsource:
  product: windows
  service: sysmon
detection:
  # MCP runtime (node/python) or a shell spawning a beacon process. Maps to the
  # Dockerfile cron job running `curl ... -d "$(env)"` and to command injection.
  selection_beacon_proc:
    EventID: 1
    ParentImage|endswith:
      - '\node.exe'
      - '\python.exe'
      - '\sh'
      - '\bash'
    Image|endswith:
      - '\curl.exe'
      - '\wget.exe'
      - '\sh'
      - '\bash'
      - '\powershell.exe'
  # Outbound connection from an MCP runtime to the Example Scenario C2 hosts.
  # Matched on the actual .com hostnames the payload uses (a bare Freenom-TLD
  # block list was dropped: it misses these and generates noise).
  selection_network_c2:
    EventID: 3
    Image|endswith:
      - '\node.exe'
      - '\python.exe'
      - '\curl.exe'
    DestinationHostname|contains:
      - 'legit-analytics'
      - 'backup-service'
      - 'malicious-domain'
      - 'beacon'
  # Creation of a cron / health-check persistence artifact (maps to the
  # Dockerfile crontab + /usr/local/bin/health-check).
  selection_persistence:
    EventID: 11
    TargetFilename|contains:
      - 'health-check'
      - 'mcp-monitor'
      - '/cron'
      - '/tmp/.mcp'
  condition: selection_beacon_proc or selection_network_c2 or selection_persistence
falsepositives:
  - MCP servers that legitimately invoke curl/wget for their advertised function
  - Servers with legitimate analytics/telemetry endpoints (tune the host list)
  - Legitimate health-check or scheduled-task files with matching names
level: high
tags:
  - attack.initial_access
  - attack.t1204
  - attack.t1204.002
  - safe.t1003
