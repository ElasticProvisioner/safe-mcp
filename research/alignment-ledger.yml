version: 1
issues:
  - id: SAF-T1001-A001
    triggered_by: SAF-T1001
    affects:
      - SAF-T1001
    change: >-
      Remove schema poisoning, runtime output injection, tool shadowing, rug
      pulls, supply-chain delivery, and unrelated implementation CVEs from the
      defining SAF-T1001 scope.
    reason: >-
      Primary sources and current MITRE ATLAS data distinguish these mechanisms,
      and SAF already contains neighboring techniques for them.
    severity: high
    status: resolved
    resolution: >-
      The rewritten Scope, Related Techniques, evidence table, and contract now
      use the top-level description field as the classification boundary.
  - id: SAF-T1001-A002
    triggered_by: SAF-T1001
    affects:
      - SAF-T1001
    change: Replace the Process Injection mapping and qualify the supply-chain mapping.
    reason: >-
      ATT&CK Process Injection does not describe the semantic boundary, while
      ATLAS AML.T0110.000 directly covers model-visible definition poisoning.
    severity: high
    status: resolved
    resolution: >-
      Added direct ATLAS AML.T0110.000 mapping and retained ATT&CK T1195.001 only
      as an analogous, conditional delivery mapping.
  - id: SAF-T1001-A003
    triggered_by: SAF-T1001
    affects:
      - SAF-T1001
    change: Upgrade the evidence status from Demonstrated to Observed.
    reason: >-
      Microsoft Defender Experts Cybersecurity Incident Response reported on
      2026-06-30 that the defining tool-description-poisoning pattern had been
      observed in 2026 against enterprise agents.
    severity: high
    status: resolved
    resolution: >-
      The technique, claim inventory, source coverage, and framework model now
      use Observed. They also disclose that Microsoft withholds affected
      organizations, dates, incident count, telemetry, and other case-specific
      evidence, and preserve ATLAS's separate Demonstrated maturity.
  - id: SAF-T1002-A001
    triggered_by: SAF-T1002
    affects:
      - SAF-T1002
      - SAF-T1003
      - SAF-T1004
      - SAF-T1006
      - SAF-T1203
    change: >-
      Register the trusted-producer or trusted-distribution-path boundary and
      distinguish it from deceptive identity, attacker-selected installation,
      malicious-server distribution, and the delivered backdoor outcome.
    reason: >-
      The frozen clean-room contract requires alteration of a producer or path
      the consumer already trusts, followed by acquisition and execution.
    severity: high
    status: resolved
    resolution: >-
      The rewritten Scope and Related Techniques sections, canonical contract,
      and shared framework model now record the Initial Access tactic and four
      nearest-neighbor distinctions without importing prior target prose.
  - id: SAF-T1003-A001
    triggered_by: SAF-T1003
    affects:
      - SAF-T1003
      - SAF-T1207
    change: >-
      Preserve the malicious-distribution versus hijacked-update-path boundary
      and create the cataloged SAF-T1207 technique needed to validate the join.
    reason: >-
      The frozen SAF-T1003 contract identifies update-path hijacking as a
      nearest neighbor, while the framework catalog contains SAF-T1207 but the
      repository has no SAF-T1207 directory.
    severity: high
    status: resolved
    resolution: >-
      SAF-T1207 was independently clean-room authored, integrated with a
      reciprocal SAF-T1003 boundary, and strict validation now passes for both
      techniques.
  - id: SAF-T1005-A001
    triggered_by: SAF-T1005
    affects:
      - SAF-T1004
      - SAF-T1005
      - SAF-T1007
      - SAF-T1101
    change: >-
      Register endpoint exposure or failed access control as the Initial Access
      boundary and distinguish it from endpoint impersonation, authorization
      phishing, and unsafe command parsing after authorized invocation.
    reason: >-
      The frozen contract ends when an untrusted network client or browser
      origin obtains a sensitive endpoint action without a valid access
      decision; later command parsing and follow-on effects are separate.
    severity: high
    status: resolved
    resolution: >-
      The clean-room Scope, Related Techniques, canonical contract, shared
      framework record, mitigation joins, and nine-case analytic now encode and
      validate the boundary.
  - id: SAF-T1004-A001
    triggered_by: SAF-T1004
    affects:
      - SAF-T1003
      - SAF-T1004
      - SAF-T1008
      - SAF-T1009
      - SAF-T1301
      - SAF-T1407
    change: >-
      Register authenticated server, publisher, package, endpoint, and TLS
      identity selection as the boundary for server impersonation or name
      collision, distinct from malicious distribution and post-connection
      shadowing or authorization mechanisms.
    reason: >-
      The frozen clean-room contract and reviewed protocol authorities separate
      wrong-server selection or connection from the means of distribution and
      from attacks that begin only after a server connection exists.
    severity: high
    status: resolved
    resolution: >-
      The rewritten Scope, Related Techniques, canonical contract, shared
      framework record, six mitigation joins, and six-case detection analytic
      now encode and validate the boundary.
  - id: SAF-T1006-A001
    triggered_by: SAF-T1006
    affects:
      - SAF-T1002
      - SAF-T1003
      - SAF-T1006
    change: >-
      Register deceptive, user-mediated MCP installation or trust as the
      boundary for SAF-T1006 and distinguish it from attacker-controlled
      distribution and compromise of a previously trusted supply path.
    reason: >-
      The frozen contract requires a user install or trust decision followed by
      registration or execution; automatic configuration and later artifact
      substitution do not satisfy that boundary.
    severity: high
    status: resolved
    resolution: >-
      The rewritten Scope, Related Techniques, canonical contract, Initial
      Access tactic, shared framework joins, seven mitigations, and seven-case
      analytic now encode and validate the distinction.
  - id: SAF-T1007-A001
    triggered_by: SAF-T1007
    affects:
      - SAF-T1007
      - SAF-T1009
      - SAF-T1706
    change: >-
      Register cross-user binding of a victim's third-party OAuth grant as the
      SAF-T1007 boundary and distinguish it from authorization-server selection
      errors and replay of an already issued token.
    reason: >-
      The frozen contract and direct vulnerability evidence require different
      authenticated subjects at flow initiation and callback completion before
      the server stores the grant under the initiator.
    severity: high
    status: resolved
    resolution: >-
      The rewritten Scope, Related Techniques, canonical contract, shared
      framework record, nine mitigation joins, and six-case detection analytic
      now encode and validate the distinction.
  - id: SAF-T1207-A001
    triggered_by: SAF-T1207
    affects:
      - SAF-T1003
      - SAF-T1201
      - SAF-T1207
    change: >-
      Register replacement of an already trusted agentic component through its
      update path as the SAF-T1207 boundary, distinct from attacker-controlled
      first installation and runtime-only tool-definition changes.
    reason: >-
      The frozen contract requires a trusted prior version, an accepted release
      or dependency replacement, activation, and persistence across component
      or host restarts.
    severity: high
    status: resolved
    resolution: >-
      The clean-room technique, reciprocal SAF-T1003 boundary, SAF-T1201
      distinction, canonical contract, shared framework record, seven
      mitigation joins, and ten-case analytic now encode and validate the
      boundary.
  - id: SAF-T1008-A001
    triggered_by: SAF-T1008
    affects:
      - SAF-T1001
      - SAF-T1008
      - SAF-T1201
      - SAF-T1301
    change: >-
      Register foreign descriptor influence over a separately trusted tool as
