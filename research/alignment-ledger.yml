      - SAF-T1304
      - SAF-T1306
      - SAF-T1406
      - SAF-T1507
    change: >-
      Retain Rogue Authorization Server as the attacker-controlled authorization
      infrastructure role within a multi-issuer flow, while recording the close
      overlap with SAF-T1009's client-side authorization-server mix-up mechanism
