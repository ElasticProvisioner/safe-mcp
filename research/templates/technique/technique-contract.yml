version: 1
technique_id: __TECHNIQUE_ID__
name: __TECHNIQUE_NAME__
status: draft
created_on: "__DATE__"
updated_on: "__DATE__"
generation_mode: standard

tactics:
  - ATK-TAXXXX

adversary_objective: >-
  State the immediate adversary objective without describing a mitigation or
  generic impact.

scope:
  security_boundary: >-
    Name the trust boundary crossed or abused.
  in_scope:
    - Define the mechanism and outcome included in this technique.
  out_of_scope:
    - Identify similar behavior that uses a different mechanism or boundary.
  affected_components:
    - MCP host, client, server, transport, tool, resource, prompt, model, memory,
      registry, or external service

nearest_neighbors:
  - technique_id: SAF-TXXXX
    distinction: >-
      Explain the mechanism, boundary, objective, or observables that prevent a
      duplicate classification.

required_evidence:
  - Establish that the defining mechanism is possible in the stated MCP or
    agentic-system boundary.
  - Establish the prerequisites and immediate outcome.
  - Establish whether the end-to-end behavior is observed, demonstrated,
    research-derived, or hypothesized.
  - Search for production breaches and disclosed vulnerabilities, classify
    their relationship to this contract, and select the highest-impact relevant
    examples or record why none qualify.

detection:
  expectation: required
  waiver_rationale: null
  required_telemetry:
    - Name the event source and fields needed to evaluate the analytic.

safe_example_constraints:
  - Use inert domains, placeholder credentials, and non-destructive commands.
  - Include only the detail needed to explain and validate the behavior.

completion_evidence:
  - Every substantive publishable unit is validated and linked to a reviewed
    source with exact locators or a declared repository artifact.
  - Unverified candidate claims and examples are omitted from publishable prose
    and recorded in traceability-ledger.yml.
  - Research saturation is recorded after two consecutive no-change passes.
  - Detection tests pass, or a specific feasibility waiver is approved.
  - Rights and quality reviews pass with no unresolved blocking issue.
