  rationale: >-
    Explain what was searched, which source classes cover the publishable propositions,
    and why further searching is unlikely to change the technique.

breach_and_vulnerability_assessment:
  searched_on: null
  candidate_count: 0
  selected_examples: []
  no_qualifying_examples_rationale: >-
    Replace this when fewer than two examples qualify. Explain the searches,
    why candidates were not direct or material, and the remaining evidence gap.
  candidates:
    - source_id: SRC-example
      identifier: CVE, GHSA, incident name, or demonstration name
      relationship: rejected
      exploitation_status: unknown
      impact: State the observed or bounded potential consequence.
      remediation: State the patch, mitigation, or unresolved status.
      selected: false
      rationale: Explain the contract boundary and selection decision.

sources_consulted:
  - SRC-example
  - SRC-rejected-example
sources_cited:
  - SRC-example
sources_rejected:
  - source_id: SRC-rejected-example
    reason: State the authority, currency, independence, or directness problem.
sources_blocked: []

conflicts:
  - issue: Describe contrary evidence or an alternate explanation.
    resolution: Explain the resolution or why uncertainty remains in the draft.

evidence_assessment:
  overall_status: hypothesized
  core_claim_ids:
    - __TECHNIQUE_ID__-C001
  rationale: >-
    Explain why the evidence supports this status for the complete technique,
    not merely for an analogous behavior or one component.

source_archive:
  manifest: ../../source-manifest.yml
  validation_status: pending

rights_review:
  audit: publication-rights.yml
  status: pending
