# Append this record under `sources:` in research/source-manifest.yml.
- id: SRC-example
  title: Full source title
  publisher: Publisher or responsible project
  version_or_date: "Version, revision, release, commit, or publication date"
  source_class: protocol_or_standard
  official_url: https://example.com/canonical-source
  access_status: public
  accessed_on: "__DATE__"
  review_status: opened_reviewed
  reviewed_on: "__DATE__"
  review_method: browser
  locators:
    - Section, page, paragraph, commit, line range, or stable heading
  review_notes: >-
    State the facts, behavior, limitations, or definitions verified in the
    complete source.
  archive:
    status: remote_reviewed_not_archived
    reason: Explain why a complete lawful local snapshot was not retained.
    review_evidence:
      access_method: Official publisher page
      notes: State what portion of the complete source was directly reviewed.
