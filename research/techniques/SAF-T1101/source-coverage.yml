sources_rejected:
  - source_id: SRC-ox-mcp-2026
    reason: Heterogeneous research and disputed intended-behavior cases were useful for challenge but omitted from publishable factual claims without product-specific primary corroboration.
  - source_id: SRC-oligo-localhost-2025
    reason: Browser access to local services is adjacent transport context and does not establish the MCP command-generation mechanism.
sources_blocked: []
conflicts:
  - issue: Ecosystem research sometimes attributes command execution risk to stdio or MCP itself, while the protocol security guidance treats the unsafe shell, proxy, configuration, or launch implementation as the controllable boundary.
    resolution: The technique attributes the mechanism to an attacker-influenced implementation launch boundary and does not claim that stdio or MCP is inherently vulnerable.
  - issue: MCP Inspector's primary advisory classification is missing authorization rather than shell metacharacter injection.
    resolution: The example is retained only as CWE-78's full-command-selection variant and that limitation is explicit in both claim and candidate records.
evidence_assessment:
  overall_status: observed
  core_claim_ids: [SAF-T1101-C004]
  rationale: >-
    CISA's current KEV catalog establishes real-world exploitation of CVE-2026-42271, and the project advisory directly establishes an MCP stdio process-launch boundary controllable by a low-privilege authenticated user. The Observed label is deliberately narrower than a named breach: the reviewed public record supplies no victim, campaign, exploit telemetry, or timeline. Other examples are separately labeled disclosed or demonstrated.
