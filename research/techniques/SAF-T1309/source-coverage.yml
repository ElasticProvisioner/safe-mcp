breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 6
  selected_examples:
    - SRC-agentdojo-2406.13352v3
    - SRC-ghsa-cursor-4cxx-2025
    - SRC-cve-2025-53773
  no_qualifying_examples_rationale: >-
    Three high-impact non-production examples qualify and are selected. No
    direct production incident qualifies; the remaining candidates lack the
    prompt-manipulation-to-privileged-tool boundary or establish disclosure
    without the defining privileged invocation.
  candidates:
    - source_id: SRC-ghsa-cursor-4cxx-2025
      identifier: CVE-2025-54135 / GHSA-4cxx-hrm3-49rm
      relationship: direct_vulnerability
      exploitation_status: CISA ADP records exploitation as none; no production exploitation established.
      impact: Indirect prompt injection could create an MCP-sensitive settings file and trigger code execution without approval.
      remediation: Cursor 1.3.9 blocks unapproved writes to MCP-sensitive files.
      selected: true
      rationale: Directly crosses the defined prompt-to-privileged-action boundary and can affect confidentiality, integrity, and availability.
    - source_id: SRC-cve-2025-53773
      identifier: CVE-2025-53773
      relationship: direct_vulnerability
      exploitation_status: CISA ADP records exploitation as none; the public evidence is a controlled demonstration.
      impact: Prompt injection changed an auto-approval setting and led to local command execution.
      remediation: Visual Studio 2022 17.14.12 closes the CNA affected range; researcher reports the August 2025 fix.
      selected: true
      rationale: Direct prompt manipulation bypasses approval and reaches a command-capable tool with host impact.
    - source_id: SRC-agentdojo-2406.13352v3
      identifier: arXiv:2406.13352v3 AgentDojo
      relationship: direct_demonstration
      exploitation_status: Controlled evaluation only; not production exploitation.
      impact: Attacker instructions in untrusted tool data caused selected malicious actions in stateful agent environments.
      remediation: Benchmark evaluates several defenses; no product patch applies.
      selected: true
      rationale: Strongest directly reviewed end-to-end demonstration of prompt-driven attacker-goal tool actions.
    - source_id: SRC-cve-2025-54136
      identifier: CVE-2025-54136 / GHSA-24mc-g4xr-4395
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA ADP records exploitation as none.
      impact: A collaborator could replace a previously approved MCP definition and obtain persistent code execution.
      remediation: Cursor 1.3 requires approval whenever an MCP server entry changes.
      selected: false
      rationale: The initiating mechanism is direct configuration substitution, not model-mediated prompt manipulation.
    - source_id: SRC-jfsa-2025-6514
      identifier: CVE-2025-6514 / JFSA-2025-001290844
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA ADP records exploitation as none.
      impact: A crafted authorization endpoint from an untrusted MCP server could cause OS command injection in mcp-remote.
      remediation: A patch commit is linked by the CNA; JFrog lists affected versions 0.0.5 through 0.1.15.
      selected: false
      rationale: The mechanism is URL-to-shell command injection without natural-language prompt manipulation.
    - source_id: SRC-cve-2025-32711
      identifier: CVE-2025-32711 EchoLeak
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA ADP records exploitation as none; Microsoft describes an exclusively hosted service issue.
      impact: AI command injection in Microsoft 365 Copilot could disclose information over a network.
      remediation: The Microsoft CNA record links a vendor patch advisory.
      selected: false
      rationale: The reviewed CNA record establishes information disclosure but not the defining privileged tool invocation.

