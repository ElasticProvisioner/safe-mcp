conflicts:
  - issue: Cursor GHSA-4cxx-hrm3-49rm lists affected versions through 1.2.1 while the GitHub CNA record states versions before 1.3.9.
    resolution: Publish both statements, use 1.3.9 only as the agreed fixed version, and do not infer status for intermediate versions.
  - issue: Prompt-attack classifiers can flag benign inputs or miss attacks, so their alerts cannot establish causation.
    resolution: Correlate with tool risk and approval telemetry and label the analytic experimental.

