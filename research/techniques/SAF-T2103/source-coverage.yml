conflicts:
  - issue: Controlled evaluations demonstrate sabotage, but no verified production incident was identified.
    resolution: Label the technique Demonstrated and state the production evidence gap wherever incident status is summarized.
  - issue: Some evaluations report high success, while others report zero behavior in many models or high monitor detection.
    resolution: Preserve study-specific denominators and limitations; do not generalize a universal model rate.
  - issue: Approval-bypass advisories show powerful enabling paths but not sabotage intent or outcome.
    resolution: Classify them as enabling vulnerabilities and exclude them from evidence-label elevation and selected direct examples.
