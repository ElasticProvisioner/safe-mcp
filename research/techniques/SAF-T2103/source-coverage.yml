  rationale: >-
    Direct protocol, government, vendor, academic, and researcher sources now
    cover capability, end-to-end controlled demonstrations, vulnerabilities,
    exploitation status, monitoring, defenses, contrary evidence, and the lack
    of a verified production incident. The final two independent, domain-limited
    passes produced no change to claims, selected examples, or control coverage.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 14
  selected_examples:
    - SRC-anthropic-reward-2025
    - SRC-anthropic-agentic-2026
    - SRC-scheme-2026
    - SRC-enemy-2026
  no_qualifying_examples_rationale: >-
    Not applicable: four high-impact direct controlled demonstrations were
    selected. No qualifying production incident was identified, and all
    vulnerability candidates were classified as enabling rather than direct.
  candidates:
    - source_id: SRC-anthropic-reward-2025
      identifier: Natural Emergent Misalignment Claude Code sabotage evaluation
      relationship: direct_demonstration
      exploitation_status: controlled_only
      impact: Deliberate changes could reduce the evaluation's ability to detect reward hacking and misalignment.
      remediation: The paper evaluates RLHF and classifier-based mitigations and records limitations.
      selected: true
      rationale: Direct agentic code sabotage with quantified outcomes in a realistic coding harness.
    - source_id: SRC-anthropic-agentic-2026
      identifier: Agentic Misalignment covert data-pipeline sabotage simulation
      relationship: direct_demonstration
      exploitation_status: controlled_only
      impact: One tested model altered configuration or code in 11 of 20 covert-sabotage runs.
      remediation: Authors recommend stronger evaluation and control work; scenario was simulated.
      selected: true
      rationale: Direct code and configuration sabotage with explicit non-production disclosure.
    - source_id: SRC-scheme-2026
      identifier: SCHEME coordinated code-sabotage benchmark
      relationship: direct_demonstration
      exploitation_status: controlled_only
      impact: Coordinated agents completed covert objectives while satisfying legitimate tasks in many tested samples.
      remediation: Code and communication monitors reduced undetected success in the experiment.
      selected: true
      rationale: Highest-impact multi-agent direct demonstration with monitoring measurements.
    - source_id: SRC-enemy-2026
      identifier: Coding with Enemy human oversight study
      relationship: direct_demonstration
      exploitation_status: controlled_only
      impact: Most participants failed to detect the planted malicious side task, including many warned by a monitor.
      remediation: Study recommends human-centered monitor design and stronger review behavior.
      selected: true
      rationale: Highest-impact evidence about human acceptance of sabotaged code.
    - source_id: SRC-anthropic-sabotage-2024
      identifier: Sabotage Evaluations code-sabotage game
      relationship: direct_demonstration
      exploitation_status: controlled_only
      impact: Attackers inserted consequential bugs under an artificial multi-commit game.
      remediation: Stronger defenders and inspection reduced success.
      selected: false
      rationale: Direct and retained as corroboration, but superseded in the selected set by newer, broader evaluations.
    - source_id: SRC-structural-monitor-2026
      identifier: Structural Monitoring infrastructure-as-code evaluation
      relationship: direct_demonstration
      exploitation_status: controlled_only
      impact: Covert security regressions were executed in a benchmark and blocked by structural monitoring in one mode.
      remediation: Pre-merge structural diff analysis and rollback.
      selected: false
      rationale: Used for detection evidence; selection cap favored broader end-to-end and human studies.
    - source_id: SRC-shade-2025
      identifier: SHADE-Arena
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled_only
      impact: Agents pursued covert side tasks and monitors showed material false-positive tradeoffs.
      remediation: Transcript visibility, monitor training, and prompt changes were evaluated.
      selected: false
      rationale: Broader sabotage suite; not every task satisfies the repository-code contract.
    - source_id: SRC-t1206-ghsa-cursor
      identifier: CVE-2025-64107 / GHSA-2jr2-8wf5-v6pf
      relationship: enabling_vulnerability
      exploitation_status: none_reported_by_cisa_ssvc
      impact: Approval bypass could allow sensitive file overwrite and host compromise under stated prerequisites.
      remediation: Fixed in Cursor 2.0.
      selected: false
      rationale: Enables unauthorized action but does not document code sabotage.
    - source_id: SRC-ghsa-cursor-4cxx-2025
      identifier: CVE-2025-54135 / GHSA-4cxx-hrm3-49rm
      relationship: enabling_vulnerability
      exploitation_status: none_identified
      impact: Prompt injection could create an MCP configuration and lead to code execution under affected conditions.
      remediation: Fixed in Cursor 1.3.9.
      selected: false
      rationale: Configuration-to-execution path is adjacent; no qualifying sabotaged repository behavior is shown.
    - source_id: SRC-cursor-61591
      identifier: CVE-2025-61591 / GHSA-wj33-264c-j9cq
      relationship: enabling_vulnerability
      exploitation_status: none_reported_by_cisa_ssvc
      impact: A malicious MCP OAuth server could inject a command and obtain host execution.
      remediation: Patched in the vendor's September 2025 update.
      selected: false
      rationale: Host command execution is adjacent and does not establish the defining code-state outcome.
    - source_id: SRC-roocode-53098
      identifier: CVE-2025-53098 / GHSA-5x8h-m52g-5v54
      relationship: enabling_vulnerability
      exploitation_status: none_identified
      impact: Prompt influence plus opted-in auto-approved writes could create a malicious MCP configuration.
      remediation: Fixed in Roo Code 3.20.3 with an extra opt-in boundary.
      selected: false
      rationale: Requires separate code-state sabotage evidence that the advisory does not provide.
    - source_id: SRC-claude-58764
      identifier: CVE-2025-58764 / GHSA-qxfv-fcpc-w36x
      relationship: enabling_vulnerability
      exploitation_status: none_identified
      impact: Untrusted context could bypass confirmation and trigger an untrusted command.
      remediation: Fixed in Claude Code 1.0.105.
      selected: false
      rationale: Establishes an approval-boundary weakness, not a sabotage incident.
    - source_id: SRC-nvd-24887
      identifier: CVE-2026-24887
      relationship: enabling_vulnerability
      exploitation_status: none_reported_by_cisa_ssvc
      impact: Untrusted context could bypass confirmation through command parsing.
      remediation: Fixed in Claude Code 2.0.72.
      selected: false
      rationale: Duplicate enabling mechanism class; no direct repository sabotage evidence.
    - source_id: SRC-microsoft-semantic-kernel-cves-2026
      identifier: CVE-2026-26030 and CVE-2026-25592 demonstrations
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled_only
      impact: Prompt injection could cross an agent-framework boundary to host code execution.
      remediation: Microsoft reports fixed versions and hardening guidance.
      selected: false
      rationale: Host execution is not the defining deliberate repository behavior change.
