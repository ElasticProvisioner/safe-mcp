conflicts:
  - issue: MCP Filesystem advisory headings list npm 0.6.3 in places, while CVE records and advisory narrative recommend 0.6.4 or 2025.7.01.
    resolution: Publish the conservative higher floor and disclose the official-metadata conflict.
  - issue: Public advisories and demonstrations could be mistaken for production exploitation.
    resolution: Classify the overall technique as Demonstrated and explicitly retain the direct-production-incident gap.
  - issue: Roots could be misconstrued as protocol-enforced filesystem authorization.
    resolution: Follow the current specification's explicit statement that roots are informational and not access control.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1802-C001
    - SAF-T1802-C007
    - SAF-T1802-C009
    - SAF-T1802-C011
  rationale: >-
    Current public evidence demonstrates the complete MCP behavior in controlled
    conditions through a direct tool path, a network-exposed file tool, and a
    file-URI conversion case. No reviewed source establishes a qualifying
    file-specific production incident, so Observed would overstate the record.

