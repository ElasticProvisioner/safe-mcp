    reason: Enabling arbitrary-directory git initialization did not itself retrieve file content.
  - source_id: SRC-ghsa-5cgr-j3jf-jw3v
    reason: Project advisory corroborated an enabling operation rather than the defining collection outcome.
  - source_id: SRC-cve-2025-47274
    reason: Cleartext secret storage required pre-existing filesystem access and was not MCP-mediated collection.
  - source_id: SRC-ghsa-xj5p-w2v5-fjm6
    reason: Project advisory was adjacent secret exposure, not direct file retrieval.
  - source_id: SRC-cve-2025-6514
    reason: Command injection was adjacent execution capability.
  - source_id: SRC-cve-2025-49596
    reason: Unauthenticated command launch was adjacent access or execution capability.
