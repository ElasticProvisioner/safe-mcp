conflicts:
  - issue: A public MCP replay demonstration exists, but its Kubernetes bearer token is not established as OAuth.
    resolution: Cite it only as adjacent evidence and retain Research-Derived status for the OAuth-specific end-to-end behavior.
  - issue: Production incidents show OAuth token pivoting, but not an MCP authorization flow.
    resolution: Label them historical analogies and state the MCP evidence gap next to each use.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1706-C004
    - SAF-T1706-C006
  rationale: >-
    The complete technique is an explicit inference joining standardized bearer
    semantics, MCP resource-binding requirements, and a direct MCP
    audience-confusion vulnerability. The controlled replay demonstration used
    a non-OAuth bearer token and the observed OAuth incidents were not MCP, so
    neither raises the end-to-end label.

