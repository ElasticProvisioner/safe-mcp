    status: passed
    notes: Eight deterministic fixtures cover positives, boundary values, ordinary activity, just-below values, approved bulk, missing discovery, time window, and malformed input.
  mitigation_quality:
    status: passed
    notes: Controls address scope, audience, token passthrough, downstream policy, query construction, volume, rate, exposure, logging, and containment.
  framework_alignment:
    status: passed
    notes: Tactic, ATT&CK mapping, framework record, detection artifacts, and synthetic-neighbor reconciliation are consistent.
  publication_rights:
    status: passed
    notes: All cited sources have paraphrase or factual-reference reviews and named author or team credits; no protected artifacts or quotations are reproduced.
  safe_publication:
    status: passed
