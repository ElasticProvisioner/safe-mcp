conflicts:
  - issue: NVD metadata and the GitHub ADX advisory differ on affected-version notation and whether a patched release exists.
    resolution: Publish the GitHub maintainer advisory's through-0.1.0 and no-patched-release statements, disclose the conflict, and avoid inferring a fixed release.
  - issue: Direct public demonstrations exist, but reviewed catalogs and first-party reporting did not establish a production MCP incident.
    resolution: Use Demonstrated, not Observed, and label production API cases as adjacent or historical analogies.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids: [SAF-T1804-C004, SAF-T1804-C005, SAF-T1804-C011]
  rationale: >-
    Two independent MCP data-server advisories demonstrate end-to-end read paths
    across the contracted boundary, and controlled MCP-SQL research provides
    supporting direct evidence. No direct production MCP incident was found, so
    observed API incidents remain contextual and the status cannot be Observed.

