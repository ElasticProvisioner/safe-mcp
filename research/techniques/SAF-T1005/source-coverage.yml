breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 8
  selected_examples:
    - SRC-ghsa-mcp-pinot-73cv
    - SRC-oligo-inspector-cve-2025-49596
    - SRC-ghsa-go-sdk-xw59
    - SRC-horizon3-litellm-chain
  no_qualifying_examples_rationale: Not applicable; four highest-impact direct or enabling examples were selected.
  candidates:
    - source_id: SRC-ghsa-mcp-pinot-73cv
      identifier: CVE-2026-49257 / GHSA-73cv-556c-w3g6
      relationship: direct_vulnerability
      exploitation_status: Public proof of concept; no production exploitation documented by the reviewed advisory.
      impact: Unauthenticated use of all exposed tools with server-side Pinot credentials, including data reads and configuration changes.
      remediation: Upgrade to 3.1.0 or later; bind locally by default and refuse unauthenticated non-loopback exposure.
      selected: true
      rationale: Most direct and highest-impact default-exposure realization of the contract.
    - source_id: SRC-oligo-inspector-cve-2025-49596
      identifier: CVE-2025-49596 controlled demonstration
      relationship: direct_demonstration
      exploitation_status: Controlled public demonstration; production exploitation not established.
      impact: Browser-to-local proxy access leading to command execution in the Inspector's environment.
      remediation: Upgrade Inspector to 0.14.1 or later and retain session-token and Origin protections.
      selected: true
      rationale: Directly demonstrates the local-listener/browser-origin variant.
    - source_id: SRC-ghsa-go-sdk-xw59
      identifier: CVE-2026-34742 / GHSA-xw59-hvm2-8pj6
      relationship: enabling_vulnerability
      exploitation_status: Publicly disclosed vulnerability; no production exploitation documented by the reviewed advisory.
      impact: A malicious website can access tools and resources on an unauthenticated localhost HTTP handler.
      remediation: Upgrade MCP Go SDK to 1.4.0 or later, where protection is enabled by default.
      selected: true
      rationale: High-impact SDK-wide realization of the DNS-rebinding prerequisite.
    - source_id: SRC-horizon3-litellm-chain
      identifier: CVE-2026-42271 chained with CVE-2026-48710
      relationship: direct_demonstration
      exploitation_status: Controlled public validation; no production exploitation established by the reviewed report.
      impact: Unauthenticated remote code execution through a path-authorization bypass and exposed MCP test endpoint.
      remediation: Upgrade LiteLLM to 1.83.7+ and Starlette to 1.0.1+.
      selected: true
      rationale: Demonstrates a companion-route authorization bypass reaching privileged endpoint behavior.
    - source_id: SRC-ghsa-inspector-7f8r
      identifier: CVE-2025-49596 / GHSA-7f8r-222p-6f5g
      relationship: direct_vulnerability
      exploitation_status: Publicly disclosed; no production exploitation documented by the reviewed advisory.
      impact: Unauthenticated requests could launch MCP commands over stdio.
      remediation: Upgrade to Inspector 0.14.1 or later.
      selected: false
      rationale: Underlying advisory duplicates the selected Oligo demonstration for the same vulnerability.
    - source_id: SRC-ghsa-litellm-v4p8
      identifier: CVE-2026-42271 / GHSA-v4p8-mg3p-g94g
      relationship: direct_vulnerability
      exploitation_status: Publicly disclosed; direct issue requires a low-privilege API key.
      impact: MCP test endpoints could start a supplied local process.
      remediation: Upgrade to LiteLLM 1.83.7+ or block the test endpoints.
      selected: false
      rationale: Component vulnerability is represented by the higher-impact selected unauthenticated chain.
    - source_id: SRC-ghsa-inspector-g9hg
      identifier: CVE-2025-58444 / GHSA-g9hg-qhmf-q45m
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Publicly disclosed; no production exploitation documented by the reviewed advisory.
      impact: A malicious remote server redirect URI could execute script and interact with the Inspector proxy.
      remediation: Upgrade Inspector to 0.16.6 or later.
      selected: false
      rationale: The defining entry is malicious redirect handling and XSS, not endpoint exposure.
    - source_id: SRC-ibm-langflow-7282147
      identifier: CVE-2026-8446
      relationship: direct_vulnerability
      exploitation_status: Publicly disclosed; no production exploitation stated by IBM.
      impact: Authentication bypass on the MCP composer endpoint can disclose project or file data.
      remediation: Upgrade Langflow OSS to 1.11.0 or later.
      selected: false
      rationale: Direct but lower-impact duplicate pattern than the four selected examples.

