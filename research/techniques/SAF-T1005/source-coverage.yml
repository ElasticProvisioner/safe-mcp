conflicts:
  - issue: MCP authorization is optional overall, while Streamable HTTP recommends authentication for all connections.
    resolution: The technique does not treat every unauthenticated endpoint as vulnerable; materiality requires unintended exposure of a sensitive operation.
  - issue: Vulnerable internet-facing instances were identified, but reviewed reports did not document a production compromise.
    resolution: Evidence status is Demonstrated, and the absence statement is explicitly bounded to the reviewed corpus.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1005-C004
    - SAF-T1005-C009
  rationale: >-
    Two independent public controlled evaluations reproduce the complete path
    from untrusted endpoint reach through a failed access boundary to command or
    process execution. Direct vulnerabilities corroborate other deployment
    variants, but no qualifying production compromise was identified.

