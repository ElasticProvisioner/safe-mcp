breach_and_vulnerability_assessment:
  searched_on: '2026-09-02'
  candidate_count: 8
  selected_examples:
    - SRC-invariant-github-mcp-2025
    - SRC-invariant-whatsapp-mcp-2025-04-07
    - SRC-invisible-prompts-2025
    - SRC-vulncheck-cve-2026-58168
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-invariant-github-mcp-2025
      identifier: GitHub MCP controlled private-to-public repository demonstration
      relationship: direct_demonstration
      exploitation_status: Controlled proof of concept; no production exploitation asserted.
      impact: Private repository data was transferred into a public pull request through a cross-tool flow.
      remediation: Restrict repository scope, isolate public writes, and enforce tool-flow approval policy; no server patch was identified as the root fix.
      selected: true
      rationale: High-impact direct demonstration with a clear source-result-to-distinct-capability sequence.
    - source_id: SRC-invariant-whatsapp-mcp-2025-04-07
      identifier: WhatsApp MCP Experiment 2 contact-exposure demonstration
      relationship: direct_demonstration
      exploitation_status: Controlled proof of concept in a tested client; no production exploitation asserted.
      impact: An attacker-controlled message returned by one operation redirected subsequent capability use and exposed contacts.
      remediation: Treat message results as untrusted, require approval for outward calls, and isolate sensitive capabilities.
      selected: true
      rationale: Direct same-session cross-tool demonstration; Experiment 1 is separately excluded as metadata poisoning.
    - source_id: SRC-invisible-prompts-2025
      identifier: Hidden external-content to MCP email controlled demonstration
      relationship: direct_demonstration
      exploitation_status: Peer-reviewed controlled experiment; no production exploitation asserted.
      impact: External content redirected an agent into transmitting protected data through an email tool.
      remediation: Sanitize and label untrusted content, gate sensitive calls, and enforce source-to-sink flow policy.
      selected: true
      rationale: Peer-reviewed direct demonstration spanning an untrusted source and distinct target tool.
    - source_id: SRC-vulncheck-cve-2026-58168
      identifier: CVE-2026-58168
      relationship: enabling_vulnerability
      exploitation_status: Public proof-of-concept indication in NVD enrichment; production exploitation not established.
      impact: Low-privilege users or prompt-injected content could enumerate and invoke filesystem, shell, browser, and other configured MCP tools.
      remediation: Upgrade DeepTutor to 1.4.10 or later and verify deny-by-default MCP-tool grants.
      selected: true
      rationale: Highest-impact disclosed enabling flaw found, with explicit prompt-injected-content relevance and a fixed version.
    - source_id: SRC-invariant-tpa-2025-04-01
      identifier: MCP Tool Poisoning and cross-origin shadowing demonstration
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Controlled proof of concept; no production exploitation asserted.
      impact: Malicious tool descriptions can shadow or redirect use of trusted tools.
      remediation: Pin tool definitions, scrutinize cross-server references, and require user-visible tool review.
      selected: false
      rationale: The causal content is pre-invocation tool metadata, outside the result-borne contract.
    - source_id: SRC-invariant-whatsapp-mcp-2025-04-07
      identifier: WhatsApp MCP Experiment 1 tool-description poisoning
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Controlled proof of concept; no production exploitation asserted.
      impact: A malicious server description shadowed trusted WhatsApp capabilities and redirected data.
      remediation: Pin and review tool definitions and isolate servers.
      selected: false
      rationale: Uses tool metadata rather than adversary-controlled returned content.
    - source_id: SRC-nvd-cve-2025-5276
      identifier: CVE-2025-5276
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Public proof of concept indicated by CISA SSVC enrichment; production exploitation not established.
      impact: A crafted prompt could trigger server-side request forgery through mcp-markdownify-server.
      remediation: Upgrade to a fixed release and restrict outbound network destinations.
      selected: false
      rationale: The disclosed root cause is SSRF within one server rather than a result-to-distinct-tool pivot.
    - source_id: SRC-arxiv-cross-tool-2026
      identifier: Cross-tool poisoning preprint across AI development clients
      relationship: rejected
      exploitation_status: Preprint experiment; production exploitation not established.
      impact: The abstract asserts cross-tool effects in multiple clients.
      remediation: Not used as a remediation authority.
      selected: false
      rationale: First-version preprint with inconsistent placeholder venue metadata; stronger peer-reviewed and direct sources control.
