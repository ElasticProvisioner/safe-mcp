conflicts:
  - issue: Content classifiers can reduce some injection attempts, but adaptive studies and formal-flow work show that content-only filtering is not a complete boundary.
    resolution: The detector uses text only as a volume-reduction heuristic and requires a behavioral cross-tool sequence.
