conflicts:
  - issue: The two July 2025 filesystem GitHub advisories list inconsistent affected-version headings and prose remediation boundaries.
    resolution: The technique records the conservative upgrade target of 0.6.4 or 2025.7.01 and discloses the inconsistency rather than asserting a narrower safe range.
  - issue: Anthropic's report documents real campaign behavior but has visibility only into Claude usage and does not publish every MCP protocol event.
    resolution: The evidence label remains Observed because the end-to-end agentic and MCP-enabled collection is directly documented; protocol-event granularity remains a stated limitation.

evidence_assessment:
  overall_status: observed
  core_claim_ids:
    - SAF-T1801-C001
    - SAF-T1801-C005
  rationale: >-
    Anthropic directly documents a real espionage campaign in which Claude Code
    and MCP tools autonomously queried systems, extracted and processed large
    data volumes, and categorized intelligence after successful intrusions.
    Controlled WhatsApp, GitHub, tool-poisoning, and Slack demonstrations support
    mechanisms and consequences but do not raise the label.

