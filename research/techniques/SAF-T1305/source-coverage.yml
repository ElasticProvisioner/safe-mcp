conflicts:
  - issue: ZDI records that the aws-mcp-server vendor rejected CVE-2026-5059 before coordinated disclosure.
    resolution: The technique labels this as a disclosed vulnerability, preserves the rejection, and does not claim production exploitation or a vendor patch.
  - issue: RCE does not necessarily imply root or SYSTEM privilege.
    resolution: The scope defines privilege gain relative to the attacker's MCP or low-privileged starting context and bounds outcome to the vulnerable process account.
