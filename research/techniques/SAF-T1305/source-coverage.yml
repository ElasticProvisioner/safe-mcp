    Directly reviewed official MCP specifications, two original controlled
    demonstrations, two current coordinated vulnerability advisories, an exact
    maintainer advisory opened only after NVD supplied its URL, MITRE ATT&CK,
    and Microsoft telemetry documentation. Separate incident, vulnerability,
    exploitation-status, fix, detection, defense, and contrary-evidence passes
    were followed by two narrower authoritative-domain passes with no material
    change. No blocked source is needed to support a publishable claim.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 5
  selected_examples:
    - SRC-zdi-aws-26-245
    - SRC-jfrog-cve-2025-6514
    - SRC-oligo-inspector-cve-2025-49596
    - SRC-zdi-cve-2026-0758
  no_qualifying_examples_rationale: not_applicable_four_examples_selected
  candidates:
    - source_id: SRC-zdi-aws-26-245
      identifier: CVE-2026-5059 / ZDI-26-245
      relationship: direct_vulnerability
      exploitation_status: Public coordinated disclosure; no production exploitation documented.
      impact: Unauthenticated arbitrary code execution in the aws-mcp-server process context; CVSS 9.8.
      remediation: No patch documented; ZDI advises restricting interaction with the product.
      selected: true
      rationale: Highest severity and no-authentication precondition, with current zero-day status and explicit server-context execution.
    - source_id: SRC-jfrog-cve-2025-6514
      identifier: CVE-2025-6514 / JFSA-2025-001290844
      relationship: direct_demonstration
      exploitation_status: Controlled public proof; no production exploitation documented.
      impact: Arbitrary Windows OS command execution from a malicious remote MCP server; CVSS 9.6.
      remediation: Fixed in mcp-remote 0.1.16; use trusted servers and HTTPS.
      selected: true
      rationale: Complete client-side MCP-to-host execution proof with affected and fixed versions and platform-specific limits.
    - source_id: SRC-oligo-inspector-cve-2025-49596
      identifier: CVE-2025-49596
      relationship: direct_demonstration
      exploitation_status: Controlled public proof and exposed-instance observation; no victim exploitation documented.
      impact: Browser-originated arbitrary commands through an unauthenticated MCP Inspector proxy; CVSS 9.4.
      remediation: Version 0.14.1 added session-token and origin protections.
      selected: true
      rationale: Complete browser-to-local-MCP-proxy execution chain with a documented fix and distinct boundary.
    - source_id: SRC-zdi-cve-2026-0758
      identifier: CVE-2026-0758 / ZDI-26-024
      relationship: direct_vulnerability
      exploitation_status: Public coordinated disclosure; no production exploitation documented.
      impact: Low-privileged local actor can execute arbitrary code as the MCP server service account; CVSS 7.8.
      remediation: No fixed version documented; ZDI advises restricting interaction.
      selected: true
      rationale: Most direct evidence for the tactic's relative privilege-escalation boundary and service-account outcome.
    - source_id: SRC-ghsa-cve-2025-53107
      identifier: CVE-2025-53107 / GHSA-3q26-f695-pp76
      relationship: direct_demonstration
      exploitation_status: Controlled public proof; no production exploitation documented.
      impact: Command injection under the git-mcp-server process privileges; CVSS 7.5.
      remediation: Fixed in 2.1.5 according to the advisory.
      selected: false
      rationale: Qualifying but lower impact than the four selected records; retained to bound prompt-induced invocation from the subsequent command-injection flaw.
