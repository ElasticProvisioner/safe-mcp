  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1305-C003
    - SAF-T1305-C004
    - SAF-T1305-C005
  rationale: >-
    JFrog Security Research and Oligo Security Research each published a
    controlled, complete MCP-connected path to host OS execution. These
    demonstrations establish the defining boundary crossing, while the absence
    of a reviewed production victim incident prevents an Observed label.
