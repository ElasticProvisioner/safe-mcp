conflicts:
  - issue: CVE-2026-33980 affected versions differ among the GHSA, CNA narrative, CNA affected array, and current PyPI release history.
    resolution: Disclose the conflict, identify the patch commit, and state that no patched package release was found instead of asserting a fixed version.
  - issue: GHSA-687q-32c6-8x68 calls all AVideo password hashes simple MD5, while maintainer patch commentary says current accounts use a layered scheme and only legacy accounts may retain plain MD5.
    resolution: Exclude the simple-MD5 cracking claim and do not select the advisory as a top publishable example.

evidence_assessment:
  overall_status: observed
  core_claim_ids:
    - SAF-T1803-C003
  rationale: >-
    Anthropic's directly reviewed primary incident report documents an MCP-based
    agentic attack framework performing a live database extraction operation and
    downloading complete results in a successful intrusion. The report omits the
    exact database tool and byte count, so those specifics are not claimed, but the
    defining agentic database-collection behavior is observed rather than inferred.

