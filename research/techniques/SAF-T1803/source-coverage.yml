breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 8
  selected_examples:
    - SRC-anthropic-espionage-2025-11
    - SRC-cve-2026-33980
    - SRC-mandiant-unc5537-2024
    - SRC-cve-2026-75133
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-anthropic-espionage-2025-11
      identifier: GTG-1002 AI-orchestrated cyber espionage campaign
      relationship: direct_production_incident
      exploitation_status: Observed in live operations; Anthropic reports a handful of validated successful intrusions.
      impact: Database account details, hashes, configurations, proprietary information, and complete local results were collected and analyzed.
      remediation: Anthropic banned accounts, notified affected entities and authorities, and expanded detection and safeguards.
      selected: true
      rationale: Highest relevance because it directly documents agentic database extraction in an MCP-based attack framework.
    - source_id: SRC-cve-2026-33980
      identifier: CVE-2026-33980 / GHSA-vphc-468g-8rfp
      relationship: direct_vulnerability
      exploitation_status: Controlled PoC according to the advisory and CISA enrichment; no production exploitation identified.
      impact: Arbitrary KQL queries through three apparently narrow MCP metadata tools can expose database contents and alter data within the configured identity's rights.
      remediation: Patch commit 0abe0ee adds identifier validation and tests; no fixed package release was identified and version records conflict.
      selected: true
      rationale: Highest direct vulnerability relevance because the affected component is an MCP database server and the trust boundary bypass permits unauthorized reads.
    - source_id: SRC-mandiant-unc5537-2024
      identifier: UNC5537 Snowflake customer-instance data theft campaign
      relationship: historical_analogy
      exploitation_status: Observed production campaign attributed by Mandiant to stolen customer credentials.
      impact: Significant-volume customer data export, victim extortion, and about 165 potentially exposed organizations notified.
      remediation: Snowflake and Mandiant issued detection and hardening guidance; customer credential, MFA, and network-control remediation was required.
      selected: true
      rationale: High-impact production analogy with unusually strong incident-response and detection evidence, clearly labeled non-agentic.
    - source_id: SRC-cve-2026-75133
      identifier: CVE-2026-75133
      relationship: historical_analogy
      exploitation_status: CISA ADP marked exploitation none; not listed in CISA KEV 2026.09.01; these facts do not prove no exploitation.
      impact: An unauthenticated request could trigger a full MySQL dump and enable retrieval of the generated backup.
      remediation: Fixed before Keep Backup Daily 2.1.4; the changelog records hardened file handling and unpredictable names.
      selected: true
      rationale: Recent, mechanism-specific analogy showing why dump authorization and output handling both matter.
    - source_id: SRC-cve-2026-33478
      identifier: CVE-2026-33478 / GHSA-687q-32c6-8x68
      relationship: historical_analogy
      exploitation_status: Public PoC according to CISA enrichment; no KEV entry or production exploitation identified.
      impact: A disclosed clone-key chain could trigger a full database dump and expose application data before follow-on compromise.
      remediation: Commit c85d076 adds clone-key access control and input sanitization, but the advisory lists no patched version.
      selected: false
      rationale: Lower selection priority because the advisory's credential-cracking claim is contradicted by maintainer code commentary and release remediation is unclear.
    - source_id: SRC-nvd-mcp-database-search
      identifier: CVE-2026-32625
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Vulnerability record reviewed; production exploitation not established by the reviewed NVD summary.
      impact: MCP URL placeholder resolution could expose process secrets and database connection credentials.
      remediation: NVD summary identifies 0.8.4-rc1 as patched.
      selected: false
      rationale: It exposes database credentials rather than causing a database dump and belongs to a credential-exposure neighbor.
    - source_id: SRC-nvd-mcp-database-search
      identifier: CVE-2026-67531
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Vulnerability record reviewed; production exploitation not established by the reviewed NVD summary.
      impact: An MCP code-execution sandbox escape could expose server secrets and database credentials.
      remediation: NVD summary identifies version 1.5.7 as fixed.
      selected: false
      rationale: It provides server code execution and credential access, not the defining logical database-collection behavior.
    - source_id: SRC-nvd-db-dump-search
      identifier: NVD database dump keyword corpus - 89 records
      relationship: rejected
      exploitation_status: Mixed; individual exploitation was not inferred from descriptions or scores.
      impact: Results ranged from keyword collisions and memory dumps to SQL injection, backup exposure, and dump-trigger vulnerabilities.
      remediation: Varied by record; current high-relevance records were promoted to individual candidates for direct review.
      selected: false
      rationale: The grouped discovery corpus is not a publishable example and cannot substitute for direct record review.

