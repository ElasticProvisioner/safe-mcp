conflicts:
  - issue: The PraisonAI advisory lists affected versions through 4.5.117 while NVD says versions before 4.5.128.
    resolution: Publish both statements, identify 4.5.128 as patched, and mark 4.5.118 through 4.5.127 uncertain.
  - issue: CISA KEV absence could be mistaken for proof that exploitation never occurred.
    resolution: Limit the conclusion to no KEV listing and no qualifying incident in the reviewed corpus.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1505-C001
  rationale: >-
    The controlled Radosevich-Halloran evaluation completes the defining path
    from MCP-enabled access to live environment secrets through unauthorized
    acquisition. Vulnerabilities corroborate mechanisms but do not establish a
    production incident, so the status cannot be Observed.

