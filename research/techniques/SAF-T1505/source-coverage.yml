    conflict, detector constraint, or source for an unsupported proposition.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 7
  selected_examples:
    - SRC-arxiv-2504.03767v2
    - SRC-ghsa-4pcc-j6m6-wcwx
    - SRC-pham-minh-cve-2026-29872
    - SRC-ghsa-pj2r-f9mw-vrcq
  no_qualifying_examples_rationale: >-
    Four examples qualify, but none is a direct production incident. Separate
    breach and incident queries returned no record, NVD marked the selected CVEs
    as PoC where SSVC data was present, and none of the selected CVEs appeared in
    CISA KEV. This is a bounded corpus finding, not proof of non-exploitation.
  candidates:
    - source_id: SRC-arxiv-2504.03767v2
      identifier: Radosevich-Halloran MCP credential-theft evaluation
      relationship: direct_demonstration
      exploitation_status: controlled_evaluation
      impact: Placeholder OpenAI and Hugging Face API keys were found in environment variables and disclosed through Slack.
      remediation: The authors recommend least privilege and avoiding storage of sensitive values in environment variables.
      selected: true
      rationale: Complete MCP-enabled environment-secret acquisition was reproduced and is the strongest end-to-end evidence.
    - source_id: SRC-ghsa-4pcc-j6m6-wcwx
      identifier: CVE-2026-32625 / GHSA-4pcc-j6m6-wcwx
      relationship: direct_vulnerability
      exploitation_status: proof_of_concept_no_production_evidence
      impact: Low-privilege user input could expose LibreChat signing, encryption, and database secrets from process.env.
      remediation: Patched in 0.8.4-rc1 by separating untrusted schema paths from environment substitution.
      selected: true
      rationale: Direct, high-impact MCP configuration-to-live-state boundary crossing with affected and fixed versions.
    - source_id: SRC-pham-minh-cve-2026-29872
      identifier: CVE-2026-29872
      relationship: direct_vulnerability
      exploitation_status: proof_of_concept_no_production_evidence
      impact: An unauthenticated session could retrieve another user's GitHub token or LLM API key from process-global state.
      remediation: Use session-scoped storage, strict ownership binding, and clearing; no fixed release was identified.
      selected: true
      rationale: Direct cross-session acquisition of environment-held credentials with a controlled reproduction.
    - source_id: SRC-ghsa-pj2r-f9mw-vrcq
      identifier: CVE-2026-40159 / GHSA-pj2r-f9mw-vrcq
      relationship: direct_vulnerability
      exploitation_status: proof_of_concept_no_production_evidence
      impact: An untrusted MCP child could read the parent environment, including API keys, tokens, and database credentials.
      remediation: Version 4.5.128 is patched; sanitize and explicitly allowlist child variables.
      selected: true
      rationale: Direct live environment transfer into an unauthorized MCP execution boundary; affected-range conflict is disclosed.
    - source_id: SRC-ghsa-mp29-fxh8-92px
      identifier: CVE-2026-67531 / GHSA-mp29-fxh8-92px
      relationship: enabling_vulnerability
      exploitation_status: proof_of_concept_no_secret_acquisition_shown
      impact: Sandbox escape enabled server-process code execution and potential access to process-held secrets.
      remediation: Patched in FrontMCP 1.5.7 by preventing live host schema objects from crossing the sandbox membrane.
      selected: false
      rationale: High-impact but the defining secret-acquisition step was not demonstrated.
    - source_id: SRC-nvd-mcp-token-env-query
      identifier: CVE-2026-47250
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: vulnerability_record_no_production_evidence
      impact: Prompt-influenced kubectl flags could send a kubeconfig bearer token to an attacker endpoint.
      remediation: Patched in mcp-server-kubernetes 3.7.0.
      selected: false
      rationale: The token source is persistent kubeconfig state and the defining behavior is tool-argument abuse and exfiltration.
    - source_id: SRC-nvd-mcp-token-env-query
      identifier: CVE-2026-46555
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: vulnerability_record_no_production_evidence
      impact: A local or DNS-rebinding caller could read files and send them through WhatsApp.
      remediation: Patched in WhatsApp MCP Server 0.2.1 with authentication, Host validation, and path confinement.
      selected: false
      rationale: The source is a persistent file, not process memory or live runtime state.

