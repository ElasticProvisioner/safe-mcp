    reason: Establishes tool invocation but not live-secret extraction.
  - source_id: SRC-nvd-mcp-token-env-query
    reason: Returned persistent-token and arbitrary-file weaknesses outside the live-state contract.
  - source_id: SRC-mitre-t1555
    reason: Password stores are persistent credential stores, not the defining live application state.
  - source_id: SRC-attack-t1055
    reason: Process injection is code-execution behavior and does not require secret acquisition.
  - source_id: SRC-mitre-attack-t1552.001-v1.3
    reason: Credentials in files are expressly outside the live-state boundary.
  - source_id: SRC-otel-logs-data-model
    reason: Generic log structure does not establish that MCP products emit the synthetic detection fields.
