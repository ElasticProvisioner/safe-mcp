breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 9
  selected_examples:
    - SRC-chainalysis-bybit-2025
    - SRC-chainalysis-ronin-2022
    - SRC-chainalysis-atomic-2024
  no_qualifying_examples_rationale: >-
    Three examples qualify. No selected example establishes agent-mediated
    execution; that unresolved end-to-end gap controls the Research-Derived label.
  candidates:
    - source_id: SRC-chainalysis-bybit-2025
      identifier: Bybit theft and laundering, February 2025
      relationship: direct_production_incident
      exploitation_status: observed_in_production
      impact: Nearly USD 1.5 billion was stolen; significant portions were converted and moved through DEXs, bridges, and a no-KYC swap service.
      remediation: Bybit and industry partners traced funds; Chainalysis reported more than USD 40 million frozen by the update date.
      selected: true
      rationale: Highest-impact directly described bridge-and-DEX laundering sequence, corroborated by the FBI; not agent-mediated.
    - source_id: SRC-chainalysis-ronin-2022
      identifier: Ronin/Axie Infinity laundering, March-September 2022
      relationship: direct_production_incident
      exploitation_status: observed_in_production
      impact: More than USD 600 million was stolen; the documented laundering used hundreds of cross-chain transactions.
      remediation: More than USD 30 million had been seized by publication; much remained under attacker control.
      selected: true
      rationale: Directly documents bridge-to-swap-to-bridge layering with named chains and assets.
    - source_id: SRC-chainalysis-atomic-2024
      identifier: Atomic Wallet laundering, June 2023
      relationship: direct_production_incident
      exploitation_status: observed_in_production
      impact: Estimated losses of USD 129 million followed by multi-phase bridge, mixer, and cross-chain movements.
      remediation: Tracing and service coordination were recommended; the public source did not report full recovery.
      selected: true
      rationale: High-impact multi-phase production chain-hopping case with explicit bridge routes.
    - source_id: SRC-fatf-stablecoins-2026
      identifier: Canadian drug-trafficking proceeds case study
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed_suspected_laundering
      impact: Suspected proceeds were swapped at DEXs, layered through wallets, and off-ramped through OTC brokers and VASPs.
      remediation: Financial-intelligence disclosures enabled investigators to identify the network and tradecraft.
      selected: false
      rationale: Strong DEX-laundering case, but the case narrative does not establish a cross-chain leg.
    - source_id: SRC-fbi-defi-2022
      identifier: FBI alert I-082922-PSA
      relationship: enabling_vulnerability
      exploitation_status: exploited_in_production
      impact: The advisory reports thefts through flash-loan, token-bridge signature, and oracle weaknesses.
      remediation: FBI recommends audits, real-time analytics, monitoring, testing, and incident response.
      selected: false
      rationale: The weaknesses create proceeds but do not implement post-theft laundering.
    - source_id: SRC-cisa-tradertraitor-2022
      identifier: Joint CSA A22-108A TraderTraitor
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed_campaign
      impact: DPRK operators compromised cryptocurrency organizations and stole assets.
      remediation: Defense-in-depth, patching, MFA, segmentation, and user training are recommended.
      selected: false
      rationale: Establishes initial compromise and theft but not a bridge/DEX laundering sequence.
    - source_id: SRC-pace-defi-agents-2026
      identifier: PACE controlled benchmark
      relationship: rejected
      exploitation_status: controlled_demonstration_only
      impact: Demonstrates agent-generated DeFi transactions and policy enforcement in a simulator.
      remediation: Typed intents, deterministic verification, simulation, and signed decision records are evaluated.
      selected: false
      rationale: Component demonstration only; no cross-chain laundering path is executed.
    - source_id: SRC-cisa-kev-catalog-page-2026-09-01
      identifier: CISA Known Exploited Vulnerabilities Catalog, reviewed 2026-09-02
      relationship: rejected
      exploitation_status: no_direct_record_identified
      impact: No catalog entry was identified whose vulnerable behavior is cross-chain laundering.
      remediation: Not applicable to the behavior contract.
      selected: false
      rationale: KEV is a product-vulnerability catalog; the defining behavior is an abuse sequence, not a CVE.
    - source_id: SRC-elliptic-cross-chain-2025
      identifier: State of Cross-Chain Crime 2025 public summary
      relationship: historical_analogy
      exploitation_status: aggregate_research
      impact: Reports large aggregate illicit and high-risk flows through cross-chain services.
      remediation: Recommends holistic screening and automated cross-chain tracing.
      selected: false
      rationale: Useful context but proprietary aggregate methodology and combined high-risk category do not improve the three selected incident examples.

