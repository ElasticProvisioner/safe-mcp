conflicts:
  - issue: Bridge and DEX events are common in legitimate treasury, arbitrage, and user activity.
    resolution: Require known-risk provenance plus a cross-chain-and-swap sequence; document expected false positives and avoid treating the rule as a verdict.
  - issue: Missing cross-chain counterparts may mean either attack behavior or incomplete data.
    resolution: Rank deterministic identifiers above heuristics, require complete field checks, and report unmatched activity as ambiguous.
  - issue: Production laundering is observed, but no production source attributes the complete sequence to an AI agent.
    resolution: Use Research-Derived status and keep the agentic composition claim explicitly inferential.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1915-C002
  rationale: >-
    Direct sources establish real bridge/DEX laundering, and controlled research
    establishes agent-generated DeFi transaction execution. Their composition into
    agent-mediated cross-chain laundering is technically supported but not directly
    observed or reproduced end to end, so the complete technique remains Research-Derived.

