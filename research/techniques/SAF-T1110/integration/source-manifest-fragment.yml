version: 1
source_defaults: &reviewed_remote
  accessed_on: "2026-09-01"
  reviewed_on: "2026-09-01"
  review_method: Direct full-text browser review of the authoritative page or paper.
  review_status: opened_reviewed
  archive: &remote_archive
    status: remote_reviewed_not_archived
    reason: Clean-room source caches are intentionally excluded from the frozen bundle.
    review_evidence:
      method: Browser full-text extraction with exact section or line locators recorded.
      retained_in_bundle: false
