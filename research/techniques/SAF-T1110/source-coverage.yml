sources_rejected:
  - source_id: SRC-microsoft-prompt-shields
    reason: Useful corroborating product guidance but unnecessary after stronger protocol and research support.
  - source_id: SRC-openai-prompt-injections-2025
    reason: General practitioner guidance was superseded for cited claims by the more specific 2026 source-sink article.
  - source_id: SRC-nagaraja-image-pi-2026
    reason: Valid direct study but lower-impact for agent execution than VPI-Bench.
  - source_id: SRC-chameleon-2025
    reason: Narrow one-model simulated pipeline did not improve the selected example set.
  - source_id: SRC-yeo-multimodal-pi-2025
    reason: Partial logging and limited multimodal coverage made it weaker than selected empirical studies.
sources_blocked: []
conflicts:
  - issue: Some papers describe real-world or commercial-system experiments in language that could be mistaken for production incidents.
    resolution: Classified all researcher-run evaluations as demonstrations and explicitly denied breach status.
  - issue: Reported attack and defense rates vary sharply across models, environments, and adaptive settings.
    resolution: Omitted universal rates from normative prose and preserved study-specific limitations.
evidence_assessment:
  overall_status: demonstrated
  core_claim_ids: [SAF-T1110-C002, SAF-T1110-C003, SAF-T1110-C004, SAF-T1110-C005]
  rationale: >-
    Multiple independent controlled evaluations reproduce the full carrier-to-model
    behavior chain for both image and audio, including downstream agent actions.
    No direct production incident was found, so Observed is not supported.
