  rationale: >-
    Primary protocol, government, practitioner, advisory, and research sources
    support every publishable proposition. Separate current incident, advisory,
    exploitation, demonstration, defense, challenge, and neighbor searches were
    completed. Two consecutive narrow synonym/title passes added no new evidence
    or changed a claim, selection, boundary, control, or classification.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 9
  selected_examples:
    - SRC-cao-vpi-bench-2025
    - SRC-chen-audiohijack-2026
    - SRC-liu-piggybacking-2026
    - SRC-bagdasaryan-multimodal-injection-2023
  no_qualifying_examples_rationale: >-
    Four direct controlled demonstrations qualify, but no direct production
    breach or modality-specific disclosed vulnerability was identified. The two
    reviewed CVEs use adjacent output-rendering or content-injection mechanisms.
  candidates:
    - source_id: SRC-cao-vpi-bench-2025
      identifier: VPI-Bench
      relationship: direct_demonstration
      exploitation_status: controlled
      impact: Unauthorized actions and data-exfiltration scenarios in controlled browser/computer agents.
      remediation: System-prompt defense was limited; contextual guards and action controls remain needed.
      selected: true
      rationale: Highest-impact visual agent benchmark with an end-to-end action path.
    - source_id: SRC-chen-audiohijack-2026
      identifier: AudioHijack
      relationship: direct_demonstration
      exploitation_status: controlled
      impact: Unauthorized actions in controlled open and commercial audio-agent experiments.
      remediation: Evaluated self-reflection, logit, and attention detectors; adaptive risk remains.
      selected: true
      rationale: Direct audio-to-tool behavior with commercial endpoints under bounded conditions.
    - source_id: SRC-liu-piggybacking-2026
      identifier: Piggybacking on Perception
      relationship: direct_demonstration
      exploitation_status: controlled_physical_study
      impact: Concurrent audio altered agent behavior across eleven systems and a bounded device study.
      remediation: CADV source separation and cross-modal consistency were evaluated.
      selected: true
      rationale: Strongest reviewed physical-channel audio evaluation.
    - source_id: SRC-bagdasaryan-multimodal-injection-2023
      identifier: Images and Sounds Indirect Instruction Injection
      relationship: direct_demonstration
      exploitation_status: proof_of_concept
      impact: Attacker-chosen output and dialogue steering from image and audio perturbations.
      remediation: Paper frames initial proof of concept; no product remediation established.
      selected: true
      rationale: Foundational direct demonstration covers both modalities.
    - source_id: SRC-bailey-image-hijacks-2024
      identifier: Image Hijacks
      relationship: direct_demonstration
      exploitation_status: proof_of_concept
      impact: Behavior matching, context leakage, and other image-triggered outcomes.
      remediation: Simple compression/noise defenses were limited.
      selected: false
      rationale: Overlaps selected visual evidence and had zero held-out-model transfer in a reported test.
    - source_id: SRC-chameleon-2025
      identifier: Chameleon
      relationship: direct_demonstration
      exploitation_status: proof_of_concept
      impact: Scaling-triggered hidden visual instruction in a simulated agent pipeline.
      remediation: No general product remediation established.
      selected: false
      rationale: One-model simulated study is lower impact than selected visual-agent evidence.
    - source_id: SRC-nagaraja-image-pi-2026
      identifier: Image-based Prompt Injection Attacks and Defenses
      relationship: direct_demonstration
      exploitation_status: controlled
      impact: Black-box image strategies changed model outputs under measured visibility tradeoffs.
      remediation: Proposes OCR and sanitization directions.
      selected: false
      rationale: Does not establish as strong an agent action path as VPI-Bench.
    - source_id: SRC-nvd-cve-2024-45989
      identifier: CVE-2024-45989
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: poc
      impact: Chat content exfiltration through an image rendered in model output.
      remediation: Affected versions are recorded as before 2.3.0; NVD gives no verified patch narrative.
      selected: false
      rationale: Image is an output/rendering sink, not the attacker-controlled multimodal input.
    - source_id: SRC-nvd-cve-2025-58357
      identifier: CVE-2025-58357
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: poc
      impact: MCP client content injection and cross-site scripting from malicious content/integrations.
      remediation: Fixed in 0.14.0 according to the reviewed NVD record.
      selected: false
      rationale: Content-injection path is not specific to image/audio model interpretation.
