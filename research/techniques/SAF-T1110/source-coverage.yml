saturation:
  reached: true
  consecutive_no_change_passes: 2
  passes:
    - pass: protocol_and_authority
      completed_on: "2026-09-01"
      queries:
        - "Direct review: MCP Tools specification 2025-11-25"
        - "Direct review: NIST AI 100-2e2025 PDF"
        - "Direct review: OWASP LLM01:2025"
        - "Direct review: MITRE ATT&CK T1204 and T1204.003"
      material_changes:
        - Established MCP modality/tool capability, trust boundary, safety guidance, and analogous ATT&CK mapping.
    - pass: known_breaches_and_vulnerabilities
      completed_on: "2026-09-01"
      queries:
        - "site:nvd.nist.gov multimodal prompt injection"
        - "site:nvd.nist.gov image prompt injection"
        - "site:nvd.nist.gov audio prompt injection"
        - "site:nvd.nist.gov/vuln/detail prompt injection image"
        - "site:nvd.nist.gov/vuln/detail prompt injection audio"
        - "site:cisa.gov prompt injection"
        - "site:cisa.gov/known-exploited-vulnerabilities-catalog prompt injection"
        - "site:cisa.gov multimodal prompt injection incident breach"
      material_changes:
        - Classified CVE-2024-45989 and CVE-2025-58357 as adjacent rather than direct.
        - Found no qualifying direct multimodal production breach, direct modality-specific advisory, or authoritative exploitation listing.
    - pass: demonstration_and_empirical_research
      completed_on: "2026-09-01"
      queries:
        - "site:arxiv.org multimodal prompt injection images audio 2025"
        - "site:arxiv.org audio prompt injection multimodal LLM"
        - "site:arxiv.org auditory prompt injection commercial voice agents"
        - "site:arxiv.org visual prompt injection agent tool invocation black-box 2026"
      material_changes:
        - Selected four direct demonstrations spanning image, audio, browser/computer agents, and voice agents.
    - pass: detection_and_defense
      completed_on: "2026-09-01"
      queries:
        - "site:arxiv.org defense detection multimodal prompt injection images"
        - "site:openai.com image prompt injection multimodal safety"
        - "Direct review: Microsoft Azure Prompt Shields"
        - "Direct review: OpenAI GPT-4V System Card and agent prompt-injection defense"
      material_changes:
        - Supported media-aware screening, source-sink correlation, action gateways, and classifier limitations.
    - pass: gap_and_challenge
      completed_on: "2026-09-01"
      queries:
        - "site:arxiv.org failed reproduction multimodal prompt injection image audio"
        - "site:arxiv.org multimodal prompt injection image audio agent 2026"
        - "site:nvd.nist.gov/vuln/detail multimodal agent image audio prompt injection CVE"
        - "site:cisa.gov multimodal agent image audio prompt injection incident"
