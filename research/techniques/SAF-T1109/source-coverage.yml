breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 5
  selected_examples:
    - SRC-ghsa-inspector-7f8r
    - SRC-ghsa-inspector-g9hg
    - SRC-microsoft-autojack-2026
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-ghsa-inspector-7f8r
      identifier: CVE-2025-49596 / GHSA-7f8r-222p-6f5g
      relationship: direct_vulnerability
      exploitation_status: controlled_demonstration_only
      impact: Unauthenticated proxy requests could launch arbitrary local MCP commands over stdio.
      remediation: Fixed in MCP Inspector 0.14.1 with authentication, local binding, and Origin validation.
      selected: true
      rationale: Directly crosses the bounded local debugging-control-plane boundary with local execution.
    - source_id: SRC-ghsa-inspector-g9hg
      identifier: CVE-2025-58444 / GHSA-g9hg-qhmf-q45m
      relationship: direct_vulnerability
      exploitation_status: advisory_no_production_incident_identified
      impact: A malicious redirect path could enable direct proxy interaction and local command execution.
      remediation: Fixed in MCP Inspector 0.16.6 with redirect URL validation.
      selected: true
      rationale: Directly exploits the Inspector control surface and reaches local execution.
    - source_id: SRC-microsoft-autojack-2026
      identifier: AutoJack
      relationship: direct_demonstration
      exploitation_status: controlled_demonstration_only
      impact: Untrusted web content could drive a local MCP connection into arbitrary process launch.
      remediation: Fixed before PyPI release; current packaged builds were not affected according to Microsoft.
      selected: true
      rationale: Independent end-to-end demonstration in an agent prototyping environment.
    - source_id: SRC-oligo-localhost-2025
      identifier: 0.0.0.0 Day
      relationship: enabling_vulnerability
      exploitation_status: controlled_demonstration
      impact: Browser requests could reach local services under affected browser behaviors.
      remediation: Browser and service-side restrictions described by the source.
      selected: false
      rationale: Establishes an enabling browser-to-localhost path but not the defining debugging-tool execution outcome.
    - source_id: SRC-oligo-litellm-2026
      identifier: LiteLLM test endpoint exploitation
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: reported_active_exploitation
      impact: Public server-side test endpoints enabled command execution.
      remediation: Vendor update and endpoint restriction.
      selected: false
      rationale: Public server API boundary is closer to public-facing service exploitation than the bounded developer debugging control plane.
