  core_claim_ids: [SAF-T1707-C007, SAF-T1707-C019]
  rationale: >-
    Direct authorities establish the OAuth primitive, defenses, formal attack,
    and several implementation vulnerabilities. The MCP-specific end-to-end
    application remains an explicit framework inference because no qualifying
    MCP incident or demonstration was identified.
