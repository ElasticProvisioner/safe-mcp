conflicts:
  - issue: Authlib upstream advisory display ambiguously lists 1.6.5 as both affected and patched.
    resolution: Use NVD's normalized fixed release 1.6.6 for the research packet and omit a detailed version boundary from publishable prose.
  - issue: Re-fetched MCP HTML had dynamic presentation-asset hash changes.
    resolution: Plain-text semantic comparison of the named authorization-response requirements found no material content change.
evidence_assessment:
