breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 7
  selected_examples:
    - SRC-ghsa-openclaw-gjm7
    - SRC-ghsa-codewhale-g29h
    - SRC-elastic-esa-2026-83
    - SRC-invariant-github-mcp-2025
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-ghsa-openclaw-gjm7
      identifier: CVE-2026-41378 / GHSA-gjm7-hw8f-73rq
      relationship: direct_vulnerability
      exploitation_status: CISA SSVC in the NVD record reports none; no production exploitation was identified.
      impact: A paired low-privilege node could reach broader gateway-side tools and gateway code execution.
      remediation: Fixed in OpenClaw 2026.3.31; maintainer rates the narrow, foothold-dependent issue high.
      selected: true
      rationale: Direct authorization boundary, total potential CIA impact, current fixed versions, and strong maintainer limitation make it the highest-impact qualifying vulnerability.
    - source_id: SRC-ghsa-codewhale-g29h
      identifier: CVE-2026-75857 / GHSA-g29h-pfmp-qp9r
      relationship: direct_vulnerability
      exploitation_status: CISA SSVC in NVD reports proof of concept; no production exploitation was identified.
      impact: Injected instructions could drive commands in an already-approved process at that process's privilege level without a new approval.
      remediation: Fixed in CodeWhale 0.8.64; upgrade is required.
      selected: true
      rationale: Directly matches the approval-boundary contract and can inherit root, database, or remote-shell authority under stated preconditions.
    - source_id: SRC-elastic-esa-2026-83
      identifier: CVE-2026-72681 / ESA-2026-83
      relationship: direct_vulnerability
      exploitation_status: CISA SSVC in NVD reports none; Elastic identifies no specific IoC.
      impact: A low-privilege Kibana requestor could invoke a separate feature through Agent Builder and potentially read unauthorized sensitive information.
      remediation: Fixed in Kibana 9.4.4; no workaround; Cloud Serverless was remediated before disclosure.
      selected: true
      rationale: First-party advisory precisely identifies missing requestor authorization before tool creation and execution.
    - source_id: SRC-invariant-github-mcp-2025
      identifier: GitHub MCP private-repository exfiltration demonstration
      relationship: direct_demonstration
      exploitation_status: Controlled demonstration only; no production exploitation was established.
      impact: A public issue author influenced an agent to read private repositories and publish selected private data to a public pull request.
      remediation: Architectural mitigation through granular per-repository controls, contextual data-flow policy, and monitoring; no server-code patch claimed.
      selected: true
      rationale: Complete, directly reviewed MCP tool sequence establishes the core behavior and therefore the Demonstrated evidence label.
    - source_id: SRC-invariant-whatsapp-mcp-2025-04-07
      identifier: WhatsApp MCP injected-message and tool-poisoning demonstrations
      relationship: direct_demonstration
      exploitation_status: Controlled demonstrations only.
      impact: Tool outputs or malicious tool descriptions steered messaging tools to disclose contacts or chat history.
      remediation: Researcher recommends caution, visibility, and MCP security controls; no authoritative product patch was established.
      selected: false
      rationale: Qualifying but lower-ranked because it is older, overlaps the selected GitHub flow, and one experiment depends on the neighboring tool-poisoning mechanism.
    - source_id: SRC-unit42-double-agents
      identifier: Vertex AI Double Agents research
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Controlled research; deployment workflow later changed.
      impact: A deliberately malicious deployed agent exposed service-agent credentials and accessed consumer storage and restricted producer images.
      remediation: Google documented the model and recommended a customer-controlled service account; some hypothesized Workspace access lacked required IAM permissions.
      selected: false
      rationale: High impact but primarily identity and credential extraction from a malicious agent package, not low-trust invocation of a legitimate privileged tool.
    - source_id: SRC-gitlab-cve-2024-3303
      identifier: CVE-2024-3303
      relationship: enabling_vulnerability
      exploitation_status: Public advisory; production exploitation not established.
      impact: Prompt injection could exfiltrate a private GitLab issue.
      remediation: Fixed in GitLab 17.6.5, 17.7.4, and 17.8.2; GitLab.com was patched at publication.
      selected: false
      rationale: Verified and relevant, but the advisory does not expose the tool authorization path needed to classify the defining boundary as precisely as the four selected examples.

