conflicts:
  - issue: NVD and CVSS language can imply critical reach for OpenClaw, while the maintainer says the issue is narrow and high because a trusted paired-node foothold is required.
    resolution: Publish high potential impact with the foothold prerequisite and do not call the issue critical.
  - issue: The GitHub disclosure makes a broad architectural claim beyond the demonstrated Claude Desktop configuration.
    resolution: Limit publishable wording to the demonstrated environment and record universal susceptibility as excluded.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids: [SAF-T1302-C004, SAF-T1302-C005]
  rationale: >-
    The GitHub MCP controlled evaluation completes the defining sequence from
    low-trust content through legitimate tools to higher-authority private-data
    access and public disclosure. Current direct vulnerabilities independently
    corroborate missing requestor authorization and action-bound approval. No
    qualifying production incident was directly reviewed, so Observed is not supported.

