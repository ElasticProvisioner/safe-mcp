conflicts:
  - issue: Microsoft reports zero-click lateral-movement outcomes in deployed-system red-team engagements, but no named external-adversary incident or complete event trace is public.
    resolution: Classified the technique as Demonstrated, selected the engagements as direct demonstrations, and preserved the production-incident gap.
  - issue: MCP tool composition is intended behavior and many prompt-like inputs observed in internal agents were accidental or non-malicious.
    resolution: The contract requires unsupported user intent, a distinct boundary, consequential action, causal linkage, and absent or bypassed approval; the detector documents remaining false positives.
evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1703-C003
    - SAF-T1703-C004
    - SAF-T1703-C018
  rationale: >-
    Direct red-team, benchmark, and vulnerability demonstrations establish the
    complete source-influence-to-second-boundary mechanism. The public corpus
    does not support Observed because it lacks a named external-adversary
    production incident with an auditable contract-exact event sequence.
