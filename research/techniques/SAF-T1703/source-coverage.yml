sources_rejected:
  - source_id: SRC-mcp-annotations-2026-03-16
    reason: Useful direct practice context, but no unique publishable proposition remained after higher-authority protocol and direct evidence were used.
  - source_id: SRC-microsoft-ai-gateway-incident
    reason: Observed compromises were conventional gateway or application exploitation without agent-mediated cross-tool influence.
  - source_id: SRC-openai-url
    reason: Later-paper historical summary was retained for research context, but the original cross-plugin artifact was not independently re-opened.
  - source_id: SRC-usenix-muzzle
    reason: Empirical corroboration was less tool-boundary-specific than AttriGuard and the selected examples.
  - source_id: SRC-contextleak
    reason: The demonstrated context disclosure can occur through one malicious tool without a distinct target boundary.
  - source_id: SRC-mitre-t1021
    reason: Remote Services is narrower and requires a remote-service mechanism not inherent to this technique.
  - source_id: SRC-mitre-t1210
    reason: Exploitation of Remote Services requires a software-vulnerability mechanism not inherent to this technique.
  - source_id: SRC-openai-agent-pi-defense-2026
    reason: Direct defense research corroborated source-to-sink controls but added no unique publishable proposition after higher-priority sources were selected.
  - source_id: SRC-anthropic-containment
    reason: Direct practice guidance corroborated defense in depth but added no unique publishable proposition after protocol and incident-response sources were selected.
  - source_id: SRC-arxiv-cross-tool-2026
    reason: Direct preprint evidence was relevant but redundant with peer-reviewed and first-party demonstrations used in the technique.
  - source_id: SRC-arxiv-mcp-threat
    reason: The preprint threat model and experiments duplicated higher-priority protocol and empirical evidence.
  - source_id: SRC-cisa-bulletin
    reason: The weekly bulletin is a secondary CVE listing and did not establish exploitation status or technical detail beyond direct authorities.
  - source_id: SRC-nvd-34072
    reason: NVD supported identifier and source discovery, while publishable technical claims use the original researcher advisory.
  - source_id: SRC-google-ai-misuse
    reason: The January 2025 threat-intelligence assessment is useful contrary historical context but predates the selected 2025-2026 demonstrations and cannot establish current absence.
  - source_id: SRC-t1206-ms-config-risk
    reason: Observed unauthenticated MCP exposure is a single-server authorization problem, not a cross-tool pivot.
