version: 1
issues:
  - id: SAF-T1703-A001
    triggered_by: SAF-T1703
    affects:
      - SAF-T1102
      - SAF-T1104
      - SAF-T1701
      - SAF-T1703
    severity: high
    status: resolved
    change: >-
      Register an adversarially induced transition into a distinct tool, server,
      service, application, or security domain as SAF-T1703.
    reason: >-
      The frozen contract excludes injection delivery without a second boundary
      and unauthorized action confined to one tool; SAF-T1701 is the result-borne
      subset of the broader upstream surfaces admitted here.
    resolution: >-
      Injection delivery maps to SAF-T1102, single-tool misuse maps to SAF-T1104,
      SAF-T1701 remains the result-borne subset, nine canonical mitigations cover
      provenance, privilege, authorization, integrity, audit, and monitoring,
      ATT&CK T1072 remains analogous, and eight detector cases validate the boundary.
