breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 8
  selected_examples:
    - SRC-song-mcp-attack-v4
    - SRC-invariant-tpa-2025-04-01
    - SRC-docker-ghsa-46gc-2025
  no_qualifying_examples_rationale: >-
    Three examples were selected, but only Song et al. directly demonstrate the
    temporal redefinition step. No primary production incident or direct CVE was
    found; adjacent examples remain explicitly bounded and do not raise the
    technique evidence status.
  candidates:
    - source_id: SRC-song-mcp-attack-v4
      identifier: arXiv:2506.02040v4 RQ1 Test 2
      relationship: direct_demonstration
      exploitation_status: controlled_research_only
      impact: Benign aggregator listings continued to direct users to replaced malicious server code without relisting or warning.
      remediation: Researchers removed the repositories after seven days; the paper recommends trusted hosting and signed definitions/code.
      selected: true
      rationale: Highest-confidence direct evidence for post-trust redefinition, with no production victims.
    - source_id: SRC-invariant-tpa-2025-04-01
      identifier: Invariant Cursor tool-poisoning experiment
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled_research_only
      impact: The controlled poisoned-description experiment caused access and transmission of sensitive local files.
      remediation: Researchers recommend visible descriptions, pinning, hashes, and cross-server boundaries.
      selected: true
      rationale: High-impact adjacent evidence for what a later malicious definition can do, but not proof of the temporal step.
    - source_id: SRC-docker-ghsa-46gc-2025
      identifier: CVE-2025-64443 / GHSA-46gc-mwh4-cc5r
      relationship: enabling_vulnerability
      exploitation_status: none_reported_in_cisa_ssvc
      impact: Browser-based attackers could manipulate tools behind an affected Docker MCP Gateway in SSE or streaming mode.
      remediation: Fixed in 0.28.0; use default stdio mode as the documented workaround.
      selected: true
      rationale: Highest-relevance current disclosed vulnerability, but it enables tool manipulation rather than proving retained post-approval trust.
    - source_id: SRC-nvd-cve-2025-64443
      identifier: CVE-2025-64443 NVD record
      relationship: enabling_vulnerability
      exploitation_status: none_reported_in_cisa_ssvc
      impact: Corroborates the Docker advisory and high potential integrity impact.
      remediation: Version 0.28.0 fixes the issue.
      selected: false
      rationale: Corroborating record for the selected advisory, not a separate example.
    - source_id: SRC-nvd-cve-2025-58357
      identifier: CVE-2025-58357
      relationship: rejected
      exploitation_status: proof_of_concept_reported
      impact: Content injection from a compromised server into 5ire client interactions.
      remediation: Fixed in 5ire 0.14.0.
      selected: false
      rationale: The server is already compromised and injects content; the record does not establish post-trust definition replacement under retained approval.
    - source_id: SRC-ms-indirect-injection-2025
      identifier: Microsoft hosted MCP rug-pull guidance
      relationship: direct_demonstration
      exploitation_status: conceptual_guidance_not_incident
      impact: Describes bounded exfiltration or manipulation after dynamic amendment.
      remediation: Prompt Shields and software supply-chain controls.
      selected: false
      rationale: Authoritative corroboration, but not an independently reported experiment or breach.
    - source_id: SRC-ms-rug-pull-catalog-2026
      identifier: Microsoft AI attack catalog rug-pull entry
      relationship: direct_demonstration
      exploitation_status: cataloged_attack_pattern_not_incident
      impact: Catalogs post-approval malicious alteration and cross-agent/tool consequences.
      remediation: Layered identity, vetting, monitoring, sandboxing, and escalation controls.
      selected: false
      rationale: Current authority and mapping source, not an additional observed event.
    - source_id: SRC-azure-appservice-mcp-2026
      identifier: Azure App Service MCP dynamic spec update
      relationship: rejected
      exploitation_status: legitimate_feature
      impact: Legitimate hot reload changes and hashes tool lists before notification.
      remediation: Not applicable; retained as detection and false-positive evidence.
      selected: false
      rationale: Implementation behavior, not a vulnerability or adversarial example.

