conflicts:
  - issue: MCP permits tool-list change, while security guidance treats post-approval semantic change as requiring renewed trust.
    resolution: The technique excludes approved evolution and detects only a changed definition lacking a matching approval for the current hash.
  - issue: The direct study changes a referenced repository rather than exercising an in-session list_changed event.
    resolution: The scope includes both update-path and protocol-notification redefinition under retained trust; the limitation is explicit and the analytic covers the protocol event path.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1205-C003
  rationale: >-
    Song et al. directly reproduced benign registration followed by malicious
    replacement under unchanged aggregator listing status. This establishes the
    defining temporal trust transition in a controlled environment. No reviewed
    primary source establishes a production incident, so Observed is not supported.

