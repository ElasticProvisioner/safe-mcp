      completed_on: 2026-09-01
      queries:
        - "site:modelcontextprotocol.io registry package version server installation metadata official registry"
        - "site:code.visualstudio.com MCP server install update extensions auto update signature verification"
        - "site:theupdateframework.io specification updater repository compromise freeze rollback mix-and-match attacks"
        - "site:csrc.nist.gov software update code signing integrity secure software update guidance"
      material_changes: [Established MCP metadata-to-package boundary, concrete agent-plugin update behavior, and update-security trust controls.]
    - pass: known_breaches_and_vulnerabilities
      completed_on: 2026-09-01
      queries:
        - "site:cisa.gov SolarWinds Orion compromised software updates backdoor advisory December 2020"
        - "site:cloud.google.com/blog/topics/threat-intelligence 3CX software supply chain compromise March 2023 Mandiant"
