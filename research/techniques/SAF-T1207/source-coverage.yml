        - "site:nvd.nist.gov Electron autoUpdater signature verification vulnerability CVE"
      material_changes: [Selected two high-impact historical incidents and two non-MCP updater vulnerabilities; recorded exploitation limitations.]
    - pass: demonstration_and_empirical_research
      completed_on: 2026-09-01
      queries:
        - "site:socket.dev/blog malicious MCP server patch release update backdoor postmark 2025"
        - "site:socket.dev/blog MCP package update compromise production incident"
        - "site:cloud.google.com/blog/topics/threat-intelligence MCP update compromise malicious version"
        - "site:koi.ai/blog malicious MCP package update compromised existing package"
      material_changes: [Selected the Axios incident as adjacent MCP dependency exposure; rejected inaccessible legacy Koi leads and first-install-only package campaigns.]
    - pass: detection_and_defense
      completed_on: 2026-09-01
      queries:
        - "site:attack.mitre.org/techniques/T1195/002 software supply chain compromise updates signed code"
