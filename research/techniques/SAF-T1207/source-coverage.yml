  rationale: >-
    Seventy whitelist-only discovery queries and 58 direct page-open operations covered official MCP and host documentation,
    update-security standards, current threat reporting, historical incidents, vulnerabilities, and detection guidance.
    Two final focused passes produced no qualifying production incident completing the trusted MCP/agentic update-to-persistence sequence.

breach_and_vulnerability_assessment:
  searched_on: 2026-09-01
  candidate_count: 10
  selected_examples:
    - SRC-google-supply-chain
    - SRC-mandiant-solarwinds
    - SRC-mandiant-3cx
    - SRC-electron-ghsa
  no_qualifying_examples_rationale: >-
    No direct qualifying production MCP or agentic-system incident was identified. Selected examples are explicitly
    adjacent, historical, or enabling evidence and therefore do not raise the end-to-end technique above Research-Derived.
  candidates:
    - source_id: SRC-google-supply-chain
      identifier: Axios 1.14.1 supply-chain incident
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed_in_production_ecosystem
      impact: A malicious dependency deployed a backdoor through a legitimate high-volume package; sampled MCP packages had resolving version ranges.
      remediation: Malicious versions were removed; pinning, deterministic installs, cooldowns, curation, and monitoring were recommended.
      selected: true
      rationale: Current, high-impact incident with MCP dependency exposure, but no confirmed persistent MCP component replacement.
    - source_id: SRC-mandiant-solarwinds
      identifier: SolarWinds SUNBURST
      relationship: historical_analogy
      exploitation_status: observed_in_production
      impact: Digitally signed trojanized updates distributed a backdoor to multiple organizations.
      remediation: Detect, contain, replace affected releases, and rebuild when integrity cannot be established.
      selected: true
      rationale: High-impact authoritative update-hijack precedent outside the agentic domain.
    - source_id: SRC-mandiant-3cx
      identifier: 3CX DesktopApp supply-chain compromise
      relationship: historical_analogy
      exploitation_status: observed_in_production
      impact: Compromised build environments distributed a trojanized application and downloader.
      remediation: Replace affected software and remediate compromised build infrastructure.
      selected: true
      rationale: Authoritative cascading update-chain precedent outside the agentic domain.
    - source_id: SRC-electron-ghsa
      identifier: GHSA-77xc-hjv8-ww97 / CVE-2022-29257
      relationship: enabling_vulnerability
      exploitation_status: no_known_exploitation_in_reviewed_sources
      impact: A controlled update server or storage path could deliver a malicious nested application that passed signing checks.
      remediation: Update to 15.5.0, 16.2.0, 17.2.0, or 18.0.0-beta.6 and later.
      selected: true
      rationale: Direct updater trust-bypass evidence relevant to desktop agent hosts, but non-MCP and not observed exploitation.
    - source_id: SRC-sparkle-security
      identifier: CVE-2025-0509
      relationship: historical_analogy
      exploitation_status: no_known_exploitation_in_reviewed_sources
      impact: Replacement of a signed update could bypass EdDSA verification.
      remediation: Update to Sparkle 2.6.4 or the 1.27.3 backport.
      selected: false
      rationale: Useful corroborating updater flaw but lower relevance than the selected Electron advisory.
    - source_id: SRC-paloalto-koi-redirect
      identifier: Legacy Koi Security Postmark MCP article lead
      relationship: rejected
      exploitation_status: unverified
      impact: Search-result text suggested a malicious MCP package update, but the complete source was unavailable.
      remediation: Not assessed from inaccessible evidence.
      selected: false
      rationale: Legacy exact URL redirected to unrelated corporate content; search snippets were source-or-omit rejected.
    - source_id: SRC-paloalto-koi-redirect
      identifier: Legacy Koi Security mcp-runcommand-server article lead
      relationship: rejected
      exploitation_status: unverified
      impact: Search-result text suggested a malicious later package version, but the complete source was unavailable.
      remediation: Not assessed from inaccessible evidence.
      selected: false
      rationale: Full article could not be reviewed after redirect.
    - source_id: SRC-mitre-t1195-002
      identifier: CCleaner 5.33
      relationship: historical_analogy
      exploitation_status: observed_in_production
      impact: A signed legitimate release carried malicious code.
      remediation: Vendor replacement release and incident response.
      selected: false
      rationale: Lower incremental value after SolarWinds and 3CX selection.
    - source_id: SRC-nvd-cve-2022-29257
      identifier: Direct MCP CVE search results
      relationship: rejected
      exploitation_status: mixed_or_none
      impact: Reviewed MCP CVE candidates concerned initial installation, authentication, path access, SSRF, or denial of service.
      remediation: Candidate-specific updates.
      selected: false
      rationale: Mechanisms did not cross the update-replacement boundary.
    - source_id: SRC-socket-axios
      identifier: Mini Shai-Hulud MCP-themed PyPI packages
      relationship: rejected
      exploitation_status: observed_malicious_packages
      impact: Malicious packages targeted MCP developers.
      remediation: Remove affected packages and rotate exposed credentials.
      selected: false
      rationale: Search evidence described malicious package delivery without proving replacement of a previously trusted component.

