conflicts:
  - issue: Capability-list output may be mistaken for the complete callable surface.
    resolution: CVE-2026-46519 shows tools/call authorization can diverge from tools/list filtering; the technique describes only advertised visibility.
  - issue: Concentrated discovery traffic may be mistaken for malicious intent.
    resolution: Inspector and SCOUT establish legitimate use, so the analytic is experimental, baselined, and purpose-suppressed.
  - issue: Roots appear to add a current enumeration surface.
    resolution: Roots are retained only as a deprecated legacy variant and are identified as client-provided informational guidance.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids: [SAF-T1605-C005]
  rationale: >-
    Direct sources independently establish the enumerable protocol surfaces,
    practical listing, legitimate production scale, and a general ATT&CK
    discovery purpose. Their adversarial MCP-specific combination remains an
    inference because no direct malicious production incident or controlled
    capability-mapping demonstration was identified.

