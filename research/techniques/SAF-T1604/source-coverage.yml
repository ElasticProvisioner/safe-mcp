saturation:
  reached: true
  consecutive_no_change_passes: 2
  passes:
    - pass: protocol_and_authority
      completed_on: 2026-09-02
      queries:
        - DIRECT OPEN https://modelcontextprotocol.io/specification/2026-07-28/server/discover
        - DIRECT OPEN https://modelcontextprotocol.io/specification/2026-07-28/basic/versioning
        - DIRECT OPEN https://modelcontextprotocol.io/specification/2026-07-28/schema
        - DIRECT OPEN https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
        - DIRECT OPEN https://www.rfc-editor.org/rfc/rfc9110.html#section-10.2.4
      material_changes:
        - Established the mandatory server/discover operation, supportedVersions, serverInfo version, version-error behavior, HTTP Server fields, authorization preconditions, and the explicit trust limitation.
    - pass: known_breaches_and_vulnerabilities
      completed_on: 2026-09-02
      queries:
        - DIRECT OPEN Anthropic first-party GTG-1002 report URL obtained from MITRE ATT&CK T1046
        - DIRECT OPEN https://httpd.apache.org/security/vulnerabilities_24.html#CVE-2021-41773
        - DIRECT OPEN https://httpd.apache.org/security/vulnerabilities_24.html#CVE-2021-42013
        - DIRECT CATALOG FILTER cveID=CVE-2021-41773 or CVE-2021-42013 against CISA KEV 2026.09.01
        - DIRECT OPEN NVD detail URLs for both CVEs; rendered content unavailable, so they were not used as evidence
      material_changes:
        - Found no direct MCP version-enumeration incident or vulnerability.
        - Selected one adjacent MCP-enabled production incident and two high-impact version-specific historical analogies with explicit limitations.
        - Verified affected and fixed Apache versions, exploitation status, CISA KEV status, and named researcher credits.
    - pass: demonstration_and_empirical_research
      completed_on: 2026-09-02
      queries:
        - DIRECT OPEN https://nmap.org/book/vscan.html
        - DIRECT OPEN https://nmap.org/book/man-version-detection.html
        - DIRECT REVIEW MCP discovery request and response examples
      material_changes:
        - Confirmed controlled service-version interrogation and its intensity tradeoff outside MCP.
        - Preserved the gap for an end-to-end malicious MCP server-version demonstration.
    - pass: detection_and_defense
      completed_on: 2026-09-02
      queries:
        - DIRECT OPEN https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
        - DIRECT OPEN https://httpd.apache.org/docs/2.4/mod/core.html#servertokens
        - DIRECT OPEN https://nginx.org/en/docs/http/ngx_http_core_module.html#server_tokens
        - DIRECT REVIEW MCP Authorization access-token requirements
      material_changes:
        - Defined actor, server, interaction, response-version, authorization, and workload-classification telemetry.
        - Built a five-distinct-server/five-minute analytic and representative seven-case test set.
        - Bounded banner suppression as defense in depth rather than a patching substitute.
    - pass: gap_and_challenge
      completed_on: 2026-09-02
      queries:
        - DIRECT OPEN https://attack.mitre.org/techniques/T1046/
        - DIRECT OPEN https://attack.mitre.org/techniques/T1518/
        - DIRECT OPEN https://attack.mitre.org/techniques/T1592/004/
        - DIRECT REVIEW RFC 9110 Section 17.12 and MCP serverInfo trust limitation
        - DIRECT REVIEW Apache ServerTokens security warning
      material_changes:
        - Preserved self-report spoofability, normal-client false positives, slow-probe evasion, and the lack of production accuracy data.
        - Classified T1046 and T1518 as analogous and rejected T1592.004 as a primary mapping because its boundary and tactic differ.
        - Narrowed impact to bounded information disclosure and separated all downstream exploitation.
    - pass: saturation_follow_up_1
      completed_on: 2026-09-02
      queries:
        - "DIRECT CISA KEV 2026.09.01 local filter: Model Context Protocol|MCP server|server version|version disclosure"
        - "DIRECT FIXED-SPEC recheck: server/discover|serverInfo|supportedVersions"
      material_changes: []
    - pass: saturation_follow_up_2
      completed_on: 2026-09-02
      queries:
        - DIRECT RECHECK Apache 2.4 advisory entries and ServerTokens limitation
        - DIRECT RECHECK ATT&CK T1046 and T1518 definitions against the frozen contract
        - DIRECT RECHECK MCP 2026-07-28 Discovery and Versioning pages for changed requirements
      material_changes: []
  rationale: >-
    The corpus contains the current controlling MCP revision, HTTP standard,
    first-party implementation controls, first-party incident reporting,
    official vulnerability and exploitation records, a controlled version-scan
    demonstration, logging guidance, and current ATT&CK definitions. The final
    two authority-only follow-ups added no requirement, qualifying direct case,
