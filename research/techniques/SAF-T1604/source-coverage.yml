breach_and_vulnerability_assessment:
  searched_on: 2026-09-02
  candidate_count: 4
  selected_examples:
    - SRC-anthropic-espionage-2025-11
    - SRC-apache-cve-2021-41773
    - SRC-apache-cve-2021-42013
  no_qualifying_examples_rationale: >-
    Three contextual examples were selected, but none is a direct instance of
    SAF-T1604. No direct MCP production incident or direct enumeration CVE was
    found in the reviewed protocol, incident, advisory, CISA, NVD-attempt, and
    ATT&CK corpus. The technique therefore remains Research-Derived and the
    direct-evidence gap is explicit.
  candidates:
    - source_id: SRC-anthropic-espionage-2025-11
      identifier: Anthropic GTG-1002 AI-orchestrated cyber espionage campaign
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Observed production campaign with a handful of validated successful intrusions.
      impact: MCP-connected automation enumerated services and endpoints across targeted networks and supported later intrusion phases.
      remediation: Anthropic banned identified accounts, notified affected entities as appropriate, coordinated with authorities, and expanded detections.
      selected: true
      rationale: Highest-impact current MCP-enabled production context, retained only as adjacent because the report does not state that MCP server versions were collected.
    - source_id: SRC-apache-cve-2021-41773
      identifier: CVE-2021-41773
      relationship: historical_analogy
      exploitation_status: Known exploited in the wild; also listed in CISA KEV 2026.09.01.
      impact: File disclosure and conditional remote code execution in Apache HTTP Server 2.4.49.
      remediation: Fixed in 2.4.50, whose fix was later found incomplete; follow superseding CVE-2021-42013 remediation.
      selected: true
      rationale: High-impact version-specific analogy showing why a precise build identifier can influence later analysis without proving enumeration occurred.
    - source_id: SRC-apache-cve-2021-42013
      identifier: CVE-2021-42013
      relationship: historical_analogy
      exploitation_status: Listed in CISA KEV 2026.09.01 with known ransomware-campaign use.
      impact: Path traversal and conditional remote code execution in Apache HTTP Server 2.4.49 and 2.4.50 after an incomplete fix.
      remediation: Fixed in Apache HTTP Server 2.4.51.
      selected: true
      rationale: High-impact analogy for version-range and remediation-state sensitivity; no source says version enumeration selected the target.
    - source_id: SRC-mcp-discovery-2026-07-28
      identifier: MCP 2026-07-28 server/discover
      relationship: rejected
      exploitation_status: No malicious exploitation claim in the specification.
      impact: The protocol operation returns supported versions and can return a self-reported implementation version.
      remediation: The specification says clients should not rely on serverInfo for security decisions; normal interoperability use remains expected.
      selected: false
      rationale: Controlling protocol evidence for mechanism, not a breach, vulnerability, or malicious demonstration.

