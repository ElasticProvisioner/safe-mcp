    reason: The sub-technique concerns pre-compromise victim client configurations under Reconnaissance, not version metadata returned by an MCP server under Discovery.
sources_blocked: []

conflicts:
  - issue: Version metadata can help narrow later analysis, but RFC 9110 says attackers often try potential weaknesses regardless of apparent versions.
    resolution: Rate immediate severity Low, state only bounded disclosure, and require separate evidence for downstream exploitation.
  - issue: MCP discovery returns serverInfo for display, logging, and debugging but says it is self-reported and unverified.
    resolution: Treat all values as hints and require independent asset-record verification before remediation decisions.
  - issue: Banner reduction is available, but Apache warns that disabling the Server field does not itself secure a server.
    resolution: Present detail minimization only as defense in depth alongside authorization, logging, verification, and patching.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1604-C004
  rationale: >-
    Current MCP sources directly establish that a client can receive version
    values, and Nmap establishes service-version interrogation outside MCP. The
    adversarial use of MCP version discovery is an explicit inference because no
    reviewed source documents a direct malicious MCP instance or end-to-end public
    demonstration. Adjacent incidents and historical CVEs do not raise the label.

