  rationale: >-
    The directly reviewed corpus covers the current protocol path and control
    guidance, two end-to-end researcher demonstrations, scanner scope,
    neighboring risk categories, and framework analogy. A contrary-result pass
    narrowed claims to tested dates and environments. Two subsequent
    authority-only passes added no controlling requirement, qualifying example,
    material fact, corroboration, exception, or detection constraint. Blocked
    official-catalog endpoints remain a stated integration gap and do not support
    an absolute absence claim.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 4
  selected_examples:
    - SRC-invariant-tpa-2025-04-01
    - SRC-invariant-whatsapp-mcp-2025-04-07
  no_qualifying_examples_rationale: >-
    Two direct controlled demonstrations qualified and were selected. No direct
    production breach or direct disclosed vulnerability qualified in the
    accessible reviewed corpus. The NVD filtered endpoint could not be opened
    and the CISA KEV feed returned HTTP 403, so the technique states only the
    bounded reviewed-corpus result and carries authoritative-catalog recheck as
    an integration gap.
  candidates:
    - source_id: SRC-invariant-tpa-2025-04-01
      identifier: Invariant Tool Poisoning Experiment 1
      relationship: direct_demonstration
      exploitation_status: controlled_demonstration_only
      impact: Sensitive configuration and private-key data were transmitted through an unrelated tool parameter in the tested setup.
      remediation: Current MCP guidance recommends full input display, confirmation, and logging; the source does not document a product patch.
      selected: true
      rationale: Highest-relevance direct demonstration of the defining sensitive-data-in-tool-argument boundary.
    - source_id: SRC-invariant-whatsapp-mcp-2025-04-07
      identifier: Invariant WhatsApp MCP Experiments 1 and 2
      relationship: direct_demonstration
      exploitation_status: controlled_demonstration_only
      impact: Chat history or contact data was transmitted through message-tool fields to an attacker-controlled recipient.
      remediation: The report recommends caution and illustrates visibility constraints; it does not document a vendor patch or production response.
      selected: true
      rationale: High-impact cross-server demonstration with both malicious-description and injected-message delivery variants.
    - source_id: SRC-mcp-security-2025-11-25
      identifier: MCP Local Server Compromise guidance
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: generic_attack_guidance_not_incident
      impact: A malicious local process can access or transmit host data when server privileges are not constrained.
      remediation: Restrict local server filesystem and network access and require explicit privilege grants.
      selected: false
      rationale: The documented example uses server process behavior rather than a host-issued MCP tool argument.
    - source_id: SRC-owasp-mcp-top10-v0.1
      identifier: OWASP MCP03 Tool Poisoning and MCP10 Context Over-Sharing
      relationship: rejected
      exploitation_status: guidance_not_incident_or_advisory
      impact: The beta categories describe risk families but do not document a specific affected product, exploit, incident, or remediation state.
      remediation: General category guidance only.
      selected: false
      rationale: Useful for scope distinctions, but not a qualifying breach, vulnerability, or demonstration record.

