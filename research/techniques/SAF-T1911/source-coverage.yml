conflicts:
  - issue: The April 2025 experiment reported incomplete argument visibility, whereas the current 2025-11-25 MCP tools page recommends showing inputs before dispatch.
    resolution: Attribute the UI result only to the tested environment and date; treat full-input display as current guidance, not proof of implementation.
  - issue: Tool-description scanning can detect inducing instructions but does not prove runtime parameter transmission.
    resolution: Require tools/call plus host-side data-lineage evidence for the bounded analytic and state the scanner limitation.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1911-C004
    - SAF-T1911-C006
  rationale: >-
    Two directly reviewed original researcher reports document end-to-end
    controlled transmission of sensitive data through tool-call fields. The
    label is Demonstrated because neither report establishes a real production
    incident, and adjacent guidance or risk taxonomies do not raise the label.

