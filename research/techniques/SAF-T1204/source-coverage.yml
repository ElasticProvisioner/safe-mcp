    corroboration, limitation, remediation change, or detection constraint.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 7
  selected_examples:
    - SRC-ms-recommendation-poisoning-2026
    - SRC-ms-redteam-update-2026
    - SRC-neurips-minja-2025
    - SRC-neurips-agentpoison-2024
  no_qualifying_examples_rationale: >-
    Four examples qualify for publication, but none is a fully documented direct
    production breach or direct product vulnerability for the complete chain.
    Microsoft observed real-world attempts but explicitly reported variable
    effectiveness; the other selected cases are controlled demonstrations. The
    OpenClaw advisory lacks the durable-memory and later-retrieval steps.
  candidates:
    - source_id: SRC-ms-recommendation-poisoning-2026
      identifier: Microsoft AI Recommendation Poisoning campaign observations
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed_attempts_with_variable_effectiveness
      impact: Attempts sought persistent promotional bias across later assistant recommendations, including health and finance contexts.
      remediation: Microsoft reports evolving prompt filtering, content separation, memory controls, monitoring, and cases no longer reproducible.
      selected: true
      rationale: Highest-relevance in-the-wild campaign evidence, retained with a prominent limitation that successful persistence was not confirmed.
    - source_id: SRC-ms-redteam-update-2026
      identifier: Microsoft 2025-2026 deployed-agent red-team engagements
      relationship: direct_demonstration
      exploitation_status: controlled_red_team_observed_high_frequency
      impact: Persistent-memory seeding propagated across sessions and appeared in high-impact attack-chain engagements.
      remediation: Microsoft recommends whole-session behavioral correlation and agent-component supply-chain controls.
      selected: true
      rationale: Direct end-to-end controlled evidence in deployed agentic systems, though public detail is aggregated.
    - source_id: SRC-neurips-minja-2025
      identifier: MINJA query-only memory injection
      relationship: direct_demonstration
      exploitation_status: controlled_public_demonstration
      impact: Evaluated attacks redirected healthcare, shopping, and QA agent reasoning after malicious records were stored and retrieved.
      remediation: No product patch; the paper evaluates prompt detection and memory sanitization and reports important limitations.
      selected: true
      rationale: Strongest peer-reviewed demonstration with a low-privilege query-only attacker.
    - source_id: SRC-neurips-agentpoison-2024
      identifier: AgentPoison long-term-memory and RAG backdoor
      relationship: direct_demonstration
      exploitation_status: controlled_public_demonstration
      impact: Triggered malicious retrieval and actions across driving, healthcare, and QA agents at low poison rates.
      remediation: No product patch; paper evaluates perplexity filtering and query rephrasing with residual attack success.
      selected: true
      rationale: High-impact peer-reviewed demonstration covering multiple safety-relevant agent domains, with stronger attacker access clearly stated.
    - source_id: SRC-arxiv-memory-defense-2026
      identifier: Realistic-memory MINJA robustness study
      relationship: direct_demonstration
      exploitation_status: controlled_public_demonstration
      impact: Demonstrated lower but nonzero attack success and material dependence on existing memory and retrieval count.
      remediation: Evaluated moderation and trust-aware retrieval; threshold calibration produced security-utility tradeoffs.
      selected: false
      rationale: Retained as contrary evidence rather than a top example because it is a non-peer-reviewed student project with a narrower setup.
    - source_id: SRC-ghsa-openclaw-57r2
      identifier: GHSA-57r2-h2wj-g887
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: no_exploitation_claimed
      impact: Webhook-triggered cron output could appear as a trusted System event and strengthen prompt injection.
      remediation: Fixed in OpenClaw 2026.4.20 by preserving untrusted labels through delivery helpers.
      selected: false
      rationale: It does not establish durable memory storage or later cross-session retrieval.
    - source_id: SRC-nvd-cve-2026-44999
      identifier: CVE-2026-44999
      relationship: rejected
      exploitation_status: unknown
      impact: NVD describes the OpenClaw trust-label issue, but the upstream advisory calls it low severity and says no known CVE.
      remediation: NVD references the upstream fix; the upstream advisory gives fixed version 2026.4.20.
      selected: false
      rationale: Identifier conflict and missing defining persistence chain make it unsuitable as a selected direct vulnerability.

