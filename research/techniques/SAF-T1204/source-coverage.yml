    - SAF-T1204-C005
    - SAF-T1204-C006
    - SAF-T1204-C008
  rationale: >-
    The complete durable-write, later-retrieval, and influence chain has been
    reproduced in peer-reviewed studies and deployed-system red-team
    engagements. Public reporting of production attempts does not establish a
    confirmed successful production compromise, so Observed would overstate the
    available evidence.

