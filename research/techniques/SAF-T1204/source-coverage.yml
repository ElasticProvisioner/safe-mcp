conflicts:
  - issue: NVD assigns CVE-2026-44999 while the linked upstream GHSA says No known CVE.
    resolution: Cite the conflict only in the evidence packet, use the stable GHSA identifier for the adjacent advisory, and do not select it as a direct vulnerability.
  - issue: MINJA reports high averages in controlled settings while a later study reports large reductions with pre-existing relevant memory.
    resolution: Preserve both results, state their settings, and avoid universal effectiveness claims.

