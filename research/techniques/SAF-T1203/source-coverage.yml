    selected examples, evidence class, or analytic.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 6
  selected_examples:
    - SRC-mandiant-unc3886-2024
    - SRC-mandiant-solarwinds
    - SRC-redhat-cve-2024-3094
    - SRC-unit42-mcp-sampling-2025
  no_qualifying_examples_rationale: >-
    Four high-impact examples qualify only as historical or adjacent evidence;
    none is a direct production MCP server-binary replacement. The packet uses
    them with explicit relationship and limitation labels and retains a
    Research-Derived overall status.
  candidates:
    - source_id: SRC-mandiant-unc3886-2024
      identifier: UNC3886 tac_plus replacement
      relationship: historical_analogy
      exploitation_status: observed_production
      impact: Credential logging through a replaced legitimate daemon.
      remediation: Incident-specific rebuild, scoping, and credential response; no universal vendor patch.
      selected: true
      rationale: Closest reviewed production example of post-deployment replacement at a stable daemon path.
    - source_id: SRC-mandiant-solarwinds
      identifier: SUNBURST
      relationship: historical_analogy
      exploitation_status: observed_production
      impact: Signed trojanized update enabled command execution across victim environments.
      remediation: Vendor updates and incident-specific eradication; the publication documents response context rather than one universal fix.
      selected: true
      rationale: High-impact signed-backdoor example, explicitly outside the post-deployment boundary.
    - source_id: SRC-redhat-cve-2024-3094
      identifier: CVE-2024-3094
      relationship: historical_analogy
      exploitation_status: none_reported_in_reviewed_nvd_record
      impact: Malicious liblzma code could interfere with an OpenSSH daemon.
      remediation: Affected xz 5.6.0 and 5.6.1 builds were withdrawn; Red Hat reported no affected RHEL release.
      selected: true
      rationale: Authoritative disclosed backdoor with current NVD exploitation status, but not MCP or post-deployment replacement.
    - source_id: SRC-unit42-mcp-sampling-2025
      identifier: Unit 42 MCP sampling demonstrations
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled_demonstration
      impact: Covert prompt and file operations while retaining legitimate MCP functionality.
      remediation: Trust-boundary isolation and server behavior review; no binary patch applies.
      selected: true
      rationale: Strongest direct MCP behavioral evidence, with explicit statement that no binary replacement was demonstrated.
    - source_id: SRC-redhat-cve-2026-44192
      identifier: CVE-2026-44192
      relationship: enabling_vulnerability
      exploitation_status: not_stated_by_source
      impact: Arbitrary user-writable file creation or overwrite and staged code execution.
      remediation: Red Hat states no suitable mitigation on the reviewed page; affected distribution scope is bounded in its statement.
      selected: false
      rationale: Could enable artifact replacement, but the advisory does not document replacement, persistence, or later server launch.
    - source_id: SRC-mitre-attack-t1195
      identifier: Pre-consumer software supply-chain compromise
      relationship: rejected
      exploitation_status: not_applicable
      impact: Product or delivery manipulation before consumer receipt.
      remediation: Not a product-specific advisory.
      selected: false
      rationale: Defines a neighboring mechanism rather than a SAF-T1203 example.
