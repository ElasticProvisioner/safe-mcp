    reason: Retained as a consulted benchmark lead, but its specialized synthetic stock-manipulation tool is weaker boundary evidence than the selected transaction demonstrations.
  - source_id: SRC-ms-recommendation-poisoning-2026
    reason: Retained as adjacent observed influence evidence, but no reviewed transaction execution crossed the contract boundary.
  - source_id: SRC-t1206-ms-config-risk
    reason: Retained as enabling exposure evidence, but it did not establish a fraudulent transaction.
sources_blocked: []
conflicts:
  - issue: Production-focused searches found adjacent agent incidents and exposed capabilities but no qualifying fraudulent transaction.
    resolution: Preserve Demonstrated rather than Observed status and state the production evidence gap.
  - issue: NCSC's bank-transfer example appears direct but is explicitly hypothetical.
    resolution: Classify it as historical analogy and exclude it from selected demonstrations.
  - issue: Benchmark attack rates vary substantially by model, defense, and whether success is measured at an intermediate or end state.
    resolution: Do not generalize benchmark rates to production; use them only to show possibility and control limitations.
  - issue: A transaction detector may alert on externally authorized standing orders when approval metadata is absent.
    resolution: Declare the expected false positive and require correlation with the authoritative approval system before enforcement.
evidence_assessment:
  overall_status: demonstrated
  core_claim_ids: [SAF-T2104-C005, SAF-T2104-C006, SAF-T2104-C007]
  rationale: Two independent controlled environments execute the defining agent-to-financial-tool behavior, satisfying Demonstrated status. No qualifying production incident was found, so Observed status is not supported.
