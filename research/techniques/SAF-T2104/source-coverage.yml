saturation:
  reached: true
  consecutive_no_change_passes: 2
  passes:
    - pass: protocol_and_authority
      completed_on: "2026-09-02"
      queries:
        - site:modelcontextprotocol.io/specification tools authorization human confirmation least privilege
        - site:datatracker.ietf.org RFC payment authorization amount currency creditor
        - site:attack.mitre.org/techniques/T1657 financial theft
      material_changes:
        - Defined the model-to-tool and authorization-to-execution boundaries.
        - Added payment-field authorization binding and the T1657 external mapping.
    - pass: known_breaches_and_vulnerabilities
      completed_on: "2026-09-02"
      queries:
        - site:aisi.gov.uk agent incident unsanctioned action financial
        - site:ncsc.gov.uk agent prompt injection bank transfer
        - site:microsoft.com/en-us/security/blog MCP vulnerability CVE prompt execution
        - site:cisa.gov AI agent financial transaction vulnerability
      material_changes:
