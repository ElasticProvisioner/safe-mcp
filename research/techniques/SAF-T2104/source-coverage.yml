  rationale: The final two restricted, authority-only passes returned only already-reviewed evidence, broader financial theft, unrelated transfer language, or adjacent agent risks. Protocol, authorization, controlled demonstration, vulnerability, incident, detection, defense, and contrary-evidence source classes are represented, so further whitelist searching is unlikely to change the Demonstrated label or the production evidence gap.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 9
  selected_examples: [SRC-debenedetti-et-al-agentdojo, SRC-art-2507.20526]
  no_qualifying_examples_rationale: Two controlled demonstrations qualify, but no reviewed source established a production SAF-T2104 incident or in-the-wild exploitation; that higher evidence tier remains an explicit gap.
  candidates:
    - source_id: SRC-debenedetti-et-al-agentdojo
      identifier: AgentDojo banking-suite attacker-account transfer
      relationship: direct_demonstration
      exploitation_status: Controlled benchmark execution with environment-state success checks; not production.
      impact: Unauthorized transfer of benchmark funds to an attacker-selected account.
      remediation: Evaluated prompt-injection defenses reduced but did not eliminate measured attack success.
      selected: true
      rationale: Directly crosses the agent-to-banking-tool boundary and measures the economic action, making it a highest-impact qualifying example.
    - source_id: SRC-art-2507.20526
      identifier: ART PharmaAgent unauthorized sale terms
      relationship: direct_demonstration
      exploitation_status: Controlled sandbox competition with successful targeted policy violations; not production.
      impact: Agent attempts to commit a high-quantity sale at a price prohibited by policy.
      remediation: Benchmark emphasizes defense evaluation; no single control is presented as complete remediation.
      selected: true
      rationale: Directly demonstrates adversarial manipulation of an economic transaction through a tool in an independent environment.
    - source_id: SRC-wasp-2504.18575
      identifier: WASP end-to-end web-agent prompt injection benchmark
      relationship: rejected
      exploitation_status: Controlled benchmark with nonzero end-to-end attack success.
      impact: Unauthorized web-agent actions across realistic tasks.
      remediation: Evaluated defenses and model differences; no transaction-specific remediation.
      selected: false
      rationale: Valuable contrary evidence on control limits, but the reviewed material did not establish a qualifying value-bearing transaction.
    - source_id: SRC-asb-2410.02644
      identifier: Agent Security Bench financial analyst stock-manipulation task
      relationship: direct_demonstration
      exploitation_status: Controlled benchmark using specialized synthetic attack tools.
      impact: A financial-analysis agent invokes a synthetic stock-manipulation action.
      remediation: Benchmark compares defense effectiveness; no production patch applies.
      selected: false
      rationale: The specialized attack-tool abstraction is less representative of an ordinary transaction boundary than the two selected demonstrations.
    - source_id: SRC-aisi-incident-2026
      identifier: Unsanctioned agent behaviour during cyber testing
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Observed in a controlled evaluation; report states no real-world harm.
      impact: Unsanctioned social and repository actions, not a financial transaction.
      remediation: AISI added monitoring, containment, and testing safeguards.
      selected: false
      rationale: Agent behavior was observed, but the event did not cross the value-bearing transaction boundary.
    - source_id: SRC-microsoft-semantic-kernel-cves-2026
      identifier: CVE-2026-25592 and CVE-2026-26030
      relationship: enabling_vulnerability
      exploitation_status: Demonstrated by researchers; in-the-wild exploitation not established by the reviewed disclosure.
      impact: File write or command execution through agent-framework input paths.
      remediation: Fixed before .NET 1.71.0 and Python 1.39.4 respectively, per the vendor disclosure.
      selected: false
      rationale: The vulnerabilities can enable privileged effects but no source tied them to a fraudulent transaction.
    - source_id: SRC-ncsc-llm-caution-2023
      identifier: NCSC hypothetical bank-assistant transfer
      relationship: historical_analogy
      exploitation_status: Hypothetical scenario only.
      impact: Imagined attacker-directed bank transfer.
      remediation: NCSC advises caution and acknowledges no complete prompt-injection mitigation.
      selected: false
      rationale: The source explicitly presents the scenario as imagined, so it cannot support Demonstrated or Observed status.
    - source_id: SRC-ms-recommendation-poisoning-2026
      identifier: Observed AI recommendation-poisoning attempts
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Observed influence attempts with variable effectiveness; no transaction execution reported.
      impact: Potentially biased commercial recommendations.
      remediation: Source recommends provenance, monitoring, validation, and resistance testing.
      selected: false
      rationale: Influence over a recommendation is out of scope until a value-bearing transaction is accepted.
    - source_id: SRC-t1206-ms-config-risk
      identifier: Exposed unauthenticated MCP servers
      relationship: enabling_vulnerability
      exploitation_status: Exposed deployments observed; transaction exploitation not established.
      impact: Unauthenticated access to sensitive internal data and operational capabilities.
      remediation: Enforce authentication, least privilege, network restriction, inventory, and monitoring.
      selected: false
      rationale: The exposure is a prerequisite pattern, not evidence of an unauthorized economic action.
