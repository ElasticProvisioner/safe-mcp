  - id: SAF-T2101-C012
    statement: A deterministic analytic can identify explicit destructive verbs and bursts, but semantic intent remains a structural limitation.
    class: research_finding
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-mitre-t1485
        support: direct
        exact_locators: ["Detection Strategy DET0146; Analytics AN0411-AN0416; cloud Delete and Terminate patterns"]
      - source_id: SRC-arxiv-agenttrust-v1
        support: direct
        exact_locators: ["Abstract; deobfuscation normalizer; 300 and 630 scenario evaluations; limitations"]
      - source_id: SRC-arxiv-agenttrust-v2
        support: direct
        exact_locators: ["Abstract; Sections 1 and 5.3; Table 3; production-transfer and replay limitations"]
      - source_id: SRC-aws-agent-access
        support: context
        exact_locators: ["CloudTrail logging examples; direct non-MCP path scope boundary"]
      - source_id: SRC-ms-documentdb-mcp
        support: context
        exact_locators: ["Audit log structured fields"]
    corroboration: ATT&CK supplies platform deletion observables while two research versions expose normalization and semantic limits.
    limitations: [The bundled rule is a portable illustrative analytic, not a universal product query or production benchmark.]
    conflicts: [AgentTrust v2 reports that deterministic rules did not improve held-out semantic data/database accuracy.]
    inference: {is_inference: true, rationale: The analytic adapts platform deletion signals to structured MCP and agent audit fields.}
    status: validated
