    statement: An adversary-influenced agent with an authorized destructive tool can use that path to delete stored state.
    class: framework_inference
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-mcp-tools-2026-07-28
        support: direct
        exact_locators: ["Tools: Overview; Security considerations: clients; Calling tools"]
      - source_id: SRC-aws-agent-access
        support: direct
        exact_locators: ["Three security principles for agent access; Security principle 1"]
      - source_id: SRC-ms-sql-mcp
        support: direct
        exact_locators: ["The tools; Tool availability by version; Disabling tools"]
      - source_id: SRC-ms-documentdb-mcp
        support: direct
        exact_locators: ["Tool catalog; Safety guardrails; Deleting databases, collections, or indexes"]
      - source_id: SRC-arxiv-trustshift
        support: context
        exact_locators: ["Abstract; compromised-server temporal threat model and schema-valid manipulation"]
    corroboration: MCP semantics, two independent first-party tool catalogs, and AWS authority analysis support each component of the inference.
    limitations: [No reviewed source reports the complete adversarial destruction chain in production or a direct end-to-end demonstration.]
    conflicts: []
    inference: {is_inference: true, rationale: The complete chain is assembled from independently supported protocol, capability, and authorization components.}
    status: validated
