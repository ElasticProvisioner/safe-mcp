  rationale: >-
    Five core passes and separate production, advisory, demonstration, defense,
    and contrary passes covered current protocol text, first-party product
    behavior, government vulnerability and exploitation catalogs, academic
    evaluations, platform analogies, and counterevidence. After the last
    material source was incorporated, two consecutive exact authoritative-
    source passes changed no claim, source selection, example classification,
    exclusion, or detector design.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 9
  selected_examples: []
  no_qualifying_examples_rationale: >-
    No reviewed source documented a production MCP or agent incident, a direct
    vulnerability, or an end-to-end controlled demonstration whose immediate
    adversary objective was deletion or irreversible corruption of stored
    state. The three strongest current advisories establish enabling control
    paths only. Selecting them as direct examples would overstate the evidence.
  candidates:
    - source_id: SRC-nvd-cve-2025-53098
      identifier: CVE-2025-53098
      relationship: enabling_vulnerability
      exploitation_status: CISA SSVC none as recorded by NVD
      impact: Prompt-influenced MCP configuration write could lead to arbitrary command execution under multiple prerequisites.
      remediation: Upgrade Roo Code to 3.20.3 or later and keep configuration writes outside auto-approval.
      selected: false
      rationale: No destruction objective or outcome is documented.
    - source_id: SRC-nvd-cve-2025-64443
      identifier: CVE-2025-64443
      relationship: enabling_vulnerability
      exploitation_status: CISA SSVC none as recorded by NVD
      impact: Browser-based DNS rebinding could manipulate tools behind non-stdio Docker MCP Gateway transports.
      remediation: Upgrade to 0.28.0 or later; default stdio was not affected.
      selected: false
      rationale: The affected access path could enable a later action, but no destruction is documented.
    - source_id: SRC-nvd-cve-54377
      identifier: CVE-2025-54377
      relationship: enabling_vulnerability
      exploitation_status: CISA SSVC proof-of-concept as recorded by NVD
      impact: Multiline command input could bypass Roo Code allow-list checking and execute additional commands.
      remediation: Upgrade to 3.23.19 or later.
      selected: false
      rationale: Proof-of-concept status concerns command execution, not a destruction objective.
    - source_id: SRC-nvd-cve-49596
      identifier: CVE-2025-49596
      relationship: enabling_vulnerability
      exploitation_status: not present in acquired CISA KEV snapshot on 2026-09-02
      impact: Unauthenticated remote command execution affected MCP Inspector before 0.14.1.
      remediation: Upgrade to 0.14.1 or later.
      selected: false
      rationale: Generic command execution with no destruction evidence is less direct than selected publishable enabling advisories.
    - source_id: SRC-arxiv-mcp-threat
      identifier: arXiv:2603.22489 controlled tool-poisoning evaluation
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled evaluation
      impact: Two of seven evaluated clients executed the remote-script test path; four blocked it and one was partial.
      remediation: Validate tools, require confirmation, restrict execution, and treat server metadata as untrusted.
      selected: false
      rationale: Demonstrates delivery and execution, not data destruction.
    - source_id: SRC-arxiv-trustshift
      identifier: arXiv:2608.23763 TrustShiftProbe
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled evaluation
      impact: Temporally defecting MCP server tests achieved a reported 69.5 percent mean success, reduced to 42.7 percent with SHIELD.
      remediation: Monitor server behavior over time and enforce runtime response policy.
      selected: false
      rationale: Objectives were disruption and exfiltration; no scoped data destruction was established.
    - source_id: SRC-arxiv-agenttrust-v1
      identifier: arXiv:2605.04785 AgentTrust v1
      relationship: rejected
      exploitation_status: controlled benchmark
      impact: Evaluates normalization and pre-execution safety verdicts for agent actions.
      remediation: Intercept actions before execution and normalize superficial obfuscation.
      selected: false
      rationale: Defense evaluation includes unsafe-action categories but not a direct destruction incident.
    - source_id: SRC-arxiv-agenttrust-v2
      identifier: arXiv:2606.08539 AgentTrust v2
      relationship: rejected
      exploitation_status: replay simulation and held-out evaluation
      impact: Deterministic rules did not improve reported semantic data/database accuracy in the held-out study.
      remediation: Escalate semantically ambiguous actions for contextual or human review.
      selected: false
      rationale: Establishes a detector limit rather than an attack example.
    - source_id: SRC-aws-agent-access
      identifier: AWS prompt-injection deletion scenario
      relationship: rejected
      exploitation_status: hypothetical guidance scenario
      impact: Granted delete permissions could be used at agent speed against production resources.
      remediation: Least privilege, organizational guardrails, identity differentiation, and logging.
      selected: false
      rationale: AWS expressly presents an architectural risk scenario, not a reported incident.
