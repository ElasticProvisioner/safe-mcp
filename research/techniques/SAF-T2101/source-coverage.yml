      completed_on: "2026-09-02"
      queries:
        - Direct review of https://modelcontextprotocol.io/specification/2026-07-28/server/tools
        - Direct review of https://modelcontextprotocol.io/specification/2026-07-28/client/elicitation
        - Direct review of https://blog.modelcontextprotocol.io/posts/2026-03-16-tool-annotations/
      material_changes: [Established model-controlled tool semantics, untrusted annotations, and confirmation mechanisms.]
    - pass: known_breaches_and_vulnerabilities
      completed_on: "2026-09-02"
      queries:
        - Direct NVD review of CVE-2025-53098, CVE-2025-64443, CVE-2025-54377, and CVE-2025-49596
