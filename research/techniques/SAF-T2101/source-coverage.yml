        - Direct review of contrary client blocking results in arXiv:2603.22489
        - Direct review of deterministic semantic limits in arXiv:2606.08539
        - Direct review of direct-path limits in AWS MCP access guidance
      material_changes: [Bounded the evidence label, documented direct-path and semantic blind spots, and rejected annotation trust as a control.]
