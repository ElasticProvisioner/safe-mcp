sources_blocked: []
conflicts:
  - issue: Some controlled clients blocked tool-poisoning execution, and runtime defenses reduced TrustShift success.
    resolution: The technique requires a successful authorized destructive call; defenses are presented as conditions and not assumed absent.
  - issue: Deterministic lexical rules cannot reliably resolve intent-dependent benign and malicious actions with the same surface.
    resolution: The rule is limited to explicit verbs, protected-target approval failures, and review-oriented bursts; semantic ambiguity is a stated limitation.
  - issue: MCP-specific context and policy may not cover direct shell or service API paths.
    resolution: Required telemetry and response guidance include target-service and non-MCP paths.
evidence_assessment:
  overall_status: research-derived
  core_claim_ids: [SAF-T2101-C001, SAF-T2101-C006, SAF-T2101-C014, SAF-T2101-C016]
  rationale: >-
    Protocol semantics, first-party destructive tool surfaces, and delegated-
    authority guidance jointly support feasibility, prerequisites, and impact.
    No qualifying direct production or end-to-end controlled example was found,
    so the complete technique is not labeled Observed or Demonstrated.
