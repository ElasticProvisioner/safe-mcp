        - "DIRECT https://www.rfc-editor.org/rfc/rfc9068.html"
        - "DIRECT https://www.rfc-editor.org/rfc/rfc9700.txt"
      material_changes:
        - Bound the technique to the grant-resource and token-audience/scope authorization context, not token acquisition or downstream passthrough.
        - Established current MCP resource-parameter, audience-validation, scope-error, and step-up requirements.
    - pass: known_breaches_and_vulnerabilities
      completed_on: "2026-09-01"
      queries:
        - "NVD keywordSearch: OAuth access token audience"
        - "NVD keywordSearch: JWT audience validation"
