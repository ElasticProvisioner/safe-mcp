        - "CISA KEV exact membership checks: CVE-2026-14541, CVE-2026-67332, CVE-2026-73208"
      material_changes:
        - Selected CVE-2026-14541 as the highest-relevance direct MCP vulnerability.
        - Selected GHSA-p2fr-6hmx-4528 as an enabling grant-to-resource widening vulnerability.
        - Selected CVE-2026-73208 as the strongest audience-to-scope historical analogy.
