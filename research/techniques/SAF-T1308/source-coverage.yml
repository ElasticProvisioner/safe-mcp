  rationale: >-
    The corpus covers current MCP and OAuth authority, an MCP-specific audience
    vulnerability, a grant-resource widening advisory, an audience-to-scope vendor
    advisory, a production token-validation analogy, KEV status, framework mapping,
    detection, controls, and falsification constraints. The final two independent
    NVD follow-ups returned only an already selected candidate or zero results, and
    the authoritative rechecks added no controlling requirement, higher-impact direct
    example, remediation change, conflict, or unsupported-claim source.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 10
  selected_examples:
    - SRC-cve-2026-14541
    - SRC-ghsa-p2fr-6hmx-4528
    - SRC-oxdc-adv-2026-0003
    - SRC-microsoft-storm-0558
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-cve-2026-14541
      identifier: CVE-2026-14541
      relationship: direct_vulnerability
      exploitation_status: CISA ADP records exploitation as none; absent from CISA KEV 2026.09.01.
      impact: Unrelated valid Google OAuth tokens could reach protected MCP tools and data backends; Google scored high confidentiality and integrity impact.
      remediation: The CVE references a patch location but does not identify a fixed release; no fixed version is asserted.
      selected: true
      rationale: Highest relevance and high impact because the affected component is explicitly an MCP OAuth provider and the failure is audience nonvalidation.
    - source_id: SRC-ghsa-p2fr-6hmx-4528
      identifier: CVE-2026-67332 / GHSA-p2fr-6hmx-4528
      relationship: enabling_vulnerability
      exploitation_status: CISA ADP records exploitation as none; no production exploitation is documented in the advisory.
      impact: A registered client could mint a token for an allow-listed resource outside the original grant; operations remained bounded by separately granted scopes.
      remediation: Fixed in 1.7.0-beta.4 and 1.7.0; 1.6.x was not patched in the reviewed advisory; single-audience configuration is a workaround.
      selected: true
      rationale: Directly establishes grant-to-resource substitution at the authorization server and materially explains the token-minting branch.
    - source_id: SRC-oxdc-adv-2026-0003
      identifier: CVE-2026-73208 / OXDC-ADV-2026-0003
      relationship: historical_analogy
      exploitation_status: Vendor states no publicly available exploits are known; absent from CISA KEV 2026.09.01.
      impact: A token with no relevant permissions could authenticate when aud matched a configured scope name; vendor scored high confidentiality and integrity impact.
      remediation: Update to Pro 2.3.22.2, 3.0.7, or 3.1.6, or CE 2.4.5; ensure scope is issued and scope names do not equal audience values.
      selected: true
      rationale: Strongest direct example of audience-to-scope semantic substitution, clearly labeled non-MCP.
    - source_id: SRC-microsoft-storm-0558
      identifier: Storm-0558 Exchange Online intrusion
      relationship: historical_analogy
      exploitation_status: Observed production exploitation beginning 2023-05-15 and blocked by Microsoft in 2023.
      impact: Forged authentication tokens enabled targeted email access and exfiltration at about 25 organizations.
      remediation: Microsoft corrected token validation and renewal defects, blocked and replaced the acquired signing key, and hardened key systems.
      selected: true
      rationale: Highest-impact reviewed production token-validation incident, retained only to calibrate consequence; forgery and non-MCP scope prevent direct classification.
    - source_id: SRC-nvd-token-scope-corpus
      identifier: CVE-2026-30863 (Parse Server)
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Unknown in the reviewed NVD query result.
      impact: Tokens for another application under the same provider could authenticate to vulnerable Parse Server versions.
      remediation: NVD description identifies fixes in 8.6.10 and 9.5.0-alpha.11.
      selected: false
      rationale: Audience-validation analogue is non-MCP and redundant with the more direct Google MCP example.
    - source_id: SRC-nvd-token-scope-corpus
      identifier: CVE-2026-55689 (OpenFGA)
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Unknown in the reviewed NVD query result.
      impact: A token minted for an unrelated service by the same issuer could authenticate to OpenFGA.
      remediation: NVD description identifies version 1.18.0 as fixed.
      selected: false
      rationale: Relevant authorization-engine analogue, but non-MCP and lower explanatory value than the selected direct MCP vulnerability.
    - source_id: SRC-nvd-token-scope-corpus
      identifier: CVE-2026-66908 (Apache Camel)
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Unknown in the reviewed NVD query result.
      impact: Shared-key trust could allow tokens for another issuer or audience to reach embedded HTTP endpoints.
      remediation: NVD description recommends 4.22.0 or maintenance-line configuration with explicit issuer or audience.
      selected: false
      rationale: Non-MCP audience-validation analogue is redundant and has configuration/version complexity not needed for the bounded technique.
    - source_id: SRC-nvd-token-scope-corpus
      identifier: CVE-2026-40205 (OX Dovecot partial-scope validation)
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: NVD description states no publicly available exploit is known.
      impact: Remote validation could accept one of multiple required scopes.
      remediation: Use local validation or update to a non-vulnerable version per the NVD description.
      selected: false
      rationale: Partial-scope OR semantics is adjacent enforcement failure, not resource/audience/scope substitution.
    - source_id: SRC-nvd-token-scope-corpus
      identifier: CVE-2025-59934 (Formbricks)
      relationship: rejected
      exploitation_status: Unknown in the reviewed NVD query result.
      impact: Missing JWT signature and claim verification could permit account takeover.
      remediation: NVD description identifies version 4.0.1 as fixed.
      selected: false
      rationale: Signature-verification failure dominates; this is not a valid-token authorization-context substitution.
    - source_id: SRC-nvd-token-scope-corpus
      identifier: CVE-2016-5431 (PHP JOSE)
      relationship: rejected
      exploitation_status: Unknown in the reviewed NVD query result.
      impact: Algorithm substitution could bypass signature verification.
      remediation: NVD description identifies versions before 2.2.1 as affected.
      selected: false
      rationale: Cryptographic algorithm substitution is a lexical collision and outside the OAuth resource/scope contract.

