conflicts:
  - issue: Approval prompts can be enforced by the client, rate-limited, or hard-denied independently of model instructions.
    resolution: The contract requires a client or workflow that permits materially equivalent requests to recur; client enforcement is a prevention boundary, not evidence against the conditional technique.
  - issue: High-impact MCP CVEs involving consent might be mistaken for direct examples.
    resolution: CVE-2026-27124 is labeled adjacent and three redirect or XSS CVEs are excluded because none relies on repeated user decisions.
  - issue: An alert sequence can represent legitimate retries or independent user actions.
    resolution: The analytic groups on normalized equivalence, requires negative-before-positive decision order, excludes explicit user initiation, and states residual false positives.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1403-C001
  rationale: >-
    MCP and agent product sources directly establish approval and elicitation
    primitives; NIST, MITRE, Uber, and Microsoft establish the repeated-request
    fatigue mechanism and consequences for authentication. Applying that
    mechanism to the human agent-action authorization boundary remains an
    explicit inference because no direct MCP production incident or end-to-end
    adversarial demonstration was identified.

