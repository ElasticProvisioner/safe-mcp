breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 7
  selected_examples:
    - SRC-mcp-security-2025-11-25
    - SRC-nvd-cve-2026-27124
    - SRC-uber-security-update-2022
    - SRC-microsoft-dev0537-2022
  no_qualifying_examples_rationale: >-
    No candidate qualified as a direct MCP or agentic production incident or
    direct end-to-end demonstration. Four high-impact examples are retained with
    explicit enabling, adjacent, or historical labels because they establish a
    denied-scope retry condition, a real MCP consent-boundary vulnerability, and
    observed consequences of the repeated-approval mechanism outside agentic
    systems. The evidence gap prevents Observed or Demonstrated status.
  candidates:
    - source_id: SRC-mcp-security-2025-11-25
      identifier: MCP Security Best Practices - Scope Minimization
      relationship: enabling_vulnerability
      exploitation_status: unknown
      impact: Repeated denied-scope elevation loops can create recurring consent requests and audit noise.
      remediation: Cache recent failures, issue precise scope challenges, and log correlated elevation events.
      selected: true
      rationale: Highest-directness implementation condition for repetition, but not a disclosed product flaw or observed exploitation.
    - source_id: SRC-nvd-cve-2026-27124
      identifier: CVE-2026-27124 / GHSA-rww4-4w9c-7733
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: proof_of_concept
      impact: A consent-check failure could provide unauthorized access to resources linked to a victim account.
      remediation: Fixed in FastMCP 3.2.0 by correcting consent verification.
      selected: true
      rationale: High-impact MCP consent-boundary evidence with a reproduced path, but it bypasses rather than fatigues consent.
    - source_id: SRC-uber-security-update-2022
      identifier: Uber September 2022 security incident
      relationship: historical_analogy
      exploitation_status: observed
      impact: Accepted repeated two-factor request enabled access to internal systems, Slack messages, finance information, and remediated vulnerability reports.
      remediation: Accounts blocked or reset, tools disabled, keys rotated, reauthentication required, MFA strengthened, and monitoring increased.
      selected: true
      rationale: Primary incident report with the exact repeated-request and eventual-acceptance mechanism, outside MCP.
    - source_id: SRC-microsoft-dev0537-2022
      identifier: Microsoft DEV-0537 / LAPSUS$ campaign observations
      relationship: historical_analogy
      exploitation_status: observed
      impact: Repeated simple-approval prompts supported initial access in campaigns involving theft, destructive actions, and extortion.
      remediation: Stronger MFA, number matching or FIDO, risk-based policies, trusted endpoints, and monitoring.
      selected: true
      rationale: Primary threat-intelligence observations across organizations with named response teams, outside MCP.
    - source_id: SRC-nvd-cve-2026-32112
      identifier: CVE-2026-32112 / GHSA-pf93-j98v-25pv
      relationship: rejected
      exploitation_status: none_observed
      impact: Consent-form XSS could expose data or alter browser-origin state after social engineering.
      remediation: Fixed in ha-mcp 7.0.0; beta OAuth mode only.
      selected: false
      rationale: Consent UI is involved, but the root cause is output encoding and the path has no repeated request mechanism.
    - source_id: SRC-nvd-cve-2026-67333
      identifier: CVE-2026-67333
      relationship: rejected
      exploitation_status: none_observed
      impact: An unsafe redirect scheme could execute script in the authorization-server origin.
      remediation: Fixed in better-auth 1.6.13 and 1.7.0-beta.4.
      selected: false
      rationale: Redirect validation and XSS are outside the contract; no fatigue or repeated prompts are present.
    - source_id: SRC-nvd-cve-2026-79786
      identifier: CVE-2026-79786
      relationship: rejected
      exploitation_status: proof_of_concept
      impact: Unvalidated redirect registration could capture authorization codes and hijack MCP sessions after consent.
      remediation: No fixed-version claim retained because the reviewed NVD record did not supply one.
      selected: false
      rationale: User consent appears in the path, but the weakness is redirect registration and code capture without repeated prompting.

