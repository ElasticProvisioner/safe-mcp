breach_and_vulnerability_assessment:
  searched_on: '2026-09-01'
  candidate_count: 15
  selected_examples:
  - SRC-ghsa-oci-rate-limit
  - SRC-ghsa-weknora
  - SRC-jfrog-azure-typosquat
  no_qualifying_examples_rationale: 'Three examples were retained: one direct vulnerability
    with a controlled proof, one explicitly adjacent tool-resolution weakness, and
    one historical non-MCP analogy. No directly reviewed source established a qualifying
    production breach; this is a bounded corpus result, not a universal absence claim.'
  candidates:
  - source_id: SRC-ghsa-oci-rate-limit
    identifier: GHSA-2v5f-5r6w-p67r / CVE-2026-45781
    relationship: direct_vulnerability
    exploitation_status: controlled proof of concept; advisory expressly excludes
      a production attack
    impact: An authenticated publisher could store an unverified association from
      its namespace to an OCI image it did not control; image bytes were unchanged.
    remediation: Fixed in MCP Registry 1.7.9; fail closed on upstream validation errors.
    selected: true
    rationale: Highest-confidence direct weakness and complete controlled demonstration
      of the frozen package-to-server identity-binding boundary.
  - source_id: SRC-nvd-cve-2026-45781
    identifier: CVE-2026-45781
    relationship: direct_vulnerability
    exploitation_status: poc; automatable=no; technicalImpact=partial
    impact: Corroborates the fail-open association-integrity effect and affected range
      below 1.7.9.
    remediation: Upgrade to 1.7.9 or later.
    selected: false
    rationale: Corroborating record for the selected GHSA, not a separate example.
  - source_id: SRC-ghsa-weknora
    identifier: GHSA-67q9-58vj-32qx / CVE-2026-30856
    relationship: adjacent_incident_or_vulnerability
    exploitation_status: public proof of concept; no production incident established
    impact: A remote server tool could overwrite another internal tool identifier
      in WeKnora through 0.2.14.
    remediation: Patched in 0.3.0.
    selected: true
    rationale: Selected as explicitly adjacent tool-resolution collision evidence;
      it does not raise SAF-T1004's evidence status.
  - source_id: SRC-nvd-cve-2026-30856
    identifier: CVE-2026-30856
    relationship: adjacent_incident_or_vulnerability
    exploitation_status: proof-of-concept record; production exploitation not established
    impact: Corroborates the WeKnora tool-identifier collision and affected range.
    remediation: Upgrade to 0.3.0 or later.
    selected: false
    rationale: Corroborating record for the selected WeKnora GHSA, not a separate
      example.
  - source_id: SRC-jfrog-azure-typosquat
    identifier: 2022 Azure-themed npm package campaign
    relationship: historical_analogy
    exploitation_status: observed non-MCP package campaign; known downloads limited
    impact: More than 200 lookalike Azure-themed packages collected host or user data.
    remediation: Remove malicious packages and bind dependencies to approved publisher
      and package identities.
    selected: true
    rationale: Selected only as historical package-name analogy; it predates MCP and
      does not establish an MCP incident.
  - source_id: SRC-paloalto-mcp-overview
    identifier: Hypothetical third-party MCP server typosquatting discussion
    relationship: rejected
    exploitation_status: hypothetical
    impact: Describes potential impersonation risk without a demonstrated incident
      or reproducible result.
    remediation: Vetting and approved registries are recommended.
    selected: false
    rationale: Adds no stronger evidence than the primary sources and is omitted from
      publishable evidence.
  - source_id: SRC-ms-agt
    identifier: MCP control-plane 60-prompt benchmark
    relationship: adjacent_incident_or_vulnerability
    exploitation_status: controlled broad benchmark
    impact: Shows broad agent-tool security risk but does not isolate server identity
      collision outcomes.
    remediation: Control-plane scanning, policy, identity, and logging are proposed.
    selected: false
    rationale: Does not establish the frozen identity-resolution mechanism.
