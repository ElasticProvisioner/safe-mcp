sources_blocked: []
conflicts:
- issue: The maintainer rated CVE-2026-45781 Low while the technique is rated Medium.
  resolution: Retain the maintainer rating for the demonstrated Registry effect and
    label Medium as an SAF synthesis conditioned on a substituted endpoint reaching
    a client; the downstream exposure was not demonstrated by the advisory.
- issue: Name similarity can be legitimate and Unicode confusable matching is inclusive,
    version-sensitive, and font-dependent.
  resolution: Use confusable similarity only as a secondary review signal and require
    identity-tuple or verification discrepancies for the analytic.
