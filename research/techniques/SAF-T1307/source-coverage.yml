conflicts:
  - issue: >-
      High-severity disclosed vulnerabilities exist, but no qualifying direct
      production breach was identified and all reviewed CISA ADP exploitation
      fields are none.
    resolution: >-
      Label the technique Demonstrated from the controlled JFrog reproduction,
      not Observed; state the dated production-evidence gap explicitly.
  - issue: >-
      CVE-2025-32711 is agentic and critical, but the official record maps the
      root problem to injection and does not describe initiator/deputy binding.
    resolution: >-
      Retain it as an adjacent selected example that cannot raise the technique
      evidence status.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1307-C007
  rationale: >-
    JFrog's first-party technical report reproduces the complete core behavior:
    an untrusted MCP server supplies authorization metadata, the client-side
    proxy treats it as eligible input to its separately privileged URL-opening
    path, and execution occurs in the client system context. No directly
    reviewed source documents this defining behavior in a production incident,
    so Observed is not justified.

