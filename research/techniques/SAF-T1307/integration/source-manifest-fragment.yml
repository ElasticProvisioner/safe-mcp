    review_status: opened_reviewed
    reviewed_on: "2026-09-01"
    review_method: Direct HTTPS retrieval as complete Markdown and full local review
    locators:
      - Confused Deputy Problem
      - Vulnerable Conditions
      - Attack Description
      - Required Protections
      - Token Passthrough
      - OAuth Authorization URL Validation
