breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 4
  selected_examples:
    - SRC-anthropic-espionage-2025-11
    - SRC-cve-2025-53109
    - SRC-cve-2025-53110
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-anthropic-espionage-2025-11
      identifier: Anthropic GTG-1002 AI-orchestrated cyber espionage campaign
      relationship: direct_production_incident
      exploitation_status: Observed in a September 2025 production campaign with a handful of successful intrusions.
      impact: Authentication certificates were extracted from configurations and harvested credentials were tested across internal systems; affected entities were not named.
      remediation: Anthropic banned identified accounts, notified affected entities and authorities, and expanded detection and safeguards.
      selected: true
      rationale: Highest-directness production evidence because an agentic framework using MCP tools performed the defining credential-configuration extraction behavior.
    - source_id: SRC-cve-2025-53109
      identifier: CVE-2025-53109 / GHSA-q66q-fx2p-7w4m
      relationship: direct_vulnerability
      exploitation_status: CISA ADP SSVC recorded exploitation as none on 2025-07-02.
      impact: Symlink handling could expose unintended files outside the expected filesystem boundary; credential-file access is conditional, not documented as an observed consequence.
      remediation: Upgrade the Filesystem server to 0.6.4 or 2025.7.01; retain the advisory version-table inconsistency as a documented conflict.
      selected: true
      rationale: Directly affects the reference Filesystem server's file-read boundary and could expose credential-bearing files.
    - source_id: SRC-cve-2025-53110
      identifier: CVE-2025-53110 / GHSA-hc55-p739-j48w
      relationship: direct_vulnerability
      exploitation_status: CISA ADP SSVC recorded exploitation as none on 2025-07-02.
      impact: Prefix-matching validation could expose unintended files outside the expected filesystem boundary; credential-file access is conditional, not documented as an observed consequence.
      remediation: Upgrade the Filesystem server to 0.6.4 or 2025.7.01; retain the advisory version-table inconsistency as a documented conflict.
      selected: true
      rationale: Directly affects the reference Filesystem server's file-read boundary and could expose credential-bearing files.
    - source_id: SRC-cve-2025-49596
      identifier: CVE-2025-49596 / GHSA-7f8r-222p-6f5g
      relationship: enabling_vulnerability
      exploitation_status: CISA ADP SSVC recorded exploitation as none in the reviewed CVE record.
      impact: Unauthenticated Inspector proxy requests could launch MCP commands and achieve remote code execution before version 0.14.1.
      remediation: Upgrade MCP Inspector to 0.14.1 or later.
      selected: false
      rationale: RCE can enable later file access but is an initial-access or execution condition, not the defining credential-file read.

