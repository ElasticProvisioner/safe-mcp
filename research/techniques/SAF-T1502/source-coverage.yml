  rationale: >-
    The Anthropic Threat Intelligence report directly documents the defining
    agentic behavior in real intrusions using an MCP-orchestrated framework.
    Protocol, file-residency, and vulnerability sources corroborate the mechanism
    and conditions but do not independently raise the label.

