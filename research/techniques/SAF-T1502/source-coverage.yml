conflicts:
  - issue: The two Filesystem advisories' affected and patched version tables differ from the advisory prose and CVE affected ranges.
    resolution: Publish the conservative upgrade target 0.6.4 or 2025.7.01 named by both CVE descriptions and advisory prose, and disclose the metadata inconsistency.
  - issue: Anthropic observed model claims of credentials that were invalid or public information.
    resolution: Do not treat model output as sufficient detection evidence; require tool and operating-system event corroboration.
  - issue: MCP file URIs do not necessarily represent physical files, and implementations choose their own interaction model.
    resolution: Scope the technique and detection to deployments where filesystem access and physical file-read telemetry are established.

