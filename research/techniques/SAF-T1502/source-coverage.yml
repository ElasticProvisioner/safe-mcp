  rationale: >-
    Direct current protocol pages establish the MCP mechanism and controls; a
    primary incident report establishes production agentic credential extraction;
    two CVE records plus provenance-authorized maintainer advisories establish
    direct filesystem boundary bypasses; cloud authority pages establish file-
