conflicts:
  - issue: Current MCP removed protocol-level sessions, while CVE-2025-6515 relies on predictable SSE session identifiers.
    resolution: Retain the vulnerability only as a legacy implementation example and state that current sessionless protocol behavior does not share that mechanism.
  - issue: Microsoft describes rug-pull behavior as more than theoretical but does not provide a production incident record for the complete scenario.
    resolution: Use the source as defensive practice corroboration, not as observed-incident evidence.
  - issue: Legitimate multi-server orchestration can resemble the detection sequence.
    resolution: Require untrusted/compromised source state, changed fingerprint, different target, high sensitivity, absent approval, and shared causal trace; document residual false positives.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1704-C003
  rationale: >-
    The complete defining chain is directly demonstrated in Invariant's two-server
    experiment and independently corroborated by Trail of Bits and MCPTox. The
    absence of a qualifying production incident prevents Observed status; product
    vulnerabilities support variants but do not independently raise the label.

