breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 7
  selected_examples:
    - SRC-invariant-tpa-2025-04-01
    - SRC-jfrog-cve-2025-6514
    - SRC-jfrog-cve-6515-2025
  no_qualifying_examples_rationale: >-
    Three non-production examples qualify. No reviewed CISA, CERT, NVD, vendor,
    protocol-project, or original-research authority established the complete
    technique in a production compromise; that remains an explicit evidence gap.
  candidates:
    - source_id: SRC-invariant-tpa-2025-04-01
      identifier: Invariant Experiment 2 - Cross-Server Tool Shadowing
      relationship: direct_demonstration
      exploitation_status: Controlled end-to-end demonstration.
      impact: A malicious server influenced a trusted email-server action and disclosure to an attacker-controlled address.
      remediation: Pin and visibly review tool metadata and enforce cross-server dataflow policy.
      selected: true
      rationale: Defining end-to-end behavior with the clearest causal chain and immediate cross-trust outcome.
    - source_id: SRC-trailofbits-line-jumping-2025
      identifier: Jumping the Line client experiments
      relationship: direct_demonstration
      exploitation_status: Controlled multi-client testing.
      impact: Malicious metadata influenced model behavior before tool invocation and during use of other tools.
      remediation: Vet servers, scan/pin descriptions, disable unnecessary servers, and require approvals.
      selected: false
      rationale: Strong independent corroboration but less concrete cross-trust impact than the selected Invariant example.
    - source_id: SRC-jfrog-cve-2025-6514
      identifier: CVE-2025-6514
      relationship: direct_vulnerability
      exploitation_status: Proof of concept; reviewed NVD CISA-ADP record reported no known exploitation.
      impact: Critical operating-system command execution on a connected client through a malicious authorization endpoint.
      remediation: Upgrade mcp-remote to 0.1.16 or later and connect over authenticated HTTPS to trusted servers.
      selected: true
      rationale: Highest-impact reviewed implementation path from an untrusted server to host authority.
    - source_id: SRC-jfrog-cve-6515-2025
      identifier: CVE-2025-6515
      relationship: direct_vulnerability
      exploitation_status: Researcher demonstration; reviewed NVD CISA-ADP record reported no known exploitation.
      impact: A network attacker could inject malicious server responses into a connected client session.
      remediation: Use cryptographically random identifiers, enforce session separation, or move to the current sessionless protocol.
      selected: true
      rationale: Distinct response-channel path with a demonstrated client effect and explicit legacy limitation.
    - source_id: SRC-nvd-cve-58062
      identifier: CVE-2025-58062
      relationship: direct_vulnerability
      exploitation_status: Proof of concept reported by CISA-ADP; no production incident established.
      impact: Windows client command execution from an attacker-controlled authorization-server endpoint.
      remediation: Upgrade openmcp-client to 0.1.12 or later.
      selected: false
      rationale: Direct but lower-rated and mechanistically redundant with the broader, higher-impact CVE-2025-6514 example.
    - source_id: SRC-nvd-cve-2026-14541
      identifier: CVE-2026-14541
      relationship: rejected
      exploitation_status: CISA-ADP exploitation assessment reported none.
      impact: Unrelated Google access tokens could be accepted by an affected MCP toolbox server.
      remediation: Configure and validate audience/client identity; avoid affected configuration.
      selected: false
      rationale: The unauthorized client enters one server; a compromised server does not pivot through host authority to another trust domain.
    - source_id: SRC-jfrog-agent-supply-chain-2026
      identifier: postmark-mcp hidden BCC report
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Reported malicious package behavior; original linked report was not reviewable at its former page.
      impact: A server copied messages using its own legitimate downstream Postmark capability.
      remediation: Package vetting, version control, and server isolation.
      selected: false
      rationale: The behavior remains within the server's own downstream capability and does not establish a host-mediated pivot into another trust domain.

