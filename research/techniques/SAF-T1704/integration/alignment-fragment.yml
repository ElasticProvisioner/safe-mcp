    affects: [SAF-T1001, SAF-T1004, SAF-T1703, SAF-T1704]
    severity: high
    status: resolved
    change: Register host-mediated cross-trust action originating from an adversary-controlled MCP server or response channel as SAF-T1704.
    reason: The frozen contract distinguishes the server-controlled-origin specialization from metadata poisoning alone, server impersonation alone, and the broader class of induced cross-tool pivots.
    resolution: SAF-T1001 covers tool-metadata poisoning, SAF-T1004 covers server identity or channel substitution, SAF-T1703 covers the broader cross-tool transition, ten canonical mitigations cover schema integrity, isolation, authorization, validation, audit, and monitoring, ATT&CK T1210 remains analogous, and eight detector cases validate the boundary.
