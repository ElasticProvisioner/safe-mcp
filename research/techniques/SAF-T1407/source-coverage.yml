conflicts:
  - issue: RFC 9728 supports optional signed resource metadata, but MCP does not require a separately trusted signature that proves an upstream server behind the connected endpoint.
    resolution: Treat TLS and exact resource matching as controls for the configured identifier, retain out-of-band approved inventory in the analytic, and disclose that a deliberately approved malicious endpoint can evade it.
  - issue: TrustShiftProbe calls malicious-server content corruption distinct from transport interception.
    resolution: Keep response tampering as canonical SAF-T1404 neighbor; SAF-T1407 requires identity, authority, or protected-resource masquerade plus a proxy or relay-like association.
  - issue: No selected source documents production exploitation.
    resolution: Set evidence status to Demonstrated, not Observed, and state the bounded incident gap in the technique.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids: [SAF-T1407-C007, SAF-T1407-C008]
  rationale: >-
    RFC 9728 directly specifies the protected-resource impersonation and
    authorization-server proxy threat, MCP adopts that protected-resource role,
    and CVE-2026-54030 publicly demonstrates the end-to-end MCP fake endpoint,
    legitimate authorization association, token delivery, and reuse condition.
    CVE-2026-50143 independently demonstrates wrong-authority MCP connection and
    token delivery. No reviewed primary source establishes production use, so
    Observed is not justified.

