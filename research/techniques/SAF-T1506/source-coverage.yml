      completed_on: 2026-09-01
      material_changes: []
research_tracks:
  breach: {status: complete, result: LiteLLM and TeamPCP established current observed production evidence.}
  vulnerability: {status: complete, result: Four CVEs were assessed and enabling primitives were not misclassified as theft incidents.}
  demonstration: {status: complete, result: Original researcher demonstrations for the two selected MCP vulnerabilities were reviewed.}
  detection: {status: complete, result: Direct MCP security and OpenTelemetry authorities supported a tested behavioral analytic.}
  contrary: {status: complete, result: No authority established universal exposure or known exploitation of the selected MCP CVEs; those claims were omitted.}
  saturation: {status: complete, result: Two consecutive direct-authority refresh passes produced no material changes.}
breach_and_vulnerability_assessment:
  searched_on: 2026-09-01
  candidate_count: 8
  selected_examples: [SRC-aqua-trivy-2026, SRC-cve-2025-49596, SRC-cve-2025-6514, SRC-litellm-incident-2026]
  candidates:
    - {source_id: SRC-litellm-incident-2026, identifier: LiteLLM PyPI 1.82.7 and 1.82.8, relationship: direct_production_incident, exploitation_status: Observed malicious releases executed credential-harvesting code in a production package channel, impact: Environment secrets and cloud and Kubernetes workload credentials were targeted for exfiltration, remediation: Upgrade to a verified safe release and rotate exposed credentials, rationale: Highest-impact direct and current agentic-gateway evidence, selected: true}
    - {source_id: SRC-aqua-trivy-2026, identifier: Trivy supply-chain compromise March 2026, relationship: adjacent_incident_or_vulnerability, exploitation_status: Observed compromise of release automation and malicious distribution, impact: Automation and cloud or CI credentials were extracted or targeted, remediation: Upgrade, verify artifacts, and rotate exposed credentials, rationale: Current high-impact infrastructure-tool incident in the same documented campaign, selected: true}
    - {source_id: SRC-cve-2025-6514, identifier: CVE-2025-6514, relationship: enabling_vulnerability, exploitation_status: Controlled exploit demonstrated; CVE record reported no known exploitation, impact: Malicious authorization endpoint could obtain local command execution in affected mcp-remote versions, remediation: Upgrade to 0.1.16 or later, rationale: Direct MCP authorization-path enabling primitive with clear affected and fixed versions, selected: true}
    - {source_id: SRC-cve-2025-49596, identifier: CVE-2025-49596, relationship: enabling_vulnerability, exploitation_status: Controlled exploit demonstrated; CVE record reported no known exploitation, impact: Unauthenticated Inspector proxy could yield local remote code execution, remediation: Upgrade to 0.14.1 or later and restrict exposure, rationale: Direct MCP tool enabling primitive with original research and a clear fix, selected: true}
    - {source_id: SRC-cve-2025-1974, identifier: CVE-2025-1974, relationship: adjacent_incident_or_vulnerability, exploitation_status: Public proof of concept reported by CISA ADP, impact: ingress-nginx admission controller code execution and secret disclosure, remediation: Upgrade to 1.12.1 or 1.11.5 or later fixed release, rationale: High impact but not direct MCP or infrastructure-token theft evidence, selected: false}
    - {source_id: SRC-cve-2025-30066, identifier: CVE-2025-30066, relationship: adjacent_incident_or_vulnerability, exploitation_status: Listed by CISA as known exploited, impact: Malicious GitHub Action code exposed workflow secrets in logs, remediation: Apply CISA and vendor mitigations and rotate exposed secrets, rationale: Active adjacent case but less direct and less current than selected examples, selected: false}
    - {source_id: SRC-circleci-alert-2023, identifier: CircleCI January 2023 security incident, relationship: historical_analogy, exploitation_status: Observed customer environment-variable and token exfiltration after engineer compromise, impact: Customer tokens keys and environment secrets required rotation, remediation: Rotate secrets and review provider logs, rationale: Strong analogy but superseded by newer evidence, selected: false}
    - {source_id: SRC-doj-capital-one-2019, identifier: Capital One 2019 cloud breach, relationship: historical_analogy, exploitation_status: Observed cloud data theft through a misconfigured application firewall, impact: Large-scale cloud data exposure, remediation: Criminal and regulatory response plus control improvements, rationale: Official source lacked direct token mechanics and was excluded from claims, selected: false}
