      completed_on: 2026-09-01
      material_changes: [Defined bearer semantics, MCP authorization boundary, workload token locations, and audience and sender constraints.]
    - pass: known_breaches_and_vulnerabilities
      completed_on: 2026-09-01
      material_changes: [Added LiteLLM and TeamPCP observed evidence and eight ranked incident or vulnerability candidates.]
    - pass: demonstration_and_empirical_research
      completed_on: 2026-09-01
      material_changes: [Separated controlled MCP RCE demonstrations from unproven production token theft.]
    - pass: detection_and_defense
      completed_on: 2026-09-01
      material_changes: [Derived and tested the private-address MCP authorization HTTP analytic and documented limitations.]
