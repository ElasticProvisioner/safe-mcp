  - {source_id: SRC-aqua-trivy-product, reason: Product page did not add incident evidence beyond Aqua's incident report.}
  - {source_id: SRC-azure-imds, reason: Reviewed for provider coverage but not needed after better-scoped AWS, Google, and Kubernetes token authorities were selected.}
  - {source_id: SRC-circleci-alert-2023, reason: Credible historical adjacent incident superseded by newer direct and adjacent 2026 examples.}
  - {source_id: SRC-cisa-kev-infrastructure-token-2026-09-01, reason: Confirmed CVE-2025-30066 only; it did not change the selected current examples.}
  - {source_id: SRC-cve-2025-1974, reason: High-impact Kubernetes vulnerability but established code execution and secret disclosure rather than this technique's direct token-theft evidence.}
  - {source_id: SRC-cve-2025-30066, reason: Active adjacent supply-chain case but less direct than the selected 2026 campaign evidence.}
  - {source_id: SRC-doj-capital-one-2019, reason: Official breach page did not establish the token mechanics needed for this technique.}
  - {source_id: SRC-ghsa-inspector-7f8r, reason: Corroborating GitHub advisory was not required after the CVE and original researcher sources were selected.}
  - {source_id: SRC-git-50df0e1, reason: Patch was reviewed after authority-provided discovery but is implementation corroboration rather than core evidence.}
  - {source_id: SRC-git-607b226, reason: Patch was reviewed after authority-provided discovery but is implementation corroboration rather than core evidence.}
  - {source_id: SRC-google-ai-threats-2026, reason: Reviewed current AI threat context but found no direct support for the scoped technique.}
  - {source_id: SRC-jfsa-2025-6514, reason: Duplicated the selected JFrog research article and CVE record.}
  - {source_id: SRC-k8s-cve-2025-1974, reason: Corroborated CVE-2025-1974 but remained outside selected examples.}
  - {source_id: SRC-mcp-authorization-2025-11-25, reason: Superseded by the directly reviewed 2026-07-28 specification.}
  - {source_id: SRC-mcp-security-2025-11-25, reason: Superseded by the directly reviewed 2026-07-28 guidance.}
  - {source_id: SRC-mcp-spec-2026-07-28, reason: General architecture context was not necessary for a substantive published proposition.}
  - {source_id: SRC-occ-capital-one-2020, reason: Official enforcement context did not establish token mechanics.}
