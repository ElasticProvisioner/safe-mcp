conflicts:
  - issue: The two GitHub advisories list 0.6.3 in patched-version tables but their descriptions and NVD advise 0.6.4; NVD affected data says versions below 0.6.4 are affected.
    resolution: Publish the official upgrade recommendation and the inconsistency; do not state that 0.6.3 is unequivocally fixed.
  - issue: ATT&CK DET0370 provides tunable detection concepts but no MCP audit schema or published accuracy evaluation.
    resolution: Label the SAF rule experimental, test only deterministic logic over synthetic MCP events, and avoid effectiveness claims.
  - issue: The Anthropic report documents MCP-enabled agentic discovery but not the defining filesystem listing call.
    resolution: Classify the report as adjacent production evidence and keep the overall label Research-Derived.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1606-C006
    - SAF-T1606-C018
  rationale: >-
    Current protocol semantics, a first-party listing implementation, filesystem
    boundaries, and the recognized discovery objective jointly support the
    complete technique as an explicit inference. The incident corpus and the
    selected vulnerabilities do not directly observe or reproduce the defining
    adversary invocation, so they cannot raise the label to Demonstrated or
    Observed.

