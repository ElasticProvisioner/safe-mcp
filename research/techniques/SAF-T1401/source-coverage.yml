  rationale: >-
    Two public advisories reproduce the complete behavior: an attacker-controlled
    MCP object wins an aggregation or lookup decision ahead of a trusted competitor
    and redirects the object later served or invoked. No reviewed source establishes
    a production incident, so the label cannot be Observed.

