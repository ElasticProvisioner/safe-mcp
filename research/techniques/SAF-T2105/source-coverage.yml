conflicts:
  - issue: Simplified retrieval-poisoning evaluations may overstate success in practical RAG pipelines.
    resolution: Retain only bounded study-specific results and include Confundo's practical-pipeline correction.
  - issue: Production operators used models, but reports found failed jailbreaks, safety refusals, and little authentic-audience reach.
    resolution: Classify the technique as observed while explicitly limiting claims about novelty, reliability, and impact.

evidence_assessment:
  overall_status: observed
  core_claim_ids:
    - SAF-T2105-C001
    - SAF-T2105-C003
    - SAF-T2105-C004
    - SAF-T2105-C005
    - SAF-T2105-C010
  rationale: >-
    First-party production reports establish deliberate deceptive output use, and independent controlled studies establish the retrieval-to-attacker-directed-output mechanism; limitations prevent any claim of universal success or high reach.

