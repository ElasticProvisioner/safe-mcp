breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 6
  selected_examples:
    - SRC-openai-prc-io-2026
    - SRC-google-ai-misuse
    - SRC-usenix-poisonedrag-2025
    - SRC-usenix-confundo-2026
  no_qualifying_examples_rationale: >-
    Four directly relevant high-value production or demonstration examples qualified; restricted NVD, CISA, and CVE searches found no direct disclosed software vulnerability defining the output behavior.
  candidates:
    - source_id: SRC-openai-prc-io-2026
      identifier: PRC-linked influence operations targeting AI debates
      relationship: direct_production_incident
      exploitation_status: observed
      impact: Generated comments and images supported false compromise allegations, but the operation did not meaningfully break out.
      remediation: Accounts were detected and disrupted; durable prevention remains unresolved.
      selected: true
      rationale: Recent first-party production evidence with an explicitly false claim and bounded impact.
    - source_id: SRC-google-ai-misuse
      identifier: Adversarial misuse of generative AI
      relationship: direct_production_incident
      exploitation_status: observed
      impact: Government-linked operators used production AI for personas, messaging, localization, and content manipulation.
      remediation: Safety systems blocked some requests and Google used technical signals for disruption.
      selected: true
      rationale: Independent first-party production corroboration with useful defensive and contrary evidence.
    - source_id: SRC-usenix-poisonedrag-2025
      identifier: PoisonedRAG
      relationship: direct_demonstration
      exploitation_status: demonstrated
      impact: A controlled ReAct agent returned attacker-chosen answers at measured non-universal success rates.
      remediation: Tested filters had material false-positive tradeoffs; layered defenses remain necessary.
      selected: true
      rationale: Direct agent-focused end-to-end demonstration.
    - source_id: SRC-usenix-confundo-2026
      identifier: Confundo
      relationship: direct_demonstration
      exploitation_status: demonstrated
      impact: Practical RAG pipelines produced attacker-directed factual, opinion, and hallucination outputs.
      remediation: Six representative defenses were evaluated; no comprehensive defense was established.
      selected: true
      rationale: Current practical-pipeline evidence and explicit correction of earlier evaluation assumptions.
    - source_id: SRC-openai-io-2024
      identifier: Disrupting deceptive uses of AI by covert influence operations
      relationship: direct_production_incident
      exploitation_status: observed
      impact: Five operations generated content and artificial engagement without meaningful authentic reach.
      remediation: OpenAI disrupted the operations and described model and behavioral defenses.
      selected: false
      rationale: Cited as broad corroboration but not selected because the 2026 OpenAI case is more specific and current.
    - source_id: SRC-openai-storm-2035-2025
      identifier: Disrupting malicious uses of AI by STORM-2035
      relationship: direct_production_incident
      exploitation_status: observed
      impact: Generated comments supported a covert operation with low observed reach.
      remediation: OpenAI disrupted associated accounts.
      selected: false
      rationale: Rejected from publishable claims as redundant lower-impact evidence.

