conflicts:
  - issue: Invariant uses shadowing for cross-server descriptor interference, while the CSA-sponsored community taxonomy uses the term for identical-name collision and resolution order.
    resolution: The contract adopts the earlier Invariant definition because it captures the foreign-descriptor invariant; collision remains explicitly out of scope.
  - issue: Controlled studies and demonstrations establish feasibility, but authoritative incident corpora contain no direct production case.
    resolution: Overall evidence remains Demonstrated and the production evidence gap is stated throughout.

