  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1008-C004
    - SAF-T1008-C005
    - SAF-T1008-C006
  rationale: >-
    A public product demonstration and an independent controlled study directly
    establish the defining cross-tool descriptor mechanism. No reviewed evidence
    establishes a production incident, so Observed would overstate the record.

