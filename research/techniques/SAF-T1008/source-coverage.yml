breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 6
  selected_examples:
    - SRC-invariant-tpa-2025-04-01
    - SRC-jamshidi-2026-arxiv-2512-06556
    - SRC-jfrog-jfsa-2026-001653030
  no_qualifying_examples_rationale: >-
    No direct production incident qualified. The packet therefore selects the
    strongest direct demonstrations and one high-impact enabling vulnerability,
    while explicitly keeping adjacent experiments and taxonomy-only material
    from raising the evidence classification.
  candidates:
    - source_id: SRC-invariant-tpa-2025-04-01
      identifier: Invariant Cursor cross-server shadowing demonstration
      relationship: direct_demonstration
      exploitation_status: public_controlled_demonstration
      impact: A trusted email tool's recipient and behavior were altered by an unrelated malicious tool descriptor.
      remediation: Authors recommend clear tool UI, version pinning, and cross-server dataflow controls; no universal patch is asserted.
      selected: true
      rationale: This is the clearest public end-to-end match for the contract and establishes that the attacker tool need not be called.
    - source_id: SRC-jamshidi-2026-arxiv-2512-06556
      identifier: arXiv:2512.06556 descriptor-shadowing evaluation
      relationship: direct_demonstration
      exploitation_status: controlled_research_evaluation
      impact: Malicious descriptors changed interpretation or selection of benign tools across tested model and prompt conditions.
      remediation: The paper evaluates layered defenses but reports residual unsafe behavior and false positives.
      selected: true
      rationale: It independently formalizes and measures the defining mechanism, with explicit limitations.
    - source_id: SRC-jfrog-jfsa-2026-001653030
      identifier: CVE-2026-25905 / JFSA-2026-001653030
      relationship: enabling_vulnerability
      exploitation_status: proof_of_concept_no_known_exploitation
      impact: Unisolated code can take over the mcp-run-python server and mutate advertised tool state.
      remediation: The advisory says the project is archived and unlikely to be fixed; remove or isolate it.
      selected: true
      rationale: Highest-impact disclosed MCP registry-manipulation enabler found, but not direct cross-server descriptor shadowing.
    - source_id: SRC-croce-south-2025-arxiv-2507-19880
      identifier: Trivial Trojans cross-server banking proof of concept
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: public_controlled_demonstration
      impact: A malicious weather prompt orchestrated a banking read and an exfiltration call after user confirmations.
      remediation: Authors recommend capability boundaries, restricted interoperability, attestation, and careful approval.
      selected: false
      rationale: Demonstrates conditional impact and cross-server composition, but uses a prompt resource and attacker exfiltration tool rather than descriptor-only shadowing.
    - source_id: SRC-embrace-red-2025-05-02
      identifier: Hidden metadata cross-tool invocation demonstration
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: public_controlled_demonstration
      impact: Tool metadata caused an agent to invoke another tool before completing the benign request.
      remediation: Source advocates treating tool metadata as untrusted and improving visibility and controls.
      selected: false
      rationale: Corroborates metadata-driven cross-tool influence, but does not clearly establish cross-server trusted-tool override.
    - source_id: SRC-csa-shadowing-2026
      identifier: CSA MCP Security tool-shadowing taxonomy entry
      relationship: rejected
      exploitation_status: taxonomy_only
      impact: Describes identical-name registration and resolution-order risk.
      remediation: Recommends namespacing, trust controls, duplicate-name detection, and deterministic resolution.
      selected: false
      rationale: Useful to record conflicting terminology, but its mechanism is name collision rather than this contract's cross-server descriptor interference.

