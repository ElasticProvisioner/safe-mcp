    resolution: Publish the shared factual prerequisite of an authenticated user and do not rely on the disputed vector component or a single score.
  - issue: Several ZDI advisories describe zero-day status but do not document production exploitation.
    resolution: Classify them as disclosed vulnerabilities and state exploitation as not documented.

