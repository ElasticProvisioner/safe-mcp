sources_rejected:
  - {source_id: SRC-mcp-spec-2025-11-25, reason: Orientation source was broader than the cited capability-specific pages.}
  - {source_id: SRC-mcp-resources-2025-11-25, reason: Consulted for boundary coverage; the tools page was sufficient for publishable response-form claims.}
  - {source_id: SRC-mcp-transports-2025-11-25, reason: Transport framing is below the technique's response-semantic boundary.}
  - {source_id: SRC-rfc3552, reason: The suspected section did not address covert response channels.}
  - {source_id: SRC-attack-t1041, reason: It describes an exfiltration outcome rather than this response-carrier C2 mechanism.}
  - {source_id: SRC-willison-worst-that-can-happen, reason: Stronger empirical and end-to-end sources were selected.}
  - {source_id: SRC-rehberger-unicode-tags, reason: Unicode UTS 51 was preferred for normative tag behavior.}
  - {source_id: SRC-rehberger-trust-no-ai, reason: Original underlying demonstrations were used to avoid relying on a synthesis for example details.}
  - {source_id: SRC-cursor-changelog-1-0, reason: Feature context did not independently establish the vulnerability.}
  - {source_id: SRC-cursor-changelog-1-3, reason: Release context did not independently describe the exact fix.}
  - {source_id: SRC-cve-2025-32711, reason: The CVE record did not establish a concealed response carrier.}
  - {source_id: SRC-cve-34072, reason: Explicit outbound tool argument rather than concealed response content.}
  - {source_id: SRC-slack-unfurl-docs, reason: Supports an adjacent tool-output chain, not the defining response boundary.}
  - {source_id: SRC-slack-mcp-source, reason: Supports an adjacent tool-output chain, not the defining response boundary.}
  - {source_id: SRC-mcp-servers-archived-security, reason: Maintenance context only for an adjacent example.}
  - {source_id: SRC-embrace-red-2025-05-02, reason: Tool metadata poisoning occurs outside response semantics.}
  - {source_id: SRC-rehberger-agent-commander, reason: Agent C2 was established without a concealed response carrier.}
  - {source_id: SRC-unicode-tags-chart, reason: Restrictive chart and code-point data were unnecessary after UTS 51 review.}

sources_blocked:
  - source_id: SRC-cisa-kev-catalog-page-2026-09-01
    reason: Direct CISA authority endpoints returned access errors in this environment, so no KEV assertion is made.
  - source_id: SRC-nvd-cve-2025-54132
    reason: Direct NVD page exposed no substantive record text through the available reader; the maintainer advisory controls.

conflicts:
  - issue: Some response carriers trigger an automatic request while others require user activation.
    resolution: The technique includes both, but treats activation mode as a severity and detection condition rather than implying equivalence.
  - issue: Public demonstrations are sometimes described colloquially as attacks or vulnerabilities without production-victim evidence.
    resolution: The technique uses Demonstrated, labels each example precisely, and records no qualifying production breach.
  - issue: Static destination allowlists can reduce egress but may fail against dynamic resources, redirects, or non-URL carriers.
    resolution: Controls are defense in depth and the limitations remain explicit in the technique and detector.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids: [SAF-T1902-C019, SAF-T1902-C006]
  rationale: >-
    Multiple controlled end-to-end demonstrations establish concealed material in
    a response plus a receiver path, including persistent, automatically fetched,
    and user-activated variants. None of the selected evidence establishes a
    verified production breach, so Observed would overstate the record.

