saturation:
  reached: true
  consecutive_no_change_passes: 2
  passes:
    - pass: protocol_and_authority
      completed_on: "2026-09-02"
      queries:
        - "Direct NIST CSRC glossary URL for covert channel"
        - "Direct MCP 2025-11-25 specification, tools, resources, and transport URLs"
        - "Direct IETF Datatracker URLs for RFC 4648 and RFC 3552"
        - "Direct Unicode UTS 51 and Tags chart URLs"
      material_changes:
        - Defined the response-semantic trust boundary and the concealed-carrier requirement.
        - Added normative result forms, Unicode tag behavior, and encoding limitations.
    - pass: known_breaches_and_vulnerabilities
      completed_on: "2026-09-02"
      queries:
        - "Direct CVE Program API URL for CVE-2025-32711"
        - "Exact Cursor GHSA identified by the direct non-GitHub researcher advisory"
        - "Direct CISA KEV catalog and NVD CVE authority URLs"
        - "Direct vendor changelog URLs and direct original researcher disclosure URLs"
      material_changes:
        - Selected one direct vulnerability and three direct demonstrations, ranked by persistence, automatic retrieval, enterprise context, and evidence quality.
        - Recorded that no selected authority source establishes a production victim breach.
    - pass: demonstration_and_empirical_research
      completed_on: "2026-09-02"
      queries:
        - "Direct OpenAI research PDF URL on URL-based agent data exfiltration"
        - "Direct arXiv author manuscripts 2412.06090 and 2601.09625"
        - "Direct original-researcher URLs for SpAIware, WebPilot, Microsoft 365 Copilot, Cursor, Unicode tags, Slack MCP, and Agent Commander"
      material_changes:
        - Raised evidence status from research-derived to demonstrated after end-to-end response-carrier paths were independently established.
        - Separated automatic-fetch, user-activated, and persistent variants.
    - pass: detection_and_defense
      completed_on: "2026-09-02"
      queries:
        - "Direct MITRE ATT&CK T1132, T1001, T1041, and DET0108 URLs"
        - "Direct MCP security-best-practices URL"
        - "Direct OpenAI URL-exfiltration mitigation and limitation sections"
      material_changes:
        - Defined response-to-egress correlation and Unicode-tag analytics.
        - Added tested boundary conditions, false positives, and defense-in-depth controls.
    - pass: gap_and_challenge
      completed_on: "2026-09-02"
      queries:
        - "Rechecked direct authority sources for contrary conditions, click requirements, fixed versions, severity, and exploitation status"
        - "Compared direct Slack MCP, EchoLeak CVE, metadata poisoning, and agent C2 sources against the frozen contract boundary"
      material_changes:
        - Downgraded adjacent examples that lacked a concealed response carrier.
        - Preserved Demonstrated rather than Observed and documented the absence of qualifying production-breach evidence.
    - pass: saturation_follow_up_1
      completed_on: "2026-09-02"
      queries:
        - "Repeated direct MCP, CVE, Cursor advisory, OpenAI paper, Unicode, IETF, and MITRE authority endpoint review"
        - "Rechecked selected original-researcher disclosure timelines and remediation statements"
      material_changes: []
    - pass: saturation_follow_up_2
      completed_on: "2026-09-02"
      queries:
        - "Final direct-authority-only reconciliation of claims, examples, detector assumptions, rights, and framework proposals"
        - "Final direct CISA and NVD access retry results reviewed as blocked/non-substantive"
      material_changes: []
  rationale: >-
    Protocol, standards, original research, a maintainer advisory, vendor material,
    CVE authority data, detection guidance, and contrary evidence cover every
    publishable proposition. Two final direct-authority review passes added no
    material claim, example, control, or limitation. General web search,
    GitHub discovery, third-party aggregators, and pre-existing SAF target
    material were not used.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 9
  selected_examples:
    - SRC-rehberger-spaiware
    - SRC-cursor-cve-2025-54132
    - SRC-rehberger-m365-ascii
    - SRC-rehberger-webpilot
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-rehberger-spaiware
      identifier: SpAIware persistent response exfiltration demonstration
      relationship: direct_demonstration
      exploitation_status: controlled public demonstration; no production exploitation established
      impact: Repeated hidden response-image callbacks could carry conversation content and maintain attacker control state.
      remediation: Researcher reports fixed ChatGPT macOS app version 1.2024.247.
      selected: true
      rationale: Highest relevance because the source explicitly demonstrates persistence, repeated response callbacks, data transfer, and a C2 characterization.
    - source_id: SRC-cursor-cve-2025-54132
      identifier: CVE-2025-54132 / GHSA-43wj-mwcc-x93p
      relationship: direct_vulnerability
      exploitation_status: public proof of concept; maintainer advisory does not report production exploitation
      impact: Response-rendered remote Mermaid images could transmit accessible secrets or context; advisory severity is Moderate with CVSS 4.4.
      remediation: Cursor removed remote images in version 1.3.
      selected: true
      rationale: Highest authority and currency among candidates, with a maintainer advisory, exact affected and fixed versions, credits, and an end-to-end response carrier.
    - source_id: SRC-rehberger-m365-ascii
      identifier: Microsoft 365 Copilot ASCII-smuggling response-link demonstration
      relationship: direct_demonstration
      exploitation_status: controlled public demonstration; path reported fixed before publication
      impact: Invisible Unicode could conceal data-bearing link content in an enterprise assistant response, requiring user activation.
      remediation: Researcher reports Microsoft fixes completed by July 2024.
      selected: true
      rationale: Selected for enterprise context and a distinct invisible-response carrier, with click dependence explicitly limiting impact.
    - source_id: SRC-rehberger-webpilot
      identifier: ChatGPT WebPilot Markdown-image demonstration
      relationship: direct_demonstration
      exploitation_status: controlled public demonstration; no production exploitation established
      impact: Automatic response image retrieval could transmit encoded chat context to an attacker destination.
      remediation: Source discusses the vulnerability and disclosure context but does not supply a versioned patch record used here.
      selected: true
      rationale: Selected as the earliest reviewed end-to-end automatic response-fetch demonstration and a distinct nonpersistent variant.
    - source_id: SRC-cve-2025-32711
      identifier: CVE-2025-32711 / EchoLeak
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CVE record states no known exploitation in the reviewed CISA ADP data
      impact: Microsoft 365 Copilot information disclosure with CVSS 9.3 is recorded, but the CVE text does not establish the response-carrier mechanism.
      remediation: Referenced vendor material indicates a vendor-handled fix, but the available authority locator did not substantiate technique-specific details.
      selected: false
      rationale: High potential impact but insufficient direct evidence tying the vulnerability to a concealed response carrier under this contract.
    - source_id: SRC-cve-34072
      identifier: Archived Slack MCP server link-unfurl data leakage demonstration
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled public demonstration; archived sample server is unmaintained
      impact: A data-bearing URL passed through an outbound Slack tool could be unfurled and retrieved.
      remediation: Disable unfurling, constrain tools, and avoid the archived unmaintained sample.
      selected: false
      rationale: The carrier is an explicit outbound tool argument rather than a concealed response field, so it does not satisfy the defining boundary.
    - source_id: SRC-embrace-red-2025-05-02
      identifier: Hidden MCP tool-metadata instruction demonstrations
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled public demonstrations
      impact: Hidden metadata can influence model tool use and downstream behavior.
      remediation: Inspect and constrain tool metadata and trust sources.
      selected: false
      rationale: Discovery metadata poisoning is outside response semantics and belongs with response or tool injection, not this carrier technique.
    - source_id: SRC-rehberger-agent-commander
      identifier: Agent Commander agent-C2 research
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled public research demonstrations
      impact: Persistent instructions can coordinate agent actions and suppress visible responses.
      remediation: Research proposes detection and a kill-switch approach.
      selected: false
      rationale: The reviewed material establishes agent C2 but not that the C2 information is concealed in a response carrier.
    - source_id: SRC-willison-worst-that-can-happen
      identifier: Early response-link and image exfiltration analysis
      relationship: direct_demonstration
      exploitation_status: conceptual and controlled examples; no production exploitation established
      impact: Generated links or images can carry context to an attacker destination.
      remediation: Source discusses partial protections and the lack of a universal solution.
      selected: false
      rationale: Directly relevant but superseded for selection by later, more fully documented end-to-end demonstrations and the OpenAI empirical study.

