        support: direct
        exact_locators: ["Definition and examples, lines 23-42; version metadata, lines 15-22"]
    corroboration: ATT&CK assigns encoded C2 data to Command and Control, matching one carrier variant.
    limitations: [Some SAF-T1902 carriers are not conventional encodings.]
    conflicts: []
    inference: {is_inference: true, rationale: The mapping is analogous because SAF adds a response-specific boundary.}
    status: validated

  - id: SAF-T1902-C018
    statement: ATT&CK Data Obfuscation is an analogous mapping for hidden C2 traffic.
    class: framework_inference
    materiality: medium
    evidence_status: research-derived
    sources:
