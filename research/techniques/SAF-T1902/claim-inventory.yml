        support: direct
        exact_locators: ["Definition and sub-techniques, lines 24-41; version metadata, lines 15-23"]
    corroboration: ATT&CK describes concealed C2 within otherwise plausible traffic, which overlaps response carriers conceptually.
    limitations: [ATT&CK is not limited to MCP or response semantics.]
    conflicts: []
    inference: {is_inference: true, rationale: The mapping is conceptual rather than a one-to-one implementation match.}
