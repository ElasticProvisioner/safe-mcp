        support: direct
        exact_locators: ["Audit-trail and restricted-access considerations, lines 229-310 and 398-418"]
      - source_id: SRC-cursor-cve-2025-54132
        support: corroborating
        exact_locators: ["Potential secret exposure and remediation, lines 132-161"]
      - source_id: SRC-rehberger-spaiware
        support: context
        exact_locators: ["Persistent state and fixed version, lines 41-83"]
    corroboration: Source guidance supports logs and containment, while the vulnerability evidence establishes why exposed secrets and persistent state require review.
    limitations: [Exact credential and evidence procedures depend on the affected environment.]
    conflicts: []
    inference: {is_inference: true, rationale: Incident-response steps are bounded recommendations derived from the evidenced exposure paths.}
    status: validated

  - id: SAF-T1902-C017
