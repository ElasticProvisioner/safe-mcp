        support: direct
        exact_locators: ["Attack chain, lines 11-22; response mechanism, lines 53-75; fix and disclosure, lines 79-112"]
    corroboration: The original researcher provides the end-to-end steps and disclosure timeline.
    limitations: [A user click was required and the source reports the path was fixed.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated

  - id: SAF-T1902-C009
    statement: A WebPilot demonstration caused a response-rendered Markdown image to request an attacker destination.
    class: demonstrated_exploit
    materiality: high
    evidence_status: demonstrated
    sources:
      - source_id: SRC-rehberger-webpilot
        support: direct
        exact_locators: ["Response Markdown image and encoded chat-history demonstration, lines 12-39"]
    corroboration: The original researcher documents the input, rendered response carrier, and resulting request.
    limitations: [The product-specific demonstration predates MCP and does not establish a production breach.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated

  - id: SAF-T1902-C010
    statement: Exploitation requires attacker influence over response-relevant content plus a surviving receiver path.
    class: research_finding
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-mcp-tools-2025-11-25
        support: direct
        exact_locators: ["Tool result semantics, lines 173-203 and 273-439"]
      - source_id: SRC-openai-url
        support: direct
        exact_locators: ["Threat model, pages 1-2"]
      - source_id: SRC-mcp-security-2026-07-28
        support: corroborating
        exact_locators: ["Security scope, lines 100-124; local-server risks and mitigations, lines 361-418"]
    corroboration: Protocol structure establishes the content boundary and threat-model research establishes attacker influence plus retrieval as necessary stages.
    limitations: [The exact input and receiver path are implementation dependent.]
    conflicts: []
    inference: {is_inference: true, rationale: The prerequisite set generalizes across the documented demonstrations.}
    status: validated

  - id: SAF-T1902-C011
    statement: Confidentiality is the primary impact and persistent control state can also affect integrity.
    class: research_finding
    materiality: high
    evidence_status: demonstrated
    sources:
      - source_id: SRC-rehberger-spaiware
        support: direct
        exact_locators: ["Continuous exfiltration and persistence, lines 11-71"]
      - source_id: SRC-cursor-cve-2025-54132
        support: corroborating
        exact_locators: ["Impact and affected context, lines 132-161"]
    corroboration: Separate demonstrations show response-driven data loss and persistence-related behavior.
    limitations: [Available data, retained state, permissions, and egress policy bound impact.]
    conflicts: []
    inference: {is_inference: true, rationale: CIA ratings synthesize the bounded consequences in the selected examples.}
    status: validated

  - id: SAF-T1902-C012
    statement: Detection needs response content, session identity, renderer decisions, and outbound request telemetry.
    class: research_finding
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-mcp-tools-2025-11-25
        support: direct
        exact_locators: ["Client security and logging guidance, lines 546-557"]
      - source_id: SRC-mcp-security-2026-07-28
        support: corroborating
        exact_locators: ["Audit-trail and egress guidance, lines 229-310; scope logging, lines 615-630"]
    corroboration: MCP guidance supports result validation, usage logging, and network restriction; correlation fields follow from the demonstrated channel path.
    limitations: [The standards do not prescribe this exact event schema.]
    conflicts: []
    inference: {is_inference: true, rationale: Required fields are an analytic design derived from the documented attack sequence.}
    status: validated

  - id: SAF-T1902-C013
    statement: Correlating suspicious response carriers with near-time outbound requests improves analytic confidence.
    class: framework_inference
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-attack-det0108
        support: direct
        exact_locators: ["Detection strategy and analytic guidance, lines 17-53"]
      - source_id: SRC-openai-url
        support: corroborating
        exact_locators: ["Threat model and monitoring discussion, pages 1-2 and 7-8"]
    corroboration: ATT&CK recommends encoded-content and anomaly analytics while the OpenAI study supplies the response-to-request relationship.
    limitations: [The 120-second window and token thresholds are locally tested parameters, not authority-prescribed constants.]
    conflicts: []
    inference: {is_inference: true, rationale: The detector specializes general encoded-traffic guidance to response and egress events.}
    status: validated

  - id: SAF-T1902-C014
    statement: Carrier-only detection has false positives and cannot prove adversary intent.
    class: research_finding
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-unicode-tr51-17
        support: direct
        exact_locators: ["Valid emoji tag sequences, lines 295-308 and 1108-1133"]
      - source_id: SRC-rfc4648
        support: direct
        exact_locators: ["Base-encoding use and security considerations, lines 134-153 and 798-827"]
      - source_id: SRC-openai-url
        support: corroborating
        exact_locators: ["Policy limitations and remaining side channels, pages 7-8"]
    corroboration: Standards establish legitimate uses of both carrier families and research documents control blind spots.
    limitations: [Even correlated requests can be legitimate without additional provenance and baseline context.]
    conflicts: []
    inference: {is_inference: true, rationale: False-positive classes follow from legitimate uses of the same observable features.}
    status: validated

  - id: SAF-T1902-C015
    statement: Output validation, restricted rendering, destination controls, and least-privilege egress constrain the technique.
    class: research_finding
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-mcp-tools-2025-11-25
        support: direct
        exact_locators: ["Output schema and client/server security guidance, lines 373-439 and 546-557"]
      - source_id: SRC-mcp-security-2026-07-28
        support: direct
        exact_locators: ["Egress, redirect, network restriction, and sandbox guidance, lines 289-314 and 398-418"]
      - source_id: SRC-openai-url
        support: corroborating
        exact_locators: ["Dynamic URL policy and limitations, pages 3-8"]
      - source_id: SRC-unicode-tr51-17
        support: context
        exact_locators: ["Tag sequence validity rules, lines 295-308 and 1108-1133"]
      - source_id: SRC-rfc4648
        support: context
        exact_locators: ["Canonical decoding and rejection guidance, lines 222-247"]
    corroboration: Protocol guidance and a dedicated mitigation study independently support validation and egress constraints.
    limitations: [No single listed control covers every response carrier or side channel.]
    conflicts: []
    inference: {is_inference: true, rationale: Controls are combined into defense in depth for this technique.}
    status: validated

  - id: SAF-T1902-C016
