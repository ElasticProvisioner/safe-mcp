version: 1
technique_id: SAF-T1902
claims:
  - id: SAF-T1902-C001
    statement: An unintended response field can carry concealed communication across a policy boundary.
    class: research_finding
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-nist-covert-channel
        support: direct
        exact_locators: ["Glossary definition, lines 113-125"]
      - source_id: SRC-mcp-tools-2025-11-25
        support: corroborating
        exact_locators: ["Tool Result content forms, lines 273-439"]
    corroboration: NIST defines the general covert-channel property and MCP specifies the response carriers to which the definition is applied.
    limitations: [Neither source documents this exact SAF technique as a named MCP attack.]
    conflicts: []
    inference: {is_inference: true, rationale: The SAF boundary is a synthesis of the general definition and MCP response semantics.}
    status: validated

  - id: SAF-T1902-C002
    statement: MCP tool results support multiple rich and structured response content forms.
    class: protocol_normative
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-mcp-tools-2025-11-25
        support: direct
        exact_locators: ["Tool Result, lines 273-439"]
    corroboration: The normative MCP page enumerates text, image, audio, resource-link, embedded-resource, and structured result forms.
    limitations: [Content-form support does not by itself establish malicious use.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated

  - id: SAF-T1902-C003
    statement: A response-contained URL can transmit data when rendered or retrieved.
    class: demonstrated_exploit
    materiality: high
    evidence_status: demonstrated
    sources:
      - source_id: SRC-openai-url
        support: direct
        exact_locators: ["Abstract and threat model, pages 1-2; limitations, pages 7-8"]
      - source_id: SRC-rehberger-webpilot
        support: corroborating
        exact_locators: ["End-to-end Markdown image demonstration, lines 12-39"]
    corroboration: OpenAI's paper models the URL channel and an independent researcher shows a product-specific response-rendering path.
    limitations: [Automatic retrieval and permitted destinations vary by product.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated

  - id: SAF-T1902-C004
    statement: Unicode tag characters can be invisible in tag-unaware rendering.
    class: protocol_normative
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-unicode-tr51-17
        support: direct
        exact_locators: ["ED-14a, lines 295-308; Handling Tag Characters, lines 863-865; Annex C, lines 1103-1133"]
    corroboration: The Unicode standard defines the tag range, valid sequence form, and tag-unaware rendering behavior.
    limitations: [Some tag sequences are valid emoji and must not be treated as malicious solely by code point.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated

  - id: SAF-T1902-C005
    statement: Encoding and permissive decoding can hide data or create a covert subchannel.
    class: protocol_normative
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-rfc4648
        support: direct
        exact_locators: ["Section 3.3, lines 222-247; Section 12, lines 798-827"]
    corroboration: RFC 4648 explicitly analyzes covert use of non-alphabet characters and the lack of confidentiality in base encoding.
    limitations: [Base encodings are ubiquitous and are not suspicious without context.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated

  - id: SAF-T1902-C006
    statement: SpAIware demonstrated persistent response-driven data transfer and a control path.
    class: demonstrated_exploit
    materiality: high
    evidence_status: demonstrated
    sources:
      - source_id: SRC-rehberger-spaiware
        support: direct
        exact_locators: ["Summary and mechanism, lines 11-71; remediation timeline, lines 77-83"]
      - source_id: SRC-nassi-promptware-kill-chain
        support: corroborating
        exact_locators: ["Persistence and C2 discussion, lines 109-145"]
    corroboration: The original researcher describes the demonstration; independent academic analysis classifies persistent promptware C2 and discusses SpAIware.
    limitations: [The evidence describes controlled research rather than a production victim incident.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated

  - id: SAF-T1902-C007
    statement: Cursor response-rendered remote Mermaid images enabled data exfiltration and were removed in version 1.3.
    class: disclosed_vulnerability
    materiality: high
    evidence_status: demonstrated
    sources:
      - source_id: SRC-cursor-cve-2025-54132
        support: direct
        exact_locators: ["GHSA summary, affected package, impact, and remediation, lines 132-161; credits, lines 235-238"]
      - source_id: SRC-cursor-cve-research
        support: corroborating
        exact_locators: ["Mechanism and demonstration, lines 12-90; fix and identifier, lines 99-106"]
    corroboration: The maintainer advisory confirms affected and patched versions; the original research supplies the response-rendering demonstration and directly identifies the advisory.
    limitations: [The advisory rates severity Moderate and exploitation requires attacker influence over relevant content.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated

  - id: SAF-T1902-C008
    statement: A Microsoft 365 Copilot demonstration hid data-bearing response-link content with Unicode tags.
