    reason: Enabling server-takeover vulnerability, but its proof mutates the compromised server's own metadata and does not establish cross-server override.
  - source_id: SRC-nvd-cve-2025-58357
    reason: Adjacent script-injection vulnerability with a different client rendering mechanism.
  - source_id: SRC-clean-t1301-nvd-cve-2026-33252
    reason: Adjacent origin-validation vulnerability with a different browser-to-local-server boundary.
sources_blocked: []
conflicts:
  - issue: Some security taxonomies use tool shadowing for identical or similar tool-name registration.
    resolution: The contract distinguishes that identity-collision mechanism as synthetic neighbor SAF-T1205 and reserves SAF-T1301 for semantic influence across server provenance.
  - issue: The Microsoft production report is anonymized and may be read as broader prevalence evidence.
    resolution: The README states only that a pattern was observed and retains the source's disclosure limitations.
evidence_assessment:
  overall_status: observed
  core_claim_ids:
    - SAF-T1301-C002
    - SAF-T1301-C003
    - SAF-T1301-C005
  rationale: >-
    Microsoft Incident Response explicitly reports observation of the complete cross-server instruction-override pattern in 2026. A prior direct demonstration and controlled study corroborate the mechanism, while the anonymization limitation prevents any claim about prevalence or named victims.
