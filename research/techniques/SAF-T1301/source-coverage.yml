  rationale: >-
    Direct protocol, vendor incident-response, primary researcher, official advisory, government vulnerability, and controlled-research sources cover the protocol premise, defining behavior, observation, impact, detection, defense, and limitations. The final two domain-restricted passes returned known sources or material outside the contract, so further searching was unlikely to change the publishable technique.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 7
  selected_examples:
    - SRC-microsoft-tool-poisoning-2026-06-30
    - SRC-invariant-tpa-2025-04-01
    - SRC-jamshidi-2026-arxiv-2512-06556
  no_qualifying_examples_rationale: ""
  candidates:
    - source_id: SRC-microsoft-tool-poisoning-2026-06-30
      identifier: Microsoft enterprise-agent cross-server tool shadowing pattern
      relationship: direct_production_incident
      exploitation_status: Observed in 2026; affected organizations and detailed indicators withheld under coordinated disclosure.
      impact: Sensitive finance data collection and exfiltration through trusted business-data and messaging tools.
      remediation: Microsoft recommends server allowlisting, metadata inspection, DLP, approvals, least privilege, and correlated logging.
      selected: true
      rationale: Highest-impact qualifying production observation and exact match to the contract boundary, with explicit disclosure limitations retained.
    - source_id: SRC-invariant-tpa-2025-04-01
      identifier: Invariant Cursor trusted-email shadowing demonstration
      relationship: direct_demonstration
      exploitation_status: Public controlled demonstration published 2025-04-01.
      impact: A malicious descriptor redirected behavior of a separately trusted email tool.
      remediation: Visible and pinned descriptors plus cross-server data-flow guardrails are proposed; no product patch is asserted.
      selected: true
      rationale: Clearest public end-to-end demonstration of the defining cross-server semantic influence.
    - source_id: SRC-jamshidi-2026-arxiv-2512-06556
      identifier: Semantic Attacks on Tool-Augmented LLMs shadowing evaluation
      relationship: direct_demonstration
      exploitation_status: Controlled synthetic evaluation, revised 2026-05-21.
      impact: Unsafe tool invocations bypassed baseline defenses under evaluated shared-context scenarios.
      remediation: The study evaluates signing, semantic vetting, and runtime guardrails; production effectiveness remains unestablished.
      selected: true
      rationale: Highest-quality multi-model controlled evidence and independent corroboration of the defining mechanism.
    - source_id: SRC-jfrog-jfsa-2026-001653030
      identifier: CVE-2026-25905 / JFSA-2026-001653030
      relationship: enabling_vulnerability
      exploitation_status: Public proof of concept; affected project archived and no fix listed by the researcher advisory.
      impact: Python execution without isolation can take over an MCP server and mutate its own tool metadata.
      remediation: No upstream fix; JFrog recommends no mitigation in the archived project advisory.
      selected: false
      rationale: It may enable malicious metadata but demonstrates same-server takeover and renaming, not the defining cross-server descriptor override.
    - source_id: SRC-nvd-cve-2025-58357
      identifier: CVE-2025-58357
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Public proof of concept recorded by CISA SSVC in NVD; fixed in 5ire 0.14.0.
      impact: Compromised MCP content can trigger script execution in affected 5ire clients.
      remediation: Upgrade to 5ire 0.14.0 or later.
      selected: false
      rationale: This is a client content-injection/XSS path rather than semantic influence over another server's trusted tool.
    - source_id: SRC-clean-t1301-nvd-cve-2026-33252
      identifier: CVE-2026-33252
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: NVD records no known exploitation; fixed in Go MCP SDK 1.4.1.
      impact: A malicious website can trigger requests to a locally running MCP server because of missing origin validation.
      remediation: Upgrade to Go MCP SDK 1.4.1 or later and enforce origin validation.
      selected: false
      rationale: The vulnerability crosses a browser-to-local-server boundary and does not use descriptor semantics to control another server's tool.
    - source_id: SRC-clean-t1301-unit42-shadowing
      identifier: Unit 42 MCP Tool/Agent Shadowing taxonomy entry
      relationship: rejected
      exploitation_status: Taxonomy description, not an incident or vulnerability record.
      impact: Potential selection of a malicious tool registered with an identical or similar name.
      remediation: Not selected for this packet because it addresses a different mechanism.
      selected: false
      rationale: It uses shadowing terminology for same-name collision, which is explicitly out of scope here.
