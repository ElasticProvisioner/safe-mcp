  rationale: >-
    The directly reviewed corpus covers the current MCP authorization
    specification, foundational and current OAuth standards, official CVE/CNA
    records, CISA exploitation context, first-party fixes and tests, a recent
    first-party MCP-plugin advisory, ATT&CK alignment, contrary conditions,
    and detection limits. An initial follow-up found CVE-2026-67336, so the
    saturation clock was reset. The final two narrower official-catalog passes
    returned no new records and added no requirement, direct relationship,
    example, corroboration, conflict, remediation change, detection constraint,
    or neighboring distinction.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 8
  selected_examples:
    - SRC-cve-2026-67336
    - SRC-cve-2025-4143
    - SRC-cve-2025-4144
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-cve-2026-67336
      identifier: CVE-2026-67336 and GHSA-9h47-pqcx-hjr4
      relationship: direct_vulnerability
      exploitation_status: CISA ADP assessed exploitation none on 2026-08-03; no production incident was established.
      impact: Plain PKCE in the legacy Better Auth mcp plugin could permit authorization-code interception when an authorization URL leaked; the combined advisory also covered a separate unsigned-token defect.
      remediation: Upgrade to better-auth 1.6.11 or later, disable plain PKCE, and migrate from the deprecated plugin when feasible.
      selected: true
      rationale: Most recent and MCP-specific direct vulnerability, with a first-party advisory, explicit affected and fixed versions, interception prerequisite, and reporter credit.
    - source_id: SRC-cve-2025-4143
      identifier: CVE-2025-4143
      relationship: direct_vulnerability
      exploitation_status: CISA ADP assessed exploitation none; the CNA described bounded potential impact.
      impact: A malicious redirect could receive an authorization code and enable credential theft or impersonation when stated prior-authorization, automatic reauthorization, and user-navigation conditions held.
      remediation: Fixed by Cloudflare pull request 26; the affected range is before 0.0.5.
      selected: true
      rationale: Direct MCP OAuth redirect-boundary failure with first-party root-cause, impact, patch, and regression-test evidence.
    - source_id: SRC-cve-2025-4144
      identifier: CVE-2025-4144
      relationship: direct_vulnerability
      exploitation_status: CISA ADP assessed exploitation none; no incident was documented.
      impact: A verifier supplied for a flow without a challenge could bypass PKCE through downgrade and undermine transaction binding.
      remediation: Fixed by Cloudflare pull request 27; the affected range is before 0.0.5.
      selected: true
      rationale: Direct MCP OAuth PKCE enforcement failure with first-party patch and regression test, despite no observed exploitation.
    - source_id: SRC-rfc7636
      identifier: RFC 7636 observed-in-the-wild OAuth statement
      relationship: historical_analogy
      exploitation_status: Observed in OAuth deployments, but the RFC does not identify MCP or an MCP incident.
      impact: A malicious native app could intercept and redeem a public-client code under the RFC's listed prerequisites.
      remediation: Transaction-specific high-entropy PKCE using S256.
      selected: false
      rationale: Authoritative mechanism evidence, but not a named MCP event and therefore not selected as a current MCP breach or vulnerability example.
    - source_id: SRC-nvd-cleanroom-queries
      identifier: CVE-2020-7692
      relationship: historical_analogy
      exploitation_status: Unknown from the reviewed NVD discovery record.
      impact: Non-MCP Java OAuth client PKCE absence could allow local application code interception.
      remediation: Upgrade to the fixed library version recorded by the vendor authority before deployment.
      selected: false
      rationale: Non-MCP historical implementation evidence with lower directness than the selected MCP-specific records.
    - source_id: SRC-nvd-cleanroom-queries
      identifier: CVE-2023-48228 and CVE-2024-23647
      relationship: historical_analogy
      exploitation_status: No production exploitation established in the reviewed discovery records.
      impact: Non-MCP identity-provider implementations could omit or downgrade PKCE verification.
      remediation: Apply the affected projects' fixed releases.
      selected: false
      rationale: Non-MCP historical analogies superseded for selection by direct MCP-related vulnerabilities.
    - source_id: SRC-nvd-cleanroom-queries
      identifier: CVE-2026-47250
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: No production incident established in the reviewed NVD record.
      impact: An MCP Kubernetes tool could disclose an already issued bearer token to an attacker-controlled server.
      remediation: Upgrade mcp-server-kubernetes to 3.7.0 or later.
      selected: false
      rationale: Targets an already issued Kubernetes token through tool argument handling, not an OAuth authorization code or redirect boundary.
    - source_id: SRC-nvd-cleanroom-queries
      identifier: CVE-2026-46555
      relationship: rejected
      exploitation_status: No production incident established in the reviewed NVD record.
      impact: An unauthenticated local bridge could permit WhatsApp actions and file exfiltration.
      remediation: Upgrade the affected bridge and enforce authentication and host validation.
      selected: false
      rationale: No OAuth authorization-code mechanism is present.

