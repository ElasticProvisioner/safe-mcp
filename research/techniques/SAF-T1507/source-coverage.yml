      material_changes:
        - Classified CVE-2025-4143 and CVE-2025-4144 as direct MCP-related vulnerabilities, not incidents.
        - Found no qualifying directly documented production MCP breach.
    - pass: demonstration_and_empirical_research
      completed_on: "2026-09-01"
      queries:
        - Complete review of RFC 7636 attack model and protocol flow
        - Complete review of Cloudflare pull request 26 patch and redirect-mismatch regression test
        - Complete review of Cloudflare pull request 27 patch and PKCE-downgrade regression test
      material_changes:
        - Confirmed first-party control tests and fixes but found no public end-to-end MCP exploitation demonstration; retained Research-Derived status.
    - pass: detection_and_defense
      completed_on: "2026-09-01"
      queries:
        - RFC 6749 Sections 4.1.3, 10.5, and 10.6
        - RFC 7636 Sections 4.4.1, 4.6, and 7.2
        - RFC 9700 Sections 2.1.1, 4.1.3, 4.5.3.1, and 4.8.2
        - MCP Authorization Code Protection, Open Redirection, and Token Handling
      material_changes:
        - Derived an experimental correlation analytic for redirect mismatch, weak or missing PKCE, verifier failure, and repeated code exchange, with explicit first-redemption and logging blind spots.
    - pass: gap_and_challenge
      completed_on: "2026-09-01"
      queries:
        - RFC 8252 redirect-mechanism exceptions and loopback limitations
        - RFC 9700 authorization-code injection, PKCE downgrade, and countermeasure limitations
