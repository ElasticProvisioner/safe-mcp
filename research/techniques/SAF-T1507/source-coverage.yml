conflicts:
  - issue: RFC 7636 retained plain PKCE for constrained legacy compatibility, while RFC 9700 and the MCP specification require stronger S256-centered behavior.
    resolution: Applied the later BCP and current MCP requirements; plain PKCE is treated as an unsafe or nonconforming condition for this technique.
  - issue: NVD-derived CVSS values for CVE-2025-4144 differ materially from the Cloudflare CNA's CVSS v4 assessment.
    resolution: Omitted score-based severity claims and used the directly described mechanism, prerequisites, and bounded impact.
  - issue: RFC 7636 says the general OAuth interception attack was observed in the wild, but it does not identify an MCP event.
    resolution: Classified it as mechanism evidence and historical analogy only; it does not raise the MCP technique above Research-Derived.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1507-C001
  rationale: >-
    Directly reviewed standards establish the full OAuth interception mechanism,
    and three official vulnerability records establish relevant MCP-specific
    control failures. None of the reviewed sources documents the complete
    behavior in a production MCP incident or a public end-to-end MCP
    demonstration, so the MCP technique remains an explicit inference.

