  - Reconcile only synthetic identifiers and exact duplicate source IDs.
  - Merge source-manifest-fragment.yml into research/source-manifest.yml without dropping review or rights metadata.
  - Merge framework-fragment.yml and alignment-fragment.yml after replacing synthetic neighbor IDs.
  - Copy the technique, research packet, and canonical tests to their matching repository paths.
  - Run python3 scripts/validate-technique-research.py SAF-T1406 and the canonical test command again; strict review is the validator default.
  - >-
    If integration changes any substantive claim, example, evidence label,
    detection logic, or publishable wording, reject the merge and schedule a
    new evidence review instead of altering this frozen bundle in place.

