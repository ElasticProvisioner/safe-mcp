        - exact advisory GHSA-vf6j-c56p-cq58 obtained from SRC-cve-2026-25650
      material_changes:
        - The Meta Ads advisory's inert proof established the complete API-response token disclosure and set the technique evidence status to Demonstrated.
        - The n8n-MCP advisory established response reflection and deployment boundaries but not production theft of a live token.
    - pass: detection_and_defense
      completed_on: "2026-09-01"
      queries:
        - direct-open Elastic ESA-2026-24 from the CVE-2026-33461 first-party reference
        - direct-open MITRE ATT&CK T1528
      material_changes:
        - Defined an authorization-aware response-secret analytic without logging raw token material.
        - Added output redaction, authentication enforcement, upgrade, egress restriction, least privilege, rotation, and token-use investigation guidance.
    - pass: gap_and_challenge
      completed_on: "2026-09-01"
      queries:
        - exact CVE records CVE-2026-48039, CVE-2026-39974, CVE-2026-27826, CVE-2026-33461, and CVE-2026-25650
