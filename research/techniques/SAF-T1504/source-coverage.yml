  rationale: >-
    Current MCP protocol pages and the governing bearer-token RFC cover the
    defining response and credential semantics. Bounded NVD, CVE, CISA,
    first-party advisory, and exact derived GHSA review produced two direct
    qualifying examples and three documented boundary exclusions. The final
    six narrower NVD queries across two consecutive passes returned no new
    candidate, requirement, conflict, remediation change, production incident,
    or detection constraint. Client-rendered CISA site-search pages supplied no
    evidence and were not used for saturation; the complete KEV catalog and
    exact CVE/advisory records supplied the authoritative exploitation check.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 5
  selected_examples:
    - SRC-ghsa-meta-ads
    - SRC-ghsa-n8n-mcp
  no_qualifying_examples_rationale: >-
    Two vulnerability examples qualify, but no direct production breach was
    identified. The selected records are a controlled end-to-end demonstration
    and a disclosed response-reflection vulnerability; neither record states
    production exploitation, and neither selected CVE was present in the
    reviewed CISA KEV catalog.
  candidates:
    - source_id: SRC-ghsa-meta-ads
      identifier: CVE-2026-48039 / GHSA-9gw6-46qc-99vr
      relationship: direct_demonstration
      exploitation_status: Controlled inert proof of concept; production exploitation not reported in the reviewed sources.
      impact: An unauthenticated network caller could receive the operator Meta access token and potentially reuse its privileges outside MCP.
      remediation: Fixed in Meta Ads MCP 1.0.109; reject unauthenticated requests and prevent token-bearing URLs from entering errors.
      selected: true
      rationale: Highest-impact and most direct example because the reviewed advisory reproduces the complete response-body disclosure with a fake token.
    - source_id: SRC-ghsa-n8n-mcp
      identifier: CVE-2026-39974 / GHSA-4ggg-h7ph-26qr
      relationship: direct_vulnerability
      exploitation_status: Public advisory; production exploitation and live-token theft not reported in the reviewed sources.
      impact: An authenticated less-trusted tenant could receive reflected content from internal services or cloud metadata endpoints through JSON-RPC.
      remediation: Fixed in n8n-MCP 2.47.4; interim measures include egress filtering, disabling unneeded multi-tenant headers, and restricting AUTH_TOKEN distribution.
      selected: true
      rationale: Direct MCP response-reflection vulnerability with high confidentiality impact and explicit affected and unaffected deployment boundaries.
    - source_id: SRC-ghsa-mcp-atlassian-7r34
      identifier: CVE-2026-27826 / GHSA-7r34-79r5-rcc9
      relationship: enabling_vulnerability
      exploitation_status: Controlled SSRF proof; production exploitation not reported.
      impact: Potential cloud IAM credential access and attacker-controlled content in MCP tool results.
      remediation: Fixed in mcp-atlassian 0.17.0.
      selected: false
      rationale: The proof establishes SSRF to an attacker listener and tool-result injection, not a token-bearing response delivered to an unauthorized client.
    - source_id: SRC-elastic-esa-2026-24
      identifier: CVE-2026-33461 / ESA-2026-24
      relationship: historical_analogy
      exploitation_status: Unknown; the advisory supplies an audit-log indicator but makes no exploitation claim.
      impact: A low-privilege Kibana user could receive configuration objects containing private keys and authentication tokens.
      remediation: Fixed in Kibana 8.19.14, 9.2.8, and 9.3.3; Elastic advises role review and rotation of possibly exposed proxy credentials.
      selected: false
      rationale: Mechanistically useful response-authorization analogy, but Kibana is not MCP or agentic and cannot establish the technique status.
    - source_id: SRC-ghsa-mcp-salesforce
      identifier: CVE-2026-25650 / GHSA-vf6j-c56p-cq58
      relationship: rejected
      exploitation_status: Unknown; no production exploitation is stated.
      impact: The advisory reports disclosure of Salesforce OAuth bearer tokens used by the MCP server.
      remediation: Fixed in MCP-Salesforce 0.1.10; rotate affected Salesforce tokens.
      selected: false
      rationale: The advisory does not identify whether an API response, log, exception, attribute renderer, or another channel disclosed the token.

