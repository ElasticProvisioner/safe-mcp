      material_changes:
        - Bounded the response channel to MCP result content and error delivery, separate from authorization and downstream passthrough.
        - Established bearer-token possession semantics, output-sanitization duties, and the limits of token-format assumptions.
    - pass: known_breaches_and_vulnerabilities
      completed_on: "2026-09-01"
      queries:
