conflicts:
  - issue: The Meta Ads advisory narrative contains an older affected-range note while its package metadata and current CVE record identify versions before 1.0.109 as affected.
    resolution: Use the current CVE and advisory package metadata for the published range, disclose the wording conflict in the claim limitation, and avoid version-by-version assertions beyond the supported boundary.
  - issue: Multiple SSRF advisories describe potential access to cloud metadata without showing a token in a client response.
    resolution: Select only n8n-MCP where the response-body reflection is explicit; classify the Atlassian record as enabling and omit any claim that its proof returned a token.
  - issue: Secret classifiers can recognize only known or inferable token forms.
    resolution: Make the analytic dependent on an upstream classifier, state the opaque-token blind spot, and test authorization and redaction decisions rather than claiming exhaustive token recognition.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1504-C004
    - SAF-T1504-C006
  rationale: >-
    GHSA-9gw6-46qc-99vr publicly reproduces the complete behavior with a fake
    operator token returned to an unauthenticated caller in an MCP JSON-RPC
    response. That supports Demonstrated, not Observed: no reviewed authority
    documents the defining behavior in a production incident.

