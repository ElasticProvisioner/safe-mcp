        - CISA site search=MCP token response
        - CISA site search=AI agent token theft
      material_changes:
        - Identified five candidate records, selected two direct high-impact MCP examples, and classified three boundary failures for exclusion or analogy.
        - Found no directly documented production incident in the reviewed authoritative corpus.
    - pass: demonstration_and_empirical_research
      completed_on: "2026-09-01"
      queries:
        - exact advisory GHSA-9gw6-46qc-99vr obtained from SRC-cve-2026-48039
        - exact advisory GHSA-4ggg-h7ph-26qr obtained from SRC-cve-2026-39974
