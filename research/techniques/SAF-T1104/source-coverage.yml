conflicts:
  - issue: The Langflow GHSA displays affected versions below 1.6.9 while identifying 1.8.0 as the patched version; NVD states prior to 1.8.0.
    resolution: The technique states only that NVD records 1.8.0 as the fix and discloses the affected-range display conflict.
  - issue: Absence from CISA KEV could be misconstrued as proof of no exploitation.
    resolution: Exploitation is recorded as unknown or not identified; no claim equates KEV absence with impossibility.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1104-C005
  rationale: >-
    Invariant Labs directly reproduced the complete defining sequence in a
    controlled MCP environment: adversarial influence caused trusted WhatsApp
    tool actions beyond user intent. This supports Demonstrated, not Observed,
    because no directly reviewed primary source documented malicious production
    exploitation. Vulnerability and benchmark evidence corroborate mechanisms
    and impacts without raising the label.

