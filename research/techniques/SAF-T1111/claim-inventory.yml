      - source_id: SRC-ghsa-gemini-trust
        support: corroborating
        exact_locators: [Tool Allowlisting under --yolo]
      - source_id: SRC-anthropic-tir-2025-08
        support: context
        exact_locators: [pages 4-9, request patterns and provider enforcement]
      - source_id: SRC-anthropic-espionage-2025-11
        support: context
        exact_locators: [pages 6-13, request tempo, target breadth, and provider response]
    corroboration: Telemetry and flag semantics are independently documented; the conjunction is SAF-authored and tested synthetically.
    limitations: [The alert does not prove malicious intent and misses sessions without exposed markers or shell lineage.]
    conflicts: []
    inference:
      is_inference: true
      rationale: The source facts support each feature; combining them into an analytic is an explicit defensive inference.
    status: validated
