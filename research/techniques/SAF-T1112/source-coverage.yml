sources_rejected:
  - source_id: SRC-mcp-doc-index-2026
    reason: Authority-only discovery index; it does not itself support substantive mechanism claims.
  - source_id: SRC-mcp-overview-2026
    reason: Current overview consulted, but sampling and schema pages provide more exact locators.
  - source_id: SRC-mcp-sampling-2025-11
    reason: Superseded by 2026-07-28 and materially different in request transport.
  - source_id: SRC-mcp-schema-2025
    reason: Superseded schema; excluded from current field claims.
  - source_id: SRC-mcp-security-2025-11-25
    reason: Superseded page with no sampling-specific attack section identified.
  - source_id: SRC-opentelemetry-moved-2026
    reason: Official page is a moved notice and exposes no current field-level telemetry convention.
  - source_id: SRC-opentelemetry-genai-repo-2026
    reason: Authority-linked repository overview confirms scope but not stable field-level semantics for this detector.
sources_blocked:
  - source_id: SRC-apress-sampling-abuse-2026
    reason: Full chapter requires subscription or purchase; public preview is insufficient and purchase terms state personal use only.

conflicts:
  - issue: Sampling remains specified but is deprecated in 2026-07-28.
    resolution: Scope is limited to existing supporting implementations; migration is a primary preventive control.
  - issue: An Apress chapter title appears directly on point, but its body is gated.
    resolution: No substantive claim is accepted; the lead is ledgered and the evidence gap remains explicit.
  - issue: Park et al. demonstrate malicious remote MCP server attacks across three platforms.
    resolution: Full-text review shows description and response channels rather than sampling/createMessage; classify as adjacent only.
  - issue: The detector uses numerical burst thresholds without an accuracy study.
    resolution: Mark the rule experimental, test deterministic boundary behavior, and require environment-specific tuning.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1112-C008
    - SAF-T1112-C009
    - SAF-T1112-C010
  rationale: >-
    Current protocol authority directly supports server-initiated sampling,
    client model authority, relevant fields, approval guidance, rate limiting,
    and response return. The adversarial end-to-end use is an explicit
    inference. Neither adjacent demonstrations nor an inaccessible chapter can
    raise the status to Demonstrated, and no direct production incident was
    found to support Observed.

