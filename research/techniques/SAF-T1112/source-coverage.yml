saturation:
  reached: true
  consecutive_no_change_passes: 2
  passes:
    - pass: protocol_and_authority
      completed_on: "2026-09-02"
      queries:
        - "OPEN https://modelcontextprotocol.io/llms.txt"
        - "OPEN https://modelcontextprotocol.io/specification/2026-07-28/client/sampling"
        - "OPEN https://modelcontextprotocol.io/specification/2026-07-28/schema"
        - "OPEN https://modelcontextprotocol.io/specification/2026-07-28/deprecated"
        - "OPEN https://modelcontextprotocol.io/specification/2026-07-28"
      material_changes:
        - >-
          Established current 2026-07-28 input_required sampling flow, exact
          request fields, security controls, and deprecation state.
    - pass: known_breaches_and_vulnerabilities
      completed_on: "2026-09-02"
      queries:
        - "NVD API keywordSearch=Model Context Protocol"
        - "NVD API keywordSearch=Model Context Protocol sampling"
        - "NVD API keywordSearch=sampling/createMessage"
        - "NVD API keywordSearch=server initiated LLM"
        - "CISA KEV 2026.09.01 filtered for Model Context Protocol, sampling, createMessage"
      material_changes:
        - >-
          Found no direct sampling CVE, incident, or KEV entry; classified
          CVE-2026-5323 and the broad MCP CVE corpus as other mechanisms.
    - pass: demonstration_and_empirical_research
      completed_on: "2026-09-02"
      queries:
        - "arXiv API all:\"Model Context Protocol\" AND all:sampling"
        - "arXiv API all:\"Sampling Abuse\""
        - "Crossref query.bibliographic=\"Model Context Protocol\" sampling"
        - "Crossref query.title=\"Sampling Abuse and the Hijacked Assistant\""
        - "OPEN https://doi.org/10.1007/979-8-8688-2968-0_6"
        - "OPEN https://doi.org/10.3390/electronics15102214"
      material_changes:
        - >-
          Identified a directly titled Apress chapter but found its technical
          body gated; reviewed the complete Park et al. paper and classified its
          tool-description and tool-response experiments as adjacent.
    - pass: detection_and_defense
      completed_on: "2026-09-02"
      queries:
        - "OPEN https://modelcontextprotocol.io/docs/2026-07-28/tools/inspector/web"
        - "OPEN current MCP sampling Security Considerations, Sampling Parameters, and Context Inclusion"
        - "OPEN https://opentelemetry.io/docs/specs/semconv/gen-ai/mcp/"
        - "OPEN exact authority-linked https://github.com/open-telemetry/semantic-conventions-genai"
      material_changes:
        - >-
          Grounded method and parameter observables in the protocol, identified
          Inspector transcript visibility, rejected a moved OpenTelemetry page
          as a stable field-level source, and designed an explicitly
          experimental threshold analytic.
    - pass: gap_and_challenge
      completed_on: "2026-09-02"
      queries:
        - "OPEN current MCP Deprecated Features registry"
        - "OPEN https://attack.mitre.org/techniques/T1204/"
        - "OPEN https://attack.mitre.org/resources/legal-and-branding/terms-of-use/"
        - "FULL-TEXT FIND sampling/createMessage in Park et al. 2026 PDF"
        - "REVIEW Apress access and personal-use restrictions"
      material_changes:
        - >-
          Narrowed future exposure because sampling is deprecated, made the
          ATT&CK mapping conditional and analogous, and preserved blocked-source
          and detector-accuracy gaps.
    - pass: candidate_refresh_before_saturation
      completed_on: "2026-09-02"
      queries:
        - "Crossref query.bibliographic=\"MCP sampling attack\""
        - "arXiv API all:\"sampling/createMessage\""
        - "NVD API keywordSearch=hijacked assistant"
      material_changes:
        - >-
          Added and fully reviewed the Park et al. MDPI paper after Crossref
