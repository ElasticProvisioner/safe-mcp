    - pass: saturation_follow_up_1
      completed_on: "2026-09-02"
      queries:
        - "REOPEN https://modelcontextprotocol.io/llms.txt and current sampling/deprecation pages"
        - "arXiv API all:\"Sampling Request Abuse\""
        - "Crossref query.title=\"Sampling Request Abuse\""
        - "CISA KEV current feed deterministic refilter"
      material_changes: []
    - pass: saturation_follow_up_2
      completed_on: "2026-09-02"
      queries:
        - "NVD API keywordSearch=MCP sampling abuse"
        - "arXiv API all:\"server-initiated LLM\" AND all:abuse"
        - "Crossref query.bibliographic=\"server initiated LLM request abuse\""
        - "RECHECK current schema sampling/createMessage and InputRequiredResult definitions"
      material_changes: []
  rationale: >-
    Current MCP specification and schema cover every protocol proposition; MCP
    project documentation covers observable transcripts; government catalogs
    cover disclosed vulnerabilities and known exploitation; academic-publisher
    and scholarly-catalog passes cover demonstrations and contrary/adjacent
    work. The final two narrower authority-only passes added no controlling
    requirement, direct example, corroboration, exception, remediation update,
    detection constraint, or neighbor distinction. The gated Apress chapter is
    preserved as an explicit unresolved evidence-access gap, not treated as
    proof or ignored in the saturation rationale.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 6
  selected_examples: []
  no_qualifying_examples_rationale: >-
    No candidate met the contract as a directly reviewed production incident,
    direct vulnerability, or complete end-to-end abuse demonstration. The NVD
    sampling and createMessage queries returned zero results; the broader MCP
    corpus and CVE-2026-5323 concern other mechanisms; CISA KEV contained no
    relevant record; Park et al. tested adjacent tool-description and
    tool-response attacks; and the directly titled Apress chapter was gated.
    Selecting any of them would misclassify the evidence, so zero examples are
    selected and the direct-example gap is explicit.
  candidates:
    - source_id: SRC-nvd-fsp-catalog-queries-2026-09-01
      identifier: NVD Model Context Protocol keyword corpus (77 CVEs)
      relationship: rejected
      exploitation_status: mixed and not probative for sampling
      impact: The records describe multiple MCP weaknesses, but none of their English descriptions identifies sampling/createMessage.
      remediation: Product-specific and outside this technique contract.
      selected: false
      rationale: Shared MCP vocabulary is insufficient; the defining sampling boundary is absent.
    - source_id: SRC-nvd-sampling-query-2026
      identifier: NVD Model Context Protocol sampling and sampling/createMessage queries
      relationship: rejected
      exploitation_status: no matching record found in queried corpus
      impact: No bounded impact can be attributed because the direct queries returned zero results.
      remediation: No sampling-specific advisory or fixed version was identified.
      selected: false
      rationale: Supports the dated evidence gap, not a breach or vulnerability example.
    - source_id: SRC-cisa-kev-2026-09-01
      identifier: CISA KEV catalog version 2026.09.01
      relationship: rejected
      exploitation_status: no relevant known-exploited entry found
      impact: No sampling/createMessage impact identified in the 1,687-entry catalog.
      remediation: No sampling-specific KEV due date or required action exists in the reviewed catalog.
      selected: false
      rationale: A GIGABYTE memcpy lexical match was noise; no MCP sampling record qualified.
    - source_id: SRC-apress-sampling-abuse-2026
      identifier: DOI 10.1007/979-8-8688-2968-0_6
      relationship: rejected
      exploitation_status: unknown; chapter body inaccessible
      impact: The public landing page does not establish technique mechanics or consequences.
      remediation: Not reviewable from the public preview.
      selected: false
      rationale: Directly relevant title but insufficient directly reviewed content; source-or-omit requires exclusion.
    - source_id: SRC-mdpi-remote-mcp-2026
      identifier: DOI 10.3390/electronics15102214
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled research only
      impact: Five malicious-remote-server scenarios were tested across three host platforms using description or response channels.
      remediation: The authors recommend layered filtering, response auditing, and user-visible output transparency.
      selected: false
      rationale: Full-text review found no sampling/createMessage mechanism; another content-manipulation technique governs it.
    - source_id: SRC-nvd-sampling-query-2026
      identifier: CVE-2026-5323
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: public exploit reported by NVD; no sampling path
      impact: Local a11y-mcp SSRF was described, with an LLM acting on the user's behalf as possible caller context.
      remediation: NVD reports upgrade to 1.0.6 and patch e3e11c9e8482bd06b82fd9fced67be4856f0dffc.
      selected: false
      rationale: SSRF in a server tool is outside the client-mediated sampling generation boundary.

