    accessed_on: "2026-09-02"
    reviewed_on: "2026-09-02"
    review_status: opened_reviewed
    review_method: Official API result set acquired directly; all 77 English CVE descriptions reviewed and searched for sampling and createMessage.
    locators:
      - totalResults=77
      - vulnerabilities[].cve.id and English descriptions
      - zero descriptions containing sampling
    review_notes: >-
      The result set contained MCP vulnerabilities with other mechanisms. It
      did not identify a sampling/createMessage vulnerability. This supports
      only a bounded corpus-and-date absence statement.
    archive:
      status: remote_reviewed_not_archived
      reason: Raw API response retained outside bundle in the isolated source corpus; canonical handoff excludes acquired source corpora.
      review_evidence:
        method: Direct official API acquisition and complete result-set filtering.
        external_sha256: 82570c57314ab3e2d5438ea4b1d1975e982fc252ee1d6f161367d653e3dada59

