  - id: SRC-mdpi-remote-mcp-2026
    title: "Beyond Tool Poisoning: Attack Surfaces of Malicious Remote MCP Servers Across LLM Platforms"
    publisher: MDPI, Electronics
    authors:
      - Jinwoo Park
      - Geonhee Kim
      - Hyeokjae Lee
      - Jeman Park
    contributors:
      - "Academic editors: Jiawei Zhang and Teng Li"
    version_or_date: "2026-05-21"
    source_class: research
    official_url: https://doi.org/10.3390/electronics15102214
    accessed_on: "2026-09-02"
    reviewed_on: "2026-09-02"
    review_status: opened_reviewed
    review_method: Full 23-page open-access publisher PDF acquired from MDPI static host and reviewed with page-preserving text extraction.
    locators:
      - Abstract, page 1
      - Introduction and contributions, pages 1-3
      - Threat model and methodology, pages 7-10
      - Scenarios and results, pages 10-17
      - Discussion and limitations, pages 17-20
    review_notes: >-
      Verified five malicious-remote-server scenarios and three-platform
      evaluation. Search of the full text found no sampling/createMessage,
      server-initiated sampling, or recursive sampling mechanism; the paper is
      adjacent evidence only. Authors and named academic editors are credited.
    archive:
      status: remote_reviewed_not_archived
      reason: Open-access PDF and extraction are retained in isolated source corpus but omitted from canonical bundle.
      review_evidence:
        method: Complete PDF and extracted-text review.
        pdf_sha256: e2488b9eee822be68fbfc1a894f2159c7706520c54bf671551bca4888eef92f4
        text_sha256: 9f4314f888541cc58874e30fd0872bed76236b9c70a2127eeee7d89c58a6f915

