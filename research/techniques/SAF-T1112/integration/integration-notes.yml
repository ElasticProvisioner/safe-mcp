source_id_integration_action: >-
  For each enumerated source, compare canonical URL and reviewed version against
  the destination source registry. Preserve the frozen ID when unused; reuse an
  identical destination ID when canonical identity matches; on collision,
  mechanically remap every fragment reference without changing claims or prose.

