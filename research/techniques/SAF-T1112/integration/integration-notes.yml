  - sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    path: research/techniques/SAF-T1112/traceability-ledger.yml
    purpose: Nonzero isolated strict-validator placeholder only; supports no external proposition.
    integration_action: Replace with an honest destination history SHA after integration, then rerun validation without changing publishable substance.

path_joins:
  - fragment: source-manifest-fragment.yml
    destination: research/source-manifest.yml
    action: Merge source records by reconciled source ID.
  - fragment: framework-fragment.yml
    destination: research/framework-model.yml
    action: Merge the SAF-T1112 technique record after resolving synthetic neighbor and mitigation joins.
  - fragment: alignment-fragment.yml
    destination: research/alignment-ledger.yml
    action: Merge issue records by unique issue ID.
  - fragment: techniques/SAF-T1112
    destination: techniques/SAF-T1112
    action: Copy the immutable technique directory byte-for-byte.
  - fragment: research/techniques/SAF-T1112
    destination: research/techniques/SAF-T1112
    action: Copy the immutable research directory byte-for-byte except the required mechanical history-SHA reconciliation.

material_change_rule: >-
  Any change to scope, claim text, evidence status, source selection, traces,
  detection semantics, thresholds, rights conclusions, or publishable prose is
  non-mechanical and invalidates this clean-room handoff; stop and re-author or
  issue a new freeze instead of silently adapting the bundle.

