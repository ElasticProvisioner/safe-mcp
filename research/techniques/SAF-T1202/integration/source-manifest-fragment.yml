    review_status: opened_reviewed
    locators: [Affected versions, Summary, Details, Patches, Workarounds, Impact, Credit]
    review_notes: Verified confidential-client authentication omission in legacy MCP/OIDC refresh paths, affected versions before 1.6.11, fixed version, bounded impact, and reporter credit.
