        - "CVE-2026-9571 fixed versions exploitation status site:nvd.nist.gov"
        - "OAuth refresh token rotation false positive legitimate retry site:rfc-editor.org"
        - "token replay detection limitations site:learn.microsoft.com"
      material_changes:
        - Added the standards-backed blind spot where an attacker controls the latest rotated token and prevents legitimate reuse.
