conflicts:
  - issue: The NVD record for CVE-2026-9571 displays different NIST and CNA CVSS 3.1 scores.
    resolution: The technique omits severity scoring and uses only the shared vulnerability description and fixed versions.
  - issue: Production incident sources establish stolen OAuth-token use but do not identify refresh-token exchange.
    resolution: Those incidents are explicitly classified as adjacent and do not support the defining renewal claim.

