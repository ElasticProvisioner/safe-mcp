  rationale: >-
    Direct protocol authorities cover the defining mechanism and defenses; first-party
    incident reports cover observed token abuse; a vendor advisory and NVD record cover
    disclosed vulnerable conditions; peer-reviewed research covers demonstration; and
    ATT&CK plus identity-provider guidance cover detection. Two later direct-authority-only
    passes produced no material change after the rotation blind spot was incorporated.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 5
  selected_examples:
    - SRC-ghsa-pw9m-5jxm-xr6h
    - SRC-nvd-cve-2026-9571
    - SRC-usenix-s3kvetter-2018
    - SRC-gtig-drift-2025
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-ghsa-pw9m-5jxm-xr6h
      identifier: GHSA-pw9m-5jxm-xr6h / CVE-2026-53512
      relationship: direct_vulnerability
      exploitation_status: unknown; the reviewed advisory does not report production exploitation
      impact: A valid refresh token and client identifier could mint access and rotated refresh tokens in affected MCP and legacy OIDC plugins.
      remediation: Upgrade Better Auth to 1.6.11 or later and revoke exposed token families.
      selected: true
      rationale: This is the strongest MCP-specific disclosed instance of the defining renewal mechanism.
    - source_id: SRC-nvd-cve-2026-9571
      identifier: CVE-2026-9571
      relationship: direct_vulnerability
      exploitation_status: none recorded in the reviewed CISA SSVC entry
      impact: A deactivated account retained a usable refresh token capable of minting fresh access tokens.
      remediation: Use Mattermost 10.11.20, 11.6.5, 11.7.3, 11.8.0, or a later fixed release.
      selected: true
      rationale: It directly demonstrates persistence caused by incomplete identity-lifecycle revocation.
    - source_id: SRC-usenix-s3kvetter-2018
      identifier: Refresh-token injection demonstration
      relationship: direct_demonstration
      exploitation_status: demonstrated in a controlled research setting
      impact: A substituted refresh token caused automatic access-token renewal under the attacker's account after expiry.
      remediation: Bind refresh tokens to the intended client and account context and protect the renewal path.
      selected: true
      rationale: It is the strongest peer-reviewed controlled demonstration of renewal-based persistence.
    - source_id: SRC-gtig-drift-2025
      identifier: UNC6395 Salesloft Drift compromise
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed OAuth-token abuse; refresh-token exchange not established
      impact: Compromised integration tokens enabled data access and exfiltration from Salesforce and Google Workspace.
      remediation: Salesloft and responders revoked active access and refresh tokens and disconnected the Drift integration.
      selected: true
      rationale: It is the highest-impact recent production incident, retained with an explicit limitation on the defining renewal step.
    - source_id: SRC-github-oauth-incident-2022
      identifier: GitHub stolen OAuth user-token campaign
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed OAuth-token abuse; refresh-token exchange not established
      impact: Attackers enumerated organizations and cloned private repositories from dozens of organizations.
      remediation: GitHub requested revocation of affected application tokens and notified affected users and organizations.
      selected: false
      rationale: Credible but redundant with the newer production incident and does not establish refresh-token renewal.

