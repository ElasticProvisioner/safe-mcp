version: 1
technique_id: SAF-T1901
name: Outbound Webhook C2
generation_mode: clean_room
trace_format: hidden_html_v1
status: ready_for_review
tactics:
- ATK-TA0011
adversary_objective: Establish an operator-control channel through repeated outbound
  webhook traffic generated by an MCP-enabled or agentic tool runtime.
scope:
  security_boundary: The transition from model or scheduler invocation context to
    outbound HTTP delivery and the return of response data to agent behavior.
  in_scope:
  - Repeated attacker-influenced HTTPS webhook POSTs from an MCP-enabled or agentic
    runtime.
  - An external destination not approved for the task or tool context.
  - Response consumption, returned tasking, or repeated signaling serving an operator-control
    function.
  out_of_scope:
  - Approved recurring callbacks with no adversary control.
  - One-off data-only transfer or generic SSRF without an operator-control objective.
  - Unauthorized tool invocation that does not establish repeated external webhook
    communication.
  affected_components:
  - MCP clients and servers that expose HTTP-capable tools.
  - Agent schedulers and callback dispatchers.
  - Runtime HTTP clients, egress controls, and approval systems.
nearest_neighbors:
- technique_id: SAF-T1913
  name: Outbound Data Transfer
  distinction: 'Synthetic integration join: data-only egress lacks returned tasking
    or an operator-control function.'
- technique_id: SAF-T1309
  name: Unauthorized Tool Invocation
  distinction: 'Synthetic integration join: invocation-only abuse does not establish
    a repeated external web-service control channel.'
required_evidence:
- Direct protocol authority for model-controlled tools and external API interaction.
- Direct authority for bidirectional web-service command and response behavior.
- Direct advisories establishing relevant outbound-request or webhook primitives.
- Telemetry authority and an executable, fixture-tested detection heuristic.
- Explicit contrary evidence, limitations, and bounded absence statements.
safe_example_constraints:
- Use only reserved non-resolving example domains.
- Do not include exploit payloads, live webhook destinations, credentials, or malicious
  instructions.
- Distinguish enabling vulnerabilities from direct observations of C2.
- Keep requests and fixtures synthetic and inert.
detection:
  expectation: required
  required_telemetry:
  - MCP or agent session, tool, invocation, model-driven, and approval records.
  - Outbound HTTP method, destination, status, size, timestamp, and retry attributes.
  - Destination approval state and whether a response affected subsequent agent behavior.
  waiver_rationale: null
completion_evidence:
- techniques/SAF-T1901/detection-rule.yml
- tests/SAF-T1901/detector.py
- tests/SAF-T1901/fixtures.json
- tests/SAF-T1901/test_detector.py
