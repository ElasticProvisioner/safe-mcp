  - id: SRC-ghsa-cmrh-wvq6-wm9r
    title: Authenticated SSRF in n8n-mcp webhook and API client paths
    publisher: czlonkowski/n8n-mcp via GitHub Security Advisories
    authors:
      - czlonkowski (maintainer publisher)
      - fg0x0 (reporter)
    version_or_date: "Published 2026-05-04; CVE-2026-44694"
    source_class: official_advisory
    official_url: https://github.com/czlonkowski/n8n-mcp/security/advisories/GHSA-cmrh-wvq6-wm9r
    accessed_on: "2026-09-02"
    reviewed_on: "2026-09-02"
    review_method: Opened the exact maintainer advisory identified by the NVD record and reviewed Summary, Impact, Patched Versions, Workarounds, Credit, severity, and weaknesses.
    review_status: opened_reviewed
    locators:
      - Affected versions and Patched versions
      - Summary
      - Impact
      - Workarounds
      - Credit
    review_notes: >-
      Verified that authenticated MCP callers and prompt-influenced tool calls
      could drive outbound requests through webhook/API paths, that responses
      could be returned, and that 2.50.2 fixed the issue. The advisory does not
      document C2 or production exploitation.
    discovery_provenance:
      authority_source_id: SRC-nvd-direct-catalog-2026-09-02
      authority_url: https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-44694
      exact_github_artifact_identified_by_authority: true
    archive:
      status: remote_reviewed_not_archived
      reason: The exact public maintainer advisory was reviewed after NVD supplied its URL; exploit material was not copied into the handoff.
      review_evidence:
        method: exact_advisory_review
        locators_recorded: true

