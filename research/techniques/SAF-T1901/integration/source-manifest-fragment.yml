  - id: SRC-unit42-brute-ratel-2022
    title: Brute Ratel C4 Red Teaming Tool Being Abused by Malicious Actors
    publisher: Palo Alto Networks Unit 42
    authors:
      - Unit 42 research team
    version_or_date: "Updated 2022-07-06"
    source_class: research
    official_url: https://unit42.paloaltonetworks.com/brute-ratel-c4-tool/
    accessed_on: "2026-09-02"
    reviewed_on: "2026-09-02"
    review_method: Opened the report identified in MITRE ATT&CK's T1102 references and reviewed the executive summary, advertised capabilities, observed sample C2, and conclusions.
    review_status: opened_reviewed
    locators:
      - Executive Summary
      - Brute Ratel C4 Overview, advertised external C2 capability
      - Observed sample C2 at direct IP over port 443
      - Conclusion
    review_notes: >-
      The report observed malicious Brute Ratel deployment and direct-IP C2,
      while external channels over Slack, Discord, or Teams were listed as an
      advertised capability. It does not establish webhook C2 or any MCP or
      agentic-system instance, so it was excluded from publishable examples.
    archive:
      status: remote_reviewed_not_archived
      reason: The public report was directly reviewed; no protected article copy or malware artifact was retained.
      review_evidence:
        method: first_party_research_page_review
        locators_recorded: true

