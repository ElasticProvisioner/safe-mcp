saturation:
  reached: true
  consecutive_no_change_passes: 2
  rationale: >-
    Five methodological passes reached a stable definition, bounded evidence
    status, four ranked enabling examples, tested analytic, controls, and
    limitations. Two subsequent direct-NVD authority query passes returned no
    new qualifying source or claim and therefore made no material changes.
  passes:
    - pass: protocol_and_authority
      completed_on: "2026-09-02"
      authorities:
        - SRC-mcp-tools-2026-07-28
        - SRC-mcp-architecture-2026-07-28
        - SRC-mitre-t1102-002-v1-1
        - SRC-mitre-t1102-003-v1-1
      findings:
        - Established model-controlled tool authority and external API interaction.
        - Established bidirectional versus one-way web-service C2 boundaries.
      material_changes:
        - Added the explicit operator-control and response-consumption boundary.
    - pass: known_breaches_and_vulnerabilities
      completed_on: "2026-09-02"
      authorities:
        - SRC-nvd-token-scope-corpus
        - SRC-cisa-kev-2026-09-01
        - SRC-ghsa-cmrh-wvq6-wm9r
        - SRC-aws-cve-2026-15643
        - SRC-ghsa-mcp-atlassian-7r34
        - SRC-ghsa-xqq2-4j46-vwp7
      findings:
        - Selected four mechanism-relevant enabling vulnerabilities.
        - Found no direct qualifying production incident in the bounded direct-authority corpus.
      material_changes:
        - Ranked four examples and bounded each as enabling rather than observed C2.
    - pass: demonstration_and_empirical_research
      completed_on: "2026-09-02"
      authorities:
        - SRC-ghsa-cmrh-wvq6-wm9r
        - SRC-ghsa-mcp-atlassian-7r34
        - SRC-ghsa-xqq2-4j46-vwp7
        - SRC-unit42-brute-ratel-2022
      findings:
        - Advisory proofs establish outbound primitives but not an end-to-end control channel.
        - The historical Brute Ratel report does not establish the proposed mechanism.
      material_changes:
        - Set the overall evidence level to Research-Derived and added a direct-demo gap.
    - pass: detection_and_defense
      completed_on: "2026-09-02"
      authorities:
        - SRC-otel-http-spans-1.44.0
        - SRC-mitre-t1102-002-v1-1
        - SRC-mcp-security-2026-07-28
      findings:
        - Defined application-to-HTTP correlation and privacy-aware collection.
        - Implemented and tested a threshold analytic with positive, negative, false-positive, malformed, and blind-spot fixtures.
      material_changes:
        - Added executable detection and destination/redirect/egress defenses.
    - pass: gap_and_challenge
      completed_on: "2026-09-02"
      authorities:
        - SRC-mitre-t1102-002-v1-1
        - SRC-mitre-t1102-003-v1-1
        - SRC-otel-http-spans-1.44.0
        - SRC-cisa-kev-2026-09-01
      findings:
        - Legitimate recurring webhooks can match the heuristic.
        - Slow, one-off, encrypted, approved-service, or uncorrelated activity can evade it.
        - Catalog absence and absence in the reviewed corpus do not establish universal absence.
      material_changes:
        - Added contrary cases, explicit inference labels, and bounded absence language.
    - pass: follow_up_no_change_1
      completed_on: "2026-09-02"
      authority: SRC-nvd-token-scope-corpus
      direct_queries:
        - keywordSearch=Model Context Protocol webhook command
        - keywordSearch=Model Context Protocol callback C2
        - keywordSearch=AI agent webhook C2
        - keywordSearch=Model Context Protocol outbound web service
      result: All four direct official NVD API queries returned zero results after a transient rate-limit response was retried successfully.
      material_changes: []
    - pass: follow_up_no_change_2
      completed_on: "2026-09-02"
      authority: SRC-nvd-token-scope-corpus
      direct_queries:
        - keywordSearch=Model Context Protocol webhook beacon
        - keywordSearch=Model Context Protocol HTTP command channel
        - keywordSearch=agent webhook bidirectional command
        - keywordSearch=AI agent webhook remote command
