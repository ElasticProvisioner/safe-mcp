conflicts:
  - issue: Literature names full-schema poisoning, but reviewed empirical studies poison only descriptions.
    resolution: Classify FSP as Research-Derived and label all selected demonstrations adjacent.
  - issue: Content scanners can detect explicit strings but may miss semantic attacks or flag benign security text.
    resolution: Limit the rule to tested deterministic selections, retain human review, and publish false-positive and blind-spot conditions.
  - issue: Fingerprinting detects definition change but not a malicious definition present at first approval.
    resolution: Combine fingerprint approval with recursive schema-path inspection and sensitive-action confirmation.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1501-C003
    - SAF-T1501-C010
  rationale: >-
    The protocol surface, client ingestion path, and adjacent description-poisoning
    influence are independently supported. The defining coordinated multi-path
    behavior is an explicit inference, with no direct breach, vulnerability, or
    end-to-end demonstration identified.

