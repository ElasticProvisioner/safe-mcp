conflicts:
  - issue: Some evaluated attacks were refused, and AgentDojo reports that attacks did not succeed universally.
    resolution: The technique states explicit access and influence preconditions, labels evidence Demonstrated rather than Observed, and does not claim deterministic model compromise.
  - issue: CVE-2025-34072 is direct and high impact but affects a deprecated, unmaintained server.
    resolution: The example remains selected for mechanism clarity while its product and remediation limits are stated next to the claim.
  - issue: The CISA KEV catalog contains no CVE-2025-34072 entry, while NVD SSVC records proof-of-concept exploitation.
    resolution: The technique reports proof-of-concept only and does not infer active or production exploitation.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1910-C003
  rationale: >-
    Multiple public controlled evaluations reproduce the complete behavior:
    sensitive data is selected, embedded in an inconspicuous MCP-mediated
    carrier, and delivered to an unintended recipient. No directly reviewed
    source documents a real production incident, so Observed is not justified.

