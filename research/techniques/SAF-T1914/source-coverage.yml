conflicts:
  - issue: User confirmation is recommended and may interrupt a malicious sink call, but demonstrations report incomplete or habituated approval experiences.
    resolution: Approval is treated as a conditional control and logged analytic field, never as proof that transfer cannot occur.
  - issue: Prompt-injection detectors and tool filtering reduced some AgentDojo attack success, but neither was complete and both had applicability or utility limits.
    resolution: Detection and mitigation are presented as layered controls with explicit blind spots, not guarantees.
  - issue: CVE-2026-46555 allows a sibling server to invoke a WhatsApp bridge, but does not document the complete model-host chain.
    resolution: It is retained as enabling vulnerability evidence and excluded from the four selected end-to-end examples.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1914-C004
    - SAF-T1914-C006
    - SAF-T1914-C007
    - SAF-T1914-C008
  rationale: >-
    Multiple independent controlled publications demonstrate the complete
    sensitive-source to distinct outbound-sink flow, and one official CVE records
    a critical disclosed vulnerability with proof-of-concept status. The direct
    authority corpus does not establish production exploitation, so observed
    would overstate the evidence and demonstrated is the strongest supported label.

