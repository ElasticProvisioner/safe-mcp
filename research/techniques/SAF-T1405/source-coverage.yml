  rationale: >-
    Protocol semantics, direct demonstrations, catalog and advisory coverage,
    detection design, contrary results, defense limitations, and rights were
    covered by direct authorities. The two final exact-query passes returned no
    new qualifying source beyond the already reviewed MCP Security Bench and
    MPMA papers and no additional NVD records, so further searching was unlikely
    to change the contract or evidence classification.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 6
  selected_examples:
    - SRC-mpma-2025
    - SRC-mcp-security-bench-2510.15994
    - SRC-ghsa-cr22-wjx7-2w6m
  no_qualifying_examples_rationale: >-
    Three high-impact examples were selected, but only two are direct controlled
    demonstrations and the advisory is merely enabling. No direct production
    breach or direct renaming vulnerability qualified in the reviewed corpus;
    that gap is explicit in the technique.
  candidates:
    - source_id: SRC-mpma-2025
      identifier: MPMA controlled evaluation
      relationship: direct_demonstration
      exploitation_status: controlled_evaluation_only
      impact: Manipulated names and descriptions biased competitive tool selection across the reported test matrix.
      remediation: The paper evaluates scanners and motivates semantic and provenance-aware defenses; no product patch applies.
      selected: true
      rationale: Directly manipulates the defining name and descriptor surfaces and reports selection outcomes.
    - source_id: SRC-mcp-security-bench-2510.15994
      identifier: MCP Security Bench NC-FE evaluation
      relationship: direct_demonstration
      exploitation_status: controlled_evaluation_only
      impact: A colliding tool name coupled with false-error response behavior produced measurable attack success in live MCP execution.
      remediation: The paper evaluates MCIP and other defenses; no product patch applies.
      selected: true
      rationale: Directly tests name collision and provides a concrete end-to-end controlled execution, with coupling limitations stated.
    - source_id: SRC-ghsa-cr22-wjx7-2w6m
      identifier: CVE-2026-46519 / GHSA-cr22-wjx7-2w6m
      relationship: enabling_vulnerability
      exploitation_status: no_known_exploitation_identified_in_reviewed_sources
      impact: A client knowing a filtered tool name could invoke it, with potential Kubernetes cluster impact bounded by the service account.
      remediation: Upgrade mcp-server-kubernetes to 3.6.0 or later, which enforces the allowed set at tools/call.
      selected: true
      rationale: High-impact adjacent enforcement failure clarifies why name hiding is not authorization; it does not raise SAF-T1405 evidence status.
    - source_id: SRC-jamshidi-2026-arxiv-2512-06556
      identifier: Semantic descriptor manipulation controlled evaluation
      relationship: direct_demonstration
      exploitation_status: controlled_synthetic_evaluation_only
      impact: Descriptor attacks produced unsafe invocation and the layered defense retained residual risk and false positives.
      remediation: The study proposes semantic vetting, permission gating, signed manifests, and runtime monitoring.
      selected: false
      rationale: Useful corroboration and defense evidence, but less directly centered on renaming and lower priority than the two selected demonstrations.
    - source_id: SRC-tool-squatting-2025
      identifier: Securing MCP Tool Metadata conceptual architecture
      relationship: rejected
      exploitation_status: conceptual_only
      impact: Describes potential deceptive registration and representation risks without an empirical exploit result.
      remediation: Proposes verified registration, signed metadata, and audit logs.
      selected: false
      rationale: Conceptual and explicitly leaves empirical validation for future work.
    - source_id: SRC-mcp-safety-audit-2025
      identifier: MCP Safety Audit controlled assessment
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled_evaluation_only
      impact: Demonstrates malicious prompt and unsafe tool-capability risks in a controlled environment.
      remediation: Proposes scanning and review of prompts and tool capabilities.
      selected: false
      rationale: Does not manipulate a tool name or identity descriptor as the defining mechanism.
