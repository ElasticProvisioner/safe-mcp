sources_rejected:
  - source_id: SRC-tool-squatting-2025
    reason: Conceptual architecture without empirical validation of the target behavior.
  - source_id: SRC-mcp-safety-audit-2025
    reason: Controlled evidence concerns malicious prompts and unsafe capabilities, not deceptive tool identity metadata.
  - source_id: SRC-mcp-security-best-practices-2026
    reason: The reviewed command-obfuscation and authorization guidance is authoritative but addresses local startup commands and OAuth boundaries rather than tool-name or descriptor manipulation.
sources_blocked: []
conflicts:
  - issue: MPMA reports high attack success for direct name and description manipulation, but its malicious-majority experiment reports increased model caution and benign preference.
    resolution: Report the high-effectiveness result with its tested competitive conditions and retain over-manipulation as contrary evidence.
  - issue: MCP Security Bench reports an aggregate NC-FE result that combines two attack stages.
    resolution: Attribute only the coupled 14.62 percent result and do not claim isolated downstream harm from renaming alone.
  - issue: Semantic defenses reduce unsafe invocation but introduce false positives and residual unsafe outcomes.
    resolution: Treat semantic classification as a supplemental control and keep the deterministic analytic focused on identity drift.
evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1405-C002
    - SAF-T1405-C003
    - SAF-T1405-C004
  rationale: >-
    Two independent controlled MCP studies directly change tool names or
    descriptors and measure selection-linked outcomes, satisfying the complete
    technique contract at demonstration level. No production incident was found,
    so observed status is not justified.
