conflicts:
  - issue: The Telegram advisory header and body disagree on whether the first patched version is 2026.2.2 or 2026.2.1.
    resolution: Preserve the conflict and use 2026.2.2 or later as the conservative remediation threshold.
  - issue: Several NVD records contain different score submissions for the same CVE.
    resolution: Rank primarily by documented consequence and prerequisites; avoid presenting a single unattributed CVSS value in the technique.
  - issue: Vulnerability disclosures demonstrate ingress or privilege boundary failures but not the complete adversarial reply loop.
    resolution: Keep the end-to-end technique Research-Derived and explicitly disclose the missing incident and demonstration evidence.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1904-C007
  rationale: >-
    Direct authorities independently establish external chat message/reply
    primitives, model-controlled tools, and multiple authorization failures
    reaching commands, host approval, or persistent credentials. The complete
    adversarial inbound-message to consequential-tool-call to attacker-observed
    reply loop remains an explicit framework inference; no qualifying production
    incident or single end-to-end demonstration was found.

