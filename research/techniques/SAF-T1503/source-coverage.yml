    runtimes, two current MCP clients, first-party incidents, original
    vulnerability researchers, one provenance-authorized maintainer advisory,
    current ATT&CK mappings, and Windows/Linux process telemetry. The final two
    targeted follow-ups added no controlling requirement, direct example,
    limitation, remediation change, detector constraint, or mapping distinction.
    Blocked catalog pages were not used for propositions; exploitation claims
    that would have depended on them were omitted.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 5
  selected_examples:
    - SRC-codecov-bash-uploader-2021
    - SRC-aikido-shai-hulud-2025
    - SRC-jfrog-cve-2025-6514
    - SRC-oligo-inspector-cve-2025-49596
  no_qualifying_examples_rationale: >-
    No reviewed authority documented the defining end-to-end behavior in an MCP
    or agentic production environment, and neither MCP vulnerability report
    demonstrated environment enumeration. The four selected items are retained
    only as two observed historical analogies and two enabling MCP
    vulnerabilities; they do not raise the technique evidence status.
  candidates:
    - source_id: SRC-codecov-bash-uploader-2021
      identifier: Codecov Bash Uploader compromise
      relationship: historical_analogy
      exploitation_status: observed production exploitation from 2021-01-31 through 2021-04-01
      impact: CI environment variables were transmitted to attacker infrastructure; Codecov had evidence that some variables were compromised.
      remediation: Codecov remediated the uploader, rotated internal credentials, added monitoring, and advised customers to rotate exposed credentials.
      selected: true
      rationale: Highest-confidence observed example of command-based runtime environment enumeration, but outside MCP and agentic systems.
    - source_id: SRC-aikido-shai-hulud-2025
      identifier: Shai-Hulud npm supply-chain attack
      relationship: historical_analogy
      exploitation_status: observed production supply-chain attack reported by the investigating researcher
      impact: Malware scanned process.env, published environment-variable and secret dumps, and propagated using recovered package credentials.
      remediation: Remove affected packages, clean caches, reinstall from pinned lockfiles, and rotate exposed credentials as appropriate.
      selected: true
      rationale: Close Node.js runtime analogy that directly names process.env, but not an MCP or agentic event.
    - source_id: SRC-jfrog-cve-2025-6514
      identifier: CVE-2025-6514
      relationship: enabling_vulnerability
      exploitation_status: controlled demonstration; production exploitation not established by the reviewed source
      impact: A malicious or intercepted MCP server could trigger attacker-controlled command execution through affected mcp-remote clients.
      remediation: Fixed in mcp-remote 0.1.16; use HTTPS and trusted servers.
      selected: true
      rationale: High-impact MCP-specific enabler that could provide the execution context for scraping, but the report does not demonstrate scraping.
    - source_id: SRC-oligo-inspector-cve-2025-49596
      identifier: CVE-2025-49596 / GHSA-7f8r-222p-6f5g
      relationship: enabling_vulnerability
      exploitation_status: controlled demonstration; production exploitation not established by the reviewed sources
      impact: Browser-originated unauthenticated requests could launch commands through vulnerable MCP Inspector proxies.
      remediation: Fixed in MCP Inspector 0.14.1 with authorization and origin checks.
      selected: true
      rationale: High-impact MCP-specific enabler; neither the original disclosure nor maintainer advisory demonstrates environment scraping.
    - source_id: SRC-circleci-incident-2023
      identifier: CircleCI December 2022 incident
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed production exfiltration on 2022-12-22
      impact: The actor exfiltrated customer environment-variable records, tokens, and keys from databases and stores.
      remediation: CircleCI rotated and revoked tokens, restricted access, and advised customer secret rotation.
      selected: false
      rationale: Stored platform records were exfiltrated after production access; the source does not describe runtime environment enumeration.

