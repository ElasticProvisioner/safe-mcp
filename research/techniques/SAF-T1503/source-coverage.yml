sources_rejected:
  - source_id: SRC-circleci-alert-2023
    reason: The full incident report provides more precise mechanism, impact, and evidence-limit details.
  - source_id: SRC-mcp-logging-2025-11-25
    reason: MCP protocol logging does not expose in-process environment reads or reliable process lineage.
  - source_id: SRC-attack-t1005
    reason: Data from Local System is broader than the live process-environment mechanism.
  - source_id: SRC-mitre-attack-t1082-current
    reason: System Information Discovery does not capture the credential-collection objective.
  - source_id: SRC-python-subprocess-3.14.7
    reason: It added no material proposition beyond the directly cited Python os and Node runtime sources.
sources_blocked: []

conflicts:
  - issue: Some local process launchers inherit broad parent environments, while current Claude Code removes credential-like variables for certain untrusted helper scopes.
    resolution: Scope the technique to values actually visible to the server process and state that filtering is client- and scope-specific contrary evidence.
  - issue: Process telemetry can detect external env utilities but not direct language-runtime environment access.
    resolution: Keep the detector experimental and bounded; publish the in-process blind spot next to the analytic.
  - issue: ATT&CK T1552.001 centers on credentials in files even though its current Shai-Hulud procedure names process.env.
    resolution: Mark the mapping Analogous, not Direct.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1503-C004
  rationale: >-
    The complete behavior is an explicit synthesis of versioned MCP subprocess
    semantics, documented runtime environment access, current MCP client env
    configuration, and local-server privilege guidance. The reviewed corpus
    contains strong non-MCP analogies and MCP code-execution enablers but no
    direct MCP or agentic incident or end-to-end demonstration.

