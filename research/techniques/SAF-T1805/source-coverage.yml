conflicts:
  - issue: MCP and agent frameworks intentionally collect and persist context for normal operation.
    resolution: The technique requires unauthorized owner or tenant boundary crossing; legitimate authorized snapshots are explicitly out of scope and negative detector fixtures.
  - issue: Current MCP sampling marks broad context inclusion as deprecated and permits clients to ignore it.
    resolution: Sampling is only contextual mechanism evidence, not a required vector or direct exploit claim.
  - issue: Government enrichment says exploitation none and the direct identifiers are absent from KEV.
    resolution: The README says no production incident was identified in the reviewed corpus and does not claim exploitation is impossible or never occurred.
  - issue: The M365 Copilot case is high impact but does not publicly identify context snapshot retrieval.
    resolution: It is selected only as an enabling or adjacent example mapped to a synthetic neighbor and does not support Demonstrated status.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1805-C001
    - SAF-T1805-C003
  rationale: >-
    GHSA-766v-q9x3-g744 publicly demonstrates the defining cross-agent capture
    of active ledger state, and the generalized boundary is independently
    supported by a second direct IBM chat-history vulnerability plus
    implementation documentation. No production incident was identified, so
    the evidence is Demonstrated rather than Observed.

