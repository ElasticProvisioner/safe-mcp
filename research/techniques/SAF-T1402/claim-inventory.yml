      - source_id: SRC-unicode-uts55-v2
        support: direct
        exact_locators: ["Section 5.2; lines 714-772"]
      - source_id: SRC-sharelock-2026
        support: context
        exact_locators: ["Sections 5.3-6; lines 389-437"]
      - source_id: SRC-microsoft-prompt-shields-2026
        support: context
        exact_locators: ["Document attacks and Limitations; lines 89-134"]
      - source_id: SRC-mitre-t1027.018
        support: context
        exact_locators: ["Detection Strategies; lines 73-81"]
    corroboration: Independent sources cover carrier, state, package, and action-stage controls.
    limitations: [No single control covers every representation; model-based scanners and human approvals can fail.]
    conflicts: []
    inference: {is_inference: true, rationale: The defense-in-depth set combines source-specific controls across the documented attack flow.}
    status: validated
  - id: SAF-T1402-C016
    statement: A defensible experimental analytic correlates an anomalous untrusted carrier with later interpretation or sensitive action in the same session, while treating representation findings alone as insufficient.
    class: framework_inference
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-mitre-t1027.018
        support: direct
        exact_locators: ["Detection Strategies DET0557 and AN1234; lines 73-81"]
      - source_id: SRC-unicode-uts55-v2
        support: context
        exact_locators: ["Section 5.2; lines 714-772"]
      - source_id: SRC-sharelock-2026
        support: context
        exact_locators: ["Section 5.4, token-consumption and threshold observables; lines 417-431"]
      - source_id: SRC-unicode-uts39
        support: context
        exact_locators: ["Sections 3.1 and 4; lines 138-160 and 357-481"]
      - source_id: SRC-skillcamo-2026
        support: context
        exact_locators: ["Sections 3.3 and 4.3-4.4; lines 152-183 and 219-241"]
      - source_id: SRC-mcp-tools-2025-11-25
        support: context
        exact_locators: ["Security guidance; lines 78-90"]
      - source_id: SRC-bad-characters-2021
        support: context
        exact_locators: ["Sections 6-7; lines 479-554"]
    corroboration: ATT&CK recommends joining abnormal Unicode density to decoding and follow-on activity; Unicode guidance supplies visibility and false-positive constraints.
    limitations: [The analytic depends on provenance-rich telemetry and misses carriers that generate no recorded representation finding.]
    conflicts: []
    inference: {is_inference: true, rationale: The concrete cross-source sequence analytic is a SAF design derived from cited detection principles.}
    status: validated
  - id: SAF-T1402-C017
    statement: MITRE ATT&CK T1027.018 Invisible Unicode is an analogous mapping for the Unicode subset of SAF-T1402, not a direct mapping for all instruction carriers.
    class: framework_inference
    materiality: medium
    evidence_status: research-derived
    sources:
      - source_id: SRC-mitre-t1027.018
        support: direct
        exact_locators: ["Technique definition and procedure examples; lines 38-43"]
    corroboration: ATT&CK explicitly includes AI prompt injection using invisible Unicode.
    limitations: [T1027.018 does not cover image, threshold-share, or opaque-reasoning carriers.]
    conflicts: []
    inference: {is_inference: true, rationale: Mapping scope is narrower than the SAF technique and is therefore analogous.}
    status: validated
