        support: corroborating
        exact_locators: ["Section 4.2; lines 325-336"]
      - source_id: SRC-gitlab-cve-2025-6945
        support: corroborating
        exact_locators: ["CVE-2025-6945 entry; lines 150-156"]
    corroboration: The sources separately establish sensitive objectives, product impact, and human-control expectations.
    limitations: [Impact varies by model, privileges, tool design, user choices, and downstream controls.]
    conflicts: []
    inference: {is_inference: true, rationale: The conditional impact statement synthesizes controlled results and protocol control boundaries.}
    status: validated
  - id: SAF-T1402-C015
    statement: Carrier normalization and visible review, context binding for opaque state, multimodal package inspection, least privilege, and sensitive-action approval address different stages of the technique.
    class: framework_inference
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-openclaw-ghsa-2qj5-gwg2-xwc4
        support: direct
        exact_locators: ["Patched versions and remediation description"]
      - source_id: SRC-reasoning-traces-2026
