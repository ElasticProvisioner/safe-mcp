    reason: The reviewed record does not establish an instruction concealment or recovery representation.
sources_blocked: []
conflicts:
  - issue: Invisible-character perturbations did not affect every model and task evaluated in Bad Characters.
    resolution: The README avoids universal susceptibility claims and requires a recorded recovery or follow-on action for detection.
  - issue: ShareLock uses mocked tool responses and ASR-at-3, while opaque-state replay depended on July 2026 API behavior that later changed.
    resolution: Both are labeled controlled demonstrations with their metric and version limitations; neither is presented as production exploitation.
  - issue: Character, entropy, image, or encoded-content findings can occur legitimately.
    resolution: The analytic correlates representation findings with same-session interpretation or sensitive action and suppresses approved or allowlisted origins.
evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1402-C001
    - SAF-T1402-C007
    - SAF-T1402-C008
  rationale: >-
    Independent controlled evaluations demonstrate the complete concealment,
    recovery, and agent-action chain using MCP tool-description shares and
    opaque replayable state. Product advisories corroborate real implementation
    exposure, but no verified production breach was found, so Observed would be
    unsupported.
