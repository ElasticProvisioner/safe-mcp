sources_rejected:
  - source_id: SRC-biasrag
    reason: Retriever-training poisoning exceeds the unchanged-retriever corpus-only contract.
  - source_id: SRC-corpus-poisoning
    reason: Establishes poisoned retrieval but not the required generated-output outcome.
  - source_id: SRC-ms-zero-trust-memory-2026
    reason: Broad catalog guidance is useful corroboration but less direct than selected primary research and OWASP controls.
  - source_id: SRC-nvd-cve-2025-27135
    reason: SQL injection in a RAG-branded product is adjacent and not evidence of trigger-conditioned corpus retrieval.
sources_blocked: []
conflicts:
  - issue: Earlier demonstrations can degrade sharply after document preprocessing or under varied user queries.
    resolution: Confundo is included, and claims are explicitly configuration-bounded rather than generalized to all RAG systems.
  - issue: High attack-success rates could be misread as proof of production exploitation.
    resolution: Evidence status is Demonstrated, and the production incident gap is explicit.
  - issue: Provenance and integrity signals may be interpreted as definitive attack detection.
    resolution: The analytic is labeled a candidate and its approved-source and metadata limitations are stated and tested.
evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T3001-C001
    - SAF-T3001-C002
    - SAF-T3001-C003
    - SAF-T3001-C004
  rationale: >-
    Multiple independent controlled studies demonstrate the complete persistent
    corpus insertion, trigger-conditioned retrieval, and generated-output path.
    No direct production compromise meeting the exact contract was found, so the
    evidence does not support Observed status.
