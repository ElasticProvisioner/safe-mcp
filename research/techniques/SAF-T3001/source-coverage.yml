    example, mitigation, or detection change.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 8
  selected_examples:
    - SRC-badrag
    - SRC-usenix-confundo-2026
    - SRC-usenix-poisonedrag-2025
    - SRC-riprag
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-badrag
      identifier: BadRAG controlled demonstration
      relationship: direct_demonstration
      exploitation_status: Reproduced in controlled research across five datasets, three retrievers, and multiple generators.
      impact: Triggered queries retrieve poison and can induce selected refusal or sentiment behavior while clean queries are minimally affected.
      remediation: Evaluated embedding-norm and fluency filters were insufficient; stronger token-level and provenance controls remain research directions.
      selected: true
      rationale: Directly exercises the defining unchanged-component, corpus-only backdoor contract.
    - source_id: SRC-usenix-poisonedrag-2025
      identifier: PoisonedRAG controlled demonstration
      relationship: direct_demonstration
      exploitation_status: Reproduced in controlled datasets, language models, and three application tests.
      impact: Target questions can receive attacker-selected answers after a few malicious texts are inserted.
      remediation: Evaluated paraphrasing, perplexity, duplicate filtering, and knowledge expansion were incomplete or operationally costly.
      selected: true
      rationale: Direct high-impact end-to-end knowledge-corruption demonstration.
    - source_id: SRC-riprag
      identifier: RIPRAG controlled demonstration
      relationship: direct_demonstration
      exploitation_status: Reproduced against black-box RAG configurations using target-system feedback.
      impact: One injected document achieved substantial to complete success in evaluated configurations.
      remediation: RAGuard reduced but did not eliminate reported attack success; interaction controls can constrain optimization.
      selected: true
      rationale: Directly removes internal-knowledge assumptions and tests a modern defense.
    - source_id: SRC-usenix-confundo-2026
      identifier: Confundo controlled demonstration
      relationship: direct_demonstration
      exploitation_status: Evaluated in practical RAG configurations with preprocessing and query variation.
      impact: Poisoned content can manipulate factual correctness, opinions, or hallucination behavior after pipeline transformations.
      remediation: The official summary reports resilience against evaluated defenses and a defensive content-protection use case; no complete mitigation is claimed.
      selected: true
      rationale: Adds practical-pipeline robustness evidence and a material contrary constraint on earlier demonstrations.
    - source_id: SRC-ms-recommendation-poisoning-2026
      identifier: AI Recommendation Poisoning in-the-wild attempts
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Microsoft observed more than 50 prompt-based attempts; effectiveness and persistence varied.
      impact: Attempts sought persistent promotional influence over future assistant recommendations.
      remediation: Prompt filtering, content separation, memory controls, monitoring, user review, and hunting guidance are described.
      selected: false
      rationale: The delivery writes assistant memory through prompts rather than planting trigger-conditioned retrieval-corpus passages.
    - source_id: SRC-nvd-cve-2025-27135
      identifier: CVE-2025-27135
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Publicly disclosed SQL injection in RAGFlow versions 0.15.1 and earlier.
      impact: Unsanitized input reaches an SQL execution component with high confidentiality, integrity, and availability impact.
      remediation: NVD reported no patched version at initial publication; later status was not used to infer a corpus-poisoning fix.
      selected: false
      rationale: Product adjacency does not make SQL injection evidence of the RAG corpus-backdoor mechanism.
    - source_id: SRC-corpus-poisoning
      identifier: EMNLP 2023 retrieval-corpus poisoning
      relationship: historical_analogy
      exploitation_status: Controlled dense-retrieval demonstration.
      impact: Small injected passage sets can dominate retrieval for broad query sets.
      remediation: The paper benchmarks retriever robustness but does not establish a complete generated-output mitigation.
      selected: false
      rationale: It demonstrates the retrieval prerequisite but not the downstream generator outcome required by this contract.
    - source_id: SRC-biasrag
      identifier: BiasRAG controlled fairness backdoor
      relationship: rejected
      exploitation_status: Controlled research with retriever-training poisoning and corpus manipulation.
      impact: Evaluated fairness-related bias in generated responses.
      remediation: Paper limitations and defenses do not restore the corpus-only unchanged-retriever boundary.
      selected: false
      rationale: The method poisons retriever training and therefore crosses a different boundary.
