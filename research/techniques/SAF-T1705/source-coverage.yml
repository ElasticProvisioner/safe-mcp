conflicts:
  - issue: Prompt Infection reported strong combined controls, but isolated labeling and marking remained weak and handcrafted attacks limit generalization.
    resolution: Publish layered controls only, characterize the detector as experimental, and retain adaptive-evasion blind spots.
  - issue: Model-specific results differ across configurations, including models that resisted one benchmark but failed in another setup or objective.
    resolution: Treat model identity as a tuning variable, never as a preventive control, and avoid universal success-rate claims.
  - issue: NVD and maintainer version expressions for GHSA-v7px were not identical.
    resolution: Omit exact affected-version bounds from publishable prose and direct integrators to reconcile the current advisory before reuse.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids: [SAF-T1705-C003, SAF-T1705-C004, SAF-T1705-C005, SAF-T1705-C015]
  rationale: >-
    Three independent controlled evaluations reproduce the defining transfer
    into a distinct receiving agent and consequent behavior change. No reviewed
    authority establishes a production incident, so Observed is not justified.

