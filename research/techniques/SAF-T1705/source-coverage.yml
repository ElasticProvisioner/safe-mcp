breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 12
  selected_examples:
    - SRC-lee-tiwari-prompt-infection
    - SRC-triedman-jha-shmatikov-mas-hijacking
    - SRC-naik-et-al-omni-leak
  no_qualifying_examples_rationale: >-
    Three controlled demonstrations qualify, but no direct production incident
    or direct disclosed vulnerability qualified. The AI Incident Database and
    NVD review was current to the recorded dates; terminology differences,
    confidential events, and later disclosures remain explicit gaps.
  candidates:
    - source_id: SRC-lee-tiwari-prompt-infection
      identifier: Prompt Infection controlled evaluation
      relationship: direct_demonstration
      exploitation_status: controlled_public_demonstration
      impact: Cross-agent instruction replication, data theft workflows, and memory manipulation in simulated systems.
      remediation: Layered tagging and instruction separation reduced attacks in the tested setting; isolated controls remained weak.
      selected: true
      rationale: Directly demonstrates attacker-authored instructions propagating from one agent output to another agent context.
    - source_id: SRC-triedman-jha-shmatikov-mas-hijacking
      identifier: MAS Hijacking controlled evaluation
      relationship: direct_demonstration
      exploitation_status: controlled_public_demonstration
      impact: Arbitrary code execution and data exfiltration through orchestrator-directed downstream capabilities.
      remediation: No universal fix established; controlled disclosure and sandboxing context were reported.
      selected: true
      rationale: Directly demonstrates attacker-influenced subagent metadata changing orchestrator and executor behavior.
    - source_id: SRC-naik-et-al-omni-leak
      identifier: OMNI-LEAK controlled evaluation
      relationship: direct_demonstration
      exploitation_status: controlled_public_demonstration
      impact: Private-data exfiltration across SQL, orchestrator, and notification agents despite data access controls.
      remediation: Monitor and gate data entry, user-agent steps, inter-agent communications, and human escalation.
      selected: true
      rationale: Directly demonstrates a multi-hop instruction chain across distinct agent roles and receiver authority.
    - source_id: SRC-gu-agent-smith
      identifier: Agent Smith infectious jailbreak
      relationship: rejected
      exploitation_status: controlled_public_demonstration
      impact: Simulated harmful behavior spreading among multimodal agents.
      remediation: A theoretical containment condition was proposed; practical defense remained open.
      selected: false
      rationale: The defining artifact is an adversarial image jailbreak, not an attacker-authored instruction relayed by one agent to another.
    - source_id: SRC-wang-planflip
      identifier: PlanFlip planning-phase injection
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled_public_demonstration
      impact: Corrupted planner context can alter downstream task plans.
      remediation: Goal anchoring and heterogeneous cross-agent consensus were evaluated.
      selected: false
      rationale: The injection is delivered as tool output to a planner; peer-agent relay is not the defining delivery hop.
    - source_id: SRC-cai-zhang-hei-child-inherits
      identifier: When Child Inherits subagent-spawn evaluation
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled_public_demonstration
      impact: Inherited memory and weak capability controls can spread a parent's compromised state.
      remediation: Capability registry, policy enforcement, and memory controls were proposed.
      selected: false
      rationale: The defining mechanism is spawn-time memory inheritance rather than an inter-agent instruction message.
    - source_id: SRC-cve-2025-32711
      identifier: CVE-2025-32711
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: no_known_exploitation_in_reviewed_cve_record
      impact: Information disclosure in Microsoft 365 Copilot from AI command injection.
      remediation: Vendor fix referenced by the CVE record.
      selected: false
      rationale: The official record does not document a distinct sender-agent to receiver-agent hop.
    - source_id: SRC-ghsa-v7px
      identifier: GHSA-v7px-3835-7gjx
      relationship: enabling_vulnerability
      exploitation_status: proof_of_concept_reported_in_advisory_metadata
      impact: Prompt-influenced lifecycle hooks could cause command execution in affected PraisonAI versions.
      remediation: Upgrade to a patched release identified by the maintainer advisory.
      selected: false
      rationale: It can enable agent compromise but does not itself establish cross-agent instruction transfer.
    - source_id: SRC-jfrog-cve-2025-6514
      identifier: CVE-2025-6514
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: public_researcher_demonstration
      impact: A malicious MCP server OAuth endpoint could reach command execution through mcp-remote.
      remediation: Upgrade mcp-remote to 0.1.16 or later and apply documented validation controls.
      selected: false
      rationale: The vulnerability crosses server and client components, not two receiving agent contexts through instruction relay.
    - source_id: SRC-oligo-inspector-cve-2025-49596
      identifier: CVE-2025-49596
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: public_researcher_demonstration
      impact: Browser and DNS-rebinding paths could reach MCP Inspector process execution.
      remediation: Upgrade MCP Inspector to 0.14.1 or later.
      selected: false
      rationale: The documented attack is a web-to-local proxy trust failure, not cross-agent instruction injection.
    - source_id: SRC-aiid-snapshot-20260831
      identifier: AI Incident Database snapshot review
      relationship: rejected
      exploitation_status: no_qualifying_record_found
      impact: No direct event could be attributed from the reviewed corpus.
      remediation: Continue monitoring and re-run current corpus queries during future review.
      selected: false
      rationale: The corpus search yielded direct single-agent injection reports but no contract-matching event.
    - source_id: SRC-nvd-token-scope-corpus
      identifier: NVD CVE API review
      relationship: rejected
      exploitation_status: no_qualifying_record_found
      impact: No direct cross-agent CVE could be attributed from the reviewed query results.
      remediation: Re-run official catalog searches and inspect new advisory references during future review.
      selected: false
      rationale: Returned records lacked the required originating-agent to receiving-agent instruction hop.

