sources_rejected:
  - source_id: SRC-arxiv-leakagent
    reason: GPT Store evaluation explicitly lacked ground-truth system prompts, so it could not strengthen the selected direct examples.
  - source_id: SRC-anthropic-system-prompts
    reason: Deliberate publication of selected web and mobile system prompts is authorized disclosure, not this technique.
  - source_id: SRC-nvd-cve-2026-7482
    reason: Memory-corruption disclosure uses a different boundary and may expose prompts only incidentally.
  - source_id: SRC-arxiv-query-audit
    reason: The returned papers supplied research context or different-boundary findings but no higher-impact direct breach example for the selected set.
sources_blocked: []

conflicts:
  - issue: System prompts may be confidential application logic, while OWASP cautions that a prompt should not be treated as a secret or security control.
    resolution: The technique preserves confidentiality as the immediate impact but makes severity conditional and requires externalized secrets and authorization.
  - issue: Public black-box studies report high extraction rates, but exact prompt ground truth is not always independently observable.
    resolution: Evidence status relies on controlled demonstrations and direct vulnerabilities; black-box percentages are not used as incident counts.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1603-C006
    - SAF-T1603-C007
    - SAF-T1603-C008
    - SAF-T1603-C009
    - SAF-T1603-C010
  rationale: >-
    A public ATLAS exercise and controlled empirical research demonstrate the
    end-to-end behavior, while three direct advisories establish distinct
    application and MCP-connected prompt-disclosure paths. No production-breach
    claim is made.

