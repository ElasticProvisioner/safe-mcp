    affects: [SAF-T1603, SAF-T1102]
    severity: high
    issue: Distinguish prompt extraction from prompt injection used only as a delivery mechanism.
    resolution: The contract and README require unauthorized recovery of hidden instructions as the immediate objective.
    status: resolved
  - id: ALIGN-SAF-T1603-002
    triggered_by: SAF-T1603
    affects: [SAF-T1603]
    severity: high
    issue: Distinguish hidden-instruction disclosure from broader sensitive-information exposure.
    resolution: The technique is limited to system, developer, or agent instructions; no exact generic sensitive-information catalog neighbor exists, so the placeholder join was removed and other data requires a separate classification.
    status: resolved
  - id: ALIGN-SAF-T1603-003
    triggered_by: SAF-T1603
    affects: [SAF-T1603]
    severity: medium
    issue: Reconcile the SAF Discovery tactic with ATLAS system-prompt discovery and Enterprise ATT&CK T1082.
    resolution: ATLAS mappings are direct and T1082 is labeled analogous because its object is operating-system information.
    status: resolved
