breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 4
  selected_examples: [SRC-ghsa-vf7j-7mrx-hp7g, SRC-ghsa-f6x8-65q6-j9m9]
  no_qualifying_examples_rationale: One direct demonstrated vulnerability and one adjacent MCP OAuth phishing vulnerability were the highest-value examples; no direct production incident qualified.
  candidates:
    - {source_id: SRC-ghsa-vf7j-7mrx-hp7g, identifier: CVE-2026-31944 / GHSA-vf7j-7mrx-hp7g, relationship: direct_vulnerability, exploitation_status: public_poc_no_production_exploitation_identified, impact: Victim third-party OAuth access bound to attacker account with high confidentiality and bounded integrity impact., remediation: Fixed in LibreChat 0.8.3-rc1., selected: true, rationale: Exact match to initiator/completer identity misbinding and cross-user token storage.}
    - {source_id: SRC-ghsa-f6x8-65q6-j9m9, identifier: CVE-2026-42230 / GHSA-f6x8-65q6-j9m9, relationship: adjacent_incident_or_vulnerability, exploitation_status: CISA_SSVS_none_and_not_in_KEV, impact: Denial of MCP OAuth consent could redirect a victim to an attacker site., remediation: Fixed in n8n 1.123.32, 2.17.4, and 2.18.1., selected: true, rationale: High-relevance MCP OAuth phishing boundary, but no cross-user token binding.}
    - {source_id: SRC-ms-oauth-redirection-2026, identifier: Microsoft OAuth redirection campaigns, relationship: historical_analogy, exploitation_status: observed_production_campaigns, impact: Redirected users to phishing and malware delivery infrastructure without stealing OAuth tokens., remediation: OAuth app governance and cross-domain monitoring., selected: false, rationale: Production observation is valuable context but uses standards-compliant redirects outside MCP.}
    - {source_id: SRC-ms-shinyhunters-oauth-2026, identifier: ShinyHunters-associated OAuth consent campaigns, relationship: historical_analogy, exploitation_status: observed_production_campaigns, impact: OAuth-backed SaaS access, persistence, and data exfiltration., remediation: Connected-app governance and event monitoring., selected: false, rationale: Malicious application consent differs from benign MCP server cross-user binding.}
