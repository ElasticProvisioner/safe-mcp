sources_rejected:
  - {source_id: SRC-ghsa-php-7m52, reason: Availability-oriented framing abuse lies outside the response-integrity objective.}
  - {source_id: SRC-ghsa-python-jpw9, reason: Cross-session request injection lies on the request side of the boundary.}
  - {source_id: SRC-mcp-security-spec-2026-07-28, reason: General security context added no distinct publishable proposition.}
  - {source_id: SRC-mcp-logging-2026-07-28, reason: Deprecated logging utility does not define paired integrity checkpoints.}
  - {source_id: SRC-cwe-345, reason: Broad authenticity parent is less specific than CWE-924.}
  - {source_id: SRC-capec-385, reason: Broader transaction tampering is less specific than CAPEC-384.}
  - {source_id: SRC-owasp-llm-top10, reason: Broader prompt and output risks do not establish the frozen response-path behavior.}
  - {source_id: SRC-otel-genai-observability, reason: Reviewed page did not provide stable paired-digest semantics.}
  - {source_id: SRC-mcp-doc-index-2026, reason: Discovery index established currency but supports no substantive claim.}
sources_blocked: []

conflicts:
  - issue: The controlled study reports varying raw attack entry across agents.
    resolution: Retain engagement-conditional results and the authors' warning that low tool use can resemble robustness.
  - issue: Selected advisories disclose plausible or demonstrated vulnerabilities but do not report production compromise.
    resolution: Classify the technique as Demonstrated and preserve the production-evidence gap.
  - issue: TypeScript SDK response misrouting may occur without malicious rewriting.
    resolution: Label it adjacent provenance confusion, not intentional content modification.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids: [SAF-T1404-C002, SAF-T1404-C003, SAF-T1404-C005]
  rationale: >-
    The defined end-to-end behavior is directly demonstrated by the controlled
    MCP-compatible response proxy and by a disclosed response-origin substitution
    flaw. The reviewed corpus does not establish production observation.

