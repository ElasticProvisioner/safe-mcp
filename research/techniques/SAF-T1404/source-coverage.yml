breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 6
  selected_examples:
    - SRC-zhan-aei-2026
    - SRC-ghsa-mcp-atlassian-7r34
    - SRC-ghsa-ts-sdk-345p
  no_qualifying_examples_rationale: >-
    Three examples qualify, but none is a direct production breach. The reviewed
    authoritative catalog, KEV feed, advisories, and controlled study support a
    demonstration classification only; this bounded absence remains explicit.
  candidates:
    - source_id: SRC-zhan-aei-2026
      identifier: "arXiv:2604.18874v1 POTEMKIN man-in-the-tool study"
      relationship: direct_demonstration
      exploitation_status: controlled experiment only
      impact: Modified retrieval and structural responses changed agent decisions or consumed step budgets in a controlled citation domain.
      remediation: The study evaluates several defenses but does not establish a universal complete defense.
      selected: true
      rationale: Directly exercises the defined response-channel transformation boundary and reports controlled results and limitations.
    - source_id: SRC-ghsa-mcp-atlassian-7r34
      identifier: CVE-2026-27826 / GHSA-7r34-79r5-rcc9
      relationship: direct_vulnerability
      exploitation_status: proof of concept reported by CISA SSVC in NVD; no production breach established
      impact: An attacker-selected upstream could supply crafted content as Jira or Confluence tool results.
      remediation: Upgrade mcp-atlassian to 0.17.0 or later.
      selected: true
      rationale: Direct response-origin substitution with high conceptual fit and a documented fix.
    - source_id: SRC-ghsa-ts-sdk-345p
      identifier: CVE-2026-25536 / GHSA-345p-7cg4-v4c7
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: none reported in the reviewed NVD CISA SSVC field
      impact: Shared server or transport instances could deliver one client's final response or progress to another client.
      remediation: Upgrade the TypeScript SDK to 1.26.0 or later and avoid shared transport/server instances.
      selected: true
      rationale: High-impact provenance confusion clarifies substitution and misrouting while its non-adversarial concurrency root cause remains explicit.
    - source_id: SRC-ghsa-5ire-8527
      identifier: CVE-2025-58357 / GHSA-8527-3cch-95gf
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: proof of concept reported by CISA SSVC in NVD; no production breach established
      impact: Crafted content could reach unsafe chart evaluation and execute code in the client.
      remediation: Upgrade 5ire to 0.14.0 or later.
      selected: false
      rationale: Compromised MCP output is only a delivery vector; unsafe downstream evaluation is the actual weakness.
    - source_id: SRC-ghsa-php-7m52
      identifier: CVE-2026-53965 / GHSA-7m52-jw36-44r3
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: advisory demonstration; production exploitation not established
      impact: A withheld stream delimiter could drive unbounded buffering and denial of service.
      remediation: Upgrade the PHP SDK to 0.7.1 or later.
      selected: false
      rationale: The defining objective is availability loss through framing, not corrupted response acceptance.
    - source_id: SRC-ghsa-python-jpw9
      identifier: CVE-2026-52869 / GHSA-jpw9-pfvf-9f58
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: vulnerability disclosure; production exploitation not established
      impact: An unbound session identifier could permit JSON-RPC request injection into another session.
      remediation: Upgrade the Python SDK to 1.27.2 or later and bind session authorization.
      selected: false
      rationale: The primary manipulated object is an injected request, outside the frozen response-side boundary.

