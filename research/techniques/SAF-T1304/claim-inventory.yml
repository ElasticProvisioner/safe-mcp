      - source_id: SRC-microsoft-ai-gateway-incident
        support: direct
        exact_locators: ["Credential extraction and later key use; lines 100-118 and 246-248"]
    corroboration: The excluded candidates instantiate adjacent acquisition mechanisms without the defining relay boundary.
    limitations: [Synthetic SAF neighbor identifiers require catalog reconciliation after freeze.]
    conflicts: []
