    corroboration: Detection authority supplies the correlation elements needed for investigation.
    limitations: [Issuer-specific operational steps vary.]
    conflicts: []
    inference: {is_inference: true, rationale: Response sequence is synthesized from cause, fix, and replay guidance.}
    status: validated
  - id: SAF-T1304-C019
    statement: Token acquisition and legitimate scope escalation are neighboring but distinct mechanisms from cross-boundary credential relay.
    class: framework_inference
    materiality: medium
