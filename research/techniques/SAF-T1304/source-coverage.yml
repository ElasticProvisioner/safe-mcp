conflicts:
  - issue: Direct public demonstrations exist, but no direct production breach was identified.
    resolution: Set overall evidence to Demonstrated and explicitly avoid the Observed label.
  - issue: ATT&CK T1550.001 maps application-token use to Lateral Movement rather than Privilege Escalation.
    resolution: Use an Analogous mapping and preserve ATK-TA0004 from the SAF contract.
evidence_assessment:
  overall_status: demonstrated
  core_claim_ids: [SAF-T1304-C001, SAF-T1304-C006]
  rationale: >-
    The FastMCP proof of concept demonstrates the complete cross-resource chain,
    and the GitHub MCP advisory independently demonstrates cross-principal
    credential substitution. No qualifying production exploitation source was
    found, so Observed is not supported.
