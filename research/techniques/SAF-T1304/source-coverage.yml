technique_id: SAF-T1304
research_status: saturated
saturation:
  reached: true
  consecutive_no_change_passes: 2
  passes:
    - pass: protocol_and_authority
      completed_on: "2026-09-01"
      queries:
        - "site:modelcontextprotocol.io/specification 2026 authorization resource audience token passthrough"
        - "site:rfc-editor.org OAuth malicious protected resource audience replay"
      material_changes:
        - Established the normative audience, no-passthrough, resource-indicator, replay, and malicious-resource foundations.
    - pass: known_breaches_and_vulnerabilities
      completed_on: "2026-09-01"
      queries:
        - "site:nvd.nist.gov MCP audience validation CVE"
        - "site:nvd.nist.gov MCP credential cache token CVE 2026"
        - "site:learn.microsoft.com MCP bearer token forwarded revalidation known issue"
        - "site:microsoft.com/security/blog MCP incident credential token 2026"
      material_changes:
        - Selected three direct implementation vulnerabilities and one current documented preview exposure.
        - Recorded that no reviewed candidate established a direct production breach.
    - pass: demonstration_and_empirical_research
      completed_on: "2026-09-01"
      queries:
        - "site:nvd.nist.gov CVE-2025-69196"
        - "site:nvd.nist.gov CVE-2026-48529"
      material_changes:
        - Classified the FastMCP end-to-end proof of concept as Demonstrated evidence.
    - pass: detection_and_defense
      completed_on: "2026-09-01"
      queries:
        - "site:attack.mitre.org application access token reuse detection"
        - "site:github.blog secure remote MCP token audience scope"
      material_changes:
        - Defined the audience, principal, and cross-resource fingerprint analytic and control set.
    - pass: gap_and_challenge
      completed_on: "2026-09-01"
      queries:
        - "site:microsoft.com/security/blog OAuth token relay incident 2026"
        - "site:nvd.nist.gov OAuth token replay CVE 2026 MCP"
      material_changes:
        - Excluded acquisition, redirect, availability, and general gateway incidents that did not cross the defining boundary.
    - pass: saturation_follow_up_1
      completed_on: "2026-09-01"
      queries:
        - "site:nvd.nist.gov CVE Google MCP Toolbox 2026 authorization"
        - "site:learn.microsoft.com Foundry Local MCP token forwarding GAP-02"
      material_changes: []
    - pass: saturation_follow_up_2
      completed_on: "2026-09-01"
      queries:
        - "site:modelcontextprotocol.io 2026 token audience relay security"
        - "site:nvd.nist.gov MCP cross-user credential cache"
      material_changes: []
  rationale: >-
    Current protocol authorities, OAuth standards, government vulnerability
    records, exact maintainer advisories reached through those records, current
    vendor known issues, production-incident research, framework detection, and
    maintainer architecture guidance cover every publishable proposition. Two
    differently phrased follow-up passes changed neither the contract, evidence
    level, selected examples, analytic, nor exclusions.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 11
  selected_examples:
    - SRC-fastmcp-ghsa
    - SRC-nvd-cve-2026-14541
    - SRC-github-mcp-ghsa
    - SRC-foundry-local-gap02
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-fastmcp-ghsa
      identifier: CVE-2025-69196 / GHSA-5h2m-4q8j-pqpj
      relationship: direct_demonstration
      exploitation_status: public_proof_of_concept
      impact: A token obtained for another resource can be replayed for protected tools and resources.
      remediation: Upgrade FastMCP to 2.14.2 or later.
      selected: true
      rationale: Highest directness; demonstrates the complete MCP resource-relay chain.
    - source_id: SRC-nvd-cve-2026-14541
      identifier: CVE-2026-14541
      relationship: direct_vulnerability
      exploitation_status: none_reported
      impact: Any valid Google token could be accepted for protected MCP tools when audience configuration was absent.
      remediation: Upgrade Google MCP Toolbox to 1.5.0 or later and configure audience.
      selected: true
      rationale: High-impact wrong-audience acceptance in a major MCP implementation.
    - source_id: SRC-github-mcp-ghsa
      identifier: CVE-2026-48529 / GHSA-pjp5-fpmr-3349
      relationship: direct_demonstration
      exploitation_status: public_proof_of_concept
      impact: Later HTTP callers could execute with the first caller's GitHub credential.
      remediation: Upgrade GitHub MCP Server to 1.1.2 or later.
      selected: true
      rationale: Direct cross-principal substitution with controlled proof of concept.
    - source_id: SRC-foundry-local-gap02
      identifier: Microsoft Foundry Local GAP-02
      relationship: enabling_vulnerability
      exploitation_status: not_reported
      impact: A malicious external MCP server could capture and replay a forwarded caller token.
      remediation: Use only trusted servers or avoid the affected preview authentication mode while under review.
      selected: true
      rationale: Current vendor-documented implementation exposure closely matching token passthrough.
    - source_id: SRC-microsoft-ai-gateway-incident
      identifier: LiteLLM AI gateway production incident
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed_production
      impact: Database access enabled model and virtual-key extraction.
      remediation: Vendor-reported incident response and gateway hardening.
      selected: false
      rationale: Credential extraction and later use, but no current-caller credential relay.
    - source_id: SRC-t1206-ms-config-risk
      identifier: Exposed MCP misconfiguration research
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed_exposure
      impact: Unauthenticated MCP services were reachable.
      remediation: Correct authentication and exposure configuration.
      selected: false
      rationale: Missing authentication is not credential propagation.
    - source_id: SRC-ms-oauth-redirection-2026
      identifier: OAuth redirection abuse
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed_campaign
      impact: OAuth redirect endpoints supported phishing and malware delivery.
      remediation: Redirect validation and phishing controls.
      selected: false
      rationale: The source states the attacker does not receive the token.
    - source_id: SRC-nvd-cve-2025-4143
      identifier: CVE-2025-4143
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: unknown
      impact: Redirect weakness could expose an OAuth token.
      remediation: Apply vendor correction.
      selected: false
      rationale: Initial token acquisition, not downstream authorization relay.
    - source_id: SRC-nvd-cve-2026-53518
      identifier: CVE-2026-53518
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: unknown
      impact: Authorization-code redemption race could mint duplicate tokens.
      remediation: Apply vendor correction.
      selected: false
      rationale: Duplicate issuance does not establish an MCP relay boundary.
    - source_id: SRC-nvd-cve-2026-14539
      identifier: CVE-2026-14539
      relationship: rejected
      exploitation_status: none_reported
      impact: Availability impact in Google MCP Toolbox.
      remediation: Apply vendor correction.
      selected: false
      rationale: Availability flaw without credential authorization behavior.
    - source_id: SRC-nvd-cve-2025-6238
      identifier: CVE-2025-6238
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: unknown
      impact: Redirect weakness could support token interception.
      remediation: Apply vendor correction.
      selected: false
      rationale: Credential acquisition rather than relay.
