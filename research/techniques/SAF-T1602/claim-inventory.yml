      - source_id: SRC-mcp-tools-2026-07-28
        support: corroborating
        exact_locators:
          - Listing Tools request and response (rendered lines 127-175)
    corroboration: The directly reviewed current protocol and first-party tool agree on the complete listing operation.
    limitations:
      - The production-incident conclusion is bounded to the documented direct-authority corpus reviewed on 2026-09-02.
    conflicts: []
    inference:
      is_inference: false
      rationale: null
