    challenged against the contract and rejected as adjacent. Two consecutive
    re-fetch passes produced byte-identical archives and no claim, boundary,
    example, detection, or mapping change.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 3
  selected_examples: []
  no_qualifying_examples_rationale: >-
    Direct CVE records, their maintainer or CNA advisories, and embedded CISA ADP
    exploitation assessments were reviewed for three high-impact MCP families.
    They concern Inspector proxy authentication and command execution,
    authorization-endpoint command injection, and filesystem symlink boundary
    bypass—not use or abuse of tools/list. No direct production incident, direct
    vulnerability, or malicious direct demonstration qualified. The technique
    therefore retains one controlled Inspector demonstration and states the
    dated evidence gap instead of borrowing adjacent events.
  candidates:
    - source_id: SRC-cve-2025-49596
      identifier: CVE-2025-49596 / GHSA-7f8r-222p-6f5g
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA ADP recorded exploitation none on 2025-06-13
      impact: Unauthenticated requests to affected MCP Inspector proxy versions could launch commands over stdio, with total technical impact assessed by CISA ADP.
      remediation: Upgrade MCP Inspector to 0.14.1 or later.
      selected: false
      rationale: The flaw crosses the Inspector client-proxy authentication boundary and enables command execution; it neither performs nor depends on tool enumeration.
    - source_id: SRC-cve-2025-6514
      identifier: CVE-2025-6514 / JFSA-2025-001290844
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA ADP recorded exploitation none on 2025-07-09
      impact: A crafted authorization_endpoint response URL could produce OS command injection in mcp-remote, with total technical impact assessed by CISA ADP.
      remediation: Upgrade from affected 0.0.5 through 0.1.15 releases to 0.1.16 or later.
      selected: false
      rationale: The issue abuses OAuth endpoint URL handling; it does not enumerate tool definitions.
    - source_id: SRC-cve-2025-53109
      identifier: CVE-2025-53109 / GHSA-q66q-fx2p-7w4m
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA ADP recorded exploitation none on 2025-07-02
      impact: Symlinks inside allowed directories could expose unintended filesystem content, with partial technical impact assessed by CISA ADP.
      remediation: The later CVE record advises 0.6.4 or 2025.7.01; the maintainer advisory displays an inconsistent earlier boundary, so exact backport status requires separate reconciliation.
      selected: false
      rationale: The flaw concerns resource/file boundary enforcement after access, not discovery of callable tool definitions.

