conflicts:
  - issue: >-
      The displayed GHSA-q66q-fx2p-7w4m version language differs from the later
      CVE-2025-53109 affected and remediation boundary.
    resolution: >-
      Preserve the discrepancy in the research packet and exclude the adjacent
      candidate; no publishable claim depends on its exact fixed version.
  - issue: A legitimate first-party client and an adversary can emit the same tools/list method.
    resolution: The analytic is explicitly behavioral and experimental, requiring authorization context or locally abnormal pagination rather than treating the method alone as malicious.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1602-C004
    - SAF-T1602-C016
  rationale: >-
    Current normative documentation defines the entire request and response,
    while the first-party Inspector documents an end-to-end listing workflow.
    This demonstrates Tool Enumeration but does not establish malicious or
    production use; the technique states that limitation throughout.

