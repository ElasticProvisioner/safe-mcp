breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 10
  selected_examples:
    - SRC-unit42-tj-actions-agentkit
    - SRC-nx-s1ngularity-postmortem
    - SRC-microsoft-axios-2026
    - SRC-microsoft-asyncapi-2026
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-unit42-tj-actions-agentkit
      identifier: CVE-2025-30066 / tj-actions changed-files / Coinbase AgentKit
      relationship: direct_production_incident
      exploitation_status: observed_execution_and_token_access; downstream_package_publish_interrupted
      impact: Malicious action executed in an agentic CI path and obtained a write-capable token.
      remediation: Compromised tags were reverted; pin actions to reviewed full SHAs and rotate exposed credentials.
      selected: true
      rationale: Highest-directness production evidence in an explicitly agentic project, with bounded impact and uncertainty.
    - source_id: SRC-nx-s1ngularity-postmortem
      identifier: s1ngularity npm compromise
      relationship: direct_production_incident
      exploitation_status: observed_malicious_packages_and_exfiltration
      impact: Install-time execution, credential discovery, AI-tool invocation, and exfiltration from developer or CI contexts.
      remediation: Malicious versions removed; Nx moved to trusted publishing, manual approvals, and provenance checks.
      selected: true
      rationale: Direct production evidence involving AI developer tools and high-volume packages.
    - source_id: SRC-microsoft-axios-2026
      identifier: Axios versions 1.14.1 and 0.30.4
      relationship: historical_analogy
      exploitation_status: observed_malicious_release_and_payload_delivery
      impact: Trusted package versions executed a dependency-supplied loader on developer and CI hosts.
      remediation: Roll back to 1.14.0 or 0.30.3, purge caches, rotate credentials, and restrict automatic upgrades.
      selected: true
      rationale: Current, high-impact trusted-package example with explicit detection and remediation; no MCP consumer established.
    - source_id: SRC-microsoft-asyncapi-2026
      identifier: AsyncAPI package compromise, July 2026
      relationship: historical_analogy
      exploitation_status: observed_trusted_pipeline_publish_and_import_time_execution
      impact: Five versions across four packages executed on import with valid provenance from an abused trusted workflow.
      remediation: Remove affected versions, purge caches, use known-good pins, hunt persistence and egress, rotate credentials.
      selected: true
      rationale: Current example demonstrating that valid provenance and disabled install scripts can both be insufficient.
    - source_id: SRC-tanstack-2026-postmortem
      identifier: CVE-2026-45321 / TanStack Router and Start compromise
      relationship: historical_analogy
      exploitation_status: observed_malicious_package_publication
      impact: 84 malicious versions across 42 packages with install-time credential theft and propagation logic.
      remediation: Versions deprecated and removed; credentials rotated; workflows, caches, and release controls hardened.
      selected: false
      rationale: Strong but overlaps the selected current package cases and has less agentic specificity.
    - source_id: SRC-nx-console-2026-postmortem
      identifier: Nx Console 18.95.0
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: malicious_marketplace_artifact_observed; installation_count_uncertain
      impact: Second-order upstream compromise reached an IDE extension distributed through trusted marketplaces.
      remediation: Upgrade to 18.100.0; compromised version removed; release controls hardened.
      selected: false
      rationale: Valuable second-order example but an IDE-extension case, not direct MCP distribution evidence.
    - source_id: SRC-jfrog-cve-2025-6514
      identifier: CVE-2025-6514
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: researcher_demonstrated; production_exploitation_not_established
      impact: Untrusted MCP server metadata can trigger command or executable execution in vulnerable mcp-remote versions.
      remediation: Upgrade to 0.1.16 or later and use trusted HTTPS servers.
      selected: false
      rationale: A product vulnerability exercised after connection, not compromise of a trusted software supply path.
    - source_id: SRC-aws-cve-2026-18953
      identifier: CVE-2026-18953
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: not_stated_by_vendor
      impact: A tool parameter can write outside the intended directory and may lead to local code execution.
      remediation: Upgrade aws-transform-mcp-server to 0.1.5 or later; no configuration-only workaround.
      selected: false
      rationale: An ordinary implementation vulnerability, not altered distribution.
    - source_id: SRC-microsoft-typosquat-2026
      identifier: vpmdhaj typosquatted npm campaign
      relationship: rejected
      exploitation_status: active_campaign_observed
      impact: Malicious new packages harvested cloud, CI/CD, Vault, and npm credentials.
      remediation: Packages and users removed; hunt lifecycle execution and egress, rotate credentials.
      selected: false
      rationale: The actor created deceptive new packages rather than compromising an existing trusted producer or channel.
    - source_id: SRC-mcp-ecosystem-dsn-2026
      identifier: MCP registry-entry hijack demonstration
      relationship: direct_demonstration
      exploitation_status: controlled_local_demonstration_only
      impact: Demonstrates conditions under which registry pointers or ownership continuity can be abused.
      remediation: Continuous ownership checks, stronger vetting, and suspicious-server analysis.
      selected: false
      rationale: Used as feasibility evidence, not a production breach example.

