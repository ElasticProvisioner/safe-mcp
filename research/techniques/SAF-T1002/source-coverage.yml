    - SAF-T1002-C003
  rationale: >-
    Production incidents establish malicious execution through trusted build or
    dependency paths in agentic development environments. Controlled MCP
    research establishes MCP-specific feasibility, while the review explicitly
    does not claim a production compromise of the official MCP Registry.

