conflicts:
  - issue: Namespace authentication or valid provenance might be read as proof that the artifact is safe.
    resolution: Registry documentation limits namespace checks to claimed-source authenticity, and the AsyncAPI case shows valid provenance from an abused trusted pipeline.
  - issue: The AgentKit action compromise obtained a write token but did not produce known downstream damage.
    resolution: Classified as direct observed acquisition-path compromise with explicitly bounded impact, not a completed package-publication breach.
  - issue: Current MCP CVEs demonstrate host compromise potential but not supply-chain alteration.
    resolution: Kept as adjacent candidates and omitted from Procedure Examples.

