conflicts:
  - issue: Invariant directly demonstrates hidden tool-parameter exfiltration, but does not name the transport.
    resolution: Classified the complete HTTP-specific behavior as Research-Derived rather than Demonstrated.
  - issue: Selected CVEs and disclosures establish MCP data exfiltration through link unfurling or SSRF.
    resolution: Labeled every selected example adjacent and prohibited it from elevating the technique status.
  - issue: MCP transport behavior changed between 2025-11-25 and 2026-07-28.
    resolution: Scoped normative and detection claims to protocol version 2026-07-28 and recorded backward-compatibility limits.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1913-C004
  rationale: >-
    The current MCP specification independently establishes the HTTP POST transport
    and tools/call argument shape, while Invariant establishes sensitive-data transfer
    through a hidden tool parameter. Joining those components supports the exact
    behavior as an explicit inference. No reviewed source establishes the complete
    transport-specific behavior in production or a public controlled evaluation.

