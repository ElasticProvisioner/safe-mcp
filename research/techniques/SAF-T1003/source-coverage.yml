breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 2
  selected_examples:
    - SRC-checkmarx-runcommand
    - SRC-jfrog-cve-2025-6514
  candidates:
    - source_id: SRC-checkmarx-runcommand
      identifier: "@lanyer640/mcp-runcommand-server versions 1.0.6 and later"
      relationship: direct_production_incident
      exploitation_status: Malicious public-registry distribution observed; controlled detonation documented; named production victim not established.
      impact: Install-time reverse shell operating with the installing user's privileges.
      remediation: npm removed the package; block exact versions and artifacts and remove retained cache copies.
      selected: true
      rationale: Highest-impact directly reviewed example that satisfies the malicious MCP-server distribution contract.
    - source_id: SRC-jfrog-cve-2025-6514
      identifier: CVE-2025-6514
      relationship: enabling_vulnerability
      exploitation_status: Controlled exploitation demonstrated by JFrog; production exploitation not established by the selected source.
      impact: Command or executable execution when affected mcp-remote connects to an untrusted or hijacked server.
      remediation: Upgrade mcp-remote to 0.1.16 or later and connect only to trusted servers over HTTPS.
      selected: true
      rationale: High-impact enabling client vulnerability with precise affected and fixed versions; explicitly not a distribution incident.

