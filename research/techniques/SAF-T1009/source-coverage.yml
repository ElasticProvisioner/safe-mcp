conflicts:
  - issue: RFC 9700 requires a mix-up defense for multi-AS clients, while current MCP permits missing iss when support is false or absent.
    resolution: The draft states the compatibility case and residual risk explicitly; the analytic treats it as an expected legitimate case unless local policy is stricter.
  - issue: Several high-impact issuer vulnerabilities resemble mix-up but occur at token validation, assertion audience construction, or account linking.
    resolution: They are labeled adjacent and cannot raise the end-to-end evidence status.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1009-C004
  rationale: >-
    Current MCP directly supports the multi-authorization-server boundary and
    normatively requires the exact issuer-binding control; OAuth standards and
    research demonstrate the complete generic client attack. No reviewed source
    demonstrates or observes the complete behavior in an MCP client, so the MCP
    technique remains an explicit inference.

