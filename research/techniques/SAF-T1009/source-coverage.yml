breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 8
  selected_examples:
    - SRC-fett-oauth-analysis
    - SRC-ghsa-authjs-provider-binding
    - SRC-nvd-cve-2026-11718
    - SRC-oidf-private-key-jwt-disclosure
  no_qualifying_examples_rationale: >-
    No direct production incident and no direct MCP authorization-response
    mix-up CVE was found. One direct OAuth demonstration and three adjacent
    high-impact cases were retained to show the exact mechanism and its nearest
    implementation boundaries without inflating the overall evidence status.
  candidates:
    - source_id: SRC-fett-oauth-analysis
      identifier: Fett-Küsters-Schmitz IdP Mix-Up demonstration
      relationship: direct_demonstration
      exploitation_status: controlled demonstration on mod_auth_openidc and pyoidc; no production exploitation claimed
      impact: Demonstrated disclosure of an honest provider's authorization code or access token and resulting authorization or authentication failure.
      remediation: Issuer identity is bound into the response and checked; the result informed later OAuth standards.
      selected: true
      rationale: Highest-directness evidence for the defining end-to-end OAuth client behavior, while explicitly non-MCP and non-production.
    - source_id: SRC-mainka-oidc-endpoints
      identifier: Malicious Endpoints Attack
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: controlled demonstration; no production exploitation claimed
      impact: Attacker-chosen discovery endpoints can receive codes, tokens, or client secrets.
      remediation: Bind discovery to the issuer in the authorization response and restrict endpoints; separate SSRF and denial-of-service controls remain necessary.
      selected: false
      rationale: Useful neighboring behavior but less direct than the selected formal mix-up demonstration.
    - source_id: SRC-ghsa-authjs-provider-binding
      identifier: CVE-2026-73419 / GHSA-x445-f3h2-j279
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA SSVC exploitation none as recorded by NVD on 2026-08-13
      impact: Under multiple preconditions, provider-unbound OAuth check cookies can cause persistent unauthorized account linking.
      remediation: Upgrade to @auth/core 0.41.3, next-auth 4.24.15, or 5.0.0-beta.32; provider-bind flow checks.
      selected: true
      rationale: Current, high-consequence callback-provider confusion that clarifies the boundary between state misbinding and credential disclosure.
    - source_id: SRC-nvd-cve-2026-11718
      identifier: CVE-2026-11718 / mcp-toolbox PR 3360
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA SSVC exploitation none as recorded by NVD on 2026-06-18
      impact: Opaque tokens from unintended identity providers could be accepted when introspection omitted iss.
      remediation: Issuer-presence enforcement and tests merged 2026-06-04 and released in mcp-toolbox 1.4.0.
      selected: true
      rationale: Directly MCP-specific and critical impact, but kept adjacent because the failure occurs at resource-server token validation.
    - source_id: SRC-oidf-private-key-jwt-disclosure
      identifier: CVE-2025-27370
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: OpenID Foundation reported no known compromises; CISA SSVC exploitation none
      impact: A malicious authorization server can obtain a client assertion usable to impersonate the client at another authorization server.
      remediation: Use and accept only the authorization-server issuer identifier as the private_key_jwt audience.
      selected: true
      rationale: Closely related multi-AS malicious-metadata attack with cross-issuer credential consequence and primary standards-body remediation.
    - source_id: SRC-nvd-issuer-validation-query
      identifier: CVE-2023-41890
      relationship: historical_analogy
      exploitation_status: CISA SSVC exploitation none in NVD
      impact: A SAML response could be processed as if issued by another identity provider.
      remediation: Upgrade Sustainsys.Saml2 to 2.9.2 or 1.0.3 or add documented validation.
      selected: false
      rationale: Strong issuer/state analogy but outside OAuth and MCP.
    - source_id: SRC-nvd-issuer-validation-query
      identifier: CVE-2018-1256
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: not established in the reviewed record
      impact: Tokens from one SSO plan could authenticate to an unbound resource server in multi-plan deployments.
      remediation: Fixed after Spring Cloud SSO Connector 2.1.2; exact later version was not established from the reviewed query record.
      selected: false
      rationale: Token issuer acceptance is downstream of, and distinct from, authorization-response mix-up.
    - source_id: SRC-nvd-oauth-mixup-query
      identifier: Exact NVD OAuth mix-up query
      relationship: rejected
      exploitation_status: no records returned
      impact: No impact record was available from this exact query.
      remediation: Not applicable.
      selected: false
      rationale: Preserves the direct-CVE search gap; a zero-result catalog query is not vulnerability evidence.

