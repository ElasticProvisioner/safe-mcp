      material_changes:
        - Bound the technique to PKCE-to-plain or PKCE-to-absent weakening rather than every OAuth downgrade.
        - Established current MCP fail-closed metadata behavior and S256 preference.
    - pass: known_breaches_and_vulnerabilities
      completed_on: "2026-09-01"
      queries:
        - NVD API keywordSearch=PKCE
        - NVD API keywordSearch=OAuth downgrade
        - NVD API keywordSearch=PKCE plain
        - NVD API keywordSearch=Model Context Protocol OAuth
        - CISA KEV 2026.09.01 OAuth, PKCE, MCP, and exact-CVE scans
      material_changes:
        - Selected CVE-2026-67336 as a direct MCP-plugin vulnerability.
        - Selected CVE-2024-23647 and CVE-2024-22258 as enabling OAuth authorization-server vulnerabilities with explicit MCP limitations.
        - Found no qualifying production MCP breach in the reviewed authority corpus.
    - pass: demonstration_and_empirical_research
      completed_on: "2026-09-01"
      queries:
        - RFC 9700 Sections 4.8 through 4.8.2 attack and countermeasure review
        - First-party GHSA-9h47-pqcx-hjr4 runtime behavior and patch review
        - First-party GHSA-mrx3-gxjx-hjqj attack details review
      material_changes:
        - Classified the generic OAuth attack as demonstrated but the complete MCP behavior as Research-Derived.
        - Preserved the direct MCP-plugin weakness without treating the advisory as a production incident.
    - pass: detection_and_defense
      completed_on: "2026-09-01"
      queries:
        - RFC 9700 Section 4.8.2 server-state correlation and rejection requirement
        - RFC 7636 Section 7.2 S256-to-plain downgrade signal
        - Current MCP PKCE capability verification and refusal rules
      material_changes:
        - Designed three correlated downgrade patterns and an explicit legacy-compatibility suppression.
        - Added eleven deterministic positive, negative, boundary, malformed, normalization, and expected-lookalike cases.
    - pass: gap_and_challenge
      completed_on: "2026-09-01"
      queries:
        - NVD API keywordSearch=code_challenge_method
        - MCP security guidance for issuer mix-up, metadata SSRF, and authorization URL injection
        - Spring advisory unaffected-public-client condition
        - CISA KEV exact-ID and exploitation-status checks
      material_changes:
        - Excluded endpoint, SSRF, transport, OAuth 1.0, verifier-recovery, and parameter-substitution analogies.
        - Narrowed Spring applicability to confidential clients and made incomplete telemetry an explicit analytic blind spot.
    - pass: saturation_follow_up_1
