  rationale: >-
    Current MCP requirements, underlying OAuth standards, one direct MCP-plugin
    advisory, two first-party authorization-server advisories, government CVE
    records, KEV exploitation checks, detection requirements, contrary cases,
    and neighbor mechanisms were directly reviewed. After incorporating the
    authentik and Spring cases, two consecutive narrow authority-catalog passes
    returned no records and added no controlling requirement, qualifying
    example, remediation change, detection constraint, or scope distinction.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 5
  selected_examples:
    - SRC-cve-2026-67336
    - SRC-cve-2024-23647
    - SRC-cve-2024-22258
  no_qualifying_examples_rationale: >-
    No direct production incident qualified. Only CVE-2026-67336 names an MCP
    plugin; the two other selected examples are enabling OAuth authorization-
    server vulnerabilities retained for mechanism and remediation value, not
    evidence that an MCP deployment was exploited.
  candidates:
    - source_id: SRC-cve-2026-67336
      identifier: CVE-2026-67336 / GHSA-9h47-pqcx-hjr4
      relationship: direct_vulnerability
      exploitation_status: CISA Coordinator SSVC reported none on 2026-08-03; no CISA KEV entry on 2026-09-01.
      impact: Plain PKCE in the legacy MCP plugin can expose authorization codes when the authorization URL is observable; the same advisory also covers a separate unsigned-token default.
      remediation: Fixed in better-auth 1.6.11; migrate to @better-auth/oauth-provider or disable plain PKCE explicitly.
      selected: true
      rationale: Highest directness because the affected legacy plugin is explicitly an MCP authorization component and silently downgraded a missing method to plain.
    - source_id: SRC-cve-2024-23647
      identifier: CVE-2024-23647 / GHSA-mrx3-gxjx-hjqj
      relationship: enabling_vulnerability
      exploitation_status: No production exploitation was stated in the reviewed advisory and no CISA KEV entry was present on 2026-09-01.
      impact: Removing code_challenge could bypass PKCE and enable code-injection or CSRF outcomes when a victim followed the attacker-controlled authorization link.
      remediation: Fixed in authentik 2023.8.7 and 2023.10.7.
      selected: true
      rationale: Exact match to the standards-described challenge-removal downgrade; retained with the limitation that the source does not document MCP use.
    - source_id: SRC-cve-2024-22258
      identifier: CVE-2024-22258
      relationship: enabling_vulnerability
      exploitation_status: No production exploitation was stated in the reviewed Spring advisory and no CISA KEV entry was present on 2026-09-01.
      impact: Confidential clients using PKCE were exposed to downgrade; public clients were explicitly unaffected.
      remediation: Fixed in Spring Authorization Server 1.0.6, 1.1.6, and 1.2.3.
      selected: true
      rationale: First-party advisory precisely bounds an important client-type exception and fixed ranges; no MCP deployment is established.
    - source_id: SRC-cve-2026-26247
      identifier: CVE-2026-26247
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA Coordinator SSVC reported none; no CISA KEV entry was present on 2026-09-01.
      impact: Gitea could exchange a code without the expected verifier after failing to persist S256 state.
      remediation: Fixed in Gitea 1.25.5.
      selected: false
      rationale: Relevant PKCE enforcement failure but less faithful to attacker-influenced negotiation than the selected challenge-removal cases, and no MCP use is established.
    - source_id: SRC-nvd-2023-48228
      identifier: CVE-2023-48228
      relationship: enabling_vulnerability
      exploitation_status: Unknown; the reviewed record did not establish production exploitation.
      impact: authentik accepted token exchange without a verifier even when a challenge had started the flow.
      remediation: Fixed in authentik 2023.8.5 and 2023.10.4.
      selected: false
      rationale: Redundant inverse-stage PKCE enforcement failure superseded for explanatory value by CVE-2024-23647.

