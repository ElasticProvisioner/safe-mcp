conflicts:
  - issue: The better-auth discovery document advertised S256 while runtime accepted plain and silently rewrote a missing method.
    resolution: Treat metadata verification as necessary but insufficient; require runtime fail-closed behavior and correlate observed request state.
  - issue: Spring's confidential-client vulnerability did not affect public clients.
    resolution: State the client-type limitation beside the example and do not generalize the affected range.
  - issue: No direct MCP incident or complete public MCP demonstration was found despite a direct MCP-plugin vulnerability.
    resolution: Set overall evidence to Research-Derived and preserve the bounded absence statement.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1408-C006
  rationale: >-
    MCP requires PKCE verification and supplies the boundary; RFC 9700 and RFC
    7636 establish the complete OAuth downgrade mechanism; and CVE-2026-67336
    establishes a vulnerable MCP plugin. No reviewed source documents all stages
    in a production MCP incident or complete controlled MCP evaluation, so the
    defining end-to-end behavior remains an explicit inference.

