sources_rejected:
  - source_id: SRC-owasp-mcp-tool-poisoning
    reason: >-
      The community page describes poisoning primarily through tool responses,
      which belongs to SAF-T1102 in this framework; using it for SAF-T1001 would
      erase the contract's discovery-time description boundary.
sources_blocked: []

conflicts:
  - issue: The arXiv abstract for MCPTox reports 1,312 cases while the published AAAI paper reports 1,348.
    resolution: The final technique uses the peer-reviewed published count and cites the publisher PDF.
  - issue: The prior technique called the April 2025 disclosure a first real-world observation.
    resolution: The disclosure repeatedly describes experiments; the technique now says first public demonstration and not observed in production.
  - issue: Current ATLAS AML.T0110.000 includes schema and other static definition fields beyond the SAF-T1001 contract.
    resolution: The mapping is direct at the mechanism level but explicitly notes that SAF-T1001 is the narrower top-level-description subset.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1001-C003
    - SAF-T1001-C004
    - SAF-T1001-C011
  rationale: >-
    The defining description-to-model-to-unintended-action chain has been
    reproduced publicly and in controlled research, including a peer-reviewed
    benchmark. The reviewed corpus does not document this exact vector as a
    production adversarial incident, so Observed would overstate the evidence.

