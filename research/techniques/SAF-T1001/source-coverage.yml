sources_rejected:
  - source_id: SRC-mcp-server-instructions-2025-11-03
    reason: Useful implementation context, but the stable tools specification and annotations analysis more directly support published claims.
  - source_id: SRC-mindguard-2508.20412
    reason: White-box attention inspection is not deployable for many hosted models and is unnecessary for the deterministic example analytic.
  - source_id: SRC-secmcp-2508.06418
    reason: Activation-based drift detection assumes model-internal access and mixes tool poisoning with retrieved-content attacks; it does not support the selected log analytic.
  - source_id: SRC-ms-mcp-governance-2026
    reason: Its recommendations are corroborative but duplicated by more direct Microsoft and Google guidance already cited.
  - source_id: SRC-ms-ai-red-team-taxonomy-blog-2026
    reason: The underlying Microsoft taxonomy PDF is the more complete and stable source for the published threat and control claims.
