conflicts:
  - issue: A Microsoft incident-response article says the pattern was observed in 2026 but does not disclose a specific organization, event date, incident record, or postmortem.
    resolution: Treat the article as practice and response context only; do not classify SAF-T1001 as Observed.
  - issue: Static hardening removed Pitfall Lab Tier-1 findings, but one focused document workflow had worse runtime ASR after hardening.
    resolution: Present static rules as review signals and require trace-grounded regression and runtime policy.

