breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 4
  selected_examples:
    - SRC-invariant-whatsapp-mcp-2025-04-07
    - SRC-mcptox-2508.14925
    - SRC-mcp-pitfall-lab-2604.21477
    - SRC-postmark-mcp-incident-2025-09-25
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-invariant-whatsapp-mcp-2025-04-07
      identifier: Invariant WhatsApp MCP controlled cross-server demonstration
      relationship: direct_demonstration
      exploitation_status: Public controlled demonstration; no production exploitation established.
      impact: Demonstrated cross-server access to message history and attacker-directed forwarding in a controlled environment.
      remediation: Inspect complete metadata, pin or hash definitions, reapprove changes, and constrain cross-server data flow.
      selected: true
      rationale: High-impact direct evidence of changed metadata and cross-tool influence at the frozen boundary.
    - source_id: SRC-mcptox-2508.14925
      identifier: MCPTox benchmark arXiv:2508.14925
      relationship: direct_demonstration
      exploitation_status: Controlled benchmark; not production exploitation.
      impact: Demonstrated tool-selection, manipulation, and privacy outcomes across 1,312 tests with a reported maximum ASR of 72.8 percent.
      remediation: Adversarially evaluate agents, minimize exposed tools, and enforce metadata and action controls outside descriptions.
      selected: true
      rationale: Largest directly reviewed multi-server benchmark of the exact defining mechanism.
    - source_id: SRC-mcp-pitfall-lab-2604.21477
      identifier: MCP Pitfall Lab v2 arXiv:2604.21477
      relationship: direct_demonstration
      exploitation_status: Controlled in-process benchmark; not production exploitation.
      impact: Reported 22.6 percent tool-poisoning ASR across four models and trace-validated confidentiality/integrity outcomes.
      remediation: Remove policy from descriptions, constrain schemas, add server-side allowlists and guards, and preserve structured logs and traces.
      selected: true
      rationale: Direct evidence combining runtime outcomes, trace provenance, static analysis, and hardening regression.
    - source_id: SRC-postmark-mcp-incident-2025-09-25
      identifier: Malicious postmark-mcp npm package version 1.0.16
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Publicly documented malicious package; victim exploitation count was not disclosed.
      impact: The package silently added a BCC recipient to outbound email.
      remediation: Remove the package, inspect outbound mail logs, rotate credentials, and use the official server.
      selected: true
      rationale: Highest-impact attributable production-adjacent MCP supply-chain event reviewed, but hidden code behavior is outside the tool-metadata boundary.

