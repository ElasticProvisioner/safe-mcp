version: 1
technique_id: SAF-T1001
research_status: saturated

saturation:
  reached: true
  consecutive_no_change_passes: 2
  passes:
    - pass: protocol_and_authority
      completed_on: "2026-09-01"
      queries:
        - MCP Tools specification description tools/list model controlled
        - official MCP client tool description model mapping
        - current MITRE ATLAS AI Agent Tool Poisoning
      material_changes:
        - Narrowed the technique to the top-level MCP tool description field.
        - Replaced the obsolete Process Injection mapping with current ATLAS AML.T0110.000.
    - pass: incident_and_demonstration
      completed_on: "2026-09-01"
      queries:
        - original Invariant Labs tool poisoning disclosure and author footer
        - peer-reviewed MCP tool poisoning benchmark
        - empirical MCP client tool poisoning study
      material_changes:
        - Classified the technique as Demonstrated rather than Observed.
        - Removed unrelated incidents, runtime prompt injections, and implementation vulnerabilities.
        - Recorded all named source authors for attribution.
    - pass: detection_and_defense
      completed_on: "2026-09-01"
      queries:
        - MCP tool poisoning detection telemetry and tool pinning
        - Unicode security controls legitimate join-control use
        - official MCP sandbox consent logging guidance
      material_changes:
        - Recast the lexical rule as a triage analytic with an expected false-positive case.
        - Excluded ZWJ and ZWNJ from the rule because they have legitimate language uses.
        - Required definition baselines, full-fidelity storage, and correlated runtime telemetry.
    - pass: gap_and_challenge
      completed_on: "2026-09-01"
      queries:
        - production MCP tool description poisoning incident
        - evidence against static tool poisoning detection completeness
        - description poisoning versus schema poisoning versus runtime response
      material_changes:
        - Found no reviewed source establishing production exploitation of this exact vector.
        - Recorded OWASP community material as rejected because it conflates runtime responses with the narrow vector.
        - Added explicit boundaries for FSP, runtime injection, shadowing, rug pulls, and supply-chain delivery.
    - pass: saturation_follow_up_1
      completed_on: "2026-09-01"
      queries:
        - latest exact MITRE ATLAS Definition and Instructions sub-technique
        - latest tool poisoning production incident description metadata
      material_changes: []
    - pass: saturation_follow_up_2
      completed_on: "2026-09-01"
      queries:
        - challenge SAF-T1001 evidence status and nearest-neighbor boundary
        - challenge SAF-T1001 detection claims and false positives
      material_changes: []
  rationale: >-
    The corpus includes the protocol and official client path, the original
    disclosure, two independent empirical studies, current ATLAS data, official
    defensive guidance, a maintained scanner, Unicode authority, the nearest
    schema/runtime research, and an explicit challenge source. Two follow-up
    passes changed no material claim, classification, boundary, detection, or
    mapping.

