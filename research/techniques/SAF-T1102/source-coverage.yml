        - Established demonstrated end-to-end evidence across tool metadata, tool results, and third-party content.
        - Added benchmark evidence while separating evaluation rates from production incidence.
    - pass: detection_and_defense
      completed_on: "2026-09-01"
      queries:
        - "Direct review: NIST AI 100-2e2025 sections 3.4-3.5"
        - "Direct review: OWASP LLM01:2025 mitigations"
        - "Direct review: NCSC prompt injection design and monitoring guidance"
