  rationale: >-
    The final source set covers the current protocol, direct vulnerability records,
    multiple end-to-end MCP demonstrations, two agent benchmarks, government and
    industry defense guidance, and adversarial defense evaluation. The final two
    independent direct-authority passes changed no material claim, example,
    detection choice, scope boundary, or evidence classification.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 7
  selected_examples:
    - SRC-invariant-tpa-2025-04-01
    - SRC-invariant-whatsapp-mcp-2025-04-07
    - SRC-invariant-github-mcp-2025
    - SRC-cve-2025-54135
  no_qualifying_examples_rationale: >-
    Four high-relevance demonstrations or vulnerabilities qualify, but none is a
    verified production breach. The selected set spans distinct vectors and one
    patched direct vulnerability without inflating adjacent Copilot issues.
  candidates:
    - source_id: SRC-invariant-tpa-2025-04-01
      identifier: Invariant MCP tool poisoning and cross-server shadowing demonstrations
      relationship: direct_demonstration
      exploitation_status: controlled_demonstration
      impact: Redirected model-selected tool behavior through malicious tool descriptions, including use of a trusted tool.
      remediation: Expose and review descriptions, pin trusted metadata, constrain tools, and require consequential-action approval.
      selected: true
      rationale: Highest direct relevance to the tool-description vector with a documented end-to-end MCP flow.
    - source_id: SRC-invariant-whatsapp-mcp-2025-04-07
      identifier: Invariant WhatsApp MCP experiments
      relationship: direct_demonstration
      exploitation_status: controlled_demonstration
      impact: Redirected an agent from a trusted tool result and disclosed synthetic contacts.
      remediation: Separate trusted and untrusted tools and data, reduce privileges, and require approval.
      selected: true
      rationale: Directly establishes tool-result and third-party message delivery without requiring a malicious server.
    - source_id: SRC-invariant-github-mcp-2025
      identifier: Invariant GitHub MCP public-issue injection demonstration
      relationship: direct_demonstration
      exploitation_status: controlled_demonstration
      impact: Retrieved private-repository test data and published it in a public pull request.
      remediation: Scope tokens, separate public and private contexts, and approve cross-boundary writes.
      selected: true
      rationale: Demonstrates a materially distinct public-content vector and cross-resource action.
    - source_id: SRC-cve-2025-54135
      identifier: CVE-2025-54135 / GHSA-4cxx-hrm3-49rm
      relationship: direct_vulnerability
      exploitation_status: no_known_exploitation
      impact: Chained indirect injection and MCP-sensitive file creation could enable code execution in affected Cursor versions.
      remediation: Update to Cursor 1.3.9 or later; require approval for MCP-sensitive file changes.
      selected: true
      rationale: The only reviewed direct MCP vulnerability with a maintainer fix and official exploitation enrichment.
    - source_id: SRC-cve-2025-32711
      identifier: CVE-2025-32711
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: no_known_exploitation
      impact: Microsoft 365 Copilot AI command injection could affect confidentiality, integrity, and availability.
      remediation: Apply Microsoft's service-side remediation and current product guidance.
      selected: false
      rationale: The reviewed official record does not establish an MCP delivery or execution path.
    - source_id: SRC-cve-2025-53773
      identifier: CVE-2025-53773
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: no_known_exploitation
      impact: Prompt injection could lead GitHub Copilot in Visual Studio to alter settings and reach local code execution.
      remediation: Update Visual Studio 2022 17.14 to 17.14.12 or later.
      selected: false
      rationale: MCP tool output is only one optional delivery angle; the defining vulnerability is a broader agent settings boundary.
    - source_id: SRC-owasp-llm01-2025
      identifier: CVE-2024-5184 EmailGPT lead
      relationship: rejected
      exploitation_status: unknown
      impact: A secondary lead described prompt injection in an email assistant.
      remediation: Primary advisory and remediation were not directly verified.
      selected: false
      rationale: Source-or-omit requires a reviewed primary advisory before using the candidate as an example.

