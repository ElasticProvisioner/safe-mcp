        - Added current normative validation, confirmation, sanitization, and auditing requirements.
    - pass: known_breaches_and_vulnerabilities
      completed_on: "2026-09-01"
      queries:
        - "Direct official CVE API review: CVE-2025-32711"
        - "Direct official CVE API review: CVE-2025-53773"
        - "Direct researcher page from CVE reference: GitHub Copilot remote code execution via prompt injection"
