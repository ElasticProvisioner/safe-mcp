        - "Direct review: CaMeL deterministic capability enforcement"
        - "Direct review: adaptive attacks against recent prompt-injection defenses"
      material_changes:
        - Derived a source-to-action correlation using provenance, detector signals, approval state, and action risk.
        - Added privacy and semantic-detection limitations plus deterministic least-privilege controls.
    - pass: gap_and_challenge
      completed_on: "2026-09-01"
      queries:
        - "Challenge: do demonstrations establish a production breach? Answer: no"
        - "Challenge: does connection to an MCP server alone establish prompt injection? Answer: no"
        - "Challenge: do literal keywords establish compromise? Answer: no"
        - "Challenge: is ATT&CK T1059 direct for natural-language prompt interpretation? Answer: no"
        - "Challenge: can model-level filtering eliminate the risk? Answer: not supported"
      material_changes:
        - Narrowed scope to inference-time instruction-authority manipulation.
        - Downgraded ATT&CK T1059 to an analogous follow-on mapping.
        - Added explicit exclusions and residual-risk language.
    - pass: saturation_follow_up_1
      completed_on: "2026-09-01"
      queries:
        - "Re-opened current MCP documentation index and 2026-07-28 prompts/resources/tools routes"
