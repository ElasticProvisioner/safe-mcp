  - id: SRC-anthropic-gtg1002-202511
    title: Disrupting the first reported AI-orchestrated cyber espionage campaign
    publisher: Anthropic
    authors:
      - Anthropic Threat Intelligence team
      - Anthropic Safeguards organization
    version_or_date: "November 2025; updated 2025-11-17"
    source_class: incident_report
    official_url: https://assets.anthropic.com/m/ec212e6566a0d47/original/Disrupting-the-first-reported-AI-orchestrated-cyber-espionage-campaign.pdf
    accessed_on: "2026-09-01"
    reviewed_on: "2026-09-01"
    review_status: opened_reviewed
    review_method: Direct full-document review of the 14-page first-party PDF.
    locators:
      - Executive Summary, pages 2-3
      - Operational infrastructure, pages 5-6
      - Phase 2 Reconnaissance and attack surface mapping, page 8
      - Technical sophistication, pages 11-12
    review_notes: >-
      Verified a real campaign using MCP-connected tools for network and service
      discovery, the affected campaign scope, Anthropic's response, and the
      report's hallucination/visibility limitations. The report does not say
      that MCP servers themselves were enumerated.
    archive:
      status: remote_reviewed_not_archived
      reason: Public first-party PDF was reviewed in full; no copyrighted copy is redistributed.
      review_evidence:
        method: Full PDF text review
        reviewed_on: "2026-09-01"

