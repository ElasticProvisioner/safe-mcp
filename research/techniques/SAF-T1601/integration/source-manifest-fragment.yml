  - id: SRC-nvd-mcp-corpus-20260901
    title: NVD CVE API keyword corpus for Model Context Protocol
    publisher: National Institute of Standards and Technology
    authors:
      - NIST National Vulnerability Database team
    version_or_date: "API timestamp 2026-09-02T06:51:42Z"
    source_class: official_advisory
    official_url: https://services.nvd.nist.gov/rest/json/cves/2.0?keywordSearch=Model%20Context%20Protocol&resultsPerPage=200
    accessed_on: "2026-09-01"
    reviewed_on: "2026-09-01"
    review_status: opened_reviewed
    review_method: >-
      Direct API retrieval; all 77 English descriptions and reference sets were
      screened, then relevant records were opened individually.
    locators:
      - totalResults=77
      - vulnerabilities[].cve.id, descriptions, affected, metrics, and references
    review_notes: >-
      Used only to establish search coverage, locate primary advisories, and
      bound the absence statement; catalog metadata was not treated as proof of
      a production incident.
    archive:
      status: remote_reviewed_not_archived
      reason: Live government catalog was queried directly; the changing bulk result is not redistributed.
      review_evidence:
        method: Direct API corpus screen plus individual record review
        reviewed_on: "2026-09-01"

