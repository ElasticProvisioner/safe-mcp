conflicts:
  - issue: serverInfo exposes a name and version but is self-reported and not guaranteed to be trustworthy or unique.
    resolution: Treat serverInfo as a fingerprinting hint; correlate configuration identity, endpoint, transport, and authenticated principal for detection.
  - issue: Tool or capability discovery output can differ from effective execution authorization.
    resolution: Stop the technique at enumeration and require separate assessment of any follow-on invocation or authorization bypass.
  - issue: Absence from CISA KEV might be mistaken for proof of no exploitation.
    resolution: State only the dated catalog result and preserve unknown/private exploitation as a limitation.

evidence_assessment:
  overall_status: research-derived
  core_claim_ids:
    - SAF-T1601-C005
  rationale: >-
    Current protocol and official Inspector sources establish every component of
    configuration and live-server enumeration, but no directly reviewed source
    reports the complete adversarial behavior against MCP servers in
    production or as an adversarial controlled demonstration. The core remains
    an explicit, bounded inference.

