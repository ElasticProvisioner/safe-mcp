breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 6
  selected_examples:
    - SRC-mcp-inspector-cli-20260728
    - SRC-nvd-cve-2025-66416
    - SRC-nvd-cve-2026-49257
    - SRC-anthropic-espionage-2025-11
  no_qualifying_examples_rationale: >-
    No direct production incident or direct vulnerability met the technique
    contract. Four examples were retained because one directly demonstrates
    the defining enumeration mechanics, two materially enable unauthorized
    access to server metadata and capabilities, and one is a high-impact
    adjacent production case that clarifies the boundary.
  candidates:
    - source_id: SRC-mcp-inspector-cli-20260728
      identifier: MCP Inspector servers/list and servers/show
      relationship: direct_demonstration
      exploitation_status: legitimate_first_party_demonstration
      impact: A user can enumerate configured server entries and inspect one entry without opening a connection.
      remediation: No remediation; use is administrative, and access to configuration should be restricted and audited.
      selected: true
      rationale: Highest-confidence direct demonstration of the defining mechanics, while not evidence of malicious use.
    - source_id: SRC-nvd-cve-2025-66416
      identifier: CVE-2025-66416 / GHSA-9h52-p55h-vw2f
      relationship: enabling_vulnerability
      exploitation_status: CISA_SSVC_none_and_not_in_KEV_as_of_2026-09-01
      impact: Under stated localhost, unauthenticated HTTP, and browser conditions, an attacker could send requests to a local MCP server and reach exposed tools or resources.
      remediation: Upgrade to MCP Python SDK 1.23.0 or later and configure transport security; stdio is unaffected.
      selected: true
      rationale: High-impact, current, first-party-corroborated access weakness that can expose a discovered local server, but does not itself enumerate servers.
    - source_id: SRC-nvd-cve-2026-49257
      identifier: CVE-2026-49257 / GHSA-73cv-556c-w3g6
      relationship: enabling_vulnerability
      exploitation_status: CISA_SSVC_poc_and_not_in_KEV_as_of_2026-09-01
      impact: Default unauthenticated network exposure gave adjacent callers access to all mcp-pinot tools under server-side Pinot credentials, with bounded confidentiality, integrity, and availability consequences.
      remediation: Upgrade to 3.1.0 or later; the fix changed bind and authentication defaults and gated non-loopback exposure.
      selected: true
      rationale: Critical enabling exposure with a directly reviewed maintainer fix; it concerns one known endpoint and cannot elevate the technique evidence label.
    - source_id: SRC-anthropic-espionage-2025-11
      identifier: Anthropic GTG-1002 campaign
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed_production_campaign
      impact: The actor used MCP-connected browser automation during attack-surface mapping and cataloged internal network services across compromised targets.
      remediation: Anthropic banned accounts, notified affected parties, expanded detection, and incorporated the pattern into safety controls.
      selected: true
      rationale: Highest-impact production example involving MCP and enumeration, retained only to show that the enumerated objects were network services rather than MCP servers.
    - source_id: SRC-nvd-cve-2025-66454
      identifier: CVE-2025-66454
      relationship: rejected
      exploitation_status: public_advisory_not_assessed_as_production_exploitation
      impact: A hardcoded worker secret permitted unauthorized tool enumeration and invocation within one Arcade MCP deployment.
      remediation: Upgrade to 1.5.4 or later.
      selected: false
      rationale: Tool enumeration inside one server is outside the contract's immediate server-set objective.
    - source_id: SRC-nvd-cve-2026-46519
      identifier: CVE-2026-46519
      relationship: rejected
      exploitation_status: public_advisory_not_assessed_as_production_exploitation
      impact: Tool-discovery filters did not prevent direct calls to hidden tools in the affected Kubernetes MCP server.
      remediation: Upgrade to 3.6.0 or later.
      selected: false
      rationale: The record concerns authorization enforcement for tools, not enumerating MCP servers; it is retained as contrary evidence about relying on discovery output.

