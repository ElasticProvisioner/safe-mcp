conflicts:
  - issue: Check Point reports Codex CLI v0.23.0 as fixed, but CVE-2025-61260 describes v0.23.0 and earlier as affected.
    resolution: Preserve the discrepancy in the claim limitation and do not assert a reconciled affected range.
  - issue: Unit 42 calls the extension an MCP server and says it uses the MCP framework, but the shown channel is a hardcoded WebSocket C2 connection.
    resolution: Include it as a server-branded integration and explicitly avoid claiming MCP specification conformance.
  - issue: A direct fetch of the CISA KEV JSON feed returned HTTP 403.
    resolution: Do not make a global KEV absence claim; limit exploitation-status statements to the opened source records.
evidence_assessment:
  overall_status: observed
  core_claim_ids:
    - SAF-T1903-C001
    - SAF-T1903-C002
    - SAF-T1903-C004
  rationale: >-
    Two independent first-party research teams documented malicious software
    distributed as MCP servers or server-branded integrations with direct remote
    command channels. This supports Observed for the defined channel behavior,
    while limitations prevent claims of named victim breach, confirmed victim
    execution, or universal MCP protocol conformance.
