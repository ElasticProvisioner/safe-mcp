  rationale: >-
    The source set covers the current protocol revision, two independent
    production malware findings, first-party vulnerability demonstrations and
    CVE records, current detection rules, first-party defense guidance, ATT&CK,
    empirical research, and contrary or adjacent evidence. The last two
    domain-restricted passes found no evidence that changed the contract,
    evidence label, selected examples, detector, or limitations.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 10
  selected_examples:
    - SRC-jfrog-malicious-mcp
    - SRC-unit42-browser-c2
    - SRC-checkpoint-codex-cli
    - SRC-checkpoint-claude-code
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-jfrog-malicious-mcp
      identifier: JFrog three malicious MCP packages on PyPI
      relationship: direct_production_incident
      exploitation_status: Observed malicious packages in a public distribution channel; approximately 1,600 downloads; victim execution not established.
      impact: Reverse-shell behavior could provide remote commands at the launched process privilege.
      remediation: Remove the packages, block reported infrastructure, and use package scanning and provenance review.
      selected: true
      rationale: Highest-directness public production finding matching the server-process control-channel contract.
    - source_id: SRC-unit42-browser-c2
      identifier: Chrome MCP Server malicious browser extension
      relationship: direct_production_incident
      exploitation_status: Observed malicious extension in a public store; victim compromise not established.
      impact: Persistent WebSocket C2 exposed more than thirty remote browser actions in authenticated tabs.
      remediation: Unit 42 reported the extensions; Google removed them or displayed security warnings.
      selected: true
      rationale: Direct server-branded persistent command channel with materially different browser observables.
    - source_id: SRC-checkpoint-codex-cli
      identifier: CVE-2025-61260
      relationship: enabling_vulnerability
      exploitation_status: Controlled public demonstration; no production exploitation established.
      impact: Project-local MCP configuration could execute an arbitrary startup command in the user's context.
      remediation: Check Point reports a v0.23.0 fix, while the later CVE affected range conflicts at that version boundary.
      selected: true
      rationale: High-impact first-party demonstration of a realistic channel-enabling startup path with explicit uncertainty.
    - source_id: SRC-checkpoint-claude-code
      identifier: CVE-2025-59536
      relationship: enabling_vulnerability
      exploitation_status: Controlled public demonstration; no production exploitation established.
      impact: Repository-controlled settings could bypass MCP startup consent and execute a configured command before the trust dialog.
      remediation: CVE Program record identifies version 1.0.111 as fixed.
      selected: true
      rationale: High-impact independent host implementation demonstrating the same startup boundary.
    - source_id: SRC-checkpoint-mcpoison-2025-54136
      identifier: Cursor MCPoison configuration trust issue
      relationship: enabling_vulnerability
      exploitation_status: Controlled public demonstration; no production exploitation established.
      impact: An approved server definition could later be changed to run an arbitrary command.
      remediation: Vendor fix described by the researcher; exact advisory metadata was not needed for the selected set.
      selected: false
      rationale: Material but redundant with two better-identified selected configuration vulnerabilities and the four-example cap.
    - source_id: SRC-jfrog-jfsa-2026-001653030
      identifier: CVE-2026-25905 / JFSA-2026-001653030
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Public proof of concept; no production exploitation established.
      impact: Lack of isolation permits MCP server takeover and tool shadowing.
      remediation: No vendor mitigation supplied; project reported archived.
      selected: false
      rationale: Server takeover is adjacent unless a bidirectional remote operator command loop is established.
    - source_id: SRC-cve-2026-34742
      identifier: CVE-2026-34742
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Disclosed vulnerability; no production exploitation established in the CVE record.
      impact: DNS rebinding can let a malicious website invoke tools on an unauthenticated localhost MCP server.
      remediation: Go SDK 1.4.0 enables the protection.
      selected: false
      rationale: This is remote interaction with a benign exposed server, not a malicious server-originated control channel.
    - source_id: SRC-t1206-ms-config-risk
      identifier: Microsoft exposed remote MCP server assessment
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Measurement of insecure exposure; not a malicious-server campaign.
      impact: Unauthenticated remote servers can expose internal tools.
      remediation: Authentication, least privilege, segmentation, and configuration hardening.
      selected: false
      rationale: Exposure of a benign server crosses an inbound authorization boundary rather than the contract's server-process egress boundary.
    - source_id: SRC-unit42-thought-experiment
      identifier: Unit 42 MCP C2 thought experiment
      relationship: rejected
      exploitation_status: Hypothetical scenario only.
      impact: Illustrates a possible MCP-mediated operator workflow.
      remediation: Not applicable to a hypothetical scenario.
      selected: false
      rationale: Explicitly presented as a thought experiment and cannot raise evidence status.
    - source_id: SRC-unit42-ai-ir
      identifier: Unit 42 AI incident-response interview
      relationship: rejected
      exploitation_status: General practitioner observation that adversaries are testing MCP-related C2; no named case.
      impact: Characterizes activity as nascent and without major impacts.
      remediation: General monitoring and defense guidance only.
      selected: false
      rationale: Useful contrary context but insufficiently specific for an incident row.
