    The five passes cover the protocol boundary, government guidance, current incident and
    vulnerability catalogs, empirical poisoning, MCP training trajectories, detection,
    defenses, contrary evidence, and publication gaps. The final two restricted-domain
    follow-ups found only generic poisoning or adjacent runtime material and did not alter
    the contract, evidence label, claims, detection, or selected examples.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 4
  selected_examples: []
  no_qualifying_examples_rationale: >-
    Restricted searches of NVD, CISA, CVE, Microsoft, OpenAI, and first-party research
    sources identified runtime MCP metadata manipulation, command injection, and untrusted
    tool-output prompt injection. None describes an MCP tool result admitted to model
    training and changing weights, so selecting them would blur the technique boundary.
  candidates:
    - source_id: SRC-microsoft-tool-poisoning-2026-06-30
      identifier: Microsoft MCP tool-poisoning observations
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed in enterprise agent ecosystems, with organization details withheld
      impact: Runtime agent behavior may be manipulated through tool metadata.
      remediation: Review tool metadata, correlate runtime behavior, and restrict trust in tools.
      selected: false
      rationale: The report describes runtime manipulation and no training-data admission or weight update.
    - source_id: SRC-nvd-cve-2025-61591
      identifier: CVE-2025-61591
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: NVD CISA-SSVC exploitation field recorded none; absent from the reviewed KEV snapshot
      impact: A malicious MCP server can cause command execution in affected Cursor versions.
      remediation: Use the vendor-fixed build identified in the NVD record.
      selected: false
      rationale: The disclosed mechanism is runtime command injection, not model training.
    - source_id: SRC-nvd-cve-2025-52573
      identifier: CVE-2025-52573
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: NVD CISA-SSVC exploitation field recorded none; absent from the reviewed KEV snapshot
      impact: Prompt injection can reach shell-command construction in affected ios-simulator-mcp versions.
      remediation: Upgrade to version 1.3.3 or later as identified in the NVD record.
      selected: false
      rationale: The disclosed mechanism is runtime command injection, not model training.
    - source_id: SRC-openai-function-calling
      identifier: OpenAI untrusted tool-output proof of concept
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: public proof of concept described by the vendor
      impact: Untrusted tool output can instruct a model to take unintended actions in a live flow.
      remediation: Treat tool output as untrusted and use confirmation controls.
      selected: false
      rationale: The source describes inference-time prompt injection, not training contamination.
