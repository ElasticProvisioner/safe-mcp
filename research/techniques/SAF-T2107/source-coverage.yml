  - source_id: SRC-cisa-kev-2026-09-01
    reason: Useful only to bound current known-exploitation status for adjacent CVEs; it does not support the core technique.
  - source_id: SRC-nist-aml
    reason: Relevant poisoning sections were reviewed, but the more focused empirical and provenance sources directly support the selected claims.
  - source_id: SRC-nist-airc-characteristics
    reason: General provenance guidance duplicates the more directly located NIST AI 600-1 material.
  - source_id: SRC-openai-function-calling
    reason: The vendor proof of concept is inference-time prompt injection outside the model-training boundary.
sources_blocked: []
conflicts:
  - issue: Empirical poisoning studies show small poison sets can matter, but they do not establish that one MCP response is sufficient.
    resolution: The technique requires an environment-dependent effective representation and expressly rejects a single-record guarantee.
  - issue: MCP tool poisoning and command-injection disclosures are real but operate at inference time.
    resolution: They remain adjacent candidates and do not raise the end-to-end evidence above Research-Derived.
  - issue: Provenance can detect missing or mismatched lineage but not content with valid-looking lineage.
    resolution: The analytic is labeled an unsafe-admission detector and the semantic blind spot is explicit.
