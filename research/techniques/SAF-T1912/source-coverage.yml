breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 10
  selected_examples:
    - SRC-agent-egress-monitor-2026
    - SRC-hidden-plain-text-2025
    - SRC-trojanstego-2025
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-trojanstego-2025
      identifier: TrojanStego controlled experiment
      relationship: direct_demonstration
      exploitation_status: Researcher-controlled demonstration only; no production exploitation claim.
      impact: Sensitive in-context information was recovered from natural-looking model outputs in controlled tests.
      remediation: Paraphrasing and clean fine-tuning were explored; limitations remain scheme-specific.
      selected: true
      rationale: Highest-directness end-to-end demonstration of the defining sensitive-context response channel.
    - source_id: SRC-agent-egress-monitor-2026
      identifier: Multi-modal LLM agent egress carrier suite
      relationship: direct_demonstration
      exploitation_status: Controlled local demonstration; no production exploitation claim.
      impact: Text, structured, image, audio, timing, and size response carriers preserved covert capacity in tested configurations.
      remediation: A trusted egress reference monitor removed tested lossless carriers under full enforcement, with documented residual capacity.
      selected: true
      rationale: Nonredundant demonstration of multimodal carrier surfaces and an evaluated defensive monitor.
    - source_id: SRC-hidden-plain-text-2025
      identifier: Emergent steganographic collusion experiments
      relationship: direct_demonstration
      exploitation_status: Controlled optimization experiments; no production exploitation claim.
      impact: Model components developed covert communication that retained task utility and bypassed tested oversight.
      remediation: Oversight and paraphrasing were evaluated but were not fully robust when optimized against.
      selected: true
      rationale: Nonredundant evidence that hidden response signaling can emerge under optimization rather than deliberate backdooring.
    - source_id: SRC-od-stega-2026
      identifier: OD-Stega controlled text-steganography experiments
      relationship: direct_demonstration
      exploitation_status: Controlled research; no production exploitation claim.
      impact: Secret bits were encoded in generated text with a measured capacity-versus-detectability tradeoff.
      remediation: Detection strength and distribution-divergence controls were evaluated.
      selected: false
      rationale: Direct carrier demonstration but redundant with the selected end-to-end and adaptive-response examples and lacks protected-context exfiltration.
    - source_id: SRC-breaking-provable-security-2026
      identifier: RRNs-HT finite-precision steganalysis experiment
      relationship: direct_demonstration
      exploitation_status: Controlled defensive audit; no production exploitation claim.
      impact: Two interval-based text-steganography schemes were detected under matched white-box conditions.
      remediation: Offline statistical auditing is proposed for the targeted implementation artifact.
      selected: false
      rationale: Material to detection limits but not an exfiltration example.
    - source_id: SRC-cve-2025-32711
      identifier: CVE-2025-32711
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA ADP exploitation value was none in the reviewed record.
      impact: A fixed cross-prompt-injection issue could disclose limited data accessible to the victim under certain conditions.
      remediation: Microsoft reports a hosted-service fix.
      selected: false
      rationale: The disclosure path is adjacent and does not establish a response-embedded covert payload.
    - source_id: SRC-microsoft-indirect-prompt-injection-2025
      identifier: Microsoft indirect-prompt-injection exfiltration analysis
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Defensive analysis, not a reported production incident for this mechanism.
      impact: Image URLs, links, and tool calls can move data through explicit browser or action channels.
      remediation: Defense in depth, fixed rendering controls, DLP, and consent are discussed.
      selected: false
      rationale: These are enabling and adjacent egress channels rather than secret-bearing response steganography.
    - source_id: SRC-silent-egress-2026
      identifier: Silent Egress controlled agent experiment
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Fully local controlled test; no production exploitation claim.
      impact: An injected page induced sensitive data transfer in outbound requests while the final response remained benign.
      remediation: Network policy, tool mediation, and correlated telemetry are recommended.
      selected: false
      rationale: The secret moves in a separate request, outside the response carrier.
    - source_id: SRC-microsoft-tool-poisoning-2026-06-30
      identifier: MCP tool-poisoning finance workflow scenario
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Microsoft explicitly does not identify a specific affected organization.
      impact: A poisoned tool description can cause sensitive invoice data to be attached to an external tool call.
      remediation: Publisher allowlisting, metadata review, DLP, approvals, and correlated telemetry are recommended.
      selected: false
      rationale: Explicit tool-parameter exfiltration is a nearest neighbor, not response steganography.
    - source_id: SRC-model-weight-exfil-2025
      identifier: Model-weight output exfiltration experiment
      relationship: historical_analogy
      exploitation_status: Controlled research; no production exploitation claim.
      impact: An attacker-controlled inference service can encode provider model weights into ordinary outputs.
      remediation: Probabilistic inference verification is evaluated.
      selected: false
      rationale: The protected asset is provider model weights and the adversarial boundary is an inference server, outside this contract.

