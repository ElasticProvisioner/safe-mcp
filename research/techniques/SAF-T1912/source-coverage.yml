conflicts:
  - issue: Paraphrasing disrupts TrojanStego's exact-token channel, while optimized collusion retains capacity against paraphrasing.
    resolution: State paraphrasing as a scheme-dependent control, never as complete prevention.
  - issue: RRNs-HT detects interval-sampling artifacts strongly in matched conditions, while semantic detectors remain near chance.
    resolution: Separate targeted offline statistical audit from the repository's deterministic observable-carrier triage and disclose both scopes.
  - issue: Current official vulnerability and agent reports describe explicit network or tool-parameter egress rather than response-embedded payloads.
    resolution: Preserve them as adjacent boundary evidence and retain the production-incident gap.

evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1912-C003
    - SAF-T1912-C007
    - SAF-T1912-C009
  rationale: >-
    Direct controlled studies establish an end-to-end sensitive-context signal in
    natural-looking outputs, multi-modal agent egress carriers, and emergent
    linguistic signaling under oversight. These justify Demonstrated for the
    mechanism, while explicit limitations and the lack of a qualifying production
    incident prevent Observed.

