sources_rejected:
  - source_id: SRC-mcp-overview-2026
    reason: General specification landing page; the component-specific Tools page is more exact.
  - source_id: SRC-mcp-release-2026-07-28
    reason: Release context only; SEP-2663 and Tools provide more exact normative locators.
  - source_id: SRC-mcp-tasks-overview-2026
    reason: Overview is less authoritative and detailed than SEP-2663 for security semantics.
  - source_id: SRC-mcp-cancellation-2025
    reason: General cancellation excludes task cancellation and is not needed for the selected task example.
  - source_id: SRC-nist-sp800-53r5.1
    reason: Broad control catalog is less specific than SP 800-228 upd1 for the analytic and defenses.
  - source_id: SRC-usenix-agentdos-2026
    reason: Strong corroboration but less MCP-specific than the selected controlled demonstration.
  - source_id: SRC-arxiv-infinite-loops-2026
    reason: Agent-loop research is adjacent and does not require the MCP boundary.
  - source_id: SRC-arxiv-overthinking-loops-2026
    reason: Direct but redundant and lower-impact than the selected 658-fold amplification result.
  - source_id: SRC-mitre-attack-t1489
    reason: Service Stop is less direct than T1499 for resource exhaustion and persistent service crash.
sources_blocked:
  - source: NVD CVE-2025-59333 direct page
    reason: Direct fetch timed out; the unverified adjacent database-abuse lead was omitted.
conflicts:
  - issue: The vulnerable 2025 task handlers differ from the current Tasks extension.
    resolution: The README dates the affected legacy surface and states current SEP-2663 authorization and list-removal changes.
  - issue: A first-party report documents a production MCP outage, but not adversarial causation.
    resolution: The event is retained as a false-positive comparator and excluded from attack examples.
  - issue: Resource amplification may increase cost without making a service fully unavailable.
    resolution: Scope requires measurable throughput or availability degradation; the selected study measured about 50% lower co-running throughput.
evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T2102-C001
    - SAF-T2102-C007
  rationale: >-
    Public advisories and controlled research demonstrate the trigger and
    availability outcomes across service crash, cross-task cancellation, and
    resource amplification. No reviewed source establishes an adversarial
    production incident, so Observed would overstate the evidence.
