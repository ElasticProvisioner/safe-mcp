conflicts:
  - issue: Cursor GHSA-r22h-5wp2-2wfv labels affected version 1.17 and patched version 1.3, while NVD repeats a non-monotonic range.
    resolution: Preserve as an excluded direct lead; do not publish its affected range or select it as a representative example.
  - issue: Some deep-link flaws trigger execution with only a click and no informed install approval.
    resolution: Include only when the user action initiates the MCP installation mechanism, and state that weak or bypassed consent is an edge case.

