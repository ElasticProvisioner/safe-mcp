  rationale: >-
    Current protocol and platform guidance establish the local execution and
    consent boundary; three exact vendor advisories plus NVD records establish
    the demonstrated user-interaction path; government catalogs, adjacent
    advisories, telemetry documentation, and a production historical analogy
    cover exploitation, counterexample, detection, and impact questions. After
    a late result reset the count, two narrower official-catalog passes added no
    new requirement, direct example, remediation change, constraint, or source.

breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 7
  selected_examples:
    - SRC-ghsa-cursor-64106
    - SRC-ghsa-cherry-61929
    - SRC-ghsa-dive-23523
  no_qualifying_examples_rationale: >-
    Three direct vulnerabilities qualified, but no direct production incident
    was identified. NVD and exact vendor advisories describe demonstrations or
    disclosed flaws, while CISA KEV did not list the reviewed CVEs. The absence
    statement is limited to this reviewed corpus and date.
  candidates:
    - source_id: SRC-ghsa-cursor-64106
      identifier: CVE-2025-64106 / GHSA-4575-fh42-7848
      relationship: direct_vulnerability
      exploitation_status: Public advisory demonstration; production exploitation not stated; not in CISA KEV on 2026-09-01.
      impact: Attacker-selected commands execute with the accepting user's access after deceptive branding and concealed command presentation.
      remediation: Cursor 2.0 is listed as patched; advisory says trusted-server parsing was fixed.
      selected: true
      rationale: The path includes attacker deception, user click and acceptance, MCP installation, and local command execution.
    - source_id: SRC-ghsa-cherry-61929
      identifier: CVE-2025-61929 / GHSA-hh6w-rmjc-26f6
      relationship: direct_vulnerability
      exploitation_status: Public proof of concept; production exploitation not stated; not in CISA KEV on 2026-09-01.
      impact: A click on deceptive web content invokes an MCP installation URL and directly executes its command.
      remediation: Cherry Studio 1.6.4 is listed as patched.
      selected: true
      rationale: The user-triggered MCP installation URL is the immediate execution mechanism, though informed consent is weak.
    - source_id: SRC-ghsa-dive-23523
      identifier: CVE-2026-23523 / GHSA-pjj5-f3wm-f9m8
      relationship: direct_vulnerability
      exploitation_status: Public proof of concept; production exploitation not stated; not in CISA KEV on 2026-09-01.
      impact: A crafted MCP install deep link bypasses confirmation and reaches local subprocess execution.
      remediation: Dive 0.13.0 is listed as patched.
      selected: true
      rationale: The demonstrated deep-link path requires victim interaction and crosses the MCP installation-to-process boundary.
    - source_id: SRC-ghsa-cursor-54133
      identifier: CVE-2025-54133 / GHSA-r22h-5wp2-2wfv
      relationship: direct_vulnerability
      exploitation_status: Public advisory attack description; production exploitation not stated; not in CISA KEV on 2026-09-01.
      impact: Hidden install arguments could execute after two user clicks.
      remediation: The advisory says arguments were added to the dialog, but labels affected 1.17 and patched 1.3.
      selected: false
      rationale: Direct but redundant with the later Cursor case; the published version labels are internally non-monotonic, so it is excluded from the selected set.
    - source_id: SRC-zed-secure-default
      identifier: CVE-2025-68433 / GHSA-cv6g-cmxc-vw8j
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Public tested vulnerability report; production exploitation not stated; not in CISA KEV on 2026-09-01.
      impact: Opening a project could automatically execute an MCP command with user privileges.
      remediation: Zed 0.218.2-pre introduced worktree trust and Restricted Mode.
      selected: false
      rationale: Opening a project triggers automatic configuration execution without a deceived MCP install or trust decision.
    - source_id: SRC-ghsa-dive-66580
      identifier: CVE-2025-66580 / GHSA-xv8m-365j-x6h2
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Public proof of concept; production exploitation not stated; not in CISA KEV on 2026-09-01.
      impact: A client-side XSS path can overwrite MCP configuration and execute a local command after a rendered-node click.
      remediation: Dive 0.11.1 is listed as patched.
      selected: false
      rationale: The defining boundary is an XSS-to-privileged-API exploit, not deception at an MCP install or trust interface.
    - source_id: SRC-unit42-contagious-interview
      identifier: CL-STA-0240 Contagious Interview campaign
      relationship: historical_analogy
      exploitation_status: Observed production malware campaign outside MCP.
      impact: Disguised applications collected and exfiltrated data and installed a backdoor.
      remediation: Unit 42 documents prevention and awareness measures; no MCP product patch applies.
      selected: false
      rationale: It demonstrates social-engineering installation impact but does not involve an MCP integration.

