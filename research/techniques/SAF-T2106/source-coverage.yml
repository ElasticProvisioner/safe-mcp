sources_rejected:
  - source_id: SRC-nvd-mem0
    reason: Direct and relevant, but redundant with selected vulnerabilities and lacking a reviewed vendor remediation page.
  - source_id: SRC-microsoft-semantic-kernel-cves-2026
    reason: The vector-store component is involved, but the mechanism is unsafe deserialization and code execution rather than memory contamination.
  - source_id: SRC-nvd-anythingllm
    reason: The behavior is vector-store reset or deletion without attacker-controlled replacement and later retrieval.
sources_blocked: []
conflicts:
  - issue: Empirical poisoning papers show high attack success, while ReliabilityRAG offers a bounded robust filtering method.
    resolution: Present the attack as demonstrated, identify failed evaluated filters narrowly, and preserve ReliabilityRAG's assumptions and bounded contrary result.
  - issue: Production reports describe manipulation attempts and RAG infrastructure compromise but do not prove the complete contracted path.
    resolution: Exclude them from selected examples and state the production-breach gap.
evidence_assessment:
  overall_status: demonstrated
  core_claim_ids: [SAF-T2106-C002, SAF-T2106-C004]
  rationale: Two independent peer-reviewed studies demonstrate the defining persistent write, later semantic retrieval, and downstream influence; product advisories establish reachable write-boundary failures, while production exploitation remains unverified.
