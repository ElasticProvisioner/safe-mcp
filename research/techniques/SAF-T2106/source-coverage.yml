breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 9
  selected_examples: [SRC-neurips-agentpoison-2024, SRC-usenix-poisonedrag-2025, SRC-openwebui-ghsa, SRC-ibm-langflow]
  no_qualifying_examples_rationale: No selected item is a verified production breach; current whitelisted authority searches found direct demonstrations and vulnerabilities but no incident proving both vector-store contamination and downstream model effect.
  candidates:
    - source_id: SRC-neurips-agentpoison-2024
      identifier: AgentPoison
      relationship: direct_demonstration
      exploitation_status: demonstrated_in_research
      impact: Poisoned memory retrieval induced target answers and actions across three evaluated agents.
      remediation: Defense evaluations were incomplete; restrict writes and validate provenance.
      selected: true
      rationale: Strongest peer-reviewed agent-specific end-to-end demonstration.
    - source_id: SRC-usenix-poisonedrag-2025
      identifier: PoisonedRAG
      relationship: direct_demonstration
      exploitation_status: demonstrated_in_research
      impact: Injected texts manipulated target answers and affected an evaluated LLM agent.
      remediation: Evaluated content filters reduced some attack success but did not reliably eliminate it.
      selected: true
      rationale: Strong peer-reviewed RAG-specific end-to-end demonstration with defense evaluation.
    - source_id: SRC-openwebui-ghsa
      identifier: CVE-2026-44554 / GHSA-7r82-qhg4-6wvj
      relationship: direct_vulnerability
      exploitation_status: none_reported_by_cisa
      impact: Cross-collection overwrite could replace legitimate vectors with attacker-controlled content.
      remediation: Upgrade to Open WebUI 0.9.0 or later.
      selected: true
      rationale: Direct disclosed vector-collection poisoning path with downstream RAG impact.
    - source_id: SRC-ibm-langflow
      identifier: CVE-2026-13444
      relationship: direct_vulnerability
      exploitation_status: not_reported
      impact: Shared vector namespaces permitted cross-tenant collection pollution and reads.
      remediation: Upgrade to Langflow 1.10.2.
      selected: true
      rationale: Direct vendor advisory for tenant-boundary vector pollution.
    - source_id: SRC-nvd-mem0
      identifier: CVE-2026-31245
      relationship: direct_vulnerability
      exploitation_status: none_reported_by_cisa
      impact: Unauthenticated memory creation allowed malicious or spoofed records and data pollution.
      remediation: Restrict and authenticate memory creation; the reviewed NVD record did not identify a fixed version.
      selected: false
      rationale: Direct but redundant with higher-impact selected vulnerabilities and lacks a reviewed vendor remediation page.
    - source_id: SRC-ms-recommendation-poisoning-2026
      identifier: AI recommendation poisoning attempts
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed_attempts
      impact: Manipulative content attempted to influence AI recommendations, with effects varying by platform and time.
      remediation: Monitor external content influence and provenance.
      selected: false
      rationale: Does not verify vector-store contamination or the required downstream persistent-memory path.
    - source_id: SRC-microsoft-ai-gateway-incident
      identifier: RAGFlow infrastructure compromise
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: observed_compromise
      impact: Attackers achieved code execution and credential theft in deployed RAGFlow infrastructure.
      remediation: Harden exposed infrastructure and credentials.
      selected: false
      rationale: Production-relevant but not memory contamination.
    - source_id: SRC-microsoft-semantic-kernel-cves-2026
      identifier: CVE-2026-26030
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: not_reported
      impact: Unsafe deserialization in an in-memory vector-store path could enable code execution.
      remediation: Upgrade Semantic Kernel to 1.39.4 or later.
      selected: false
      rationale: Code execution through deserialization, not persistent attacker-record retrieval influence.
    - source_id: SRC-nvd-anythingllm
      identifier: CVE-2024-3033
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: not_reported
      impact: Unauthorized vector-database reset or deletion could affect availability.
      remediation: Apply vendor updates and enforce authorization.
      selected: false
      rationale: Destruction without demonstrated attacker-controlled replacement and later retrieval.
