  rationale: >-
    Current protocol, two independent client implementations, first-party cloud
    guidance, three product advisories, official NVD/CISA exploitation records,
    current incident research, and framework guidance cover every publishable
    proposition. Two narrower authority-only follow-ups added no requirement,
    direct case, material limitation, remediation change, or better example.
breach_and_vulnerability_assessment:
  searched_on: "2026-09-01"
  candidate_count: 9
  selected_examples:
    - SRC-t1206-ghsa-cursor
    - SRC-ghsa-dive-66580
    - SRC-ghsa-zed-68433
  no_qualifying_examples_rationale: >-
    Three examples qualified for publication, but none is a direct production
    incident or a complete credential implant. The section therefore preserves
    the direct-production evidence gap and labels every selected example as
    enabling or adjacent.
  candidates:
    - source_id: SRC-t1206-ghsa-cursor
      identifier: CVE-2025-64107 / GHSA-2jr2-8wf5-v6pf
      relationship: enabling_vulnerability
      exploitation_status: CISA ADP recorded none; not present in CISA KEV 2026.09.01.
      impact: Approval-bypassing overwrite of sensitive Cursor editor files on Windows could lead to RCE after prompt injection or malicious-model control.
      remediation: Fixed in Cursor 2.0.
      selected: true
      rationale: Highest relevance because it directly supplies an unauthorized write path to mcp.json, but the advisory does not show a credential implant.
    - source_id: SRC-ghsa-dive-66580
      identifier: CVE-2025-66580 / GHSA-xv8m-365j-x6h2
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA ADP recorded proof-of-concept; not present in CISA KEV 2026.09.01.
      impact: Click-triggered stored XSS could overwrite MCP server configuration and reach RCE.
      remediation: Fixed in Dive 0.11.1.
      selected: true
      rationale: Critical config-injection demonstration with full affected and fixed ranges; objective is execution rather than credential persistence.
    - source_id: SRC-ghsa-zed-68433
      identifier: CVE-2025-68433 / GHSA-cv6g-cmxc-vw8j
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA ADP recorded none; not present in CISA KEV 2026.09.01.
      impact: Opening a seeded project could auto-execute an MCP server configuration with user privileges.
      remediation: Worktree trust added in Zed 0.218.2-pre.
      selected: true
      rationale: High-quality first-party configuration-boundary demonstration with named researcher credit; objective is execution.
    - source_id: SRC-t1206-nvd-forgecode
      identifier: CVE-2026-57860
      relationship: rejected
      exploitation_status: CISA ADP recorded proof-of-concept; NVD status Deferred.
      impact: Reported unvetted repository mcp.json execution with user privileges.
      remediation: Affected record and references were present, but an authoritative fixed version was not established in the reviewed source.
      selected: false
      rationale: Adjacent command execution and weaker remediation certainty than selected examples; no credential implant.
    - source_id: SRC-t1206-nvd-google-toolbox
      identifier: CVE-2026-14541
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA ADP recorded none.
      impact: Missing audience/clientId configuration could allow unrelated Google OAuth tokens to access protected tools and data.
      remediation: Google patch reference was recorded; only version 1.4.0 was listed affected.
      selected: false
      rationale: Authentication bypass caused by missing validation, not persistent client credential implantation.
    - source_id: SRC-t1206-nvd-cloudflare-oauth
      identifier: CVE-2025-4143
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: CISA ADP recorded none.
      impact: Redirect validation weakness could enable credential theft and impersonation under stated auto-approval conditions.
      remediation: Fixed before workers-oauth-provider 0.0.5.
      selected: false
      rationale: Credential theft without a persistent configuration write is outside the contract.
    - source_id: SRC-t1206-ms-config-risk
      identifier: Microsoft Defender observed AI/MCP misconfiguration abuse
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Production observations and active Mage AI exploitation were reported.
      impact: Exposed agentic services enabled RCE, credential theft, and access to internal tools.
      remediation: Authentication defaults and deployment guidance were improved for described products.
      selected: false
      rationale: The incidents concern exposed or weakly authenticated services, not attacker-written credential-bearing client config.
    - source_id: SRC-t1206-gtig-ai-threats
      identifier: TeamPCP AI-package supply-chain compromises
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: Production incident-response engagements reported.
      impact: Compromised packages embedded a credential stealer and extracted cloud secrets from build environments.
      remediation: Defensive discussion and ecosystem controls were reported; no MCP client-config remediation applied.
      selected: false
      rationale: Credential theft through compromised packages is not credential implantation in MCP configuration.
    - source_id: SRC-cisa-kev-2026-09-01
      identifier: CISA KEV catalog version 2026.09.01
      relationship: rejected
      exploitation_status: Selected CVE identifiers absent from the current catalog.
      impact: Catalog status only; it is not an incident or vulnerability itself.
      remediation: Not applicable.
      selected: false
      rationale: Used only as a current exploitation cross-check.
