conflicts:
  - issue: Several sources call malicious MCP configuration a persistence primitive even when the immediate mechanism is command execution.
    resolution: Classified those cases under the synthetic configuration-execution neighbor and retained them only as adjacent or enabling examples.
  - issue: NVD and CNA CVSS vectors differ for the selected Cursor and Zed vulnerabilities.
    resolution: Omitted score-dependent reasoning and relied on agreed behavior, affected/fixed ranges, and explicit evidence limitations.
evidence_assessment:
  overall_status: research-derived
  core_claim_ids: [SAF-T1206-C001, SAF-T1206-C005]
  rationale: >-
    Authoritative client and protocol sources establish persistent credential
    selection, and a direct advisory establishes unauthorized MCP-config writes,
    but no source demonstrates the complete credential implant and later reuse.
    The end-to-end behavior is therefore an explicit supported inference.
