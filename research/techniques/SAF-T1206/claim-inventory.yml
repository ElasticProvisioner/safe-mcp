    corroboration: The vendor advisory and current NVD record agree on the path bypass, prerequisites, and fixed version.
    limitations: [Neither source demonstrates inserting or later using a credential.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated
