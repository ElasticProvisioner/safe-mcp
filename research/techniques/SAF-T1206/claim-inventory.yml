    corroboration: Microsoft agent and MCP guidance ties identity choice to roles, scopes, and reachable tools.
    limitations: [Impact cannot be rated precisely without deployment-specific authorization data.]
    conflicts: []
    inference: {is_inference: true, rationale: "Impact conditions are derived from documented authorization boundaries."}
    status: validated
  - id: SAF-T1206-C008
