version: 1
technique_id: SAF-T1206
claims:
  - id: SAF-T1206-C001
    statement: An unauthorized persistent MCP or agent configuration change can direct later authentication to an attacker-selected credential or credential reference.
    class: framework_inference
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-t1206-vscode-config
        support: direct
        exact_locators: ["Configuration file; Input variables for sensitive data"]
      - source_id: SRC-t1206-copilot-cli
        support: direct
        exact_locators: ["MCP server loading priority; mcp add options"]
      - source_id: SRC-t1206-mcp-client-registration
        support: direct
        exact_locators: ["Pre-registration; Authorization Server Binding"]
      - source_id: SRC-t1206-ghsa-cursor
        support: corroborating
        exact_locators: ["Summary; Impact"]
    corroboration: Product docs establish credential-bearing persistence and the Cursor advisory establishes an unauthorized MCP-config write path.
    limitations: [The complete credential-implant sequence was not directly demonstrated.]
    conflicts: []
    inference: {is_inference: true, rationale: "Synthesizes documented persistent credential selection with an unauthorized configuration-write capability."}
    status: validated
  - id: SAF-T1206-C002
    statement: MCP and agent configurations can contain headers, environment mappings, input references, client identifiers, or secret references that select authentication material.
    class: implementation_fact
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-t1206-vscode-config
        support: direct
        exact_locators: ["Input variables for sensitive data, lines 327-349"]
      - source_id: SRC-t1206-copilot-cli
        support: direct
        exact_locators: ["mcp add options, env/header fields, lines 740-770"]
      - source_id: SRC-t1206-foundry-auth
        support: corroborating
        exact_locators: ["Key-based authentication, lines 78-97"]
    corroboration: Three first-party product documents describe credential-bearing configuration or secret references.
    limitations: [Exact fields and storage locations vary by client and hosting model.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated
  - id: SAF-T1206-C003
    statement: MCP supports pre-registered or persisted client credentials and requires persisted credentials to remain associated with the issuer that created them.
    class: protocol_normative
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-t1206-mcp-client-registration
        support: direct
        exact_locators: ["Pre-registration, lines 153-160; Authorization Server Binding, lines 180-184"]
    corroboration: The current MCP client-registration specification states both static credential support and issuer binding.
    limitations: [The specification does not prescribe every client's persistence format.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated
  - id: SAF-T1206-C004
    statement: Conformant MCP HTTP authorization sends bearer tokens on protected requests and requires server-side issuer, audience, expiry, and resource validation.
    class: protocol_normative
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-mcp-authorization-2026-07-28
        support: direct
        exact_locators: ["Token Requirements, lines 239-260; Token Handling, lines 263-267"]
      - source_id: SRC-mcp-auth-security-2026-07-28
        support: direct
        exact_locators: ["Token Audience Binding and Validation; Access Token Privilege Restriction"]
      - source_id: SRC-ms-azure-mcp-security-2026
        support: corroborating
        exact_locators: ["Authentication and authorization, lines 34-43"]
    corroboration: Current MCP normative text and Microsoft implementation guidance agree on token validation and binding.
    limitations: [Applies to authorization-capable HTTP deployments; nonconformant products may differ.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated
  - id: SAF-T1206-C005
    statement: Persistent configuration or registration state can affect authentication on later client starts or reconnects until removed or invalidated.
    class: framework_inference
    materiality: high
    evidence_status: research-derived
    sources:
      - source_id: SRC-vscode-mcp-servers
        support: direct
        exact_locators: ["Configuration locations; Synchronize MCP configuration; Automatically start MCP servers"]
      - source_id: SRC-t1206-copilot-cli
