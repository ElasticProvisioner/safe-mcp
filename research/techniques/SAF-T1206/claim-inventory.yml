      - source_id: SRC-t1206-mcp-client-registration
        support: direct
        exact_locators: ["Authorization Server Binding, lines 180-184"]
    corroboration: Multiple clients document persistent config while the protocol documents persisted registration credentials.
    limitations: [Some clients may require a reload, trust decision, or successful server validation.]
    conflicts: []
    inference: {is_inference: true, rationale: "Later identity selection follows from documented config persistence and credential resolution."}
    status: validated
  - id: SAF-T1206-C006
