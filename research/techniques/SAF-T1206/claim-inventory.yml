      - source_id: SRC-t1206-copilot-cli
        support: context
        exact_locators: ["mcp add options; MCP server loading priority"]
      - source_id: SRC-t1206-ms-config-risk
        support: context
        exact_locators: ["Background; exploitable misconfiguration definition"]
    corroboration: Two advisories demonstrate unauthorized configuration write paths and first-party docs identify legitimate administration paths.
    limitations: [A write path alone does not establish credential implantation.]
    conflicts: []
    inference: {is_inference: false, rationale: null}
    status: validated
  - id: SAF-T1206-C007
