evidence_assessment:
  overall_status: demonstrated
  core_claim_ids:
    - SAF-T1105-C004
    - SAF-T1105-C005
  rationale: >-
    The defining tool-call-to-out-of-scope-file-operation behavior was reproduced
    end to end by Varonis Threat Labs against an AWS-owned public MCP endpoint.
    This is a controlled demonstration, not a hostile production incident;
    therefore Demonstrated, not Observed, is the strongest supported label.

