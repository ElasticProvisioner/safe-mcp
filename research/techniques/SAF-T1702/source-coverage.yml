    reason: Task authorization and lifecycle logging are useful context but do not directly establish persistent memory poisoning.
  - source_id: SRC-mcp-sampling-2025-11
    reason: Sampling context controls are adjacent to context inclusion but do not define shared persistent memory.
  - source_id: SRC-nist-ai100-2e2025
    reason: The adversarial-ML taxonomy is authoritative but broader than the agent shared-memory mechanism and unnecessary for a sourced claim.
  - source_id: SRC-owasp-memory-blog-2026
    reason: The blog is derivative of the directly cited OWASP report and Cisco disclosure.
  - source_id: SRC-tma-nm-2026
    reason: The origin-bound authority proposal is recent single-author research and is redundant with stronger cited provenance sources.
  - source_id: SRC-memorygraft-2025
    reason: The demonstration is relevant but redundant with the three higher-impact selected examples and not needed for a unique claim.
sources_blocked: []

conflicts:
  - issue: Aggregate success rates in MINJA could be mistaken for universal effectiveness.
    resolution: The technique reports no universal rate and cites counterevidence showing material variation with memory contents, models, and defenses.
  - issue: Lateral Movement normally describes movement through an environment after initial access.
    resolution: The mapping is retained as the supplied tactic but expressly qualified as a cross-consumer agentic-context pivot, with Stored Data Manipulation shown only as an analogy.
  - issue: Cisco reports a product remediation without an independently reviewed Anthropic advisory in the final corpus.
    resolution: The patch statement is attributed to Cisco and the missing vendor confirmation is an explicit evidence gap.

