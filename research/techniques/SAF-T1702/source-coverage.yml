breach_and_vulnerability_assessment:
  searched_on: "2026-09-02"
  candidate_count: 6
  selected_examples:
    - SRC-cisco-memorytrap-2026
    - SRC-agentpoison-2024
    - SRC-minja-2026
  no_qualifying_examples_rationale: null
  candidates:
    - source_id: SRC-cisco-memorytrap-2026
      identifier: MemoryTrap persistent memory compromise
      relationship: direct_vulnerability
      exploitation_status: controlled demonstration; no production exploitation reported
      impact: Persistent global memory and hook changes could influence subsequent projects, sessions, and reboots.
      remediation: Cisco reports that Anthropic removed user memories from the system prompt in Claude Code 2.1.50; no independently reviewed Anthropic advisory was found.
      selected: true
      rationale: The product-specific path crosses the exact persistent cross-session boundary and is the strongest reviewed disclosure.
    - source_id: SRC-minja-2026
      identifier: MINJA query-only memory injection
      relationship: direct_demonstration
      exploitation_status: controlled academic demonstration
      impact: Shared long-term memory can carry attacker-injected records into later user interactions and alter agent behavior.
      remediation: The paper evaluates prompt detection, memory isolation, rate limits, permissions, and guardrails while documenting residual limitations.
      selected: true
      rationale: It removes the direct-storage-access assumption and explicitly evaluates memory shared across users.
    - source_id: SRC-agentpoison-2024
      identifier: AgentPoison memory and knowledge-base poisoning
      relationship: direct_demonstration
      exploitation_status: controlled academic demonstration
      impact: A small poisoning budget can bias long-term-memory and retrieval-augmented agent behavior.
      remediation: Evaluated perplexity and rephrasing defenses did not eliminate the attack; the paper does not provide a product patch.
      selected: true
      rationale: It is the earliest reviewed direct demonstration and complements MINJA with a different access model.
    - source_id: SRC-memorygraft-2025
      identifier: MemoryGraft indirect cross-session poisoning
      relationship: direct_demonstration
      exploitation_status: controlled academic demonstration
      impact: Input artifacts can reach a persistent shared memory path and affect later sessions or users.
      remediation: Research mitigations only; no production patch or incident response was reviewed.
      selected: false
      rationale: Directly relevant but lower priority than the selected sources because it is a redundant laboratory path in a narrower evaluated system.
    - source_id: SRC-injecmem-2026
      identifier: InjecMEM benchmark
      relationship: direct_demonstration
      exploitation_status: controlled benchmark demonstration
      impact: Single-interaction memory injection can alter later agent behavior without direct memory access.
      remediation: The benchmark evaluates multiple defenses and documents security-utility tradeoffs.
      selected: false
      rationale: Highly relevant but published after the selected foundational demonstrations and used here primarily for defense limitations.
    - source_id: SRC-owasp-memory-blog-2026
      identifier: OWASP Memory Is a Feature blog
      relationship: adjacent_incident_or_vulnerability
      exploitation_status: synthesis of disclosed and research examples
      impact: Summarizes persistent agent-memory risks and MemoryTrap.
      remediation: Recommends layered memory security controls.
      selected: false
      rationale: Derivative of the directly reviewed OWASP report and Cisco disclosure, so it adds no independent example.

