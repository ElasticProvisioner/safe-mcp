  - id: SRC-aaai-mcptox-2026
    title: "MCPTox: A Benchmark for Tool Poisoning on Real-World MCP Servers"
    publisher: Association for the Advancement of Artificial Intelligence
    version_or_date: "AAAI-26, 2026"
    source_class: research
    official_url: https://ojs.aaai.org/index.php/AAAI/article/download/40895/44856
    access_status: public
    accessed_on: "2026-09-01"
    review_status: opened_reviewed
    reviewed_on: "2026-09-01"
    review_method: browser_pdf
    locators:
      - "Pages 1-3, definition and architecture"
      - "Page 2, benchmark composition and headline results"
      - "Page 5, evaluation methodology and success definition"
      - "Pages 6-7, attack success results"
      - "Page 7, defense recommendations and limitations"
    review_notes: >-
      Verified the published benchmark design, its controlled evaluation over
      real server tool definitions, reported attack-success results, recommended
      controls, and the limitation that payloads were semi-automated and
      human-defined. Used the published paper's 1,348-case count rather than the
      older arXiv abstract's 1,312-case count.
    archive:
      status: remote_reviewed_not_archived
      reason: The public publisher PDF is linked directly and no table, figure, payload, or substantial expression is reproduced.
      review_evidence:
        access_method: Publisher PDF
        notes: All nine pages were reviewed, with material claims checked against the specified pages.

  - id: SRC-huang-mcp-security-2026
    title: Model Context Protocol Threat Modeling and Analysis of Vulnerabilities to Prompt Injection with Tool Poisoning
    publisher: Journal of Cybersecurity and Privacy, MDPI
    version_or_date: "2026-05-05, 6(3), article 84"
    source_class: research
    official_url: https://doi.org/10.3390/jcp6030084
    access_status: public
    accessed_on: "2026-09-01"
    review_status: opened_reviewed
    reviewed_on: "2026-09-01"
    review_method: browser_and_reproducibility_repository
    locators:
      - "Abstract"
      - "Sections 5 and 6"
      - "Reproducibility repository README, Paper Overview and Experimental Results"
      - "Reproducibility repository README, Citation and License"
    review_notes: >-
      Verified a controlled comparison of seven MCP clients, the focus on
      client-side metadata poisoning, the authors Charoes Huang, Xin Huang,
      Ngoc Phu Tran, and Amin Milani Fard, the reproducibility materials, and
      the defense-in-depth recommendations.
    archive:
      status: remote_reviewed_not_archived
      reason: The open-access article and its public reproducibility repository remain available at canonical URLs.
      review_evidence:
        access_method: Publisher article and author-maintained GitHub repository
        notes: The article metadata, relevant sections, artifacts summary, citation, authors, and license were reviewed.

