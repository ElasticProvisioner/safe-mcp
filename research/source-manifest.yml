  - id: SRC-mcp-tools-2025-11-25
    title: "Model Context Protocol Specification: Tools"
    publisher: Model Context Protocol project
    version_or_date: "2025-11-25"
    source_class: protocol_or_standard
    official_url: https://modelcontextprotocol.io/specification/2025-11-25/server/tools
    access_status: public
    accessed_on: "2026-09-01"
    review_status: opened_reviewed
    reviewed_on: "2026-09-01"
    review_method: browser
    locators:
      - "User Interaction Model, lines 83-90"
      - "Listing Tools, lines 119-167"
      - "List Changed Notification, lines 209-216"
      - "Tool data type, lines 234-254"
      - "Security Considerations, lines 546-557"
    review_notes: >-
      Verified the model-controlled interaction model, the tools/list request and
      response, the top-level description field, list-change notification, and
      client safety guidance. The specification defines transport and metadata;
      it does not establish that a model will obey adversarial descriptions.
    archive:
      status: remote_reviewed_not_archived
      reason: The versioned canonical specification remains publicly available and only short paraphrases are used.
      review_evidence:
        access_method: Official versioned HTML specification
        notes: The complete Tools page and each cited section were opened and reviewed.

