  - id: SRC-cyberark-fsp-2025-05-30
    title: "Poison everywhere: No output from your MCP server is safe"
    publisher: CyberArk Labs
    version_or_date: "2025-05-30"
    source_class: research
    official_url: https://www.cyberark.com/resources/threat-research-blog/poison-everywhere-no-output-from-your-mcp-server-is-safe
    access_status: public
    accessed_on: "2026-09-01"
    review_status: opened_reviewed
    reviewed_on: "2026-09-01"
    review_method: browser
    locators:
      - "Tool Poisoning Attack (TPA)"
      - "TPA lives beyond descriptions: full-schema poisoning"
      - "Advanced Tool Poisoning Attacks"
      - "Mitigation strategies"
      - "Author footer"
    review_notes: >-
      Verified the author's distinction between description poisoning,
      full-schema poisoning, and malicious runtime output, and credited Simcha
      Kosman. The controlled examples support scope boundaries, not a production
      incident for SAF-T1001.
    archive:
      status: remote_reviewed_not_archived
      reason: The publisher article is used for classification and attribution only; no payload or image is reproduced.
      review_evidence:
        access_method: Publisher HTML page
        notes: The complete article and author footer were reviewed.

  - id: SRC-unicode-uts39
    title: "Unicode Technical Standard #39: Unicode Security Mechanisms"
    publisher: Unicode Consortium
    version_or_date: "Latest version accessed 2026-09-01"
    source_class: protocol_or_standard
    official_url: https://www.unicode.org/reports/tr39/
    access_status: public
    accessed_on: "2026-09-01"
    review_status: opened_reviewed
    reviewed_on: "2026-09-01"
    review_method: browser
    locators:
      - "Section 1, Introduction"
      - "Section 3.1.1, Joining Controls"
      - "Section 4, Confusable Detection"
    review_notes: >-
      Verified that Unicode security mechanisms can identify suspicious or
      confusable text, while join controls are necessary in some languages and
      blanket exclusion creates false positives. Used to constrain the
      detection rule, not to claim an MCP exploit.
    archive:
      status: remote_reviewed_not_archived
      reason: The stable Unicode standard is cited directly and no normative text or data table is reproduced.
      review_evidence:
        access_method: Unicode Consortium technical standard
        notes: The introduction, joining-control cautions, and detection mechanisms were reviewed.

