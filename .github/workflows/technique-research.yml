name: Validate technique research

on:
  pull_request:
    paths:
      - "techniques/**"
      - "research/**"
      - "scripts/*technique*.py"
      - "requirements-dev.txt"
      - ".github/workflows/technique-research.yml"
  push:
    branches: [main]
    paths:
      - "techniques/**"
      - "research/**"
      - "scripts/*technique*.py"
      - "requirements-dev.txt"
      - ".github/workflows/technique-research.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: python3 scripts/validate-technique-research.py --all
